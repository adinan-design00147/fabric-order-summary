# กัน Supabase แพลนฟรี pause โปรเจกต์เพราะไม่มีการใช้งาน
# มี 2 งานในไฟล์นี้
#   1) ping   — ยิง request เข้า Supabase ทุกวัน (Supabase หลับถ้าไม่มี request 7 วัน)
#   2) keepalive — commit ไฟล์ .keepalive ทุกวันอาทิตย์ (GitHub ปิด schedule ถ้า repo เงียบ 60 วัน)
name: keep-supabase-awake

on:
  schedule:
    - cron: '0 1 * * *'   # ทุกวัน 08:00 น. ไทย
    - cron: '30 1 * * 0'  # ทุกวันอาทิตย์ 08:30 น. ไทย
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ยิง request เข้า Supabase
        env:
          SUPABASE_URL: https://pmcnamlesodpuynakkuk.supabase.co
          SUPABASE_KEY: sb_publishable_qkWioinGX5ybtENThpRjLw_9R3OL_Gw
        run: |
          code=$(curl -s -o /tmp/out.txt -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/settings?select=key&limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
          echo "HTTP $code"; cat /tmp/out.txt
          if [ "$code" != "200" ]; then
            echo "::error::ยิงไม่สำเร็จ — โปรเจกต์อาจถูก pause ไปแล้ว หรือคีย์เปลี่ยน"
            exit 1
          fi
          echo "✅ Supabase ตอบปกติ"

  keepalive:
    # ทำงานเฉพาะรอบวันอาทิตย์ — commit เล็กๆ ให้ repo ไม่เงียบเกิน 60 วัน
    if: github.event.schedule == '30 1 * * 0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: commit ไฟล์เวลาไว้กัน workflow ถูกปิด
        run: |
          date -u +"ping ล่าสุด %Y-%m-%d %H:%M UTC" > .keepalive
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git diff --staged --quiet || git commit -m "keepalive: กัน GitHub ปิด scheduled workflow"
          git push
