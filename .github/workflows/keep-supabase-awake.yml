# กัน Supabase แพลนฟรี pause โปรเจกต์เพราะไม่มีการใช้งาน
# Supabase ถือว่า "ไม่ใช้งาน" เมื่อไม่มี request เข้าฐานข้อมูลตลอด 7 วัน
# workflow นี้ยิง request เบาๆ วันละครั้ง (แค่ขอ 1 แถวจากตาราง settings)
#
# นอกจากนี้ยังเขียนไฟล์ .keepalive แล้ว commit ทุกวันอาทิตย์
# เพื่อให้ repo มีความเคลื่อนไหวตลอด GitHub จะได้ไม่ปิด schedule ทิ้งเมื่อครบ 60 วัน
name: keep-supabase-awake

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping supabase
        env:
          SUPABASE_URL: https://pmcnamlesodpuynakkuk.supabase.co
          SUPABASE_KEY: sb_publishable_qkWioinGX5ybtENThpRjLw_9R3OL_Gw
        run: |
          code=$(curl -s -o /tmp/out.txt -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/settings?select=key&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "HTTP $code"
          cat /tmp/out.txt
          if [ "$code" != "200" ]; then
            echo "::error::ping failed - project may be paused or key changed"
            exit 1
          fi
          echo "OK - Supabase responded"

      - name: checkout
        uses: actions/checkout@v4

      - name: keep repo active (weekly commit)
        run: |
          if [ "$(date -u +%u)" != "7" ]; then
            echo "not sunday - skip commit"
            exit 0
          fi
          date -u +"last ping: %Y-%m-%d %H:%M UTC" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive: supabase ping ok" || { echo "nothing to commit"; exit 0; }
          git push
