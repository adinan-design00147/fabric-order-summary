    // ค่าตั้งต้นแทบไม่เปลี่ยน -> ดึงครั้งเดียวแล้วจำไว้ หน้าอื่นจะได้ไม่ต้องรอ
    let SETTINGS_CACHE = null;

    async function loadSettings(force) {
      if (SETTINGS_CACHE && !force) return SETTINGS_CACHE;
      const { data, error } = await sb.from('settings').select('key,value');
      if (error) throw error;
      const s = {};
      data.forEach(r => s[r.key] = Number(r.value));
      SETTINGS_CACHE = s;
      return s;
    }

    /** ผ้าหลักที่ใช้ตัดสต็อกเวลาปริ้นงาน (ตั้งได้ในเมนูสต็อกของ) */
    async function getDefaultFabric() {
      const { data } = await sb.from('stock_items')
        .select('id,name,unit,total_qty,used_qty,threshold_pct,threshold_qty,is_default_fabric')
        .eq('active', true).eq('category', 'ผ้าดิบ').order('is_default_fabric', { ascending: false }).order('created_at');
      if (!data || !data.length) return null;
      return data.find(x => x.is_default_fabric) || data[0];
    }

    /**
     * ปริ้นงาน = ตัดผ้าออกจากสต็อกตามจำนวนหลาของชิ้นนั้น
     * ยกเลิกปริ้น = คืนผ้ากลับเข้าสต็อก (ลบรายการเบิกเดิมทิ้ง)
     */
    async function setPiecePrinted(piece, printed, lotName) {
      if (printed) {
        const yards = round4(pieceYard(piece, SETTINGS));
        let moveId = null;
        if (yards > 0) {
          const fabric = await getDefaultFabric();
          if (!fabric) throw new Error('ยังไม่มีผ้าดิบในสต็อก — ไปเพิ่มที่เมนู "สต็อกของ" ก่อน');
          moveId = await stockMove(fabric, 'out', yards,
            'ปริ้นงาน ' + (piece.label || 'ไม่ระบุชื่อ') + ' · ' + piece.width_cm + 'x' + piece.length_cm +
            (lotName ? ' · ล็อต ' + lotName : ''));
        }
        const { error } = await sb.from('pieces')
          .update({ printed: true, printed_at: new Date().toISOString(), stock_move_id: moveId })
          .eq('id', piece.id);
        if (error) throw new Error(error.message);
        return yards;
      }

      // ---- ยกเลิกปริ้น: คืนผ้า ----
      if (piece.stock_move_id) {
        const { data: mv } = await sb.from('stock_moves').select('id,item_id,qty').eq('id', piece.stock_move_id).maybeSingle();
        if (mv) {
          await stockMove({ id: mv.item_id }, 'undo_out', Number(mv.qty));
          await sb.from('stock_moves').delete().eq('id', mv.id);
        }
      }
      const { error } = await sb.from('pieces')
        .update({ printed: false, printed_at: null, stock_move_id: null }).eq('id', piece.id);
      if (error) throw new Error(error.message);
      return 0;
    }

    async function loadAll() {
      document.getElementById('statusMsg').textContent = 'กำลังโหลด...';
      // ยิงพร้อมกันทีเดียว ไม่ต้องรอต่อคิวทีละคำสั่ง
      const [st, lotsRes, piecesRes, wasteRes] = await Promise.all([
        loadSettings(),
        sb.from('lots').select('id,name,lot_date,created_at'),
        sb.from('pieces').select('id,lot_id,width_cm,length_cm,label,price,paid,item_type,printed,printed_at,stock_move_id,redo_count,vendor'),
        // ดึงทุกแถว (เฉพาะคอลัมน์ที่ใช้) ยอดสรุปจะได้ตรงเสมอ ไม่ตัดที่ 300 แถวแบบเงียบๆ
        sb.from('fabric_waste').select('id,lot_id,piece_id,kind,reason,note,yards,cost,created_at')
          .order('created_at', { ascending: false }),
      ]);
      SETTINGS = st;
      if (lotsRes.error) throw lotsRes.error;
      if (piecesRes.error) throw piecesRes.error;
      const lots = lotsRes.data, pieces = piecesRes.data;
      WASTE = wasteRes.data || [];

      lots.sort((a, b) => lotSortKey(b.name) - lotSortKey(a.name));
      render(lots, pieces);
      document.getElementById('statusMsg').textContent = 'อัปเดตล่าสุด: ' + new Date().toLocaleString('th-TH');
    }

    function render(lots, pieces) {
      if (activeTab === 'customer') activeTab = 'daily';
      const app = document.getElementById('app');
      app.innerHTML = '';
      app.appendChild(buildPageHead('งานผลิต', 'งานที่ส่งผลิตกับร้านอื่น — ป้ายผ้า โฟมบอร์ด สติกเกอร์ และยอดที่ต้องจ่ายร้านผลิต'));

      let totalPieces = 0, grandTotalYard = 0, grandTotalPrice = 0;
      const lotBlocks = lots.map(lot => {
        const rows = pieces.filter(p => p.lot_id === lot.id);
        let lotYard = 0, lotPrice = 0;
        rows.forEach(r => {
          lotYard += pieceYard(r, SETTINGS);
          lotPrice += Number(r.price);
        });
        totalPieces += rows.length; grandTotalYard += lotYard; grandTotalPrice += lotPrice;
        return { lot, rows, lotYard: round4(lotYard), lotPrice: round2(lotPrice) };
      });
      const bufferYard = round4(grandTotalYard * SETTINGS.buffer_rate);

      // ---- tab bar ----
      const tabs = document.createElement('div');
      tabs.className = 'tabs';
      tabs.innerHTML = `
        <button class="tab-btn ${activeTab === 'daily' ? 'active' : ''}" data-tab="daily">${icon('calendar', 17)}รายวัน</button>
        <button class="tab-btn ${activeTab === 'monthly' ? 'active' : ''}" data-tab="monthly">${icon('chart', 17)}รายเดือน</button>
        <button class="tab-btn ${activeTab === 'payment' ? 'active' : ''}" data-tab="payment">${icon('wallet', 17)}การชำระเงิน</button>
        <button class="tab-btn ${activeTab === 'waste' ? 'active' : ''}" data-tab="waste">${icon('trash', 17)}ผ้าเสีย</button>
      `;
      app.appendChild(tabs);

      // ---- แท็บรายวัน ----
      const dailyEl = document.createElement('div');
      dailyEl.id = 'dailyContent';

      const summary = document.createElement('div');
      summary.className = 'summary-grid';
      summary.innerHTML = `
        <div class="stat"><div class="num">${totalPieces}</div><div class="lbl">ชิ้นรวม</div></div>
        <div class="stat"><div class="num">${fmtBaht(grandTotalPrice)}</div><div class="lbl">ยอดรวม (บาท)</div></div>
        <div class="stat"><div class="num">${round4(grandTotalYard).toFixed(2)}</div><div class="lbl">ผ้าที่ต้องใช้ (หลา)</div></div>
        <div class="stat"><div class="num">${bufferYard.toFixed(2)}</div><div class="lbl">แนะนำสั่งซื้อ +5% (หลา)</div></div>
      `;
      dailyEl.appendChild(summary);

      const tKey = todayKey();
      const todayBlocks = lotBlocks.filter(b => lotSortKey(b.lot.name) === tKey);
      const todayCard = document.createElement('div');
      todayCard.className = 'today-card';
      if (todayBlocks.length === 0) {
        todayCard.innerHTML = `
          <h2>${icon('pin', 17)}วันนี้ (${esc(todayLabel())})</h2>
          <div class="today-empty">ยังไม่มีออเดอร์วันนี้</div>
        `;
      } else {
        const tPieces = todayBlocks.reduce((s, b) => s + b.rows.length, 0);
        const tYard = round4(todayBlocks.reduce((s, b) => s + b.lotYard, 0));
        const tPrice = round2(todayBlocks.reduce((s, b) => s + b.lotPrice, 0));
        const tBuffer = round4(tYard * SETTINGS.buffer_rate);
        todayCard.innerHTML = `
          <h2>${icon('pin', 17)}วันนี้ (${esc(todayLabel())})</h2>
          <div class="today-stats">
            <div class="stat"><div class="num">${tPieces}</div><div class="lbl">ชิ้นวันนี้</div></div>
            <div class="stat"><div class="num">${fmtBaht(tPrice)}</div><div class="lbl">ยอดเงินวันนี้ (บาท)</div></div>
            <div class="stat"><div class="num">${tYard.toFixed(2)}</div><div class="lbl">ผ้าที่ต้องใช้ (หลา)</div></div>
            <div class="stat"><div class="num">${tBuffer.toFixed(2)}</div><div class="lbl">แนะนำซื้อ +5% (หลา)</div></div>
          </div>
        `;
      }
      dailyEl.appendChild(todayCard);

      dailyEl.appendChild(buildAddPanel(lots));

      const searchWrap = document.createElement('div');
      searchWrap.className = 'search-wrap';
      searchWrap.innerHTML = `<span class="search-ico">${icon('search', 18)}</span>
        <input id="lotSearch" type="text" placeholder="ค้นหา: ชื่อลูกค้า · ล็อต · ขนาด · ราคา · ร้านผลิต" aria-label="ค้นหาล็อตหรือชิ้นงาน">
        <div class="search-count hint"></div>`;
      dailyEl.appendChild(searchWrap);

      lotBlocks.forEach(({ lot, rows, lotYard, lotPrice }) => {
        const lotBufferYard = round4(lotYard * SETTINGS.buffer_rate);
        const hasUnpaid = rows.some(r => !r.paid);
        const card = document.createElement('div');
        card.className = 'lot-card';
        card.dataset.search = [lot.name, ...rows.map(r => [r.label, r.vendor, r.item_type,
          r.width_cm + 'x' + r.length_cm, r.price].join(' '))].join(' ').toLowerCase();
        const lotVendors = [...new Set(rows.map(r => r.vendor).filter(Boolean))];
        const nPrinted = rows.filter(r => r.printed).length;
        const nPaid = rows.filter(r => r.paid).length;

        const rowsHtml = rows.map(r => {
          const yardPerPiece = pieceYard(r, SETTINGS);
          const rowSearch = [r.label, r.vendor, r.item_type, r.width_cm + 'x' + r.length_cm,
            r.width_cm + ' x ' + r.length_cm, r.price, r.paid ? 'จ่ายแล้ว' : 'ยังไม่จ่าย',
            r.printed ? 'ปริ้นแล้ว' : 'ยังไม่ปริ้น'].filter(Boolean).join(' ').toLowerCase();
          return `<tr data-search="${esc(rowSearch)}">
            <td class="pick-cell" data-label="เลือก">
              <input type="checkbox" class="pick" data-id="${r.id}" data-lot="${esc(lot.name)}"
                data-label-txt="${esc(r.label || '')}" data-w="${r.width_cm}" data-l="${r.length_cm}"
                data-price="${r.price}" aria-label="เลือกชิ้นงานนี้" ${selectedPieces.has(r.id) ? 'checked' : ''}>
            </td>
            <td class="piece-name" data-label="รายการ">
              <span class="piece-name-text">${esc(r.label || '-')}${isFabricPiece(r) ? '' : ' <span class="st st-prod">' + esc(r.item_type) + '</span>'}
                ${r.redo_count ? `<span class="st st-cancel tag-redo">ทำใหม่ ${r.redo_count} ครั้ง</span>` : ''}
                ${r.vendor ? `<span class="vendor-tag">${icon('factory', 12)}${esc(r.vendor)}</span>` : ''}</span>
              <span class="piece-name-actions">
                <button class="icon-btn icon-btn-edit edit-piece" data-id="${r.id}" data-label="${esc(r.label || '')}" data-width="${r.width_cm}" data-length="${r.length_cm}" data-type="${esc(r.item_type || 'ป้ายผ้า')}" data-price="${r.price}" aria-label="แก้ไขชิ้นงาน" title="แก้ไข">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                </button>
                <button class="icon-btn icon-btn-warn waste-piece" data-id="${r.id}" aria-label="แจ้งงานเสีย" title="แจ้งงานเสีย (ตัดผ้าเพิ่ม)">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
                </button>
                <button class="icon-btn icon-btn-delete delete-piece" data-id="${r.id}" data-name="${esc(r.label || 'ไม่ระบุชื่อ')}" data-size="${r.width_cm}x${r.length_cm} ซม." aria-label="ลบชิ้นงาน" title="ลบ">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
                </button>
              </span>
            </td>
            <td data-label="ขนาด (ซม.)">${r.width_cm && r.length_cm ? r.width_cm + ' x ' + r.length_cm : '—'}</td>
            <td data-label="ราคา">${fmtBaht(r.price)}</td>
            <td data-label="ผ้า (หลา)">${isFabricPiece(r) ? yardPerPiece.toFixed(2) : '—'}</td>
            <td data-label="สถานะ"><span class="badge-pair">
              <span class="print-badge ${r.printed ? 'printed' : ''}" data-id="${r.id}" data-printed="${r.printed}"
                title="${r.printed ? 'ปริ้นแล้ว · ตัดผ้าออกจากสต็อกแล้ว' : 'กดเมื่อปริ้นงานเสร็จ ระบบจะตัดผ้าให้'}">${r.printed ? 'ปริ้นแล้ว' : 'ยังไม่ปริ้น'}</span>
              <span class="paid-badge ${r.paid ? 'paid' : 'unpaid'}" data-id="${r.id}" data-paid="${r.paid}">${r.paid ? 'จ่ายแล้ว' : 'ยังไม่จ่าย'}</span>
            </span></td>
          </tr>`;
        }).join('');
        card.innerHTML = `
          <div class="lot-head">
            <span>${esc(lot.name)}</span>
            <span class="lot-head-right"><span class="lot-total">${lotYard.toFixed(2)} หลา</span><span class="lot-price">${fmtBaht(lotPrice)} บาท</span><span class="lot-buffer">+5%: ${lotBufferYard.toFixed(2)} หลา</span></span>
          </div>
          ${rows.length ? `<div class="lot-progress">
            <div class="lp-line">
              <span class="lp-tag ${nPrinted === rows.length ? 'done' : ''}">${icon('printer', 14)}ปริ้นแล้ว ${nPrinted}/${rows.length}</span>
              <span class="lp-tag ${nPaid === rows.length ? 'done' : ''}">${icon('wallet', 14)}จ่ายแล้ว ${nPaid}/${rows.length}</span>
              ${lotVendors.map(v => `<span class="lp-tag">${icon('factory', 14)}${esc(v)}</span>`).join('')}
            </div>
            <div class="lp-bar"><div style="width:${Math.round(nPrinted / rows.length * 100)}%"></div></div>
          </div>` : ''}
          <div class="lot-actions">
            ${rows.some(r => !r.printed) ? `<button class="btn secondary btn-sm print-lot" data-lot="${lot.id}">${icon('printer', 15)}ปริ้นทั้งล็อต</button>` : ''}
            ${hasUnpaid ? `<button class="btn secondary btn-sm mark-lot-paid" data-lot="${lot.id}">${icon('check', 15)}จ่ายครบล็อต</button>` : ''}
            <button class="btn secondary btn-sm toggle-gallery" data-lot="${esc(lot.name)}">${icon('image', 15)}<span class="gal-label">รูปงาน</span></button>
            <button class="btn secondary btn-sm lot-more" aria-expanded="false">${icon('more', 15)}เพิ่มเติม</button>
            <span class="lot-more-box" hidden>
              <button class="btn secondary btn-sm waste-lot" data-lot="${lot.id}" data-name="${esc(lot.name)}">${icon('trash', 15)}บันทึกเศษผ้า</button>
              <button class="btn secondary btn-sm from-photos" data-lot="${esc(lot.name)}" data-id="${lot.id}">${icon('plus', 15)}สร้างชิ้นงานจากชื่อไฟล์รูป</button>
              ${rows.length ? `<button class="btn secondary btn-sm pick-all">${icon('checkbox', 15)}เลือกทั้งล็อต</button>` : ''}
            </span>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th class="pick-cell"></th><th>รายการ</th><th>ขนาด (ซม.)</th><th>ราคา</th><th>ผ้า (หลา)</th><th>สถานะ</th></tr></thead>
              <tbody>${rowsHtml || '<tr><td colspan="6" class="empty-cell">ยังไม่มีชิ้นงาน</td></tr>'}</tbody>
            </table>
          </div>
        `;
        const gallery = buildGallery(lot.name);
        card.appendChild(gallery);
        const galBtn = card.querySelector('.toggle-gallery');
        let loaded = false;
        galBtn.addEventListener('click', () => {
          gallery.hidden = !gallery.hidden;
          const n = galBtn.dataset.count ? ' (' + galBtn.dataset.count + ')' : '';
          galBtn.innerHTML = (gallery.hidden ? icon('image', 15) : icon('eyeOff', 15)) +
            '<span class="gal-label">' + (gallery.hidden ? 'รูปงาน' + n : 'ซ่อนรูป') + '</span>';
          if (!gallery.hidden && !loaded) { loaded = true; gallery.__load(); }
        });

        // สร้างชิ้นงานจากชื่อไฟล์รูปในไดรฟ์ (เช่น "Suraiya 65x85.png" -> Suraiya · 65 x 85)
        const fromBtn = card.querySelector('.from-photos');
        fromBtn.addEventListener('click', async () => {
          fromBtn.disabled = true;
          const label0 = fromBtn.innerHTML;
          fromBtn.textContent = 'กำลังอ่านชื่อไฟล์...';
          try {
            const files = await driveList(lot.name, 'fabric');
            const parsed = files.map(f => ({ file: f.name, ...(parsePieceFromFilename(f.name) || {}) }))
              .filter(x => x.width_cm);
            const already = new Set(rows.map(r => (r.label || '') + '|' + r.width_cm + 'x' + r.length_cm));
            const fresh = parsed.filter(x => !already.has((x.label || '') + '|' + x.width_cm + 'x' + x.length_cm));
            if (!parsed.length) {
              alert('อ่านขนาดจากชื่อไฟล์ไม่ได้เลย\n\nตั้งชื่อไฟล์แบบนี้ระบบจะอ่านออก:\n  Suraiya 65x85.png\n  Wea 50 x 200.jpg');
              return;
            }
            if (!fresh.length) {
              alert('ชิ้นงานจากรูปทั้งหมดถูกเพิ่มเข้าล็อตนี้แล้ว (' + parsed.length + ' รูป)');
              return;
            }
            // ล็อตนี้มีร้านอยู่แล้วให้ใช้ร้านนั้นเป็นค่าเริ่มต้น
            const lotVendor = rows.map(r => r.vendor).find(Boolean);
            if (lotVendor) lastVendor = lotVendor;
            const vendor = await askVendor('งานชุดนี้ส่งร้านไหน',
              'อ่านชื่อไฟล์ได้ ' + fresh.length + ' ชิ้น จากล็อต ' + lot.name + ' — เลือกร้านผลิตให้ทั้งชุดทีเดียว');
            if (vendor === null) return;

            const preview = fresh.map(x => '· ' + (x.label || '(ไม่มีชื่อ)') + ' — ' + x.width_cm + ' x ' + x.length_cm +
              ' ซม. = ' + fmtBaht(Math.round(x.width_cm * x.length_cm * SETTINGS.price_rate)) + ' บาท').join('\n');
            if (!confirm('เพิ่มชิ้นงาน ' + fresh.length + ' ชิ้นเข้าล็อต ' + lot.name +
              (vendor ? ' (ส่งร้าน ' + vendor + ')' : '') + ' ?\n\n' + preview)) return;
            const { error } = await sb.from('pieces').insert(fresh.map(x => ({
              lot_id: lot.id, label: x.label, width_cm: x.width_cm, length_cm: x.length_cm,
              price: Math.round(x.width_cm * x.length_cm * SETTINGS.price_rate),
              paid: false, item_type: 'ป้ายผ้า', vendor: vendor || null,
            })));
            if (error) { alert('เพิ่มไม่สำเร็จ: ' + error.message); return; }
            await loadAll();
          } catch (e) {
            alert('อ่านรูปจากไดรฟ์ไม่สำเร็จ: ' + e.message);
          } finally { fromBtn.disabled = false; fromBtn.innerHTML = label0; }
        });

        dailyEl.appendChild(card);
      });

      app.appendChild(dailyEl);

      // ---- โฟลเดอร์รูปในไดรฟ์ที่ยังไม่มีล็อตในระบบ ----
      // (อัปรูปเข้าไดรฟ์แล้วแต่ยังไม่ได้สร้างล็อต -> รูปจะไม่โผล่ที่ไหนเลย)
      (async () => {
        if (!DRIVE_API_URL) return;
        try {
          const res = await fetch(DRIVE_API_URL + '?action=counts&root=fabric');
          const j = await res.json();
          if (!j.ok) return;
          // เติมจำนวนรูปบนปุ่ม "รูปงาน" ของแต่ละล็อต จะได้รู้ว่ามีรูปรออยู่กี่รูป
          const counts = j.counts || {};
          app.querySelectorAll('.toggle-gallery').forEach(btn => {
            const n = counts[normalizeLotName(btn.dataset.lot || '')] || 0;
            if (!n) return;
            btn.dataset.count = n;
            const lbl = btn.querySelector('.gal-label');
            if (lbl) lbl.textContent = 'รูปงาน (' + n + ')';
          });

          const known = new Set(lots.map(l => normalizeLotName(l.name)));
          const missing = Object.entries(counts)
            .filter(([folder, n]) => n > 0 && !known.has(normalizeLotName(folder)))
            .sort((a, b) => lotSortKey(b[0]) - lotSortKey(a[0]));
          if (!missing.length) return;
          const card = document.createElement('div');
          card.className = 'panel no-print';
          card.innerHTML = `
            <h2>${icon('image', 17)}รูปในไดรฟ์ที่ยังไม่มีล็อตในระบบ</h2>
            <div class="hint" style="margin-bottom:10px">
              มีโฟลเดอร์รูปในไดรฟ์ที่ยังไม่มีล็อตในระบบ เลยไม่มีที่ให้รูปแสดง — กดสร้างล็อตแล้วรูปจะเข้ามาเอง
            </div>
            ${missing.map(([folder, n]) => `
              <div class="field-row" style="align-items:center;margin-bottom:8px">
                <span style="font-weight:600;min-width:110px">${esc(folder)}</span>
                <span class="hint" style="margin:0">${n} รูป</span>
                <button class="btn btn-sm make-lot" data-lot="${esc(folder)}" style="margin-left:auto">
                  ${icon('plus', 15)}สร้างล็อตนี้
                </button>
              </div>`).join('')}
          `;
          dailyEl.appendChild(card);
          card.querySelectorAll('.make-lot').forEach(b => b.addEventListener('click', async () => {
            const folder = b.dataset.lot;
            // อ่านชื่อไฟล์ในโฟลเดอร์ก่อน จะได้สร้างล็อต + ชิ้นงาน + ร้านผลิต ให้ครบในครั้งเดียว
            b.disabled = true; b.textContent = 'กำลังอ่านชื่อไฟล์...';
            let fresh = [];
            try {
              const files = await driveList(folder, 'fabric');
              fresh = files.map(f => ({ file: f.name, ...(parsePieceFromFilename(f.name) || {}) }))
                .filter(x => x.width_cm);
            } catch (e) { /* อ่านไม่ได้ก็สร้างล็อตเปล่าไปก่อน */ }

            let vendor = '';
            if (fresh.length) {
              const v = await askVendor('สร้างล็อต ' + folder,
                'อ่านชื่อไฟล์ได้ ' + fresh.length + ' ชิ้น — เลือกร้านที่ส่งผลิตให้ทั้งชุด แล้วระบบจะสร้างล็อตพร้อมชิ้นงานให้เลย');
              if (v === null) { b.disabled = false; b.innerHTML = icon('plus', 15) + 'สร้างล็อตนี้'; return; }
              vendor = v;
            }

            b.textContent = 'กำลังสร้าง...';
            const { data: newLot, error } = await sb.from('lots').insert({ name: folder }).select('id').single();
            if (error) { alert('สร้างล็อตไม่สำเร็จ: ' + error.message); b.disabled = false; return; }

            if (fresh.length) {
              const { error: e2 } = await sb.from('pieces').insert(fresh.map(x => ({
                lot_id: newLot.id, label: x.label, width_cm: x.width_cm, length_cm: x.length_cm,
                price: Math.round(x.width_cm * x.length_cm * SETTINGS.price_rate),
                paid: false, item_type: 'ป้ายผ้า', vendor: vendor || null,
              })));
              if (e2) alert('สร้างล็อตแล้ว แต่เพิ่มชิ้นงานไม่สำเร็จ: ' + e2.message);
            }
            await loadAll();
          }));
        } catch (e) { /* ไดรฟ์ล่มไม่ควรทำให้หน้าพัง */ }
      })();

      // ค้นหา: กรองทั้งการ์ดล็อตและแถวชิ้นงานข้างใน + สรุปผลให้เห็น
      const lotSearchInput = searchWrap.querySelector('#lotSearch');
      const lotSearchCount = searchWrap.querySelector('.search-count');
      lotSearchInput.addEventListener('input', () => {
        const q = lotSearchInput.value.trim().toLowerCase();
        let foundRows = 0, foundLots = 0;
        dailyEl.querySelectorAll('.lot-card').forEach(card => {
          const rowsEl = [...card.querySelectorAll('tbody tr')].filter(tr => tr.dataset.search);
          let hitInCard = 0;
          rowsEl.forEach(tr => {
            const hit = !q || tr.dataset.search.includes(q);
            tr.style.display = hit ? '' : 'none';
            if (hit && q) hitInCard++;
          });
          // ล็อตจะโชว์เมื่อชื่อล็อตตรง หรือมีชิ้นงานข้างในตรง
          const lotHit = !q || card.dataset.search.includes(q);
          card.style.display = lotHit ? '' : 'none';
          if (lotHit && q) { foundLots++; foundRows += hitInCard; }

          // ถ้าเข้าล็อตเพราะชื่อล็อตตรง แต่ไม่มีชิ้นไหนตรง -> โชว์ทุกแถวตามเดิม
          if (q && lotHit && hitInCard === 0) {
            rowsEl.forEach(tr => { tr.style.display = ''; });
            foundRows += rowsEl.length;
          }
          const note = card.querySelector('.search-note');
          if (note) note.remove();
          if (q && lotHit && hitInCard > 0 && hitInCard < rowsEl.length) {
            const n = document.createElement('div');
            n.className = 'search-note hint no-print';
            n.style.cssText = 'padding:6px var(--space-4) 0';
            n.textContent = 'แสดง ' + hitInCard + ' จาก ' + rowsEl.length + ' ชิ้นที่ตรงกับคำค้น';
            card.querySelector('.table-wrap')?.before(n);
          }
        });
        lotSearchCount.textContent = q
          ? (foundRows ? 'เจอ ' + foundRows + ' ชิ้นงาน ใน ' + foundLots + ' ล็อต'
            : 'ไม่เจอรายการที่ตรงกับ "' + lotSearchInput.value + '"')
          : '';
      });

      // ---- แท็บรายเดือน ----
      const monthlyEl = document.createElement('div');
      monthlyEl.id = 'monthlyContent';

      const groups = {};
      const unknown = { pieces: 0, yard: 0, price: 0, lots: [] };
      lotBlocks.forEach(({ lot, rows, lotYard, lotPrice }) => {
        const ym = parseLotYM(lot.name);
        if (!ym) {
          unknown.pieces += rows.length; unknown.yard += lotYard; unknown.price += lotPrice; unknown.lots.push(lot.name);
          return;
        }
        const key = ym.yy + '-' + ym.month;
        if (!groups[key]) groups[key] = { yy: ym.yy, month: ym.month, pieces: 0, yard: 0, price: 0, lots: [] };
        groups[key].pieces += rows.length;
        groups[key].yard += lotYard;
        groups[key].price += lotPrice;
        groups[key].lots.push(lot.name);
      });
      const groupList = Object.values(groups).sort((a, b) => (b.yy * 100 + b.month) - (a.yy * 100 + a.month));

      if (groupList.length === 0 && unknown.lots.length === 0) {
        monthlyEl.innerHTML = `<div class="loading">ยังไม่มีข้อมูล</div>`;
      } else {
        monthlyEl.appendChild(buildSearchBox({
          placeholder: 'ค้นหา: เดือน · ปี · ชื่อล็อต',
          targets: () => [...monthlyEl.querySelectorAll('.month-card')],
        }));
        groupList.forEach(g => {
          const card = document.createElement('div');
          card.className = 'month-card';
          card.dataset.search = [THAI_MONTHS[g.month], g.yy + 2500, g.lots.join(' ')].join(' ').toLowerCase();
          card.innerHTML = `
            <h3>${THAI_MONTHS[g.month]} ${g.yy + 2500}</h3>
            <div class="month-sub">รวม ${g.lots.length} ล็อต: ${g.lots.map(esc).join(', ')}</div>
            <div class="month-stats">
              <div class="stat"><div class="num">${g.pieces}</div><div class="lbl">ชิ้นรวม</div></div>
              <div class="stat"><div class="num">${fmtBaht(round2(g.price))}</div><div class="lbl">ยอดเงินรวม (บาท)</div></div>
              <div class="stat"><div class="num">${round4(g.yard).toFixed(2)}</div><div class="lbl">ผ้ารวม (หลา)</div></div>
            </div>
          `;
          monthlyEl.appendChild(card);
        });
        if (unknown.lots.length) {
          const card = document.createElement('div');
          card.className = 'month-card';
          card.innerHTML = `
            <h3>ไม่ระบุเดือน</h3>
            <div class="month-sub">${unknown.lots.length} ล็อต: ${unknown.lots.map(esc).join(', ')}</div>
            <div class="month-stats">
              <div class="stat"><div class="num">${unknown.pieces}</div><div class="lbl">ชิ้นรวม</div></div>
              <div class="stat"><div class="num">${fmtBaht(round2(unknown.price))}</div><div class="lbl">ยอดเงินรวม (บาท)</div></div>
              <div class="stat"><div class="num">${round4(unknown.yard).toFixed(2)}</div><div class="lbl">ผ้ารวม (หลา)</div></div>
            </div>
          `;
          monthlyEl.appendChild(card);
        }
      }

      app.appendChild(monthlyEl);

      // ---- แท็บการชำระเงิน ----
      const paymentEl = document.createElement('div');
      paymentEl.id = 'paymentContent';

      let paidPieces = 0, paidPrice = 0, unpaidPieces = 0, unpaidPrice = 0;
      const lotOutstanding = [];
      lotBlocks.forEach(({ lot, rows }) => {
        let lp = 0, lc = 0;
        rows.forEach(r => {
          if (r.paid) { paidPieces++; paidPrice += Number(r.price); }
          else { unpaidPieces++; unpaidPrice += Number(r.price); lp += Number(r.price); lc++; }
        });
        if (lc > 0) lotOutstanding.push({ lot, count: lc, price: round2(lp) });
      });

      const paySummary = document.createElement('div');
      paySummary.className = 'summary-grid';
      paySummary.innerHTML = `
        <div class="stat"><div class="num">${fmtBaht(round2(unpaidPrice))}</div><div class="lbl">ยอดค้างชำระรวม (บาท)</div></div>
        <div class="stat"><div class="num">${unpaidPieces}</div><div class="lbl">ชิ้นที่ยังไม่จ่าย</div></div>
        <div class="stat"><div class="num">${fmtBaht(round2(paidPrice))}</div><div class="lbl">ยอดจ่ายแล้วรวม (บาท)</div></div>
        <div class="stat"><div class="num">${paidPieces}</div><div class="lbl">ชิ้นที่จ่ายแล้ว</div></div>
      `;
      paymentEl.appendChild(paySummary);

      // ---- ค้างจ่ายแยกตามร้านผลิต ----
      const byVendor = {};
      pieces.forEach(r => {
        const v = r.vendor || 'ไม่ระบุร้าน';
        byVendor[v] = byVendor[v] || { unpaid: 0, unpaidN: 0, paid: 0, total: 0, n: 0 };
        byVendor[v].total += Number(r.price);
        byVendor[v].n += 1;
        if (r.paid) byVendor[v].paid += Number(r.price);
        else { byVendor[v].unpaid += Number(r.price); byVendor[v].unpaidN += 1; }
      });
      const vendorRows = Object.entries(byVendor).sort((a, b) => b[1].unpaid - a[1].unpaid);
      if (vendorRows.length) {
        const vHead = document.createElement('h2');
        vHead.className = 'section-title';
        vHead.innerHTML = icon('factory', 17) + 'ค้างจ่ายแยกตามร้านผลิต';
        paymentEl.appendChild(vHead);

        const vCard = document.createElement('div');
        vCard.className = 'lot-card';
        vCard.innerHTML = `<div class="att-people">${vendorRows.map(([name, v]) => `
          <div class="att-person ${v.unpaid > 0 ? 'on' : 'done'}">
            <div class="ap-main">
              <div class="ap-name">${esc(name)}</div>
              <div class="ap-sub">${v.n} ชิ้น · ยอดรวม ${fmtBaht(round2(v.total))} บาท · จ่ายแล้ว ${fmtBaht(round2(v.paid))} บาท</div>
            </div>
            <span class="ap-state" style="color:${v.unpaid > 0 ? '#b42318' : '#067647'}">
              ${v.unpaid > 0 ? 'ค้าง ' + fmtBaht(round2(v.unpaid)) + ' (' + v.unpaidN + ' ชิ้น)' : 'จ่ายครบแล้ว'}
            </span>
          </div>`).join('')}</div>`;
        paymentEl.appendChild(vCard);
      }

      // ค้างชำระรายเดือน
      const payMonthHeading = document.createElement('h2');
      payMonthHeading.className = 'section-title';
      payMonthHeading.innerHTML = icon('calendar', 17) + 'ค้างชำระรายเดือน';
      paymentEl.appendChild(payMonthHeading);

      const oGroups = {};
      const oUnknown = { count: 0, price: 0, lots: [] };
      lotBlocks.forEach(({ lot, rows }) => {
        const unpaidRows = rows.filter(r => !r.paid);
        if (unpaidRows.length === 0) return;
        const count = unpaidRows.length;
        const price = round2(unpaidRows.reduce((s, r) => s + Number(r.price), 0));
        const ym = parseLotYM(lot.name);
        if (!ym) { oUnknown.count += count; oUnknown.price += price; oUnknown.lots.push(lot.name); return; }
        const key = ym.yy + '-' + ym.month;
        if (!oGroups[key]) oGroups[key] = { yy: ym.yy, month: ym.month, count: 0, price: 0, lots: [] };
        oGroups[key].count += count;
        oGroups[key].price += price;
        oGroups[key].lots.push(lot.name);
      });
      const oGroupList = Object.values(oGroups).sort((a, b) => (b.yy * 100 + b.month) - (a.yy * 100 + a.month));

      if (oGroupList.length === 0 && oUnknown.lots.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'loading';
        empty.textContent = 'ไม่มียอดค้างชำระ';
        paymentEl.appendChild(empty);
      } else {
        oGroupList.forEach(g => {
          const card = document.createElement('div');
          card.className = 'month-card';
          card.innerHTML = `
            <h3>${THAI_MONTHS[g.month]} ${g.yy + 2500}</h3>
            <div class="month-sub">${g.lots.length} ล็อตที่ค้าง: ${g.lots.map(esc).join(', ')}</div>
            <div class="month-stats stats-2">
              <div class="stat"><div class="num">${g.count}</div><div class="lbl">ชิ้นค้าง</div></div>
              <div class="stat"><div class="num">${fmtBaht(round2(g.price))}</div><div class="lbl">ยอดค้าง (บาท)</div></div>
            </div>
          `;
          paymentEl.appendChild(card);
        });
        if (oUnknown.lots.length) {
          const card = document.createElement('div');
          card.className = 'month-card';
          card.innerHTML = `
            <h3>ไม่ระบุเดือน</h3>
            <div class="month-sub">${oUnknown.lots.length} ล็อตที่ค้าง: ${oUnknown.lots.map(esc).join(', ')}</div>
            <div class="month-stats stats-2">
              <div class="stat"><div class="num">${oUnknown.count}</div><div class="lbl">ชิ้นค้าง</div></div>
              <div class="stat"><div class="num">${fmtBaht(round2(oUnknown.price))}</div><div class="lbl">ยอดค้าง (บาท)</div></div>
            </div>
          `;
          paymentEl.appendChild(card);
        }
      }

      // ค้างชำระรายล็อต
      const payLotHeading = document.createElement('h2');
      payLotHeading.className = 'section-title';
      payLotHeading.innerHTML = icon('box', 17) + 'ค้างชำระรายล็อต';
      paymentEl.appendChild(payLotHeading);

      if (lotOutstanding.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'loading';
        empty.textContent = 'ทุกล็อตจ่ายครบแล้ว';
        paymentEl.appendChild(empty);
      } else {
        lotOutstanding.forEach(({ lot, count, price }) => {
          const row = document.createElement('div');
          row.className = 'pay-row';
          row.innerHTML = `
            <span class="pay-row-name">${esc(lot.name)}</span>
            <span class="pay-row-right"><span class="pay-row-count">${count} ชิ้น</span><span class="pay-row-price">${fmtBaht(price)} บาท</span><button class="btn secondary btn-sm mark-lot-paid" data-lot="${lot.id}">${icon('check', 15)}จ่ายครบ</button></span>
          `;
          paymentEl.appendChild(row);
        });
      }

      // ประวัติที่จ่ายแล้ว
      const payHistHeading = document.createElement('h2');
      payHistHeading.className = 'section-title';
      payHistHeading.innerHTML = icon('receipt', 17) + 'ประวัติที่จ่ายแล้ว';
      paymentEl.appendChild(payHistHeading);

      const paidRows = [];
      lotBlocks.forEach(({ lot, rows }) => {
        rows.forEach(r => { if (r.paid) paidRows.push({ lot, r }); });
      });
      paidRows.sort((a, b) => lotSortKey(b.lot.name) - lotSortKey(a.lot.name));

      const histCard = document.createElement('div');
      histCard.className = 'lot-card';
      if (paidRows.length === 0) {
        histCard.innerHTML = `<div class="loading">ยังไม่มีรายการที่จ่ายแล้ว</div>`;
      } else {
        const histRowsHtml = paidRows.map(({ lot, r }) => {
          const yardPerPiece = pieceYard(r, SETTINGS);
          return `<tr data-search="${esc([lot.name, r.label, r.item_type,
            (r.width_cm && r.length_cm ? r.width_cm + ' x ' + r.length_cm : ''), r.price]
            .filter(Boolean).join(' ').toLowerCase())}">
            <td data-label="ล็อต / รายการ">${esc(lot.name)}${r.label ? ' — ' + esc(r.label) : ''}</td>
            <td data-label="ขนาด (ซม.)">${r.width_cm && r.length_cm ? r.width_cm + ' x ' + r.length_cm : '—'}</td>
            <td data-label="ราคา">${fmtBaht(r.price)}</td>
            <td data-label="ผ้า (หลา)">${isFabricPiece(r) ? yardPerPiece.toFixed(2) : '—'}</td>
            <td data-label="สถานะ"><span class="paid-badge paid" data-id="${r.id}" data-paid="true">จ่ายแล้ว</span></td>
          </tr>`;
        }).join('');
        histCard.innerHTML = `
          <div class="table-wrap">
            <table>
              <thead><tr><th>ล็อต / รายการ</th><th>ขนาด (ซม.)</th><th>ราคา</th><th>ผ้า (หลา)</th><th>สถานะ</th></tr></thead>
              <tbody>${histRowsHtml}</tbody>
            </table>
          </div>
        `;
      }
      if (paidRows.length) {
        const histSearch = buildSearchBox({
          placeholder: 'ค้นหาในประวัติที่จ่ายแล้ว: ล็อต · ชื่อลูกค้า · ขนาด · ราคา',
          targets: () => [...histCard.querySelectorAll('tbody tr')],
        });
        paymentEl.appendChild(histSearch);
      }
      paymentEl.appendChild(histCard);

      app.appendChild(paymentEl);
      const wasteEl = renderWasteTab(lots, pieces);
      app.appendChild(wasteEl);

      dailyEl.style.display = activeTab === 'daily' ? '' : 'none';
      const syncTabs = () => {
        dailyEl.style.display = activeTab === 'daily' ? '' : 'none';
        monthlyEl.style.display = activeTab === 'monthly' ? '' : 'none';
        paymentEl.style.display = activeTab === 'payment' ? '' : 'none';
        wasteEl.hidden = false;
        wasteEl.style.display = activeTab === 'waste' ? '' : 'none';
      };
      syncTabs();

      tabs.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeTab = btn.dataset.tab;
          tabs.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
          syncTabs();
        });
      });

      app.querySelectorAll('.paid-badge').forEach(el => {
        el.addEventListener('click', async () => {
          const id = el.dataset.id;
          const next = el.dataset.paid !== 'true';
          el.textContent = '...';
          const { error } = await sb.from('pieces').update({ paid: next }).eq('id', id);
          if (error) { alert('อัปเดตไม่สำเร็จ: ' + error.message); }
          await loadAll();
        });
      });

      app.querySelectorAll('.edit-piece').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const tr = btn.closest('tr');
          const id = btn.dataset.id;
          const label = btn.dataset.label;
          const width = btn.dataset.width;
          const length = btn.dataset.length;
          const itemType = btn.dataset.type || 'ป้ายผ้า';
          const isFabric = itemType === 'ป้ายผ้า';
          tr.innerHTML = `
            <td colspan="6">
              <div class="edit-row">
                <input class="edit-label" placeholder="ชื่อ/รายละเอียด" aria-label="ชื่อ/รายละเอียด" value="${esc(label)}">
                <input class="edit-width" type="number" min="0" step="any" value="${width}" placeholder="กว้าง" aria-label="กว้าง (ซม.)">
                <input class="edit-length" type="number" min="0" step="any" value="${length}" placeholder="ยาว" aria-label="ยาว (ซม.)">
                ${isFabric ? '' : `<input class="edit-cost" type="number" min="0" step="1" value="${btn.dataset.price}" placeholder="ต้นทุน/ชิ้น" aria-label="ต้นทุนต่อชิ้น (บาท)">`}
                <button class="btn btn-sm save-piece">${icon('check', 15)}บันทึก</button>
                <button class="btn secondary btn-sm cancel-edit">${icon('close', 15)}ยกเลิก</button>
              </div>
            </td>
          `;
          tr.querySelector('.cancel-edit').addEventListener('click', () => loadAll());
          tr.querySelector('.save-piece').addEventListener('click', async () => {
            const newLabel = tr.querySelector('.edit-label').value.trim();
            const newWidth = parseFloat(tr.querySelector('.edit-width').value);
            const newLength = parseFloat(tr.querySelector('.edit-length').value);
            if (isFabric && (!newWidth || !newLength)) { alert('กรอกกว้างและยาวให้ครบ'); return; }
            const newPrice = isFabric
              ? Math.round(newWidth * newLength * SETTINGS.price_rate)
              : Math.round(parseFloat(tr.querySelector('.edit-cost').value) || 0);
            const { error } = await sb.from('pieces').update({ label: newLabel || null, width_cm: newWidth || 0, length_cm: newLength || 0, price: newPrice }).eq('id', id);
            if (error) { alert('บันทึกไม่สำเร็จ: ' + error.message); return; }
            await loadAll();
          });
        });
      });

      // ---- กดปุ่มปริ้นทีละชิ้น: ตัด/คืนผ้าอัตโนมัติ ----
      app.querySelectorAll('.print-badge').forEach(b => b.addEventListener('click', async (e) => {
        e.stopPropagation();
        const piece = pieces.find(x => x.id === b.dataset.id);
        if (!piece) return;
        const willPrint = b.dataset.printed !== 'true';
        const lotName = (lots.find(l => l.id === piece.lot_id) || {}).name || '';
        const yards = round4(pieceYard(piece, SETTINGS));
        if (willPrint) {
          const fabric = await getDefaultFabric();
          if (!fabric) { alert('ยังไม่มีผ้าดิบในสต็อก — ไปเพิ่มที่เมนู "สต็อกของ" ก่อน'); return; }
          const left = Number(fabric.total_qty) - Number(fabric.used_qty);
          const msg = 'ปริ้นงาน ' + (piece.label || 'ชิ้นนี้') + ' (' + piece.width_cm + 'x' + piece.length_cm + ')\n\n' +
            'จะตัดผ้า "' + fabric.name + '" ออก ' + yards.toFixed(2) + ' ' + fabric.unit + '\n' +
            'คงเหลือหลังตัด: ' + (left - yards).toFixed(2) + ' ' + fabric.unit +
            (left - yards < 0 ? '\n\n⚠️ ผ้าไม่พอ! (จะติดลบ)' : '');
          if (!confirm(msg)) return;
        } else {
          if (!confirm('ยกเลิกสถานะปริ้น และคืนผ้า ' + yards.toFixed(2) + ' หลา กลับเข้าสต็อก?')) return;
        }
        b.textContent = '...';
        try {
          await setPiecePrinted(piece, willPrint, lotName);
          await loadAll();
        } catch (err) { alert(err.message); await loadAll(); }
      }));

      // ---- ปริ้นทั้งล็อต ----
      app.querySelectorAll('.lot-more').forEach(b => b.addEventListener('click', () => {
        const box = b.parentElement.querySelector('.lot-more-box');
        box.hidden = !box.hidden;
        b.setAttribute('aria-expanded', String(!box.hidden));
      }));

      app.querySelectorAll('.waste-piece').forEach(b => b.addEventListener('click', async () => {
        const piece = pieces.find(x => x.id === b.dataset.id);
        if (!piece) return;
        const lot = lots.find(l => l.id === piece.lot_id);
        const def = round4(pieceYard(piece, SETTINGS)).toFixed(2);
        const res = await openWasteDialog({
          title: 'แจ้งงานเสีย',
          sub: (piece.label || 'ไม่ระบุชื่อ') + ' · ' + piece.width_cm + 'x' + piece.length_cm + ' ซม.'
            + (lot ? ' · ล็อต ' + lot.name : '') + ' — ผ้าที่ต้องตัดใหม่ตามสูตรคือ ' + def + ' หลา',
          defYards: def, showReason: true,
        });
        if (!res) return;
        b.disabled = true;
        try {
          await addWaste({ kind: 'defect', yards: res.yards, reason: res.reason, note: res.note,
            lotId: piece.lot_id, lotName: lot ? lot.name : '', piece });
          await loadAll();
        } catch (e) { alert('บันทึกไม่สำเร็จ: ' + e.message); b.disabled = false; }
      }));

      app.querySelectorAll('.waste-lot').forEach(b => b.addEventListener('click', async () => {
        const res = await openWasteDialog({
          title: 'บันทึกเศษผ้าของล็อต ' + b.dataset.name,
          sub: 'เศษที่ตัดเหลือแล้วเอาไปทำงานอื่นต่อไม่ได้ — ระบบจะตัดออกจากสต็อกผ้าดิบให้',
          defYards: '', showReason: false,
        });
        if (!res) return;
        b.disabled = true;
        try {
          await addWaste({ kind: 'scrap', yards: res.yards, note: res.note,
            lotId: b.dataset.lot, lotName: b.dataset.name });
          await loadAll();
        } catch (e) { alert('บันทึกไม่สำเร็จ: ' + e.message); b.disabled = false; }
      }));

      app.querySelectorAll('.print-lot').forEach(b => b.addEventListener('click', async () => {
        const lotId = b.dataset.lot;
        const lot = lots.find(l => l.id === lotId) || {};
        const todo = pieces.filter(r => r.lot_id === lotId && !r.printed);
        if (!todo.length) return;
        const total = round4(todo.reduce((sum, r) => sum + pieceYard(r, SETTINGS), 0));
        const fabric = await getDefaultFabric();
        if (!fabric) { alert('ยังไม่มีผ้าดิบในสต็อก — ไปเพิ่มที่เมนู "สต็อกของ" ก่อน'); return; }
        const left = Number(fabric.total_qty) - Number(fabric.used_qty);
        const msg = 'ปริ้นทั้งล็อต ' + lot.name + ' (' + todo.length + ' ชิ้น)\n\n' +
          'จะตัดผ้า "' + fabric.name + '" ออก ' + total.toFixed(2) + ' ' + fabric.unit + '\n' +
          'คงเหลือหลังตัด: ' + (left - total).toFixed(2) + ' ' + fabric.unit +
          (left - total < 0 ? '\n\n⚠️ ผ้าไม่พอ! (จะติดลบ)' : '');
        if (!confirm(msg)) return;
        b.disabled = true; b.textContent = 'กำลังตัดผ้า...';
        try {
          for (const piece of todo) await setPiecePrinted(piece, true, lot.name);
          await loadAll();
        } catch (err) { alert(err.message); await loadAll(); }
      }));

      app.querySelectorAll('.delete-piece').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (!confirm('ลบชิ้นงานนี้? (กู้คืนได้ที่เมนูถังขยะ)')) return;
          try { await trashDelete('pieces', btn.dataset.id, { label: btn.dataset.name || 'ไม่ระบุชื่อ', detail: btn.dataset.size || '' }); }
          catch (e) { alert('ลบไม่สำเร็จ: ' + e.message); return; }
          await loadAll();
        });
      });

      app.querySelectorAll('.piece-name').forEach(td => {
        td.addEventListener('click', () => {
          td.classList.toggle('active');
        });
      });

      app.querySelectorAll('.pick').forEach(cb => {
        cb.addEventListener('change', () => {
          const id = cb.dataset.id;
          if (cb.checked) {
            selectedPieces.set(id, {
              id, lotName: cb.dataset.lot, label: cb.dataset.labelTxt,
              width_cm: Number(cb.dataset.w), length_cm: Number(cb.dataset.l),
              price: Number(cb.dataset.price),
            });
          } else {
            selectedPieces.delete(id);
          }
          renderSelBar();
        });
      });

      app.querySelectorAll('.pick-all').forEach(btn => {
        btn.addEventListener('click', () => {
          const card = btn.closest('.lot-card');
          const boxes = [...card.querySelectorAll('.pick')];
          const allOn = boxes.every(b => b.checked);
          boxes.forEach(b => {
            b.checked = !allOn;
            b.dispatchEvent(new Event('change'));
          });
          btn.innerHTML = allOn ? icon('checkbox', 15) + 'เลือกทั้งล็อต' : icon('square', 15) + 'ยกเลิกที่เลือก';
        });
      });

      renderSelBar();

      app.querySelectorAll('.mark-lot-paid').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('มาร์คทุกชิ้นในล็อตนี้ว่าจ่ายแล้ว?')) return;
          const lotId = btn.dataset.lot;
          btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
          const { error } = await sb.from('pieces').update({ paid: true }).eq('lot_id', lotId);
          if (error) { alert('อัปเดตไม่สำเร็จ: ' + error.message); btn.disabled = false; return; }
          await loadAll();
        });
      });
    }

    function buildAddPanel(lots) {
      const frag = document.createDocumentFragment();

      if (lastSelectedLotId === null && lots.length) lastSelectedLotId = lots[0].id;

      // ---- panel 1: เพิ่มล็อตใหม่ ----
      const lotPanel = document.createElement('div');
      lotPanel.className = 'panel';
      lotPanel.innerHTML = `
        <h2>${icon('plus', 17)}เพิ่มล็อตใหม่</h2>
        <div class="field-row">
          <div class="field">
            <label for="newLotName">ชื่อล็อต</label>
            <input id="newLotName" placeholder="เช่น 9/8/69">
          </div>
          <button id="addLotBtn" class="btn">+ เพิ่มล็อต</button>
        </div>
        <div class="msg" id="lotMsg"></div>
      `;
      const lotNameInput = lotPanel.querySelector('#newLotName');
      const addLotBtn = lotPanel.querySelector('#addLotBtn');
      const lotMsg = lotPanel.querySelector('#lotMsg');
      async function submitLot() {
        const name = lotNameInput.value.trim();
        lotMsg.textContent = ''; lotMsg.className = 'msg';
        if (!name) { lotMsg.textContent = 'กรอกชื่อล็อตก่อน'; lotMsg.className = 'msg error'; return; }
        addLotBtn.disabled = true; addLotBtn.textContent = 'กำลังเพิ่ม...';
        const { error } = await sb.from('lots').insert({ name });
        if (error) {
          lotMsg.textContent = 'เพิ่มล็อตไม่สำเร็จ: ' + error.message; lotMsg.className = 'msg error';
          addLotBtn.disabled = false; addLotBtn.textContent = '+ เพิ่มล็อต';
          return;
        }
        await loadAll();
      }
      addLotBtn.addEventListener('click', submitLot);
      lotNameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitLot(); });

      // ---- panel 2: เพิ่มชิ้นงาน ----
      const piecePanel = document.createElement('div');
      piecePanel.className = 'panel';
      const lotOptions = lots.map(l => `<option value="${l.id}" ${l.id === lastSelectedLotId ? 'selected' : ''}>${esc(l.name)}</option>`).join('');
      piecePanel.innerHTML = `
        <h2>${icon('thread', 17)}เพิ่มชิ้นงาน</h2>
        <div class="form-grid" style="margin-bottom:var(--space-3)">
          <div class="field">
            <label for="pieceLot">เลือกล็อต</label>
            <select id="pieceLot">${lotOptions || '<option value="">-- ยังไม่มีล็อต --</option>'}</select>
          </div>
          <div class="field">
            <label for="pieceType">ประเภทงาน</label>
            <select id="pieceType">${PRODUCE_TYPES.map(t => `<option>${esc(t)}</option>`).join('')}</select>
          </div>
        </div>
        <div class="form-grid">
          <div class="field">
            <label for="pieceLabel">ชื่อ/รายละเอียด</label>
            <input id="pieceLabel" placeholder="ไม่บังคับ">
          </div>
          <div class="field">
            <label for="pieceWidth">กว้าง (ซม.)</label>
            <input id="pieceWidth" type="number" min="0" placeholder="0" inputmode="decimal">
          </div>
          <div class="field">
            <label for="pieceLength">ยาว (ซม.)</label>
            <input id="pieceLength" type="number" min="0" placeholder="0" inputmode="decimal">
          </div>
          <div class="field" id="pieceCostField" style="display:none">
            <label for="pieceCost">ต้นทุน/ชิ้น (บาท)</label>
            <input id="pieceCost" type="number" min="0" step="1" placeholder="0" inputmode="numeric">
          </div>
          <div class="field">
            <label for="pieceQty">จำนวน</label>
            <input id="pieceQty" type="number" min="1" value="1" inputmode="numeric">
          </div>
          <div class="field">
            <label for="pieceVendor">ร้านที่ส่งผลิต</label>
            <select id="pieceVendor">
              <option value="">— ยังไม่ระบุ —</option>
              ${vendorList().map(v => `<option ${v === lastVendor ? 'selected' : ''}>${esc(v)}</option>`).join('')}
              <option value="${NEW_VENDOR}">+ พิมพ์ชื่อร้านอื่น...</option>
            </select>
          </div>
          <div class="field" id="pieceVendorNewField" style="display:none">
            <label for="pieceVendorNew">ชื่อร้านใหม่</label>
            <input id="pieceVendorNew" placeholder="พิมพ์ชื่อร้าน แล้วระบบจะจำไว้ให้">
          </div>
        </div>
        <button id="addPieceBtn" class="btn secondary block">+ เพิ่มชิ้นงาน</button>
        <div class="msg" id="pieceMsg"></div>
        <div class="hint" id="pieceHint">ราคา = กว้าง x ยาว x ${SETTINGS.price_rate} บาท/ตร.ซม. · ผ้าที่ต้องเตรียม = ด้านที่ยาวกว่า + เผื่อหด ${Math.round((SETTINGS.shrink_rate - 1) * 100)}% + เผื่อริม ${Number(SETTINGS.edge_cm) || 0} ซม.</div>
      `;
      piecePanel.querySelector('#pieceLot').addEventListener('change', (e) => {
        lastSelectedLotId = e.target.value;
      });
      // ป้ายผ้า = คิดราคาจากขนาดอัตโนมัติ · งานอื่น = กรอกต้นทุนที่ร้านผลิตคิดมาเอง
      const typeSel = piecePanel.querySelector('#pieceType');
      function syncPieceType() {
        const fabric = typeSel.value === 'ป้ายผ้า';
        piecePanel.querySelector('#pieceCostField').style.display = fabric ? 'none' : '';
        piecePanel.querySelector('#pieceHint').textContent = fabric
          ? 'ราคา = กว้าง x ยาว x ' + SETTINGS.price_rate + ' บาท/ตร.ซม. · ผ้าที่ต้องเตรียม = ด้านที่ยาวกว่า + เผื่อหด ' + Math.round((SETTINGS.shrink_rate - 1) * 100) + '% + เผื่อริม ' + (Number(SETTINGS.edge_cm) || 0) + ' ซม.'
          : 'งาน' + typeSel.value + ' ไม่คิดผ้า — กรอกต้นทุนที่ร้านผลิตคิดมาเอง (ขนาดใส่หรือไม่ใส่ก็ได้)';
      }
      typeSel.addEventListener('change', syncPieceType);
      syncPieceType();
      // เลือก "พิมพ์ชื่อร้านอื่น" แล้วค่อยโชว์ช่องพิมพ์
      const vendorSel = piecePanel.querySelector('#pieceVendor');
      const vendorNewField = piecePanel.querySelector('#pieceVendorNewField');
      vendorSel.addEventListener('change', () => {
        vendorNewField.style.display = vendorSel.value === NEW_VENDOR ? '' : 'none';
        if (vendorSel.value === NEW_VENDOR) piecePanel.querySelector('#pieceVendorNew').focus();
      });

      piecePanel.querySelector('#addPieceBtn').addEventListener('click', async () => {
        const lotId = piecePanel.querySelector('#pieceLot').value;
        const label = piecePanel.querySelector('#pieceLabel').value.trim();
        const width = parseFloat(piecePanel.querySelector('#pieceWidth').value);
        const length = parseFloat(piecePanel.querySelector('#pieceLength').value);
        const qty = parseInt(piecePanel.querySelector('#pieceQty').value) || 1;
        const msg = piecePanel.querySelector('#pieceMsg');
        const btn = piecePanel.querySelector('#addPieceBtn');
        msg.textContent = ''; msg.className = 'msg';
        const itemType = piecePanel.querySelector('#pieceType').value;
        const isFabric = itemType === 'ป้ายผ้า';
        const cost = parseFloat(piecePanel.querySelector('#pieceCost').value);
        if (!lotId) { msg.textContent = 'ยังไม่มีล็อต กรุณาเพิ่มล็อตก่อน'; msg.className = 'msg error'; return; }
        if (isFabric && (!width || !length)) { msg.textContent = 'กรอกกว้างและยาวให้ครบ'; msg.className = 'msg error'; return; }
        if (!isFabric && !(cost > 0)) { msg.textContent = 'กรอกต้นทุน/ชิ้นก่อน'; msg.className = 'msg error'; return; }
        // ร้านที่ส่งผลิต — เลือกจากลิสต์ หรือพิมพ์ชื่อใหม่
        let vendor = vendorSel.value;
        if (vendor === NEW_VENDOR) {
          vendor = piecePanel.querySelector('#pieceVendorNew').value.trim();
          if (!vendor) { msg.textContent = 'พิมพ์ชื่อร้านก่อน หรือเลือกจากลิสต์'; msg.className = 'msg error'; return; }
          await rememberVendor(vendor);
        }

        btn.disabled = true; btn.textContent = 'กำลังเพิ่ม...';
        lastSelectedLotId = lotId;
        lastVendor = vendor || '';
        const price = isFabric ? Math.round(width * length * SETTINGS.price_rate) : Math.round(cost);
        const rowsToInsert = Array.from({ length: qty }, () => ({
          lot_id: lotId, width_cm: width || 0, length_cm: length || 0,
          label: label || null, price, paid: false, item_type: itemType,
          vendor: vendor || null,
        }));
        const { error } = await sb.from('pieces').insert(rowsToInsert);
        if (error) {
          msg.textContent = 'เพิ่มชิ้นงานไม่สำเร็จ: ' + error.message; msg.className = 'msg error';
          btn.disabled = false; btn.textContent = '+ เพิ่มชิ้นงาน';
          return;
        }
        await loadAll();
      });

      frag.appendChild(lotPanel);
      frag.appendChild(piecePanel);
      return frag;
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    /**
     * แทรกแถวที่มี "เลขเอกสาร" ซึ่งห้ามซ้ำ (ออเดอร์/ใบเสร็จ)
     * ถ้าชนกับเลขที่มีอยู่แล้ว (เปิด 2 เครื่องพร้อมกัน หรือเพิ่งลบเอกสารเก่า)
     * จะขอเลขใหม่แล้วลองใหม่อัตโนมัติ ไม่เด้ง error ใส่หน้าผู้ใช้
     */
    async function insertWithDocNo(table, nextNoFn, buildRow) {
      for (let attempt = 0; attempt < 5; attempt++) {
        const no = await nextNoFn();
        const { data, error } = await sb.from(table).insert(buildRow(no)).select('id').single();
        if (!error) return { no, id: data.id };
        const dup = error.code === '23505' || /duplicate key|already exists/i.test(error.message || '');
        if (!dup) throw new Error(error.message);
        await new Promise(r => setTimeout(r, 150 + Math.random() * 250));
      }
      throw new Error('ออกเลขเอกสารไม่สำเร็จ (เลขชนกันหลายครั้ง) — ลองกดใหม่อีกครั้ง');
    }

    // ===== เข้าสู่ระบบ =====
    let signupMode = false;
    // ชื่อผู้ใช้ (ไม่มี @) จะถูกแปลงเป็นอีเมลภายในอัตโนมัติ เพราะระบบยืนยันตัวตนต้องใช้อีเมล
    const LOGIN_DOMAIN = 'haifa-design.local';
    const toLoginEmail = (v) => {
      const t = (v || '').trim().toLowerCase();
      return t.includes('@') ? t : t + '@' + LOGIN_DOMAIN;
    };
    const prettyLogin = (email) => {
      const t = (email || '');
      return t.endsWith('@' + LOGIN_DOMAIN) ? t.split('@')[0].toUpperCase() : t;
    };

    function showAuthScreen(show) {
      document.getElementById('authScreen').hidden = !show;
      document.querySelector('.sidebar').style.display = show ? 'none' : '';
      document.querySelector('header').style.display = show ? 'none' : '';
      document.getElementById('app').style.display = show ? 'none' : '';
    }

    function bindAuthUI() {
      const email = document.getElementById('auEmail');
      const pass = document.getElementById('auPass');
      const msg = document.getElementById('auMsg');
      const btn = document.getElementById('auLogin');
      const toggle = document.getElementById('auSignupToggle');
      const note = document.getElementById('auNote');

      const say = (t, cls) => { msg.textContent = t; msg.className = 'msg' + (cls ? ' ' + cls : ''); };

      toggle.addEventListener('click', () => {
        signupMode = !signupMode;
        btn.textContent = signupMode ? 'สมัครใช้งาน' : 'เข้าสู่ระบบ';
        toggle.textContent = signupMode ? 'กลับไปหน้าเข้าสู่ระบบ' : 'สมัครใช้งานครั้งแรก';
        note.hidden = !signupMode;
        pass.autocomplete = signupMode ? 'new-password' : 'current-password';
        say('');
      });

      async function submit() {
        const e = email.value.trim(), p = pass.value;
        if (!e || !p) { say('กรอกชื่อผู้ใช้/อีเมล และรหัสผ่านให้ครบ', 'error'); return; }
        if (signupMode && p.length < 8) { say('รหัสผ่านต้องยาวอย่างน้อย 8 ตัวอักษร', 'error'); return; }
        btn.disabled = true; say(signupMode ? 'กำลังสมัคร...' : 'กำลังเข้าสู่ระบบ...');
        try {
          if (signupMode) {
            const { error } = await sb.auth.signUp({ email: toLoginEmail(e), password: p });
            if (error) throw error;
            say('สมัครแล้ว — เช็คอีเมล ' + e + ' แล้วกดลิงก์ยืนยัน จากนั้นกลับมาเข้าสู่ระบบ', 'ok');
          } else {
            const { data, error } = await sb.auth.signInWithPassword({ email: toLoginEmail(e), password: p });
            if (error) throw error;
            pass.value = '';
            say('เข้าสู่ระบบสำเร็จ กำลังโหลดข้อมูล...', 'ok');
            await enterApp(data.user, { fresh: true });
          }
        } catch (err) {
          console.error(err);
          const m = String(err.message || err);
          say(/Invalid login/i.test(m) ? 'ชื่อผู้ใช้/อีเมล หรือรหัสผ่านไม่ถูกต้อง'
            : /not confirmed/i.test(m) ? 'ยังไม่ได้ยืนยันอีเมล — กดลิงก์ในอีเมลก่อน'
            : /already registered/i.test(m) ? 'อีเมลนี้สมัครไว้แล้ว กลับไปหน้าเข้าสู่ระบบได้เลย'
            : m, 'error');
        } finally { btn.disabled = false; }
      }

      btn.addEventListener('click', submit);
      pass.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') submit(); });
      email.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') pass.focus(); });

      document.getElementById('auReset').addEventListener('click', async () => {
        const e = email.value.trim();
        if (!e) { say('ใส่อีเมลก่อน แล้วกดลืมรหัสผ่านอีกครั้ง', 'error'); return; }
        const { error } = await sb.auth.resetPasswordForEmail(e, { redirectTo: location.href.split('#')[0] });
        say(error ? error.message : 'ส่งลิงก์ตั้งรหัสใหม่ไปที่ ' + e + ' แล้ว', error ? 'error' : 'ok');
      });

      document.getElementById('logoutBtn').addEventListener('click', async () => {
        if (!confirm('ออกจากระบบ?')) return;
        await sb.auth.signOut();
        location.reload();
      });
    }

    async function enterApp(user, opts) {
      ME = user || null;
      await loadMyProfile();
      const who = document.getElementById('whoami');
      const out = document.getElementById('logoutBtn');
      if (user) {
        who.innerHTML = esc(MY_NAME || prettyLogin(user.email) || '') +
          (MY_ROLE ? ' <span class="st ' + roleMeta(MY_ROLE).cls + '">' + roleMeta(MY_ROLE).label + '</span>' : '');
        out.hidden = false;
      }
      applyRoleUI();
      showAuthScreen(false);
      if (opts && opts.fresh) {
        // เพิ่งล็อกอิน -> เริ่มที่ My Job เสมอ (ไม่ค้างอยู่หน้าเดิมก่อนออกจากระบบ)
        currentView = HOME_VIEW;
        viewingOrderId = null; viewingReceiptId = null;
        suppressHash = true;
        location.hash = '#/' + HOME_VIEW;
        setTimeout(() => { suppressHash = false; }, 150);
      } else {
        applyHash();   // เปิดลิงก์ตรงมา (เช่น #/order/xxx) ให้ไปหน้านั้นตามเดิม
      }
      await boot();
      checkForUpdate(true);
      setInterval(() => checkForUpdate(true), 15 * 60 * 1000);
      window.addEventListener('focus', () => checkForUpdate());   // มีตัวหรี่ 5 นาทีในตัวแล้ว
    }

    // ---- จุดเริ่มระบบ: รอไลบรารีให้พร้อมก่อน ----
    (async function startApp() {
      initTheme();
      try { await window.__libsReady; } catch (e) { /* ไม่เป็นไร เช็คซ้ำข้างล่าง */ }
      if (typeof supabase === 'undefined') {
        document.getElementById('app').innerHTML =
          '<div class="info-note">โหลดตัวเชื่อมฐานข้อมูลไม่สำเร็จ (เน็ตมีปัญหา หรือ CDN ล่มทั้ง 2 ที่)<br>' +
          'ลองรีเฟรชหน้าอีกครั้ง ข้อมูลทั้งหมดยังอยู่ครบ ไม่ได้หายไปไหน</div>';
        document.getElementById('statusMsg').textContent = 'เชื่อมต่อไม่ได้';
        return;
      }
      sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      bindAuthUI();
      let session = null;
      try {
        // กันค้าง: ถ้าอ่าน session ไม่เสร็จใน 8 วิ ให้ถือว่ายังไม่ล็อกอิน
        const res = await Promise.race([
          sb.auth.getSession(),
          new Promise(r => setTimeout(() => r({ data: { session: null } }), 8000)),
        ]);
        session = res && res.data ? res.data.session : null;
      } catch (e) { session = null; }
      if (session) { await enterApp(session.user); }
      else { showAuthScreen(true); document.getElementById('auEmail').focus(); }
    })();
  </script>
</body>
</html>
