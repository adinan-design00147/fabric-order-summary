    // ===== สำรองข้อมูลลงเครื่อง =====
    // แพลนฟรีของ Supabase โหลด backup เองไม่ได้ -> ต้องดึงข้อมูลออกมาเก็บไว้เอง
    const BACKUP_TABLES = ['lots', 'pieces', 'settings', 'shop_info', 'products', 'orders',
      'order_items', 'order_payments', 'receipts', 'receipt_items',
      'stock_items', 'stock_moves', 'purchases', 'purchase_orders', 'activity_log'];
    const BACKUP_KEY = 'haifa_last_backup';
    const GH_REPO = 'adinan-design00147/fabric-order-summary';   // ใช้เช็กว่า workflow ปลุกฐานข้อมูลยังไม่ถูกปิด

    async function fetchAllTables() {
      const out = {};
      for (const t of BACKUP_TABLES) {
        const { data, error } = await sb.from(t).select('*');
        if (error) throw new Error(t + ': ' + error.message);
        out[t] = data || [];
      }
      return out;
    }

    function downloadFile(filename, text, mime) {
      const blob = new Blob(['﻿' + text], { type: (mime || 'text/plain') + ';charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }

    function rowsToCsv(rows) {
      if (!rows.length) return '';
      const cols = Object.keys(rows[0]);
      const cell = (v) => {
        if (v === null || v === undefined) return '';
        const s = (typeof v === 'object') ? JSON.stringify(v) : String(v);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      };
      return [cols.join(','), ...rows.map(r => cols.map(c => cell(r[c])).join(','))].join('\n');
    }

    // เก็บวันสำรองไว้ในฐานข้อมูลด้วย เครื่องอื่นจะได้รู้ว่ามีคนสำรองไปแล้ว
    // (เดิมเก็บใน localStorage เครื่องเดียว สำรองจากมือถือแล้วคอมยังเตือนอยู่)
    let LAST_BACKUP_AT = null;

    async function markBackedUp() {
      const now = new Date().toISOString();
      try { localStorage.setItem(BACKUP_KEY, now); } catch (e) {}
      LAST_BACKUP_AT = now;
      try { await sb.from('settings').upsert({ key: 'last_backup_at', value: now }, { onConflict: 'key' }); } catch (e) {}
    }

    async function fetchLastBackup() {
      try {
        const { data } = await sb.from('settings').select('value').eq('key', 'last_backup_at').maybeSingle();
        if (data && data.value) LAST_BACKUP_AT = data.value;
      } catch (e) {}
      if (!LAST_BACKUP_AT) { try { LAST_BACKUP_AT = localStorage.getItem(BACKUP_KEY); } catch (e) {} }
      return LAST_BACKUP_AT;
    }

    function daysSinceBackup() {
      let t = LAST_BACKUP_AT;
      if (!t) { try { t = localStorage.getItem(BACKUP_KEY); } catch (e) {} }
      if (!t) return null;
      return Math.floor((Date.now() - new Date(t).getTime()) / 86400000);
    }

    // ---- สร้างไฟล์ ZIP เอง (แบบ store ไม่บีบอัด) จะได้ไม่ต้องพึ่งไลบรารีนอก ----
    const CRC_TABLE = (() => {
      const t = new Uint32Array(256);
      for (let i = 0; i < 256; i++) {
        let c = i;
        for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        t[i] = c >>> 0;
      }
      return t;
    })();
    function crc32(bytes) {
      let c = 0xFFFFFFFF;
      for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
      return (c ^ 0xFFFFFFFF) >>> 0;
    }
    /** files: [{ name, text }] -> Blob (.zip) */
    function makeZip(files) {
      const enc = new TextEncoder();
      const chunks = [], central = [];
      let offset = 0;
      const u16 = (n) => [n & 0xFF, (n >>> 8) & 0xFF];
      const u32 = (n) => [n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF];

      files.forEach(f => {
        const name = enc.encode(f.name);
        const data = enc.encode('\ufeff' + f.text);   // BOM ให้ Excel อ่านภาษาไทยถูก
        const crc = crc32(data);
        const local = [].concat(
          u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(0), u16(0),
          u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0));
        chunks.push(new Uint8Array(local), name, data);
        central.push([].concat(
          u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0),
          u32(crc), u32(data.length), u32(data.length),
          u16(name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset)));
        central.push(name);
        offset += local.length + name.length + data.length;
      });

      const cdChunks = [];
      let cdSize = 0;
      for (let i = 0; i < central.length; i += 2) {
        const head = new Uint8Array(central[i]), nm = central[i + 1];
        cdChunks.push(head, nm);
        cdSize += head.length + nm.length;
      }
      const end = new Uint8Array([].concat(
        u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length),
        u32(cdSize), u32(offset), u16(0)));
      return new Blob([...chunks, ...cdChunks, end], { type: 'application/zip' });
    }

    /** แจ้งผลสั้นๆ มุมล่างจอ — บนมือถือกดบันทึกแล้วต้องรู้ทันทีว่าติดไหม ไม่ต้องเดา */
    let toastTimer = null;
    function toast(text, kind) {
      let el = document.getElementById('toast');
      if (!el) {
        el = document.createElement('div');
        el.id = 'toast';
        el.className = 'toast no-print';
        document.body.appendChild(el);
      }
      el.className = 'toast no-print ' + (kind === 'error' ? 'error' : 'ok');
      el.innerHTML = (kind === 'error' ? icon('close', 17) : icon('check', 17)) + '<span></span>';
      el.querySelector('span').textContent = text;
      requestAnimationFrame(() => el.classList.add('show'));
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), kind === 'error' ? 4000 : 2200);
    }

    function downloadBlob(filename, blob) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }

    /** สคริปต์สร้างตารางใหม่ทั้งหมด — ใช้ตอนต้องย้ายไป Supabase โปรเจกต์ใหม่ */
    const RESTORE_DDL = `create extension if not exists "pgcrypto";

create table if not exists lots (id uuid primary key default gen_random_uuid(), name text not null, lot_date date, created_at timestamptz default now());
create table if not exists pieces (id uuid primary key default gen_random_uuid(), lot_id uuid references lots(id) on delete cascade, width_cm numeric, length_cm numeric, label text, price numeric, paid boolean default false, sell_price numeric, item_type text not null default 'ป้ายผ้า', created_at timestamptz default now());
create table if not exists settings (key text primary key, value numeric);
create table if not exists shop_info (key text primary key, value text, sort_order int default 0, updated_at timestamptz default now());
create table if not exists products (id uuid primary key default gen_random_uuid(), name text not null, category text, pricing_mode text check (pricing_mode in ('fixed','per_area','tier')), unit_price numeric, area_rate numeric, tiers jsonb, unit text default 'ชิ้น', note text, active boolean default true, width_cm numeric, length_cm numeric, sort_order int default 10, created_at timestamptz default now());
create table if not exists orders (id uuid primary key default gen_random_uuid(), order_no text unique, customer text, channel text, status text default 'new', due_date date, note text, total numeric default 0, payment_method text, paid_amount numeric default 0, address text, phone text, created_at timestamptz default now());
create table if not exists order_items (id uuid primary key default gen_random_uuid(), order_id uuid references orders(id) on delete cascade, product_id uuid, name text, width_cm numeric, length_cm numeric, qty int default 1, unit_price numeric, line_total numeric);
create table if not exists order_payments (id uuid primary key default gen_random_uuid(), order_id uuid references orders(id) on delete cascade, amount numeric, method text, note text, paid_at timestamptz default now());
create table if not exists receipts (id uuid primary key default gen_random_uuid(), receipt_no text unique, recipient text, note text, total numeric, item_count int, order_id uuid references orders(id) on delete set null, created_at timestamptz default now());
create table if not exists receipt_items (id uuid primary key default gen_random_uuid(), receipt_id uuid references receipts(id) on delete cascade, piece_id uuid, lot_name text, label text, width_cm numeric, length_cm numeric, price numeric);
create table if not exists stock_items (id uuid primary key default gen_random_uuid(), name text not null, category text not null default 'อื่นๆ', unit text not null default 'ชิ้น', total_qty numeric not null default 0, used_qty numeric not null default 0, threshold_pct numeric not null default 20, threshold_qty numeric, note text, active boolean not null default true, created_at timestamptz default now());
create table if not exists stock_moves (id uuid primary key default gen_random_uuid(), item_id uuid references stock_items(id) on delete cascade, kind text not null check (kind in ('in','out')), qty numeric not null, note text, order_id uuid references orders(id) on delete set null, order_no text, created_at timestamptz default now());
create table if not exists activity_log (id uuid primary key default gen_random_uuid(), entity_type text, entity_id uuid, entity_label text, action text, detail text, created_at timestamptz default now());

-- เปิด RLS: เข้าถึงได้เฉพาะคนที่ล็อกอินแล้ว (ต้องสมัครบัญชีในหน้าเว็บก่อน)
do $$
declare t text;
begin
  foreach t in array array['lots','pieces','settings','shop_info','products','orders','order_items','order_payments','receipts','receipt_items','stock_items','stock_moves','activity_log']
  loop
    execute format('alter table %I enable row level security', t);
    execute format('drop policy if exists "authenticated full access" on %I', t);
    execute format('create policy "authenticated full access" on %I for all to authenticated using (true) with check (true)', t);
  end loop;
end $$;
`;

    function sqlLit(v) {
      if (v === null || v === undefined) return 'null';
      if (typeof v === 'boolean') return v ? 'true' : 'false';
      if (typeof v === 'number') return String(v);
      if (typeof v === 'object') return "'" + JSON.stringify(v).replace(/'/g, "''") + "'::jsonb";
      return "'" + String(v).replace(/'/g, "''") + "'";
    }

    function buildRestoreSql(data, stampText) {
      const out = ['-- Haifa Design — สคริปต์กู้คืนฐานข้อมูลทั้งหมด',
        '-- สำรองเมื่อ: ' + stampText,
        '-- วิธีใช้: สร้างโปรเจกต์ Supabase ใหม่ -> SQL Editor -> วางไฟล์นี้ทั้งไฟล์ -> Run',
        '--        แล้วแก้ SUPABASE_URL / SUPABASE_ANON_KEY ใน app.html ให้ตรงกับโปรเจกต์ใหม่', '',
        RESTORE_DDL, '', '-- ===== ข้อมูล ====='];
      BACKUP_TABLES.forEach(t => {
        const rows = data[t] || [];
        if (!rows.length) { out.push('-- ' + t + ': ไม่มีข้อมูล'); return; }
        const cols = Object.keys(rows[0]);
        out.push('-- ' + t + ' (' + rows.length + ' แถว)');
        rows.forEach(r => {
          out.push('insert into ' + t + ' (' + cols.join(', ') + ') values (' +
            cols.map(c => sqlLit(r[c])).join(', ') + ') on conflict do nothing;');
        });
        out.push('');
      });
      return out.join('\n');
    }

    function buildBackupPanel() {
      const panel = document.createElement('div');
      panel.className = 'panel no-print';
      const days = daysSinceBackup();
      const stamp = days === null ? 'ยังไม่เคยสำรอง'
        : days === 0 ? 'สำรองล่าสุด: วันนี้'
        : 'สำรองล่าสุด: ' + days + ' วันที่แล้ว';
      const warn = (days === null || days > 30);
      panel.innerHTML = `
        <h2>${icon('box', 17)}สำรองข้อมูลทั้งระบบ</h2>
        <div class="${warn ? 'info-note' : 'hint'}" style="margin-bottom:12px">
          ${esc(stamp)}${warn ? ' — แพลนฟรีของ Supabase ดาวน์โหลด backup เองไม่ได้ ควรเก็บไฟล์ไว้ในเครื่อง' : ''}
        </div>
        <button class="btn block" id="bkAll">${icon('box', 16)}สำรองทั้งระบบ (ไฟล์เดียว .zip)</button>
        <div class="msg" id="bkMsg"></div>
        <div class="hint">ในไฟล์ zip มี: ข้อมูลดิบ JSON · ตาราง CSV ทุกตาราง (เปิด Excel ได้) · สคริปต์กู้คืน SQL · คู่มือ<br>
          หมายเหตุ: รูปงานไม่ได้อยู่ในไฟล์นี้ (เก็บบน Google Drive อยู่แล้ว)</div>
      `;
      const msg = panel.querySelector('#bkMsg');

      panel.querySelector('#bkAll').addEventListener('click', async () => {
        const btn = panel.querySelector('#bkAll');
        btn.disabled = true;
        msg.textContent = 'กำลังดึงข้อมูล...'; msg.className = 'msg';
        try {
          const data = await fetchAllTables();
          const now = new Date();
          const day = now.toISOString().slice(0, 10);
          const stampText = now.toLocaleString('th-TH');
          const rows = Object.values(data).reduce((s, r) => s + r.length, 0);

          const readme = [
            'สำรองข้อมูลระบบ Haifa Design',
            'สำรองเมื่อ: ' + stampText,
            '',
            'ในไฟล์นี้มีอะไรบ้าง',
            '  backup.json   ข้อมูลดิบทั้งหมดในไฟล์เดียว',
            '  csv/          ข้อมูลเดียวกัน แยกไฟล์ต่อตาราง เปิดด้วย Excel ได้เลย',
            '  restore.sql   สคริปต์สร้างฐานข้อมูลใหม่ + ใส่ข้อมูลกลับ',
            '',
            'วิธีกู้คืนถ้าโปรเจกต์ Supabase หาย',
            '  1. สร้างโปรเจกต์ใหม่ที่ supabase.com (ฟรี)',
            '  2. SQL Editor -> วางไฟล์ restore.sql ทั้งไฟล์ -> Run',
            '  3. สมัครบัญชีใหม่ในหน้าเว็บ (ปุ่ม "สมัครใช้งานครั้งแรก") แล้วยืนยันอีเมล',
            '  4. แก้ SUPABASE_URL กับ SUPABASE_ANON_KEY ใน app.html ให้ตรงกับโปรเจกต์ใหม่',
            '',
            'รูปงานไม่ได้อยู่ในไฟล์นี้ — เก็บบน Google Drive ของคุณเอง',
            '  โฟลเดอร์ "งานป้ายผ้า" และ "รูปงานออเดอร์"',
            '',
            'จำนวนข้อมูลที่สำรองไว้',
          ].concat(BACKUP_TABLES.map(t => '  ' + t.padEnd(18) + String((data[t] || []).length).padStart(5) + ' แถว')).join('\n');

          const files = [
            { name: 'อ่านก่อน.txt', text: readme },
            { name: 'backup.json', text: JSON.stringify({ exported_at: now.toISOString(), data }, null, 1) },
            { name: 'restore.sql', text: buildRestoreSql(data, stampText) },
          ];
          BACKUP_TABLES.forEach(t => {
            if ((data[t] || []).length) files.push({ name: 'csv/' + t + '.csv', text: rowsToCsv(data[t]) });
          });

          msg.textContent = 'กำลังบีบไฟล์...';
          const zip = makeZip(files);
          downloadBlob('haifa-backup-' + day + '.zip', zip);
          markBackedUp();
          msg.textContent = 'สำรองแล้ว: ' + rows + ' แถว · ' + files.length + ' ไฟล์ · ' +
            (zip.size / 1024).toFixed(0) + ' KB';
          msg.className = 'msg ok';
        } catch (e) {
          msg.textContent = 'สำรองไม่สำเร็จ: ' + e.message; msg.className = 'msg error';
        } finally { btn.disabled = false; }
      });
      return panel;
    }

    // ===== เช็กว่ามีเวอร์ชันใหม่ไหม =====
    // เบราว์เซอร์ชอบจำไฟล์เก่าไว้ (cache) ทำให้ไม่เห็นของที่เพิ่งอัปเดต
    // ตัวนี้จะแอบเทียบเวอร์ชันกับไฟล์บนเซิร์ฟเวอร์ แล้วขึ้นแถบให้กดอัปเดต
    const APP_BUILD = '20260827-0130';

    let lastUpdateCheck = 0;

    // อ่านจากไฟล์ version.txt (ไม่กี่ไบต์) แทนการโหลด app.html ทั้งก้อน 470 KB
    // ถ้าไฟล์นั้นหาย (เช่น deploy เก่า) ค่อยถอยไปอ่าน app.html เหมือนเดิม
    async function checkForUpdate(force) {
      const now = Date.now();
      if (!force && now - lastUpdateCheck < 5 * 60 * 1000) return;   // เช็กถี่สุด 5 นาทีครั้ง
      lastUpdateCheck = now;
      try {
        let build = null;
        const res = await fetch('version.txt?_=' + now, { cache: 'no-store' });
        if (res.ok) {
          const t = (await res.text()).trim();
          if (t && t.length < 40) build = t;
        }
        if (!build) {
          const res2 = await fetch('app.html?_=' + now, { cache: 'no-store' });
          if (!res2.ok) return;
          const m = (await res2.text()).match(/APP_BUILD\s*=\s*'([^']+)'/);   // เขียนแบบนี้กัน sed ตอน deploy ทับ
          build = m ? m[1] : null;
        }
        if (!build || build === APP_BUILD) return;
        showUpdateBar();
      } catch (e) { /* ออฟไลน์ก็ข้ามไป */ }
    }

    function showUpdateBar() {
      if (document.getElementById('updateBar')) return;
      const bar = document.createElement('div');
      bar.id = 'updateBar';
      bar.className = 'update-bar no-print';
      bar.innerHTML = `<span>${icon('check', 16)}มีเวอร์ชันใหม่ของระบบแล้ว</span>
        <button class="btn btn-sm" id="doUpdate">อัปเดตเลย</button>`;
      document.body.appendChild(bar);
      bar.querySelector('#doUpdate').addEventListener('click', () => {
        const u = new URL(location.href);
        u.searchParams.set('v', Date.now());
        location.replace(u.toString());
      });
    }

    // ===== ภาษี =====
    // ตอนนี้ร้านยังไม่จด VAT -> vat_enabled = 0 ทุกอย่างทำงานเหมือนเดิมทุกบาท
    // วันจดจริงค่อยเปิดสวิตช์ในหน้า "สินค้า & ราคา" ระบบจะแยกยอดและเปลี่ยนชื่อเอกสารให้เอง
    const cfg = (k, def) => {
      const v = SETTINGS ? SETTINGS[k] : undefined;
      return (v === undefined || v === null || Number.isNaN(Number(v))) ? def : Number(v);
    };
    const vatOn = () => cfg('vat_enabled', 0) === 1;
    const vatRate = () => cfg('vat_rate', 7) / 100;
    const whtRate = () => cfg('wht_rate', 3) / 100;
    const priceIncludesVat = () => cfg('price_includes_vat', 1) !== 0;

    /** แยกยอดรวมเป็น ก่อนภาษี / VAT / รวมสุทธิ — ปิดสวิตช์อยู่จะคืน VAT = 0 */
    function splitVat(total) {
      const t = round2(Number(total) || 0);
      if (!vatOn()) return { subtotal: t, vat: 0, total: t };
      if (priceIncludesVat()) {
        const sub = round2(t / (1 + vatRate()));
        return { subtotal: sub, vat: round2(t - sub), total: t };
      }
      const vat = round2(t * vatRate());
      return { subtotal: t, vat, total: round2(t + vat) };
    }

    /** ชื่อเอกสารเปลี่ยนตามสถานะการจด VAT (ยังไม่จด = ห้ามเขียนว่าใบกำกับภาษี) */
    const receiptTitle = () => vatOn() ? 'ใบเสร็จรับเงิน / ใบกำกับภาษี' : 'ใบเสร็จรับเงิน';

    /** บล็อกข้อมูลผู้เสียภาษีของร้าน (โผล่เฉพาะตอนจด VAT แล้วและกรอกข้อมูลครบ) */
    function taxIdBlockHTML() {
      if (!vatOn() || !SHOP.tax_id) return '';
      return `<div class="tax-block">
        <div>${esc(SHOP.legal_name || 'Haifa Design')}</div>
        ${SHOP.tax_address ? `<div>${esc(SHOP.tax_address)}</div>` : ''}
        <div>เลขประจำตัวผู้เสียภาษี ${esc(SHOP.tax_id)}${SHOP.branch ? ' · ' + esc(SHOP.branch) : ''}</div>
      </div>`;
    }

    // ===== ข้อมูลร้าน / ช่องทางชำระเงิน =====
    let SHOP = {};

    async function fetchShopInfo() {
      if (Object.keys(SHOP).length) return SHOP;
      try {
        const { data } = await sb.from('shop_info').select('key,value');
        (data || []).forEach(r => { SHOP[r.key] = r.value; });
      } catch (e) { /* ไม่มีข้อมูลร้านไม่ควรทำให้หน้าเว็บพัง */ }
      return SHOP;
    }

    /** กล่องเลขบัญชี ใช้ในใบออเดอร์/ใบเสร็จ (โชว์เฉพาะตอนมีข้อมูล) */
    function bankBlockHTML() {
      if (!SHOP.account_no) return '';
      return `<div class="pay-block">
        <div class="pay-title">${icon('wallet', 15)}ช่องทางชำระเงิน</div>
        <div class="pay-line">ธนาคาร ${esc(SHOP.bank_name || '')}</div>
        <div class="pay-line">ชื่อบัญชี ${esc(SHOP.account_name || '')}</div>
        <div class="pay-acc">${esc(SHOP.account_no)}</div>
      </div>`;
    }

    // ===== สินค้า & ราคาขาย =====
    let PRODUCTS = [];

    async function fetchProducts() {
      const { data, error } = await sb.from('products')
        .select('id,name,category,pricing_mode,unit_price,area_rate,tiers,unit,note,active,width_cm,length_cm,sort_order')
        .eq('active', true)
        .order('sort_order').order('created_at');
      if (error) throw error;
      PRODUCTS = data;
      return data;
    }

    /** ราคาขั้นบันได: เลือกช่วงที่จำนวนถึงเกณฑ์สูงสุด (ต่ำกว่าขั้นแรกใช้ราคาขั้นแรก) */
    function tierList(p) {
      const t = Array.isArray(p.tiers) ? p.tiers.slice() : [];
      return t.sort((a, b) => Number(a.min_qty) - Number(b.min_qty));
    }

    function tierPrice(p, qty) {
      const t = tierList(p);
      if (!t.length) return Number(p.unit_price || 0);
      let price = Number(t[0].price);
      t.forEach(x => { if (qty >= Number(x.min_qty)) price = Number(x.price); });
      return price;
    }

    /** แปลง "100=4.5, 700=4, 1000=3.5" -> array | null */
    function parseTierText(txt) {
      const out = [];
      String(txt || '').split(/[,\n]/).forEach(part => {
        const m = part.trim().match(/^(\d+)\s*=\s*([\d.]+)$/);
        if (m) out.push({ min_qty: parseInt(m[1], 10), price: parseFloat(m[2]) });
      });
      return out.length ? out.sort((a, b) => a.min_qty - b.min_qty) : null;
    }

    function tierText(p) {
      return tierList(p).map(t => t.min_qty + '=' + t.price).join(', ');
    }

    function productOptionLabel(p) {
      let price;
      if (p.pricing_mode === 'per_area') price = fmtBaht(p.area_rate) + ' บ./ตร.ซม.';
      else if (p.pricing_mode === 'tier') {
        const t = tierList(p);
        price = t.length ? t[t.length - 1].price + '–' + t[0].price + ' บ./' + p.unit + ' (ตามจำนวน)' : '—';
      } else price = fmtBaht(p.unit_price || 0) + ' บ.';
      return p.name + ' — ' + price + (p.note === 'ขนาดขายดี' ? ' ★' : '');
    }

    /** ตัวเลือกสินค้าในฟอร์มออเดอร์ จัดกลุ่มตามหมวด (optgroup) */
    function productOptionsHTML() {
      const groups = new Map();
      PRODUCTS.forEach(p => {
        const key = p.category || 'อื่นๆ';
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(p);
      });
      return [...groups.entries()].map(([cat, items]) => {
        const opts = items
          .slice()
          .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0))
          .map(p => `<option value="${p.id}">${esc(productOptionLabel(p))}</option>`)
          .join('');
        return `<optgroup label="${esc(cat)}">${opts}</optgroup>`;
      }).join('');
    }

    async function loadProductCatalog() {
      document.getElementById('statusMsg').textContent = 'กำลังโหลด...';
      renderProductCatalog(await fetchProducts());
      document.getElementById('statusMsg').textContent = 'อัปเดตล่าสุด: ' + new Date().toLocaleString('th-TH');
    }

    function priceLabel(p) {
      if (p.pricing_mode === 'per_area') return fmtBaht(p.area_rate) + ' บาท/ตร.ซม.';
      if (p.pricing_mode === 'tier') {
        const t = tierList(p);
        return t.length
          ? t.map(x => Number(x.min_qty).toLocaleString('th-TH') + '+ = ' + x.price).join(' · ') + ' บาท/' + p.unit
          : 'ยังไม่ได้ตั้งขั้นราคา';
      }
      return fmtBaht(p.unit_price || 0) + ' บาท/' + p.unit;
    }

    function renderProductCatalog(list) {
      const app = document.getElementById('app');
      app.innerHTML = '';
      app.appendChild(buildPageHead('สินค้า & ราคา', 'ราคาขายของร้าน (รวมกำไรแล้ว) ใช้ตอนคีย์ออเดอร์'));

      // ฟอร์มเพิ่มสินค้า
      const panel = document.createElement('div');
      panel.className = 'panel';
      panel.innerHTML = `
        <h2>${icon('plus', 17)}เพิ่มสินค้า</h2>
        <div class="form-grid">
          <div class="field"><label for="pName">ชื่อสินค้า</label><input id="pName" placeholder="เช่น การ์ดแต่งงาน"></div>
          <div class="field"><label for="pCat">หมวด</label><input id="pCat" placeholder="เช่น การ์ด"></div>
          <div class="field"><label for="pUnit">หน่วย</label><input id="pUnit" placeholder="ชิ้น" value="ชิ้น"></div>
          <div class="field">
            <label for="pMode">คิดราคาแบบ</label>
            <select id="pMode">
              <option value="fixed">ตายตัวต่อหน่วย</option>
              <option value="per_area">ตามขนาด (บาท/ตร.ซม.)</option>
              <option value="tier">ขั้นบันไดตามจำนวน</option>
            </select>
          </div>
          <div class="field"><label for="pPrice">ราคาขาย</label><input id="pPrice" type="number" min="0" step="any" placeholder="0" inputmode="decimal"></div>
          <div class="field" id="pTierField" style="display:none"><label for="pTiers">ขั้นราคา</label><input id="pTiers" placeholder="100=4.5, 700=4, 1000=3.5"></div>
          <div class="field"><label for="pW">กว้าง (ซม.)</label><input id="pW" type="number" min="0" step="any" placeholder="ไม่บังคับ" inputmode="decimal"></div>
          <div class="field"><label for="pL">ยาว (ซม.)</label><input id="pL" type="number" min="0" step="any" placeholder="ไม่บังคับ" inputmode="decimal"></div>
        </div>
        <button id="pAdd" class="btn secondary block">${icon('plus', 15)}เพิ่มสินค้า</button>
        <div class="msg" id="pMsg"></div>
        <div class="hint" id="pHint">คิดตายตัว = ราคาต่อ 1 หน่วย · คิดตามขนาด = ระบบจะคูณ กว้าง × ยาว × เรตนี้ ให้ตอนคีย์ออเดอร์</div>
      `;
      app.appendChild(panel);

      panel.querySelector('#pMode').addEventListener('change', (e) => {
        const m = e.target.value;
        panel.querySelector('#pTierField').style.display = m === 'tier' ? '' : 'none';
        panel.querySelector('#pHint').textContent =
          m === 'per_area' ? 'ใส่เรตเป็น บาท/ตร.ซม. เช่น 0.02 → ป้าย 50×200 ซม. = 200 บาท'
          : m === 'tier' ? 'ใส่ขั้นราคาเป็น จำนวน=ราคา คั่นด้วยจุลภาค เช่น 100=4.5, 700=4, 1000=3.5 · ช่อง "ราคาขาย" ใช้เป็นราคาตั้งต้น'
          : 'ใส่ราคาขายต่อ 1 หน่วย';
      });

      panel.querySelector('#pAdd').addEventListener('click', async () => {
        const name = panel.querySelector('#pName').value.trim();
        const mode = panel.querySelector('#pMode').value;
        const price = parseFloat(panel.querySelector('#pPrice').value);
        const msg = panel.querySelector('#pMsg');
        msg.textContent = ''; msg.className = 'msg';
        if (!name) { msg.textContent = 'กรอกชื่อสินค้าก่อน'; msg.className = 'msg error'; return; }
        if (isNaN(price)) { msg.textContent = 'กรอกราคาก่อน'; msg.className = 'msg error'; return; }
        const btn = panel.querySelector('#pAdd');
        btn.disabled = true;
        const { error } = await sb.from('products').insert({
          name,
          category: panel.querySelector('#pCat').value.trim() || null,
          unit: panel.querySelector('#pUnit').value.trim() || 'ชิ้น',
          pricing_mode: mode,
          unit_price: mode === 'per_area' ? null : price,
          area_rate: mode === 'per_area' ? price : null,
          tiers: mode === 'tier' ? parseTierText(panel.querySelector('#pTiers').value) : null,
          width_cm: parseFloat(panel.querySelector('#pW').value) || null,
          length_cm: parseFloat(panel.querySelector('#pL').value) || null,
          sort_order: 10,
        });
        if (error) { msg.textContent = 'เพิ่มไม่สำเร็จ: ' + error.message; msg.className = 'msg error'; btn.disabled = false; return; }
        await loadProductCatalog();
      });

      // รายการสินค้า
      const card = document.createElement('div');
      card.className = 'lot-card';
      app.appendChild(buildSearchBox({
        placeholder: 'ค้นหา: ชื่อสินค้า · หมวด · ราคา · ขนาด',
        targets: () => [...card.querySelectorAll('tbody tr')].filter(tr => !tr.classList.contains('cat-row')),
      }));

      const catGroups = new Map();
      list.forEach(p => {
        const key = p.category || 'อื่นๆ';
        if (!catGroups.has(key)) catGroups.set(key, []);
        catGroups.get(key).push(p);
      });
      const productRow = p => `<tr data-search="${esc([p.name, p.category, p.unit, p.unit_price, priceLabel(p),
        (p.width_cm && p.length_cm ? p.width_cm + ' x ' + p.length_cm : '')].filter(Boolean).join(' ').toLowerCase())}">
        <td data-label="สินค้า">${esc(p.name)}${p.note === 'ขนาดขายดี' ? ' <span class="st st-paid">ขายดี</span>' : ''}${p.width_cm && p.length_cm ? '<br><span style="font-size:11px;color:var(--sub)">' + p.width_cm + ' x ' + p.length_cm + ' ซม.</span>' : ''}</td>
        <td data-label="คิดราคา">${p.pricing_mode === 'per_area' ? 'ตามขนาด' : p.pricing_mode === 'tier' ? 'ตามจำนวน' : 'ตายตัว'}</td>
        <td data-label="ราคาขาย">${esc(priceLabel(p))}</td>
        <td data-label="จัดการ" class="row-actions">
          <button class="icon-btn icon-btn-edit edit-product" data-id="${p.id}" data-name="${esc(p.name)}" data-cat="${esc(p.category || '')}" data-unit="${esc(p.unit)}" data-mode="${p.pricing_mode}" data-tiers="${esc(tierText(p))}" data-price="${p.pricing_mode === 'per_area' ? (p.area_rate ?? '') : (p.unit_price ?? '')}" aria-label="แก้ไขสินค้า" title="แก้ไข">${icon('edit', 18)}</button>
          <button class="icon-btn icon-btn-delete del-product" data-id="${p.id}" data-name="${esc(p.name)}" aria-label="ลบสินค้า" title="ลบ">${icon('trash', 18)}</button>
        </td>
      </tr>`;
      const rows = [...catGroups.entries()].map(([cat, items]) => (
        `<tr class="cat-row"><td colspan="4">${esc(cat)} <span class="cat-count">${items.length}</span></td></tr>` +
        items.slice().sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0)).map(productRow).join('')
      )).join('');
      card.innerHTML = `
        <div class="table-wrap"><table>
          <thead><tr><th>สินค้า</th><th>คิดราคา</th><th>ราคาขาย</th><th>จัดการ</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="4" class="empty-cell">ยังไม่มีสินค้า</td></tr>'}</tbody>
        </table></div>
      `;
      app.appendChild(card);

      // ---- ข้อมูลร้าน / ช่องทางชำระเงิน (โชว์บนใบออเดอร์และใบเสร็จ) ----
      const shopPanel = document.createElement('div');
      shopPanel.className = 'panel';
      shopPanel.innerHTML = `
        <h2>${icon('wallet', 17)}ช่องทางชำระเงิน</h2>
        <div class="form-grid">
          <div class="field"><label for="sBank">ธนาคาร</label><input id="sBank" value="${esc(SHOP.bank_name || '')}" placeholder="เช่น ไทยพาณิชย์"></div>
          <div class="field"><label for="sAccName">ชื่อบัญชี</label><input id="sAccName" value="${esc(SHOP.account_name || '')}" placeholder="ชื่อ-นามสกุล"></div>
          <div class="field"><label for="sAccNo">เลขบัญชี</label><input id="sAccNo" value="${esc(SHOP.account_no || '')}" placeholder="000-0-00000-0"></div>
        </div>
        <button id="sSave" class="btn secondary block">${icon('check', 15)}บันทึกข้อมูลร้าน</button>
        <div class="msg" id="sMsg"></div>
        <div class="hint">ข้อมูลนี้จะพิมพ์อยู่ท้ายใบออเดอร์และใบเสร็จอัตโนมัติ</div>
      `;
      app.appendChild(shopPanel);

      shopPanel.querySelector('#sSave').addEventListener('click', async () => {
        const msg = shopPanel.querySelector('#sMsg');
        const rows = [
          { key: 'bank_name', value: shopPanel.querySelector('#sBank').value.trim(), sort_order: 2 },
          { key: 'account_name', value: shopPanel.querySelector('#sAccName').value.trim(), sort_order: 3 },
          { key: 'account_no', value: shopPanel.querySelector('#sAccNo').value.trim(), sort_order: 4 },
        ];
        const { error } = await sb.from('shop_info').upsert(rows, { onConflict: 'key' });
        if (error) { msg.textContent = 'บันทึกไม่สำเร็จ: ' + error.message; msg.className = 'msg error'; return; }
        rows.forEach(r => { SHOP[r.key] = r.value; });
        msg.textContent = 'บันทึกแล้ว'; msg.className = 'msg ok';
      });

      // ---- ภาษี (เตรียมไว้ ปิดสวิตช์อยู่จนกว่าจะจด VAT) ----
      const taxPanel = document.createElement('div');
      taxPanel.className = 'panel admin-only';
      taxPanel.innerHTML = `
        <h2>${icon('price', 17)}ภาษี</h2>
        <label class="threshold-row" style="cursor:pointer;margin-top:0">
          <input type="checkbox" id="tVat" ${vatOn() ? 'checked' : ''}>
          <span><b>ร้านจดทะเบียน VAT แล้ว</b> — เปิดแล้วใบเสร็จจะกลายเป็น "ใบเสร็จรับเงิน / ใบกำกับภาษี" และแยกยอดภาษีให้</span>
        </label>
        <div class="hint" style="margin-bottom:12px">ยังไม่ได้จดอย่าเปิด — ออกใบกำกับภาษีโดยไม่ได้จดทะเบียนมีความผิดตามกฎหมาย</div>
        <div class="form-grid">
          <div class="field"><label for="tLegal">ชื่อผู้ประกอบการ (ตามที่จด)</label><input id="tLegal" value="${esc(SHOP.legal_name || '')}" placeholder="เช่น ห้างหุ้นส่วนจำกัด ..."></div>
          <div class="field"><label for="tTaxId">เลขประจำตัวผู้เสียภาษี</label><input id="tTaxId" value="${esc(SHOP.tax_id || '')}" placeholder="13 หลัก" inputmode="numeric"></div>
          <div class="field"><label for="tBranch">สาขา</label><input id="tBranch" value="${esc(SHOP.branch || 'สำนักงานใหญ่')}"></div>
          <div class="field"><label for="tAddr">ที่อยู่ตามที่จดทะเบียน</label><input id="tAddr" value="${esc(SHOP.tax_address || '')}" placeholder="ที่อยู่ที่ใช้ออกเอกสาร"></div>
          <div class="field"><label for="tRate">อัตรา VAT (%)</label><input id="tRate" type="number" min="0" step="0.5" value="${Number(SETTINGS.vat_rate) || 7}"></div>
          <div class="field"><label for="tWht">อัตราหัก ณ ที่จ่าย (%)</label><input id="tWht" type="number" min="0" step="0.5" value="${Number(SETTINGS.wht_rate) || 3}"></div>
          <div class="field"><label for="tInc">ราคาที่ตั้งไว้</label>
            <select id="tInc">
              <option value="1" ${priceIncludesVat() ? 'selected' : ''}>รวม VAT แล้ว</option>
              <option value="0" ${priceIncludesVat() ? '' : 'selected'}>ยังไม่รวม VAT</option>
            </select></div>
        </div>
        <button id="tSave" class="btn secondary block">${icon('check', 15)}บันทึกข้อมูลภาษี</button>
        <div class="msg" id="tMsg"></div>
        <div class="hint">ต้องจด VAT เมื่อรายได้เกิน ${fmtBaht(Number(SETTINGS.vat_threshold) || 1800000)} บาท/ปี (ดูตัวนับที่หน้าแดชบอร์ด) · ตัวเลขทั้งหมดควรยืนยันกับผู้ทำบัญชีอีกครั้ง</div>
      `;
      app.appendChild(taxPanel);

      taxPanel.querySelector('#tSave').addEventListener('click', async () => {
        const msg = taxPanel.querySelector('#tMsg');
        const on = taxPanel.querySelector('#tVat').checked;
        const taxId = taxPanel.querySelector('#tTaxId').value.trim();
        if (on && taxId.replace(/\D/g, '').length !== 13) {
          msg.textContent = 'ถ้าเปิด VAT ต้องใส่เลขประจำตัวผู้เสียภาษีให้ครบ 13 หลักก่อน';
          msg.className = 'msg error'; return;
        }
        const shopRows = [
          { key: 'legal_name', value: taxPanel.querySelector('#tLegal').value.trim() },
          { key: 'tax_id', value: taxId },
          { key: 'branch', value: taxPanel.querySelector('#tBranch').value.trim() },
          { key: 'tax_address', value: taxPanel.querySelector('#tAddr').value.trim() },
        ];
        const setRows = [
          { key: 'vat_enabled', value: on ? '1' : '0' },
          { key: 'vat_rate', value: String(parseFloat(taxPanel.querySelector('#tRate').value) || 7) },
          { key: 'wht_rate', value: String(parseFloat(taxPanel.querySelector('#tWht').value) || 3) },
          { key: 'price_includes_vat', value: taxPanel.querySelector('#tInc').value },
        ];
        const [r1, r2] = await Promise.all([
          sb.from('shop_info').upsert(shopRows, { onConflict: 'key' }),
          sb.from('settings').upsert(setRows, { onConflict: 'key' }),
        ]);
        if (r1.error || r2.error) {
          msg.textContent = 'บันทึกไม่สำเร็จ: ' + ((r1.error || r2.error).message);
          msg.className = 'msg error'; return;
        }
        shopRows.forEach(r => { SHOP[r.key] = r.value; });
        SETTINGS = await loadSettings(true);
        msg.textContent = on ? 'บันทึกแล้ว — เปิดโหมด VAT อยู่' : 'บันทึกแล้ว — ยังปิดโหมด VAT';
        msg.className = 'msg ok';
      });

      app.querySelectorAll('.del-product').forEach(b => b.addEventListener('click', async () => {
        if (!confirm('ลบสินค้านี้? (กู้คืนได้ที่เมนูถังขยะ)')) return;
        try { await trashDelete('products', b.dataset.id, { label: b.dataset.name || '' }); }
        catch (e) { alert('ลบไม่สำเร็จ: ' + e.message); return; }
        await loadProductCatalog();
      }));

      app.querySelectorAll('.edit-product').forEach(b => b.addEventListener('click', () => {
        const tr = b.closest('tr');
        const d = b.dataset;
        tr.innerHTML = `<td colspan="4"><div class="edit-row">
          <input class="e-name" value="${esc(d.name)}" placeholder="ชื่อสินค้า" aria-label="ชื่อสินค้า">
          <input class="e-cat" value="${esc(d.cat)}" placeholder="หมวด" aria-label="หมวด">
          <input class="e-unit" value="${esc(d.unit)}" placeholder="หน่วย" aria-label="หน่วย">
          <select class="e-mode" aria-label="วิธีคิดราคา">
            <option value="fixed" ${d.mode === 'fixed' ? 'selected' : ''}>ตายตัว</option>
            <option value="per_area" ${d.mode === 'per_area' ? 'selected' : ''}>ตามขนาด</option>
            <option value="tier" ${d.mode === 'tier' ? 'selected' : ''}>ตามจำนวน</option>
          </select>
          <input class="e-price" type="number" step="any" min="0" value="${d.price}" placeholder="ราคา" aria-label="ราคา">
          <input class="e-tiers" value="${esc(d.tiers || '')}" placeholder="100=4.5, 700=4, 1000=3.5" aria-label="ขั้นราคา" style="${d.mode === 'tier' ? '' : 'display:none'}">
          <button class="btn btn-sm e-save">${icon('check', 15)}บันทึก</button>
          <button class="btn secondary btn-sm e-cancel">${icon('close', 15)}ยกเลิก</button>
        </div></td>`;
        tr.querySelector('.e-cancel').addEventListener('click', () => loadProductCatalog());
        tr.querySelector('.e-mode').addEventListener('change', (e) => {
          tr.querySelector('.e-tiers').style.display = e.target.value === 'tier' ? '' : 'none';
        });
        tr.querySelector('.e-save').addEventListener('click', async () => {
          const mode = tr.querySelector('.e-mode').value;
          const price = parseFloat(tr.querySelector('.e-price').value) || 0;
          const { error } = await sb.from('products').update({
            name: tr.querySelector('.e-name').value.trim(),
            category: tr.querySelector('.e-cat').value.trim() || null,
            unit: tr.querySelector('.e-unit').value.trim() || 'ชิ้น',
            pricing_mode: mode,
            unit_price: mode === 'per_area' ? null : price,
            area_rate: mode === 'per_area' ? price : null,
            tiers: mode === 'tier' ? parseTierText(tr.querySelector('.e-tiers').value) : null,
          }).eq('id', d.id);
          if (error) { alert('บันทึกไม่สำเร็จ: ' + error.message); return; }
          await loadProductCatalog();
        });
      }));
    }

    // ===== หนี้ส่วนตัว (ไม่เกี่ยวกับร้าน · เห็นได้เฉพาะผู้ดูแลสูงสุด) =====
    // หน้าตาแบบสมุดบัญชีธนาคาร: วันที่ · รายการ · รับหนี้มา · จ่ายคืน · คงเหลือ
    // ตัวกันจริงคือ RLS ฝั่งฐานข้อมูล (policy "super admin only") ฝั่งเว็บแค่ซ่อนเมนูให้ตรงกัน
    let DEBT_ENTRIES = [], DEBT_RECUR = [];
    // สมุดหนี้ไม่อยู่ในไฟล์สำรองของร้าน (ตั้งใจ) -> ต้องมีตัวนับวันของตัวเอง ไม่งั้นลืมกดก็คือไม่มี backup เลย
    const DEBT_BACKUP_KEY = 'haifa_debt_backup';
    const DEBT_BACKUP_WARN_DAYS = 7;
    function daysSinceDebtBackup() {
      let t = null;
      try { t = localStorage.getItem(DEBT_BACKUP_KEY); } catch (e) {}
      if (!t) return null;
      return Math.floor((Date.now() - new Date(t).getTime()) / 86400000);
    }
    let JOB_ALERT = 0;           // ออเดอร์ที่เลยกำหนดส่งแล้วและยังไม่ได้ส่ง
    let jobAlertLoaded = false;

    /** นับงานเลยกำหนดส่ง — ยิงเบาๆ ครั้งเดียวต่อ session แล้วรีเฟรชหลังเข้าหน้า My Job */
    async function refreshJobAlert() {
      const { data } = await sb.from('orders').select('id')
        .lt('due_date', dateKey()).is('delivered_at', null).neq('status', 'cancelled');
      JOB_ALERT = (data || []).length;
    }

    let DEBT_ALERT = 0;          // รายการประจำที่ยังไม่ได้ลงสมุดของเดือนนี้
    let debtAlertLoaded = false;

    /** นับรายการประจำที่ยังไม่ได้ลงเดือนนี้ — ยิงเบาๆ ครั้งเดียวต่อ session แล้วรีเฟรชหลังเข้าหน้าหนี้ */
    async function refreshDebtAlert() {
      if (!isSuperAdmin()) { DEBT_ALERT = 0; return; }
      const now = new Date();
      const first = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-01';
      const nx = new Date(now.getFullYear(), now.getMonth() + 1, 1);
      const last = nx.getFullYear() + '-' + String(nx.getMonth() + 1).padStart(2, '0') + '-01';
      const [rRes, eRes] = await Promise.all([
        sb.from('debt_recurring').select('id').eq('active', true),
        sb.from('debt_entries').select('recurring_id')
          .gte('entry_date', first).lt('entry_date', last).not('recurring_id', 'is', null),
      ]);
      const done = new Set((eRes.data || []).map(x => x.recurring_id));
      DEBT_ALERT = (rRes.data || []).filter(x => !done.has(x.id)).length;
    }

    let debtOpen = {};        // จำว่าเจ้าหนี้รายไหนกางสมุดอยู่
    let debtPage = {};        // จำว่าเจ้าหนี้รายไหนเปิดสมุดหน้าที่เท่าไร
    const DEBT_PER_PAGE = 10; // แสดงทีละ 10 รายการ

    async function loadDebts() {
      const app = document.getElementById('app');
      if (!isSuperAdmin()) {
        app.innerHTML = '';
        app.appendChild(buildPageHead('หนี้ส่วนตัว', ''));
        const no = document.createElement('div');
        no.className = 'lot-card';
        no.innerHTML = '<div class="empty-cell" style="padding:28px">หน้านี้เปิดได้เฉพาะผู้ดูแลสูงสุด</div>';
        app.appendChild(no);
        document.getElementById('statusMsg').textContent = '';
        return;
      }
      const [eRes, rRes] = await Promise.all([
        sb.from('debt_entries').select('*').order('entry_date').order('created_at'),
        sb.from('debt_recurring').select('*').eq('active', true).order('created_at'),
      ]);
      if (eRes.error) throw eRes.error;
      DEBT_ENTRIES = eRes.data || [];
      DEBT_RECUR = rRes.data || [];
      renderDebts();
      refreshDebtAlert().then(renderNav).catch(() => {});
      document.getElementById('statusMsg').textContent = 'อัปเดตล่าสุด: ' + new Date().toLocaleString('th-TH');
    }

    /** ชีตเล็กๆ ให้เลือกว่าจะทำอะไรกับแถวนั้น — คืน 'edit' | 'delete' | null */
    function pickRowAction(title, sub) {
      return new Promise(resolve => {
        const wrap = document.createElement('div');
        wrap.className = 'sheet-backdrop no-print';
        wrap.innerHTML = `
          <div class="sheet">
            <div class="sheet-bar"></div>
            <div class="sheet-title">${esc(title)}</div>
            ${sub ? `<div class="hint" style="margin:-4px 0 8px 2px">${esc(sub)}</div>` : ''}
            <button class="sheet-item" data-a="edit"><span class="nav-ico">${icon('edit', 20)}</span><span class="si-label">แก้ไขรายการ</span></button>
            <button class="sheet-item danger" data-a="delete"><span class="nav-ico">${icon('trash', 20)}</span><span class="si-label">ลบรายการ</span></button>
            <button class="btn secondary block" data-a="" style="margin-top:var(--space-3)">ปิด</button>
          </div>`;
        document.body.appendChild(wrap);
        const close = (v) => { wrap.remove(); resolve(v || null); };
        wrap.addEventListener('click', (e) => { if (e.target === wrap) close(null); });
        wrap.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => close(b.dataset.a)));
      });
    }

    /** แก้ไขรายการในสมุด — เปลี่ยนได้ทุกช่อง รวมถึงย้อนวันที่ไปเดือนก่อนๆ */
    function editDebtEntry(e) {
      return new Promise(resolve => {
        const back = document.createElement('div');
        back.className = 'modal-back no-print';
        back.innerHTML = `
          <div class="modal-card" role="dialog" aria-modal="true">
            <h3>แก้ไขรายการ</h3>
            <div class="modal-sub">แก้ได้ทุกช่อง · เปลี่ยนวันที่ย้อนไปเดือนก่อนได้ ยอดคงเหลือจะคิดใหม่ให้เอง</div>
            <div class="field"><label for="edKind">ประเภท</label>
              <select id="edKind">
                <option value="in" ${e.kind === 'in' ? 'selected' : ''}>รับหนี้มา</option>
                <option value="out" ${e.kind === 'out' ? 'selected' : ''}>จ่ายคืน</option>
              </select></div>
            <div class="field"><label for="edCred">เจ้าหนี้</label>
              <input id="edCred" value="${esc(e.creditor)}"></div>
            <div class="field"><label for="edAmt">จำนวนเงิน (บาท)</label>
              <input id="edAmt" type="number" min="0" step="any" inputmode="decimal" value="${e.amount}"></div>
            <div class="field"><label for="edDate">วันที่</label>
              <input id="edDate" type="date" value="${esc(e.entry_date)}"></div>
            <div class="field"><label for="edItem">รายการ</label>
              <input id="edItem" value="${esc(e.item || '')}" placeholder="เช่น ค่ารถ · ยืมค่าผ้า"></div>
            <div class="field" id="edMethodField" ${e.kind === 'out' ? '' : 'hidden'}><label for="edMethod">ช่องทาง</label>
              <select id="edMethod">${PAY_METHODS.map(m => `<option ${m === e.method ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select></div>
            <div class="msg" id="edMsg"></div>
            <div class="field-row" style="justify-content:flex-end;margin-top:6px">
              <button class="btn secondary" id="edCancel">ยกเลิก</button>
              <button class="btn" id="edOk">${icon('check', 15)}บันทึกการแก้ไข</button>
            </div>
          </div>`;
        document.body.appendChild(back);
        const close = (v) => { back.remove(); resolve(v); };
        back.querySelector('#edKind').addEventListener('change', (ev) => {
          back.querySelector('#edMethodField').hidden = ev.target.value !== 'out';
        });
        back.querySelector('#edCancel').addEventListener('click', () => close(null));
        back.addEventListener('click', (ev) => { if (ev.target === back) close(null); });
        back.querySelector('#edOk').addEventListener('click', () => {
          const msg = back.querySelector('#edMsg');
          const creditor = back.querySelector('#edCred').value.trim();
          const amount = parseFloat(back.querySelector('#edAmt').value);
          const kind = back.querySelector('#edKind').value;
          if (!creditor) { msg.textContent = 'ใส่ชื่อเจ้าหนี้ก่อน'; msg.className = 'msg error'; return; }
          if (!(amount > 0)) { msg.textContent = 'ใส่จำนวนเงินก่อน'; msg.className = 'msg error'; return; }
          close({
            creditor, kind, amount,
            entry_date: back.querySelector('#edDate').value || e.entry_date,
            item: back.querySelector('#edItem').value.trim() || null,
            method: kind === 'out' ? back.querySelector('#edMethod').value : null,
          });
        });
        setTimeout(() => back.querySelector('#edAmt').focus(), 50);
      });
    }

    /** กล่องยืนยันยอดของรายการประจำเดือนนี้ — ยอดคงที่เติมให้ ยอดไม่คงที่ต้องกรอก */
    function askMonthlyAmounts(list, monthLabel) {
      return new Promise(resolve => {
        const back = document.createElement('div');
        back.className = 'modal-back no-print';
        back.innerHTML = `
          <div class="modal-card" role="dialog" aria-modal="true">
            <h3>ยอดของ ${esc(monthLabel)}</h3>
            <div class="modal-sub">แก้ยอดได้ก่อนลงสมุด · เว้นว่างหรือใส่ 0 = ข้ามรายการนั้นไปก่อน</div>
            ${list.map(r => `<div class="field">
              <label for="mo_${r.id}">${esc(r.item)} <span class="hint">· ${esc(r.creditor)}</span></label>
              <input id="mo_${r.id}" data-id="${r.id}" class="mo-amt" type="number" min="0" step="any"
                inputmode="decimal" value="${r.amount || ''}" placeholder="ใส่ยอดเดือนนี้">
            </div>`).join('')}
            <div class="field-row" style="justify-content:flex-end;margin-top:6px">
              <button class="btn secondary" id="moCancel">ยกเลิก</button>
              <button class="btn" id="moOk">${icon('check', 15)}ลงสมุด</button>
            </div>
          </div>`;
        document.body.appendChild(back);
        const close = (v) => { back.remove(); resolve(v); };
        back.querySelector('#moCancel').addEventListener('click', () => close(null));
        back.addEventListener('click', (e) => { if (e.target === back) close(null); });
        back.querySelector('#moOk').addEventListener('click', () => {
          const out = {};
          back.querySelectorAll('.mo-amt').forEach(i => { out[i.dataset.id] = parseFloat(i.value) || 0; });
          close(out);
        });
        const first = back.querySelector('.mo-amt:not([value]), .mo-amt[value=""]') || back.querySelector('.mo-amt');
        setTimeout(() => first && first.focus(), 50);
      });
    }

    const thDate = (d) => new Date(d + 'T00:00:00').toLocaleDateString('th-TH', { day: '2-digit', month: 'short', year: '2-digit' });

    function renderDebts() {
      const app = document.getElementById('app');
      app.innerHTML = '';
      app.appendChild(buildPageHead('หนี้ส่วนตัว', 'สมุดบันทึกส่วนตัวของเจ้าของ — ไม่เกี่ยวกับบัญชีร้าน และไม่มีใครอื่นเห็น'));

      // จัดกลุ่มตามเจ้าหนี้
      const byCreditor = {};
      DEBT_ENTRIES.forEach(e => {
        const k = e.creditor.trim();
        (byCreditor[k] = byCreditor[k] || []).push(e);
      });
      const sumIn = round2(DEBT_ENTRIES.filter(e => e.kind === 'in').reduce((a, e) => a + Number(e.amount), 0));
      const sumOut = round2(DEBT_ENTRIES.filter(e => e.kind === 'out').reduce((a, e) => a + Number(e.amount), 0));
      const left = round2(sumIn - sumOut);
      const owing = Object.entries(byCreditor).filter(([, list]) =>
        list.reduce((a, e) => a + (e.kind === 'in' ? 1 : -1) * Number(e.amount), 0) > 0.009).length;

      // แถบเตือนว่านานแล้วยังไม่ได้สำรอง — โชว์เฉพาะจอคอม
      // การสำรองคือโหลดไฟล์ JSON ลงเครื่อง ทำจริงได้แค่บนคอม
      // และตัวนับอยู่ใน localStorage แยกกันคนละเครื่อง มือถือจะขึ้น "ยังไม่เคยสำรอง" ค้างตลอด ทั้งที่สำรองบนคอมไปแล้ว
      const bdays = daysSinceDebtBackup();
      const onDesktop = window.matchMedia('(min-width: 900px)').matches;
      if (onDesktop && DEBT_ENTRIES.length && (bdays === null || bdays >= DEBT_BACKUP_WARN_DAYS)) {
        const warn = document.createElement('div');
        warn.className = 'viewer-banner no-print';
        warn.style.cssText = 'background:var(--warn-bg);border:1px solid var(--warn-border);color:var(--warn-text)';
        warn.textContent = bdays === null
          ? 'ยังไม่เคยสำรองสมุดหนี้เลย — ข้อมูลนี้ไม่อยู่ในไฟล์สำรองของร้าน กดปุ่มสำรองท้ายหน้าไว้ด้วย'
          : 'ไม่ได้สำรองสมุดหนี้มา ' + bdays + ' วันแล้ว — กดปุ่มสำรองท้ายหน้า';
        app.appendChild(warn);
      }

      const sum = document.createElement('div');
      sum.className = 'summary-grid';
      sum.innerHTML = `
        <div class="stat"><div class="num">${fmtBaht(sumIn)}</div><div class="lbl">รับหนี้มารวม (บาท)</div></div>
        <div class="stat"><div class="num" style="color:var(--ok-text)">${fmtBaht(sumOut)}</div><div class="lbl">จ่ายคืนแล้ว (บาท)</div></div>
        <div class="stat"><div class="num" style="color:var(--${left > 0 ? 'err' : 'ok'}-text)">${fmtBaht(left)}</div><div class="lbl">ค้างอยู่ (บาท)</div></div>
        <div class="stat"><div class="num">${owing}</div><div class="lbl">เจ้าหนี้ที่ยังค้าง</div></div>`;
      app.appendChild(sum);

      // ---- ฟอร์มบันทึกรายการ (ใช้ได้ทั้งรับมาและจ่ายคืน) ----
      const knownCreditors = Object.keys(byCreditor);
      const addBar = document.createElement('div');
      addBar.className = 'field-row';
      addBar.style.marginBottom = 'var(--space-3)';
      addBar.innerHTML = `<button class="btn" id="deOpen">${icon('plus', 15)}บันทึกรายการ</button>`;
      app.appendChild(addBar);

      const panel = document.createElement('div');
      panel.className = 'panel';
      panel.hidden = true;
      panel.innerHTML = `
        <h2>${icon('wallet', 17)}บันทึกรายการ</h2>
        <div class="form-grid">
          <div class="field"><label for="deKind">ประเภท</label>
            <select id="deKind">
              <option value="in">รับหนี้มา (ยืมเพิ่ม)</option>
              <option value="out">จ่ายคืน</option>
            </select></div>
          <div class="field"><label for="deCreditor">เจ้าหนี้ *</label>
            <input id="deCreditor" list="deCreditorList" placeholder="ชื่อคนหรือที่ที่ยืมมา" autocomplete="off">
            <datalist id="deCreditorList">${knownCreditors.map(c => `<option value="${esc(c)}"></option>`).join('')}</datalist></div>
          <div class="field"><label for="deAmt">จำนวนเงิน (บาท) *</label>
            <input id="deAmt" type="number" min="0" step="any" inputmode="decimal"></div>
          <div class="field"><label for="deDate">วันที่</label><input id="deDate" type="date" value="${dateKey()}"></div>
          <div class="field"><label for="deItem">รายการ</label><input id="deItem" placeholder="เช่น ยืมค่าผ้า · จ่ายงวดเดือน ส.ค."></div>
          <div class="field" id="deMethodField"><label for="deMethod">ช่องทาง</label>
            <select id="deMethod">${PAY_METHODS.map(m => `<option>${esc(m)}</option>`).join('')}</select></div>
        </div>
        <div class="field-row">
          <button class="btn" id="deAdd">${icon('check', 15)}บันทึก</button>
          <button class="btn secondary" id="deCancel">ยกเลิก</button>
        </div>
        <div class="msg" id="deMsg"></div>`;
      app.appendChild(panel);

      const openForm = (kind, creditor) => {
        panel.hidden = false; addBar.hidden = true;
        panel.querySelector('#deKind').value = kind || 'in';
        if (creditor) panel.querySelector('#deCreditor').value = creditor;
        panel.querySelector('#deMethodField').style.display = (kind === 'out') ? '' : 'none';
        panel.querySelector('#deAmt').focus();
        panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      };
      addBar.querySelector('#deOpen').addEventListener('click', () => openForm('in'));
      panel.querySelector('#deCancel').addEventListener('click', () => { panel.hidden = true; addBar.hidden = false; });
      panel.querySelector('#deKind').addEventListener('change', (e) => {
        panel.querySelector('#deMethodField').style.display = e.target.value === 'out' ? '' : 'none';
      });
      panel.querySelector('#deMethodField').style.display = 'none';

      panel.querySelector('#deAdd').addEventListener('click', async () => {
        const msg = panel.querySelector('#deMsg');
        const kind = panel.querySelector('#deKind').value;
        const creditor = panel.querySelector('#deCreditor').value.trim();
        const amount = parseFloat(panel.querySelector('#deAmt').value);
        msg.textContent = ''; msg.className = 'msg';
        if (!creditor) { msg.textContent = 'ใส่ชื่อเจ้าหนี้ก่อน'; msg.className = 'msg error'; return; }
        if (!(amount > 0)) { msg.textContent = 'ใส่จำนวนเงินก่อน'; msg.className = 'msg error'; return; }
        const { error } = await sb.from('debt_entries').insert({
          creditor, kind, amount,
          entry_date: panel.querySelector('#deDate').value || dateKey(),
          item: panel.querySelector('#deItem').value.trim() || null,
          method: kind === 'out' ? panel.querySelector('#deMethod').value : null,
        });
        if (error) { msg.textContent = 'บันทึกไม่สำเร็จ: ' + error.message; msg.className = 'msg error'; return; }
        debtOpen[creditor] = true;
        await loadDebts();
      });

      // ---- รายการประจำทุกเดือน (ค่ารถ · สหกรณ์ ฯลฯ) ----
      const now = new Date();
      const monthLabel = now.toLocaleDateString('th-TH', { month: 'long' }) + ' ' + (now.getFullYear() + 543);
      const monthPrefix = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
      const doneThisMonth = (r) => DEBT_ENTRIES.some(e => e.recurring_id === r.id && String(e.entry_date).startsWith(monthPrefix));
      const pending = DEBT_RECUR.filter(r => !doneThisMonth(r));

      const recCard = document.createElement('div');
      recCard.className = 'lot-card';
      recCard.innerHTML = `
        <div class="lot-head"><span>${icon('calendar', 16)}รายการประจำทุกเดือน</span>
          ${DEBT_RECUR.length ? `<span class="st ${pending.length ? 'st-prod' : 'st-paid'}">${pending.length
            ? 'ยังไม่ได้ลง ' + pending.length + ' รายการ (' + monthLabel + ')'
            : 'ลงครบแล้ว · ' + monthLabel}</span>` : ''}</div>
        <div style="padding:var(--space-4)">
          ${DEBT_RECUR.length ? `<div class="att-people" style="margin-bottom:12px">${DEBT_RECUR.map(r => `
            <div class="att-person ${doneThisMonth(r) ? 'done' : 'on'}">
              <div class="ap-main">
                <div class="ap-name">${esc(r.item)} <span class="hint">· ${esc(r.creditor)}</span></div>
                <div class="ap-sub">${r.kind === 'in' ? 'เพิ่มยอดหนี้' : 'จ่ายคืน'} ${r.amount
                  ? fmtBaht(round2(r.amount)) + ' บาท' : '<b>ยอดไม่คงที่ — กรอกตอนลงแต่ละเดือน</b>'} ทุกวันที่ ${r.day_of_month}</div>
              </div>
              <span class="ap-state">${doneThisMonth(r) ? 'ลงแล้วเดือนนี้' : 'ยังไม่ลง'}</span>
              <button class="icon-btn icon-btn-delete rec-del" data-id="${r.id}" title="ลบรายการประจำ">${icon('trash', 16)}</button>
            </div>`).join('')}</div>` : '<div class="hint" style="margin-bottom:12px">ยังไม่มีรายการประจำ — เช่น ค่ารถ 320 · สหกรณ์ 250 ที่ต้องลงทุกเดือน</div>'}

          ${pending.length ? `<button class="btn" id="recRun">${icon('check', 15)}ลงรายการประจำของ ${esc(monthLabel)} (${pending.length} รายการ)</button>
            ${pending.some(r => !r.amount) ? '<div class="hint">มีรายการที่ยอดไม่คงที่ ระบบจะให้กรอกยอดก่อนลงสมุด</div>' : ''}` : ''}

          <details style="margin-top:12px">
            <summary class="hint" style="cursor:pointer">+ เพิ่มรายการประจำใหม่</summary>
            <div class="form-grid" style="margin-top:10px">
              <div class="field"><label for="rcCred">เจ้าหนี้</label><input id="rcCred" list="deCreditorList" placeholder="เช่น สหกรณ์"></div>
              <div class="field"><label for="rcItem">ชื่อรายการ</label><input id="rcItem" placeholder="เช่น ค่ารถ"></div>
              <div class="field"><label for="rcAmt">จำนวนต่อเดือน (บาท)</label>
                <input id="rcAmt" type="number" min="0" step="any" inputmode="decimal" placeholder="เว้นว่าง = ยอดไม่คงที่"></div>
              <div class="field"><label for="rcKind">ประเภท</label>
                <select id="rcKind"><option value="in">เพิ่มยอดหนี้ทุกเดือน</option><option value="out">จ่ายคืนทุกเดือน</option></select></div>
              <div class="field"><label for="rcDay">ลงทุกวันที่</label><input id="rcDay" type="number" min="1" max="31" value="1" inputmode="numeric"></div>
            </div>
            <button class="btn secondary" id="rcAdd">${icon('plus', 15)}บันทึกรายการประจำ</button>
            <div class="msg" id="rcMsg"></div>
          </details>
        </div>`;
      app.appendChild(recCard);

      recCard.querySelector('#rcAdd')?.addEventListener('click', async () => {
        const msg = recCard.querySelector('#rcMsg');
        const creditor = recCard.querySelector('#rcCred').value.trim();
        const item = recCard.querySelector('#rcItem').value.trim();
        const amount = parseFloat(recCard.querySelector('#rcAmt').value);
        msg.textContent = ''; msg.className = 'msg';
        if (!creditor || !item) { msg.textContent = 'ใส่เจ้าหนี้และชื่อรายการก่อน'; msg.className = 'msg error'; return; }
        const { error } = await sb.from('debt_recurring').insert({
          creditor, item, amount: amount > 0 ? amount : null,
          kind: recCard.querySelector('#rcKind').value,
          day_of_month: parseInt(recCard.querySelector('#rcDay').value) || 1,
        });
        if (error) { msg.textContent = 'บันทึกไม่สำเร็จ: ' + error.message; msg.className = 'msg error'; return; }
        await loadDebts();
      });

      recCard.querySelector('#recRun')?.addEventListener('click', async () => {
        // รายการที่ยอดไม่คงที่ (ค่าไฟ ฯลฯ) ต้องกรอกยอดของเดือนนี้ก่อน
        const amounts = await askMonthlyAmounts(pending, monthLabel);
        if (!amounts) return;
        const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
        const rows = pending.map(r => ({
          creditor: r.creditor, kind: r.kind, amount: amounts[r.id],
          entry_date: monthPrefix + '-' + String(Math.min(r.day_of_month, lastDay)).padStart(2, '0'),
          item: r.item, recurring_id: r.id,
        })).filter(x => x.amount > 0);
        if (!rows.length) return;
        const { error } = await sb.from('debt_entries').insert(rows);
        if (error) { alert('ลงรายการไม่สำเร็จ: ' + error.message); return; }
        await loadDebts();
      });

      recCard.querySelectorAll('.rec-del').forEach(b => b.addEventListener('click', async () => {
        if (!confirm('ลบรายการประจำนี้? (รายการที่ลงไปแล้วในสมุดยังอยู่)')) return;
        const r = DEBT_RECUR.find(x => x.id === b.dataset.id);
        try {
          await trashDelete('debt_recurring', b.dataset.id, {
            label: r ? r.item + ' · ' + r.creditor : 'รายการประจำ',
            detail: r ? (r.kind === 'in' ? 'เพิ่มยอดหนี้' : 'จ่ายคืน') + ' ทุกวันที่ ' + r.day_of_month : '',
          });
        } catch (err) { alert('ลบไม่สำเร็จ: ' + err.message); return; }
        await loadDebts();
      }));

      if (!DEBT_ENTRIES.length) {
        const empty = document.createElement('div');
        empty.className = 'lot-card';
        empty.innerHTML = '<div class="empty-cell" style="padding:28px">ยังไม่มีรายการ — กด "บันทึกรายการ" เพื่อเริ่ม</div>';
        app.appendChild(empty);
        return;
      }

      // ---- สมุดของเจ้าหนี้แต่ละราย เรียงค้างมากสุดก่อน ----
      const cards = Object.entries(byCreditor).map(([name, list]) => {
        const rows = list.slice().sort((a, b) =>
          a.entry_date === b.entry_date ? a.created_at.localeCompare(b.created_at) : a.entry_date.localeCompare(b.entry_date));
        let bal = 0;
        const withBal = rows.map(e => {
          bal = round2(bal + (e.kind === 'in' ? 1 : -1) * Number(e.amount));
          return { ...e, balance: bal };
        });
        // ไล่ยอดคงเหลือตามเวลาจริงก่อน แล้วค่อยกลับด้าน — รายการใหม่สุดจะได้อยู่บนสุดเสมอ
        withBal.reverse();
        return { name, rows: withBal, balance: bal,
          inSum: round2(rows.filter(e => e.kind === 'in').reduce((a, e) => a + Number(e.amount), 0)),
          outSum: round2(rows.filter(e => e.kind === 'out').reduce((a, e) => a + Number(e.amount), 0)) };
      }).sort((a, b) => b.balance - a.balance);

      cards.forEach(c => {
        const clear = c.balance <= 0.009;

        // ---- แบ่งหน้า 10 รายการ (ยอดคงเหลือคิดจากทั้งเล่มก่อนแล้ว หน้าไหนก็ตรง) ----
        const totalPages = Math.max(1, Math.ceil(c.rows.length / DEBT_PER_PAGE));
        if (debtPage[c.name] === undefined) debtPage[c.name] = 1;   // หน้าแรก = รายการใหม่สุด
        const page = Math.min(Math.max(1, debtPage[c.name]), totalPages);
        debtPage[c.name] = page;
        const pageRows = c.rows.slice((page - 1) * DEBT_PER_PAGE, page * DEBT_PER_PAGE);

        // เลขหน้า: 1 … (หน้าที่อยู่ใกล้ๆ) … หน้าสุดท้าย
        const nums = [];
        for (let i = 1; i <= totalPages; i++) {
          if (i === 1 || i === totalPages || Math.abs(i - page) <= 1) nums.push(i);
          else if (nums[nums.length - 1] !== '…') nums.push('…');
        }
        const pageBar = totalPages > 1 ? `<div class="pager no-print">
          <button class="pg-btn pg-nav" data-c="${esc(c.name)}" data-p="${page - 1}" ${page === 1 ? 'disabled' : ''} aria-label="หน้าก่อนหน้า">${icon('back', 15)}</button>
          ${nums.map(n => n === '…' ? '<span class="pg-dots">…</span>'
            : `<button class="pg-btn ${n === page ? 'active' : ''}" data-c="${esc(c.name)}" data-p="${n}">${n}</button>`).join('')}
          <button class="pg-btn pg-nav" data-c="${esc(c.name)}" data-p="${page + 1}" ${page === totalPages ? 'disabled' : ''} aria-label="หน้าถัดไป">${icon('chevron', 15)}</button>
          <span class="pg-info">${(page - 1) * DEBT_PER_PAGE + 1}–${Math.min(page * DEBT_PER_PAGE, c.rows.length)} จาก ${c.rows.length}</span>
        </div>` : '';
        const card = document.createElement('div');
        card.className = 'lot-card';
        const open = debtOpen[c.name] !== false;
        card.innerHTML = `
          <div class="lot-head">
            <span>${esc(c.name)} ${clear ? '<span class="st st-paid">จ่ายครบแล้ว</span>' : ''}</span>
            <span class="lot-head-right">
              <span class="lot-total" style="color:var(--${clear ? 'ok' : 'err'}-text)">${clear ? 'ไม่มียอดค้าง' : 'ค้าง ' + fmtBaht(c.balance)}</span>
              <span class="lot-price">รับมา ${fmtBaht(c.inSum)} · จ่ายคืน ${fmtBaht(c.outSum)}</span>
            </span>
          </div>
          <div class="lot-actions">
            <button class="btn secondary btn-sm de-in" data-c="${esc(c.name)}">${icon('plus', 15)}รับหนี้มาเพิ่ม</button>
            <button class="btn secondary btn-sm de-out" data-c="${esc(c.name)}">${icon('wallet', 15)}จ่ายคืน</button>
            <button class="btn secondary btn-sm de-toggle" data-c="${esc(c.name)}">${icon('chart', 15)}${open ? 'ซ่อนสมุด' : 'ดูสมุด'} (${c.rows.length})</button>
          </div>
          <div class="de-book" ${open ? '' : 'hidden'}>
            ${pageBar}
            <div class="table-wrap"><table class="passbook">
              <thead><tr>
                <th>วันที่</th><th>รายการ</th>
                <th class="num-col">รับหนี้มา</th><th class="num-col">จ่ายคืน</th><th class="num-col">คงเหลือ</th>
              </tr></thead>
              <tbody>${pageRows.map(e => `<tr class="pb-row ${e.kind}">
                <td data-label="วันที่" class="pb-date">${thDate(e.entry_date)}</td>
                <td data-label="รายการ" class="pb-item">
                  <span class="pb-ico">${icon(e.kind === 'in' ? 'back' : 'check', 15)}</span>
                  <span class="pb-text">${esc(e.item || (e.kind === 'in' ? 'รับหนี้มา' : 'จ่ายคืน'))}${e.method ? `<span class="hint"> · ${esc(e.method)}</span>` : ''}${e.recurring_id ? '<span class="st st-prod pb-tag">ประจำเดือน</span>' : ''}</span>
                </td>
                <td data-label="รับหนี้มา" class="num-col in">${e.kind === 'in' ? fmtBaht(round2(e.amount)) : ''}</td>
                <td data-label="จ่ายคืน" class="num-col out">${e.kind === 'out' ? fmtBaht(round2(e.amount)) : ''}</td>
                <td data-label="คงเหลือ" class="num-col bal">${fmtBaht(e.balance)}</td>
              </tr>`).join('')}
              <tr class="pb-total">
                <td colspan="2" data-label="">รวม</td>
                <td class="num-col in">${fmtBaht(c.inSum)}</td>
                <td class="num-col out">${fmtBaht(c.outSum)}</td>
                <td class="num-col bal">${fmtBaht(c.balance)}</td>
              </tr></tbody>
            </table></div>
          </div>`;
        app.appendChild(card);

        card.querySelector('.de-in').addEventListener('click', () => openForm('in', c.name));
        card.querySelector('.de-out').addEventListener('click', () => openForm('out', c.name));
        card.querySelectorAll('.pg-btn').forEach(b => b.addEventListener('click', () => {
          const p = parseInt(b.dataset.p);
          if (!p || b.disabled) return;
          debtPage[b.dataset.c] = p;
          renderDebts();
        }));

        card.querySelector('.de-toggle').addEventListener('click', () => {
          debtOpen[c.name] = !(debtOpen[c.name] !== false);
          renderDebts();
        });
        // เปิดตัวเลือกแก้ไข/ลบของรายการนั้น
        const openRowMenu = async (id) => {
          const e = DEBT_ENTRIES.find(x => x.id === id);
          if (!e) return;
          const act = await pickRowAction(
            (e.item || (e.kind === 'in' ? 'รับหนี้มา' : 'จ่ายคืน')) + ' · ' + fmtBaht(round2(e.amount)) + ' บาท',
            thDate(e.entry_date));
          if (act === 'edit') {
            const patch = await editDebtEntry(e);
            if (!patch) return;
            const { error } = await sb.from('debt_entries').update(patch).eq('id', e.id);
            if (error) { alert('บันทึกไม่สำเร็จ: ' + error.message); return; }
            await loadDebts();
          } else if (act === 'delete') {
            if (!confirm('ลบรายการนี้ออกจากสมุด?')) return;
            try {
              await trashDelete('debt_entries', e.id, {
                label: (e.item || (e.kind === 'in' ? 'รับหนี้มา' : 'จ่ายคืน')) + ' · ' + fmtBaht(round2(e.amount)) + ' บาท',
                detail: (e.creditor || '') + ' · ' + thDate(e.entry_date),
              });
            } catch (err) { alert('ลบไม่สำเร็จ: ' + err.message); return; }
            await loadDebts();
          }
        };

        // ไม่มีปุ่มในแถวแล้ว — แตะที่ "ยอดเงิน" ของรายการไหนก็ได้เพื่อเปิดเมนูแก้ไข/ลบ (ใช้ได้ทุกขนาดจอ)
        pageRows.forEach((e, i) => {
          const tr = card.querySelectorAll('.pb-row')[i];
          if (!tr) return;
          tr.querySelectorAll('.num-col').forEach(cell =>
            cell.addEventListener('click', () => openRowMenu(e.id)));
        });
      });

      // ---- สำรองข้อมูลแยกจากไฟล์ของร้าน ----
      const bk = document.createElement('div');
      bk.className = 'field-row';
      bk.style.marginTop = 'var(--space-4)';
      bk.innerHTML = `<button class="btn secondary btn-sm" id="deBackup">${icon('box', 15)}สำรองสมุดหนี้ (ไฟล์แยก)</button>
        <span class="hint" style="margin:0;align-self:center">ข้อมูลนี้ไม่รวมอยู่ในไฟล์สำรองของร้าน · <b id="deBackupWhen"></b>${
          window.matchMedia('(min-width: 900px)').matches ? '' : ' · ตัวเลขนี้นับแยกแต่ละเครื่อง ให้สำรองจริงที่คอม'}</span>`;
      app.appendChild(bk);
      const bdText = () => {
        const d = daysSinceDebtBackup();
        return d === null ? 'ยังไม่เคยสำรอง' : d === 0 ? 'สำรองล่าสุดวันนี้' : 'สำรองล่าสุด ' + d + ' วันก่อน';
      };
      bk.querySelector('#deBackupWhen').textContent = bdText();
      bk.querySelector('#deBackup').addEventListener('click', () => {
        downloadBlob('สมุดหนี้ส่วนตัว-' + dateKey() + '.json',
          new Blob([JSON.stringify({ exported_at: new Date().toISOString(), entries: DEBT_ENTRIES, recurring: DEBT_RECUR }, null, 1)],
            { type: 'application/json' }));
        try { localStorage.setItem(DEBT_BACKUP_KEY, new Date().toISOString()); } catch (e) {}
        bk.querySelector('#deBackupWhen').textContent = bdText();
      });
    }

    // ===== ผ้าที่เสีย: งานเสียต้องทำใหม่ + เศษผ้าที่ใช้ต่อไม่ได้ =====
    // ทุกครั้งที่บันทึก จะตัดผ้าดิบออกจากสต็อกให้ด้วย (เหมือนตอนกดปริ้น) จะได้ไม่ต้องมาหักเองทีหลัง
    const WASTE_REASONS = ['พิมพ์เพี้ยน', 'โรลเสีย', 'ตัดพลาด', 'สีเพี้ยน', 'ผ้ามีตำหนิ', 'เครื่องมีปัญหา', 'อื่นๆ'];
    let WASTE = [];

    function wasteCost(yards) {
      const rate = Number(SETTINGS.fabric_cost_per_yard) || 0;
      return rate > 0 ? round2(Number(yards) * rate) : null;
    }

    /** บันทึกผ้าเสีย 1 รายการ + ตัดสต็อกผ้าดิบ */
    async function addWaste({ kind, yards, reason, note, lotId, lotName, piece }) {
      const amount = round4(Number(yards));
      if (!(amount > 0)) throw new Error('ใส่จำนวนหลาก่อน');

      const fabric = await getDefaultFabric();
      if (!fabric) throw new Error('ยังไม่มีผ้าดิบในสต็อก — ไปเพิ่มที่เมนู "สต็อกของ" ก่อน');
      const label = kind === 'defect'
        ? 'งานเสีย ' + (piece ? (piece.label || 'ไม่ระบุชื่อ') + ' · ' + piece.width_cm + 'x' + piece.length_cm : '')
        : 'เศษผ้า';
      const moveId = await stockMove(fabric, 'out', amount,
        label + (reason ? ' · ' + reason : '') + (lotName ? ' · ล็อต ' + lotName : ''));

      const { error } = await sb.from('fabric_waste').insert({
        lot_id: lotId || null,
        piece_id: piece ? piece.id : null,
        kind, reason: reason || null, note: note || null,
        yards: amount, cost: wasteCost(amount),
        stock_move_id: moveId || null,
        created_by: (ME && ME.email) ? prettyLogin(ME.email) : null,
      });
      if (error) throw new Error(error.message);

      // งานเสีย = ต้องพิมพ์ใหม่ -> นับครั้งไว้ที่ชิ้นงาน
      if (kind === 'defect' && piece) {
        await sb.from('pieces').update({ redo_count: (Number(piece.redo_count) || 0) + 1 }).eq('id', piece.id);
      }
    }

    /** กล่องกรอกข้อมูลเล็กๆ กลางจอ — คืน object ที่กรอก หรือ null ถ้ากดยกเลิก */
    function openWasteDialog({ title, sub, defYards, showReason }) {
      return new Promise(resolve => {
        const back = document.createElement('div');
        back.className = 'modal-back no-print';
        back.innerHTML = `
          <div class="modal-card" role="dialog" aria-modal="true">
            <h3>${esc(title)}</h3>
            <div class="modal-sub">${esc(sub || '')}</div>
            ${showReason ? `<div class="field"><label for="wReason">สาเหตุ</label>
              <select id="wReason">${WASTE_REASONS.map(r => `<option>${esc(r)}</option>`).join('')}</select></div>` : ''}
            <div class="field"><label for="wYards">ผ้าที่เสีย (หลา)</label>

            <div class="field"><label for="wNote">หมายเหตุ (ไม่บังคับ)</label>

    /** แท็บ "ผ้าเสีย" ในหน้างานผลิต */
    function renderWasteTab(lots, pieces) {

        rc.className = 'lot-card';
        rc.innerHTML = `<div class="lot-head"><span>${icon('chart', 16)}งานเสียเพราะอะไรบ่อยสุด</span></div>

        <div class="table-wrap"><table>
          <thead><tr><th>วันที่</th><th>ประเภท</th><th>งาน / ล็อต</th><th>สาเหตุ</th><th>หลา</th><th>มูลค่า</th><th></th></tr></thead>
          <tbody>${WASTE.length ? WASTE.slice(0, 300).map(w => {
            const p = w.piece_id ? pieceById[w.piece_id] : null;

              <td data-label="งาน / ล็อต">${p ? esc(p.label || 'ไม่ระบุชื่อ') + ' · ' + p.width_cm + 'x' + p.length_cm : (lot ? 'ล็อต ' + esc(lot.name) : '-')}
                ${w.note ? `<div class="hint">${esc(w.note)}</div>` : ''}</td>
              <td data-label="สาเหตุ">${esc(w.reason || '-')}</td>

              <td data-label="" class="admin-only"><button class="icon-btn icon-btn-delete waste-del" data-id="${w.id}"
                aria-label="ลบรายการผ้าเสีย" title="ลบ (เลือกได้ว่าจะคืนผ้าเข้าสต็อกไหม)">${icon('trash', 18)}</button></td>
            </tr>`;

      card.querySelectorAll('.waste-del').forEach(b => b.addEventListener('click', async () => {
        const w = WASTE.find(x => x.id === b.dataset.id);

        if (!confirm('ลบรายการนี้ออกจากประวัติผ้าเสีย?')) return;

        // ถามแยกอีกที: บันทึกผิด -> คืนผ้า · ผ้าเสียจริงแต่ไม่อยากเก็บประวัติ -> ไม่คืน
        const giveBack = confirm('คืนผ้า ' + Number(w.yards).toFixed(2) + ' หลา เข้าสต็อกด้วยไหม?\n\n' +
          'ตกลง = บันทึกผิด คืนผ้าเข้าสต็อก\nยกเลิก = ผ้าเสียจริง เก็บยอดที่ตัดไปแล้วไว้เหมือนเดิม');

        b.disabled = true;
        try {
          if (giveBack) {
            const fabric = await getDefaultFabric();
            if (!fabric) throw new Error('ไม่พบผ้าดิบในสต็อก');
            await stockMove(fabric, 'in', Number(w.yards), 'คืนผ้าจากการลบรายการผ้าเสีย' + (w.reason ? ' · ' + w.reason : ''));
