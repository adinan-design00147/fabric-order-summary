  <script>
    // ===== ตั้งค่า Supabase =====
    const SUPABASE_URL = 'https://pmcnamlesodpuynakkuk.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_qkWioinGX5ybtENThpRjLw_9R3OL_Gw';
    let sb;   // สร้างจริงใน startApp() หลังไลบรารีโหลดเสร็จ

    // ===== ตัวกลางรูปงานบน Google Drive (Apps Script Web App) =====
    // วาง URL ที่ได้จากการ deploy drive-images.gs ตรงนี้ (ลงท้ายด้วย /exec)
    const DRIVE_API_URL = 'https://script.google.com/macros/s/AKfycbywrr_aXf_GWT4UCHJzJMAFB_a8jxfwfP93MrhGVuQsFASQJy6TpHkmLRppdwd-Cx5syQ/exec';

    // ชื่อโฟลเดอร์ในไดรฟ์เขียนไม่เหมือนกัน (30-7-69 / 10 / 7/ 69 / 7/8/69)
    // ทำให้เป็นรูปแบบเดียวกันก่อนจับคู่ ให้ตรงกับ normalizeLotName ใน drive-images.gs
    function normalizeLotName(name) {
      return String(name == null ? '' : name)
        .replace(/[\s ]/g, '')
        .replace(/[-.]/g, '/')
        .split('/')
        .filter(p => p !== '')
        .map(p => /^\d+$/.test(p) ? String(parseInt(p, 10)) : p)
        .join('/');
    }

    // root: 'fabric' = โฟลเดอร์งานป้ายผ้า (แยกตามล็อต) · 'order' = รูปงานออเดอร์ลูกค้า (แยกตามเลขออเดอร์)
    async function driveList(lot, root) {
      if (!DRIVE_API_URL) return [];
      const url = DRIVE_API_URL + '?action=list&root=' + encodeURIComponent(root || 'fabric')
        + '&lot=' + encodeURIComponent(lot);
      const res = await fetch(url);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'โหลดรูปไม่สำเร็จ');
      return data.files || [];
    }

    async function drivePost(payload) {
      if (!DRIVE_API_URL) throw new Error('ยังไม่ได้ตั้งค่า DRIVE_API_URL');
      // ใช้ text/plain เพื่อเลี่ยง CORS preflight ที่ Apps Script รองรับไม่ได้
      const res = await fetch(DRIVE_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'ทำรายการไม่สำเร็จ');
      return data;
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onload = () => resolve(String(fr.result).split(',')[1]);
        fr.onerror = () => reject(new Error('อ่านไฟล์ไม่สำเร็จ'));
        fr.readAsDataURL(file);
      });
    }

    /**
     * แยก "ชื่อลูกค้า" กับ "ขนาด" ออกจากชื่อไฟล์รูป
     * รองรับ: "Suraiya 65x85 .png", "mustaza 85 x 190ai.png", "Wea 50*200.jpg", "Ang-70X150.png"
     * คืน null ถ้าหาขนาดไม่เจอ
     */
    function parsePieceFromFilename(filename) {
      const base = String(filename || '').replace(/\.[a-z0-9]+$/i, '');
      const m = base.match(/(\d{1,3})\s*[x×*]\s*(\d{1,3})/i);
      if (!m) return null;
      const w = parseInt(m[1], 10), l = parseInt(m[2], 10);
      if (!w || !l) return null;
      const label = base.slice(0, m.index)
        .replace(/[-_]+$/, '')
        .replace(/\s+/g, ' ')
        .trim();
      return { label: label || null, width_cm: w, length_cm: l };
    }

    function buildGallery(lotName, opts) {
      const root = (opts && opts.root) || 'fabric';
      const emptyText = (opts && opts.emptyText) || 'ยังไม่มีรูปในล็อตนี้';
      const wrap = document.createElement('div');
      wrap.className = 'gallery';
      wrap.hidden = !(opts && opts.open);
      wrap.innerHTML = `
        <div class="gallery-bar">
          <label class="btn secondary btn-sm" style="display:inline-flex;align-items:center;cursor:pointer">
            ${icon('plus', 15)}เพิ่มรูป
            <input type="file" accept="image/*" multiple hidden class="gal-input">
          </label>
          <span class="gallery-msg"></span>
        </div>
        <div class="gallery-grid"></div>
      `;
      const grid = wrap.querySelector('.gallery-grid');
      const msg = wrap.querySelector('.gallery-msg');
      const input = wrap.querySelector('.gal-input');

      function setMsg(text, isErr) {
        msg.textContent = text || '';
        msg.className = 'gallery-msg' + (isErr ? ' error' : '');
      }

      function paint(files) {
        if (!files.length) {
          grid.innerHTML = '';
          grid.insertAdjacentHTML('beforebegin', '');
          grid.innerHTML = `<div class="gallery-empty">${esc(emptyText)}</div>`;
          return;
        }
        grid.innerHTML = files.map((f, i) => `
          <div class="gallery-item">
            <a href="${esc(f.view)}" target="_blank" rel="noopener" title="${esc(f.name)}">
              <img src="${esc(f.thumb)}" alt="${esc(f.name)}" loading="lazy" referrerpolicy="no-referrer">
              <span class="gallery-fallback" hidden>${icon('image', 22)}<span class="gf-name">${esc(f.name)}</span><span class="gf-hint">เปิดในไดรฟ์</span></span>
            </a>
            ${opts && opts.onSetCover ? `<button class="cover-btn ${opts.currentCover === f.id ? 'is-cover' : ''}" data-i="${i}">
              ${opts.currentCover === f.id ? icon('check', 13) + 'รูปปก' : 'ตั้งเป็นรูปปก'}</button>` : ''}
          </div>
        `).join('');
        if (opts && opts.onSetCover) {
          grid.querySelectorAll('.cover-btn').forEach(b => b.addEventListener('click', async (e) => {
            e.preventDefault(); e.stopPropagation();
            b.disabled = true; b.textContent = 'กำลังตั้ง...';
            try { await opts.onSetCover(files[+b.dataset.i]); paint(files); }
            catch (err) { setMsg(err.message, true); b.disabled = false; }
          }));
        }
        // Drive บางทีไม่สร้าง thumbnail ให้ หรือจำกัดโควตาแล้วค้างไม่ตอบ
        // -> ลองลิงก์สำรอง ถ้ายังไม่ได้ (หรือค้างเกิน 12 วิ) ให้โชว์ชื่อไฟล์แทนช่องว่าง
        grid.querySelectorAll('.gallery-item img').forEach((img, i) => {
          const id = files[i].id;
          let tried = 0;
          let done = false;
          const showFallback = () => {
            if (done) return;
            done = true;
            img.hidden = true;
            const fb = img.parentElement.querySelector('.gallery-fallback');
            if (fb) fb.hidden = false;
          };
          img.addEventListener('load', () => { done = true; });
          img.addEventListener('error', () => {
            if (done) return;
            tried++;
            if (tried === 1) { img.src = 'https://lh3.googleusercontent.com/d/' + id + '=w800'; return; }
            if (tried === 2) { img.src = 'https://drive.google.com/thumbnail?id=' + id + '&sz=w400'; return; }
            showFallback();
          });
          setTimeout(() => { if (!img.complete || img.naturalWidth === 0) showFallback(); }, 12000);
        });
      }

      async function load() {
        if (!DRIVE_API_URL) {
          grid.innerHTML = `<div class="gallery-empty">ยังไม่ได้เชื่อมต่อ Google Drive — ดูขั้นตอนใน CLAUDE.md</div>`;
          return;
        }
        setMsg('กำลังโหลดรูป...');
        try {
          paint(await driveList(lotName, root));
          setMsg('');
        } catch (e) { setMsg(e.message, true); }
      }

      input.addEventListener('change', async () => {
        const files = Array.from(input.files || []);
        if (!files.length) return;
        for (let i = 0; i < files.length; i++) {
          setMsg('กำลังอัปโหลด ' + (i + 1) + '/' + files.length + '...');
          try {
            await drivePost({
              action: 'upload', root, lot: lotName,
              filename: files[i].name, mimeType: files[i].type,
              data: await fileToBase64(files[i]),
            });
          } catch (e) { setMsg(e.message, true); input.value = ''; return; }
        }
        input.value = '';
        await load();
        setMsg('อัปโหลดเรียบร้อย');
      });

      wrap.__load = load;
      return wrap;
    }

    function pieceYard(r, settings) {
      return isFabricPiece(r) ? calcPiece(r.width_cm, r.length_cm, settings).yardPerPiece : 0;

    /**
     * ผ้าที่ต้องเตรียมต่อ 1 ชิ้น
     * ผ้าดิบมาเป็นม้วน หน้ากว้างคงที่ -> ตัดงานหนึ่งชิ้นกินผ้าตาม "ด้านที่ยาวกว่า" ไม่ใช่พื้นที่
     *   50 x 200 -> ใช้ 200 ซม. · 65 x 85 -> ใช้ 85 ซม.
     * แล้วเผื่อหดตาม shrink_rate + เผื่อริม edge_cm ก่อนแปลงเป็นหลา (1 หลา = 91.44 ซม.)
     *   สูตร: (ด้านยาว x shrink_rate + edge_cm) / 91.44   เช่น 85 -> (85 x 1.20 + 5) / 91.44 = 1.17 หลา
     * ราคายังคิดจากพื้นที่เหมือนเดิม (กว้าง x ยาว x เรต) — คนละเรื่องกับการเตรียมผ้า
     */
    function calcPiece(widthCm, lengthCm, settings) {
      const longSide = Math.max(Number(widthCm) || 0, Number(lengthCm) || 0);
      const edgeCm = Number(settings.edge_cm) || 0;      // เผื่อริม/เย็บ คงที่ต่อชิ้น
      const shrinkLength = round2(longSide * settings.shrink_rate + edgeCm);
      const yardCm = settings.yard_cm || 91.44;
      const yardPerPiece = round4(shrinkLength / yardCm);
      const price = Math.round(widthCm * lengthCm * settings.price_rate);
      return { shrinkLength, yardPerPiece, price, longSide };
    }

      ]);
      // การเลือกชิ้นงานใช้ได้เฉพาะหน้าป้ายผ้า ออกจากหน้านี้ให้ล้างทิ้ง
      if (currentView !== 'fabric' && selectedPieces.size) selectedPieces.clear();
      renderSelBar();
      document.getElementById('receiptForm')?.remove();
      updateHeaderTitle();
      renderNav();
      // ยิงครั้งเดียวต่อ session แล้วค่อยวาดเมนูใหม่ ไม่ให้ถ่วงการเปิดหน้า
      if (!debtAlertLoaded && isSuperAdmin()) {
        debtAlertLoaded = true;
        refreshDebtAlert().then(renderNav).catch(() => {});
      }
      if (!jobAlertLoaded) {
        jobAlertLoaded = true;
        refreshJobAlert().then(renderNav).catch(() => {});
      }
      // เก็บตำแหน่งเลื่อนของหน้าเดิมไว้ก่อน เผื่อกด back กลับมา
      const nextKey = viewKey();
      if (lastRenderedView && lastRenderedView !== nextKey) {
        scrollMemo[lastRenderedView] = window.scrollY;
      }
      const sameView = lastRenderedView === nextKey;
      const restoreTo = navIsBack ? (scrollMemo[nextKey] || 0) : 0;
      navIsBack = false;

      document.getElementById('app').innerHTML = '<div class="loading">กำลังโหลดข้อมูล...</div>';
      try {
        if (currentView === 'home') {
          await loadHome();
        } else if (currentView === 'dashboard') {
          await loadDashboard();
        } else if (currentView === 'calendar') {
          await loadCalendar();
        } else if (currentView === 'fabric') {
          await loadAll();
        } else if (currentView === 'customers') {
          await loadGlobalCustomers();
        } else if (currentView === 'receipts') {
          await loadReceipts();
        } else if (currentView === 'receiptView') {
          await loadReceiptDetail(viewingReceiptId);
        } else if (currentView === 'orders') {
          await loadOrders();
        } else if (currentView === 'orderView') {
          await loadOrderDetail(viewingOrderId);
        } else if (currentView === 'products') {
          await loadProductCatalog();
        } else if (currentView === 'attendance' || currentView === 'schedule' || currentView === 'timesheet') {
          attTab = currentView === 'attendance' ? 'clock' : currentView === 'schedule' ? 'schedule' : 'history';
          await loadAttendance();
        } else if (currentView === 'users') {
          await loadUsers();
        } else if (currentView === 'debts') {
          if (!isSuperAdmin()) { currentView = HOME_VIEW; syncHash(); return boot(); }
          await loadDebts();
        } else if (currentView === 'trash') {
          await loadTrash();
        } else if (currentView === 'stockreport') {
          await loadStockReport();
        } else if (currentView === 'stock') {
          await loadStock();
        } else if (currentView === 'purchases') {
          if (!isAdmin()) { currentView = HOME_VIEW; syncHash(); return boot(); }
          await loadPurchases();
        } else if (currentView === 'health') {
          await loadHealth();
        } else if (currentView === 'profile') {
          await loadProfile();
        } else {
          await loadProducts(currentView);
        }
      } catch (err) {
        document.getElementById('statusMsg').textContent = 'โหลดไม่สำเร็จ: ' + err.message;
      }

      lastRenderedView = viewKey();
      if (!sameView) {
        window.scrollTo({ top: restoreTo, behavior: 'auto' });
        // เนื้อหาค่อยๆ ขึ้น ไม่กระพริบ (เครื่องที่ตั้งลดการเคลื่อนไหว CSS จะข้ามให้เอง)
        const appEl = document.getElementById('app');
        appEl.classList.remove('view-in');
        void appEl.offsetWidth;          // บังคับให้เบราว์เซอร์เริ่มแอนิเมชันใหม่
        appEl.classList.add('view-in');
      }
    }

    // ===== หน้าแรก (#/home) =====
    // หน้าเปิดแอป — ดูสถานะตัวเองแล้วกดเข้าเมนูที่จะทำ ไม่ใช่หน้าอ่านตัวเลขเยอะๆ (อันนั้นคือแดชบอร์ด)
    // เอาเฉพาะข้อมูลที่มีจริงในระบบ ไม่มีระบบลา จึงไม่มีการ์ดสิทธิ์วันลา
    let HOME = { today: null, sched: null };

    // สีไอคอนของแต่ละเมนู — จำง่ายกว่าไอคอนสีเดียวหมด
    const HOME_TILE_COLOR = {
      attendance: '#0ea47a', orders: '#6d3fd4', fabric: '#e8720c', dashboard: '#2563eb',
      calendar:   '#3454d1', products: '#c026a3', stock: '#0891b2', purchases: '#16a34a',
      customers:  '#dc2626', receipts: '#475569', schedule: '#7c3aed', timesheet: '#0d9488',
      stockreport: '#0891b2', users: '#b45309', debts: '#be123c', trash: '#64748b',
      health: '#0369a1', profile: '#4f46e5',
    };

    // เรียงตามที่ใช้จริงในร้าน ไม่ใช่ตามลำดับในเมนูข้าง
    const HOME_TILES = ['attendance', 'orders', 'fabric', 'calendar', 'stock', 'purchases',
      'customers', 'receipts', 'products', 'schedule', 'timesheet', 'dashboard',
      'users', 'debts', 'trash', 'health', 'profile'];

    async function loadHome() {
      document.getElementById('statusMsg').textContent = 'กำลังโหลด...';
      const [tRes, sRes] = await Promise.all([
        sb.from('attendances').select('*').eq('user_id', ME ? ME.id : null).eq('work_date', dateKey()).maybeSingle(),
        sb.from('work_schedules').select('*'),
      ]);
      ATT.schedules = sRes.data || [];      // scheduleOf() อ่านจากตรงนี้
      HOME = { today: tRes.data || null, sched: scheduleOf(ME ? ME.id : null) };
      renderHome();
      document.getElementById('statusMsg').textContent = 'อัปเดตล่าสุด: ' + new Date().toLocaleString('th-TH');
    }

    function homeGreet() {
      const h = new Date().getHours();
      return h < 12 ? 'สวัสดีตอนเช้า' : h < 17 ? 'สวัสดีตอนบ่าย' : 'สวัสดีตอนเย็น';
    }

    function renderHome() {
      const app = document.getElementById('app');
      app.innerHTML = '';

      const login = prettyLogin(ME ? ME.email : '') || '';
      const name = MY_NAME || login.split('@')[0] || 'ผู้ใช้';
      const initial = (name.trim()[0] || '?').toUpperCase();
      const rm = roleMeta(MY_ROLE);
      const t = HOME.today;
      const sc = HOME.sched || { days: DEFAULT_DAYS, grace_minutes: 30 };

      // ---- หัวสีน้ำเงิน ----
      const head = document.createElement('div');
      head.className = 'home-head';
      head.innerHTML = `
        <div class="home-head-top">
          <span class="home-greet">${esc(homeGreet())}</span>
          <button class="home-out" id="homeOut" aria-label="ออกจากระบบ" title="ออกจากระบบ">${icon('signout', 20)}</button>
        </div>
        <div class="home-me">
          <div class="home-avatar">${esc(initial)}<span class="home-online"></span></div>
          <div class="home-me-txt">
            <div class="home-name">${esc(name)}</div>
            <div class="home-role">${esc(rm.label)}</div>
            <div class="home-login">${esc(login)}</div>
          </div>
        </div>`;
      app.appendChild(head);
      head.querySelector('#homeOut').addEventListener('click', async () => {
        if (confirm('ออกจากระบบ?')) await sb.auth.signOut();
      });

      // ---- สถานะวันนี้ ----
      const dow = new Date().getDay();
      const plan = sc.days[dow] || DEFAULT_DAYS[dow];
      const stTxt = !plan.work && !t ? 'วันหยุด'
        : !t || !t.clock_in ? 'ยังไม่ลงเวลา'
        : t.late_minutes ? 'มาสาย ' + t.late_minutes + ' น.'
        : t.clock_out ? 'ครบแล้ว' : 'กำลังทำงาน';
      const stCls = !t || !t.clock_in ? (plan.work ? 'warn' : 'off') : t.late_minutes ? 'late' : 'ok';

      const card1 = document.createElement('div');
      card1.className = 'home-card';
      card1.innerHTML = `
        <div class="home-card-head">${icon('clock', 17)}<b>สถานะวันนี้</b>
          <a class="home-more" href="${routeFor('attendance')}">ลงเวลา ${icon('chevron', 15)}</a></div>
        <div class="home-3">
          <div class="home-slot ${t && t.clock_in ? 'ok' : ''}"><span class="hs-l">เข้างาน</span><span class="hs-v">${hhmm(t && t.clock_in)}</span></div>
          <div class="home-slot ${t && t.clock_out ? 'ok' : ''}"><span class="hs-l">ออกงาน</span><span class="hs-v">${hhmm(t && t.clock_out)}</span></div>
          <div class="home-slot"><span class="hs-l">สถานะ</span><span class="home-badge ${stCls}">${esc(stTxt)}</span></div>
        </div>
        ${plan.work && (!t || !t.clock_in)
          ? `<a class="btn block" href="${routeFor('attendance')}" style="margin-top:12px">${icon('signin', 16)}ไปลงเวลาเข้างาน</a>` : ''}`;
      app.appendChild(card1);

      // ---- ตารางงานสัปดาห์นี้ ----
      const DOW = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
      const card2 = document.createElement('div');
      card2.className = 'home-card';
      card2.innerHTML = `
        <div class="home-card-head">${icon('calendar', 17)}<b>ตารางงานสัปดาห์นี้</b>
          <a class="home-more" href="${routeFor('schedule')}">รายละเอียด ${icon('chevron', 15)}</a></div>
        <div class="home-week">${DOW.map((d, i) => {
          const p = sc.days[i] || DEFAULT_DAYS[i];
          return `<div class="home-day ${i === dow ? 'today' : ''} ${p.work ? '' : 'off'}">
            <span class="hd-n">${d}</span>
            ${p.work ? `<span class="hd-s">${esc(p.start)}</span><span class="hd-e">${esc(p.end)}</span>`
                     : '<span class="hd-off">หยุด</span>'}
          </div>`;
        }).join('')}</div>`;
      app.appendChild(card2);

      // ---- กริดเมนู ----
      const canSee = (k) => {
        if (k === 'debts') return isSuperAdmin();
        if (k === 'purchases' || k === 'users') return isAdmin();
        return true;
      };
      const grid = document.createElement('div');
      grid.className = 'home-grid';
      grid.innerHTML = HOME_TILES.filter(canSee).map(k => {
        const m = viewMeta(k);
        const c = HOME_TILE_COLOR[k] || 'var(--accent)';
        const badge = k === 'orders' && JOB_ALERT ? `<span class="tile-dot">${JOB_ALERT > 9 ? '9+' : JOB_ALERT}</span>`
                    : k === 'debts' && DEBT_ALERT ? `<span class="tile-dot">${DEBT_ALERT}</span>` : '';
        return `<a class="home-tile" href="${routeFor(k)}">
          <span class="tile-ico" style="background:${c}">${icon(m.icon, 24)}${badge}</span>
          <span class="tile-lbl">${esc(m.label)}</span>
        </a>`;
      }).join('');
      app.appendChild(grid);

      const foot = document.createElement('div');
      foot.className = 'home-foot';
      foot.textContent = 'Haifa Design · ' + APP_BUILD;
      app.appendChild(foot);
    }

    // ===== แดชบอร์ดรวม =====
    async function loadDashboard() {
      document.getElementById('statusMsg').textContent = 'กำลังโหลด...';
      SETTINGS = await loadSettings();
      const [lotsRes, piecesRes, ordersRes, salesRes, stockRes] = await Promise.all([
        sb.from('lots').select('id,name'),
        sb.from('pieces').select('id,lot_id,width_cm,length_cm,label,price,sell_price,paid,item_type,printed,printed_at,stock_move_id,vendor'),
        sb.from('product_orders').select('id,category,name,customer,quantity,unit_cost,paid,created_at'),
        sb.from('orders').select('id,order_no,customer,customer_id,channel,status,total,paid_amount,due_date,delivered_at,created_at,cover_file_id,phone'),
        sb.from('stock_items').select('id,name,category,unit,total_qty,used_qty,threshold_pct,threshold_qty').eq('active', true),
      ]);
      await fetchLastBackup();
      if (lotsRes.error) throw lotsRes.error;
      if (piecesRes.error) throw piecesRes.error;
      if (ordersRes.error) throw ordersRes.error;
      if (salesRes.error) throw salesRes.error;
      renderDashboard(lotsRes.data, piecesRes.data, ordersRes.data, salesRes.data, stockRes.data || []);
      document.getElementById('statusMsg').textContent = 'อัปเดตล่าสุด: ' + new Date().toLocaleString('th-TH');
    }

    function renderDashboard(lots, pieces, orders, sales, stock) {
      sales = sales || [];
      stock = stock || [];
      const app = document.getElementById('app');
      app.innerHTML = '';
      app.appendChild(buildPageHead('แดชบอร์ด', 'ภาพรวมทั้งร้าน — ฝั่งขายและฝั่งต้นทุนผลิต'));

      // ===== ต้องรีบทำ (รวมของค้างจากทุกเมนูมาไว้บนสุด) =====
      const today0 = new Date(new Date().toDateString());
      const overdue = sales.filter(s => {
        if (!s.due_date || !needsDelivery(s)) return false;
        return new Date(s.due_date) < today0;
      });
      const lowStock = stock.filter(i => stockStatus(i).key !== 'ok');
      const backupDays = daysSinceBackup();
      const notPrinted = pieces.filter(p => !p.printed && isFabricPiece(p));
      const notPrintedYard = round4(notPrinted.reduce((a, p) => a + pieceYard(p, SETTINGS), 0));

      const alerts = [];
      if (overdue.length) alerts.push({
        cls: 'danger', ico: 'truck', num: overdue.length, lbl: 'ออเดอร์เลยกำหนดส่งแล้ว',
        sub: overdue.slice(0, 3).map(o => o.order_no + (o.customer ? ' · ' + o.customer : '')).join(' · '),
        href: routeFor('orders'),
      });
      if (lowStock.length) alerts.push({
        cls: 'warn', ico: 'box', num: lowStock.length, lbl: 'วัตถุดิบใกล้หมด / ต้องสั่งเพิ่ม',
        sub: lowStock.map(i => i.name + ' เหลือ ' + fmtQty(stockRemain(i)) + ' ' + i.unit).join(' · '),
        href: routeFor('stock'),
      });
      if (backupDays === null || backupDays > 14) alerts.push({
        cls: 'danger', ico: 'box', num: backupDays === null ? '!' : backupDays,
        lbl: backupDays === null ? 'ยังไม่เคยสำรองข้อมูล' : 'ไม่ได้สำรองข้อมูลมา ' + backupDays + ' วัน',
        sub: 'กดสำรองทั้งระบบเป็นไฟล์เดียว เก็บไว้ในเครื่อง',
        href: routeFor('health'),
      });
      if (notPrinted.length) alerts.push({
        cls: 'info', ico: 'factory', num: notPrinted.length, lbl: 'ชิ้นงานที่ยังไม่ได้ปริ้น',
        sub: 'ต้องเตรียมผ้าอีก ' + notPrintedYard.toFixed(2) + ' หลา',
        href: routeFor('fabric'),
      });

      if (alerts.length) {
        const alertHead = document.createElement('h2');
        alertHead.className = 'section-title';
        alertHead.style.marginTop = '0';
        alertHead.innerHTML = icon('clock', 17) + 'ต้องรีบทำ';
        app.appendChild(alertHead);

        const alertGrid = document.createElement('div');
        alertGrid.className = 'alert-grid';
        alertGrid.innerHTML = alerts.map(a => `<a class="alert-card ${a.cls}" href="${a.href}">
          <span class="alert-ico">${icon(a.ico, 20)}</span>
          <span class="alert-body">
            <span class="alert-num">${a.num}</span>
            <span class="alert-lbl">${esc(a.lbl)}</span>
            <span class="alert-sub">${esc(a.sub)}</span>
          </span>
          <span class="alert-go">${icon('chevron', 18)}</span>
        </a>`).join('');
        app.appendChild(alertGrid);
      }

      // ===== ตัวนับรายได้ 12 เดือน เทียบเกณฑ์ที่ต้องจด VAT =====
      // (โชว์เฉพาะตอนยังไม่ได้จด — จดแล้วไม่ต้องเตือนอีก)
      if (!vatOn()) {
        const yearAgo = new Date();
        yearAgo.setFullYear(yearAgo.getFullYear() - 1);
        const rev12 = sales
          .filter(s2 => s2.status !== 'cancelled' && new Date(s2.created_at) >= yearAgo)
          .reduce((a, s2) => a + Number(s2.total), 0);
        const threshold = Number(SETTINGS.vat_threshold) || 1800000;
        const pctVat = Math.min(100, (rev12 / threshold) * 100);
        const near = pctVat >= 80;

        const vatCard = document.createElement('div');
        vatCard.className = 'lot-card';
        vatCard.style.marginBottom = 'var(--space-5)';
        vatCard.innerHTML = `
          <div class="lot-head"><span>${icon('price', 16)}รายได้ 12 เดือนล่าสุด</span>
            <span class="st ${near ? 'st-cancel' : 'st-paid'}">${pctVat.toFixed(1)}% ของเกณฑ์จด VAT</span></div>
          <div style="padding:var(--space-4)">
            <div style="font-size:22px;font-weight:700">${fmtBaht(round2(rev12))} <span style="font-size:13px;font-weight:500;color:var(--sub)">/ ${fmtBaht(threshold)} บาท</span></div>
            <div class="lp-bar" style="margin-top:10px"><div style="width:${pctVat}%;background:${near ? '#b42318' : '#22a06b'}"></div></div>
            <div class="hint">${near
              ? 'ใกล้ถึงเกณฑ์แล้ว — เกิน ' + fmtBaht(threshold) + ' บาท/ปี ต้องจดทะเบียน VAT ภายใน 30 วัน ปรึกษาผู้ทำบัญชีไว้ล่วงหน้า'
              : 'ยังไม่ถึงเกณฑ์ที่ต้องจดทะเบียน VAT — ระบบจะเตือนเมื่อถึง 80%'}</div>
          </div>`;
        app.appendChild(vatCard);
      }

      // ===== ฝั่งขาย (ออเดอร์) =====
      const now2 = new Date();
      const salesThisMonth = sales.filter(s => {
        const d = new Date(s.created_at);
        return d.getFullYear() === now2.getFullYear() && d.getMonth() === now2.getMonth() && s.status !== 'cancelled';
      });
      const salesTotal = salesThisMonth.reduce((s, o) => s + Number(o.total), 0);
      const activeOrders = sales.filter(s => s.status !== 'cancelled'
        && (!isDelivered(s) || Number(s.paid_amount || 0) < Number(s.total)));
      const custOutstanding = sales
        .filter(s => s.status !== 'cancelled')
        .reduce((s, o) => s + Math.max(0, Number(o.total) - Number(o.paid_amount || 0)), 0);
      const dueSoon = sales.filter(s => {
        if (!s.due_date || !needsDelivery(s)) return false;
        const diff = (new Date(s.due_date) - new Date(new Date().toDateString())) / 86400000;
        return diff >= 0 && diff <= 7;
      });

      const salesHead = document.createElement('h2');
      salesHead.className = 'section-title';
      salesHead.style.marginTop = '0';
      salesHead.innerHTML = icon('clipboard', 17) + 'ฝั่งขาย (ออเดอร์)';
      app.appendChild(salesHead);

      const salesKpi = document.createElement('div');
      salesKpi.className = 'kpi-grid';
      salesKpi.innerHTML = `
        <div class="kpi">
          <div class="kpi-top"><span class="kpi-ico">${icon('cash', 17)}</span><span class="kpi-trend up">${salesThisMonth.length} ใบ</span></div>
          <div><div class="kpi-num">${fmtBaht(round2(salesTotal))}</div><div class="kpi-lbl">ยอดขายเดือนนี้ (บาท)</div></div>
        </div>
        <div class="kpi">
          <div class="kpi-top"><span class="kpi-ico">${icon('clock', 17)}</span><span class="kpi-trend ${custOutstanding > 0 ? 'down' : 'up'}">ลูกค้า</span></div>
          <div><div class="kpi-num">${fmtBaht(round2(custOutstanding))}</div><div class="kpi-lbl">ค้างเก็บจากลูกค้า (บาท)</div></div>
        </div>
        <div class="kpi">
          <div class="kpi-top"><span class="kpi-ico">${icon('clipboard', 17)}</span><span class="kpi-trend flat">ยังไม่ปิด</span></div>
          <div><div class="kpi-num">${activeOrders.length}</div><div class="kpi-lbl">ออเดอร์ที่ค้างอยู่</div></div>
        </div>
        <div class="kpi">
          <div class="kpi-top"><span class="kpi-ico">${icon('truck', 17)}</span><span class="kpi-trend ${dueSoon.length ? 'down' : 'flat'}">7 วัน</span></div>
          <div><div class="kpi-num">${dueSoon.length}</div><div class="kpi-lbl">ใกล้ถึงกำหนดส่ง</div></div>
        </div>
      `;
      app.appendChild(salesKpi);

      if (sales.length) {
        const byChannel = {};
        sales.filter(s => s.status !== 'cancelled').forEach(s => {
          const c = s.channel || 'ไม่ระบุ';
          byChannel[c] = (byChannel[c] || 0) + Number(s.total);
        });
        const chRow = document.createElement('div');
        chRow.className = 'dash-row thirds';
        chRow.innerHTML = `
          <div class="panel-card">
            <h3>ยอดขายตามช่องทาง</h3>
            <div class="panel-sub">รวมทุกออเดอร์ที่ไม่ถูกยกเลิก</div>
            <div class="chart-box donut"><canvas id="chartChannel"></canvas></div>
          </div>
          <div class="panel-card">
            <h3>ออเดอร์ล่าสุด</h3>
            <div class="panel-sub">${sales.length} ใบทั้งหมด</div>
            <div class="mini-list">${sales.slice(0, 8).map(s => {
              const st = ORDER_STATUS[s.status] || ORDER_STATUS.new;
              const bal = Math.max(0, Number(s.total) - Number(s.paid_amount || 0));
              return `<div class="mini-row">
                <div class="mini-main">
                  <div class="mini-title">${esc(s.order_no)} ${s.customer ? '· ' + esc(s.customer) : ''}</div>
                  <div class="mini-meta">${esc(st.label)}${s.channel ? ' · ' + esc(s.channel) : ''}${bal > 0 ? ' · ค้าง ' + fmtBaht(round2(bal)) : ''}</div>
                </div>

        // ---- ยอดขาย 6 เดือนย้อนหลัง + ลูกค้าซื้อเยอะสุด ----
        const months = [];
        for (let i = 5; i >= 0; i--) {
          const d = new Date(now2.getFullYear(), now2.getMonth() - i, 1);
          months.push({
            y: d.getFullYear(), m: d.getMonth(),
            label: d.toLocaleDateString('th-TH', { month: 'short' }) + ' ' + String((d.getFullYear() + 543) % 100),
            total: 0,
          });
        }
        const liveSales = sales.filter(s => s.status !== 'cancelled');
        liveSales.forEach(s => {
          const d = new Date(s.created_at);
          const hit = months.find(x => x.y === d.getFullYear() && x.m === d.getMonth());
          if (hit) hit.total += Number(s.total);
        });

        const byCust = {};
        liveSales.forEach(s => {
          const k = (s.customer || 'ไม่ระบุชื่อ').trim();
          if (!byCust[k]) byCust[k] = { total: 0, n: 0, due: 0 };
          byCust[k].total += Number(s.total);
          byCust[k].n += 1;
          byCust[k].due += Math.max(0, Number(s.total) - Number(s.paid_amount || 0));
        });
        const topCust = Object.entries(byCust).sort((a, b) => b[1].total - a[1].total).slice(0, 5);

        const row6 = document.createElement('div');
        row6.className = 'dash-row thirds';
        row6.innerHTML = `
          <div class="panel-card">
            <h3>ยอดขาย 6 เดือนย้อนหลัง</h3>
            <div class="panel-sub">ไม่นับออเดอร์ที่ยกเลิก (บาท)</div>
            <div class="chart-box"><canvas id="chartMonths"></canvas></div>
          </div>
          <div class="panel-card">
            <h3>ลูกค้าซื้อเยอะสุด</h3>
            <div class="panel-sub">5 อันดับแรกจากยอดสะสม</div>
            <div class="mini-list">${topCust.length ? topCust.map(([name, v], i) => `<div class="mini-row">
              <div class="mini-main">
                <div class="mini-title">${i + 1}. ${esc(name)}</div>
                <div class="mini-meta">${v.n} ออเดอร์${v.due > 0 ? ' · ค้าง ' + fmtBaht(round2(v.due)) : ''}</div>
              </div>
              <div class="mini-amt">${fmtBaht(round2(v.total))}</div>
            </div>`).join('') : '<div class="mini-empty">ยังไม่มีข้อมูลลูกค้า</div>'}</div>
          </div>
        `;
        app.appendChild(row6);
        setTimeout(() => drawMonthsChart(months), 30);
      }

      const costHead = document.createElement('h2');
      costHead.className = 'section-title';
      costHead.innerHTML = icon('factory', 17) + 'ฝั่งต้นทุนผลิต (ส่งผลิตร้านอื่น)';
      app.appendChild(costHead);

      const all = flattenOrders(lots, pieces, orders);

      const now = new Date();
      const inMonth = (d, offset) => {
        if (!d) return false;
        const t = new Date(now.getFullYear(), now.getMonth() + offset, 1);
        return d.getFullYear() === t.getFullYear() && d.getMonth() === t.getMonth();
      };
      const sum = arr => arr.reduce((s, r) => s + r.amount, 0);
      const thisMonth = all.filter(r => inMonth(r.date, 0));
      const lastMonth = all.filter(r => inMonth(r.date, -1));
      const unpaid = all.filter(r => !r.paid);
      const totalYard = round4(all.reduce((s, r) => s + r.yard, 0));
      const bufferYard = round4(totalYard * SETTINGS.buffer_rate);

      // กำไรฝั่งงานผลิต: นับเฉพาะชิ้นที่กรอก "ราคาขาย" ไว้ (ชิ้นที่ไม่กรอก = ไม่รู้ราคาขาย จึงข้าม)
      const lotDateById = {};
      lots.forEach(l => { lotDateById[l.id] = parseLotDate(l.name); });
      const sellPieces = pieces.filter(p => p.sell_price != null && inMonth(lotDateById[p.lot_id], 0));
      const profitMonth = sellPieces.reduce((a, p) => a + (Number(p.sell_price) - Number(p.price)), 0);

      const thisSum = sum(thisMonth), lastSum = sum(lastMonth);
      const pct = lastSum > 0 ? Math.round(((thisSum - lastSum) / lastSum) * 100) : null;
      const trendCls = pct === null ? 'flat' : (pct >= 0 ? 'up' : 'down');
      const trendTxt = pct === null ? 'ใหม่' : (pct >= 0 ? '▲ ' + pct + '%' : '▼ ' + Math.abs(pct) + '%');

      const kpi = document.createElement('div');
      kpi.className = 'kpi-grid';
      kpi.innerHTML = `
        <div class="kpi">
          <div class="kpi-top"><span class="kpi-ico">${icon('wallet', 17)}</span><span class="kpi-trend ${trendCls}">${trendTxt}</span></div>
          <div><div class="kpi-num">${fmtBaht(round2(thisSum))}</div><div class="kpi-lbl">ยอดเดือนนี้ (บาท)</div></div>
        </div>
        <div class="kpi">
          <div class="kpi-top"><span class="kpi-ico">${icon('clock', 17)}</span><span class="kpi-trend ${unpaid.length ? 'down' : 'up'}">${unpaid.length} รายการ</span></div>
          <div><div class="kpi-num">${fmtBaht(round2(sum(unpaid)))}</div><div class="kpi-lbl">ค้างชำระรวม (บาท)</div></div>
        </div>
        <div class="kpi">
          <div class="kpi-top"><span class="kpi-ico">${icon('box', 17)}</span><span class="kpi-trend flat">ทั้งหมด</span></div>
          <div><div class="kpi-num">${all.length}</div><div class="kpi-lbl">ออเดอร์ทั้งหมด</div></div>
        </div>
        <div class="kpi">
          <div class="kpi-top"><span class="kpi-ico">${icon('layers', 17)}</span><span class="kpi-trend flat">+5%</span></div>
          <div><div class="kpi-num">${bufferYard.toFixed(2)}</div><div class="kpi-lbl">ผ้าที่ต้องสั่ง (หลา)</div></div>
        </div>
        <div class="kpi">
          <div class="kpi-top"><span class="kpi-ico">${icon('chart', 17)}</span><span class="kpi-trend ${profitMonth > 0 ? 'up' : 'flat'}">${sellPieces.length} ชิ้นที่ใส่ราคาขาย</span></div>
          <div><div class="kpi-num">${fmtBaht(round2(profitMonth))}</div><div class="kpi-lbl">กำไรเดือนนี้ (ขาย − ต้นทุน)</div></div>
        </div>
      `;
      app.appendChild(kpi);

      // แถวกราฟ
      const row1 = document.createElement('div');
      row1.className = 'dash-row';
      row1.innerHTML = `
        <div class="panel-card">
          <h3>ยอดออเดอร์ 7 วันล่าสุด</h3>
          <div class="panel-sub">รวมทุกสินค้า (บาท)</div>
          <div class="chart-box"><canvas id="chartTrend"></canvas></div>
        </div>
        <div class="panel-card">
          <h3>สัดส่วนสินค้า</h3>
          <div class="panel-sub">ตามยอดเงินรวม</div>
          <div class="chart-box donut"><canvas id="chartMix"></canvas></div>
        </div>
      `;
      app.appendChild(row1);

      // แถวลิสต์
      const todayStr = new Date().toDateString();
      const todayItems = all.filter(r => r.date && r.date.toDateString() === todayStr);
      const oldestUnpaid = unpaid.slice().sort((a, b) => (a.date ? a.date.getTime() : 0) - (b.date ? b.date.getTime() : 0)).slice(0, 8);

      const row2 = document.createElement('div');
      row2.className = 'dash-row thirds';
      row2.innerHTML = `
        <div class="panel-card">
          <h3>ออเดอร์วันนี้</h3>
          <div class="panel-sub">${todayItems.length} รายการ</div>
          <div class="mini-list">${todayItems.length ? todayItems.map(miniRow).join('') : '<div class="mini-empty">ยังไม่มีออเดอร์วันนี้</div>'}</div>
        </div>
        <div class="panel-card">
          <h3>ค้างชำระนานสุด</h3>
          <div class="panel-sub">${unpaid.length} รายการที่ยังไม่จ่าย</div>
          <div class="mini-list">${oldestUnpaid.length ? oldestUnpaid.map(miniRow).join('') : '<div class="mini-empty">ไม่มียอดค้างชำระ</div>'}</div>
        </div>
      `;
      app.appendChild(row2);

      drawCharts(all);
    }

    // ===== โปรไฟล์ผู้ใช้ + สิทธิ์ =====
    let ME = null, MY_ROLE = null, MY_NAME = '';
    // สิทธิ์ 3 ระดับ — ตัวจริงที่กันคือ RLS ฝั่งฐานข้อมูล ตรงนี้แค่ซ่อน/แสดงปุ่มให้ตรงกัน

      admin:       { label: 'ผู้ดูแล',      cls: 'st-deliv', desc: 'แก้ไข/ลบข้อมูลได้ทุกอย่าง ยกเว้นจัดการสิทธิ์ผู้ใช้' },
      user:        { label: 'พนักงาน',      cls: 'st-prod',  desc: 'เพิ่ม/แก้ออเดอร์ ลูกค้า กดปริ้น เบิกสต็อก ลงเวลา — ลบข้อมูลไม่ได้' },

    /** โหมดดูอย่างเดียว: ซ่อนปุ่มที่แก้ข้อมูล (ฐานข้อมูลกันอีกชั้นอยู่แล้ว) */

          box.querySelector('#pfSavePass').addEventListener('click', async () => {
            const msg = box.querySelector('#pfPassMsg');

          <div class="field-row">
            <button class="btn secondary btn-sm" id="nuGen">${icon('checkbox', 15)}สุ่มรหัสให้</button>
            <button class="btn" id="nuAdd">${icon('check', 15)}สร้างบัญชีให้เลย</button>
          </div>
          <div class="msg" id="nuMsg"></div>
          <div class="hint">
            สร้างเสร็จใช้งานได้ทันที ไม่ต้องให้เขาสมัครเองและไม่ต้องยืนยันอีเมล —
            ส่ง <b>อีเมล + รหัสผ่านชั่วคราว</b> ให้เขา แล้วบอกให้เข้าไปเปลี่ยนรหัสเองที่เมนู "โปรไฟล์ผู้ใช้"
          </div>
        `;
        app.appendChild(inv);

        const genPass = () => {
          const cs = 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
          const a = new Uint32Array(10);
          crypto.getRandomValues(a);
          return Array.from(a, n => cs[n % cs.length]).join('');
        };
        inv.querySelector('#nuGen').addEventListener('click', () => {
          inv.querySelector('#nuPass').value = genPass();
        });

        inv.querySelector('#nuAdd').addEventListener('click', async () => {
          const msg = inv.querySelector('#nuMsg');
          const username = inv.querySelector('#nuUser').value.trim();
          const email = inv.querySelector('#nuEmail').value.trim().toLowerCase();
          const pass = inv.querySelector('#nuPass').value;
          const role = inv.querySelector('#nuRole').value;
          msg.textContent = ''; msg.className = 'msg';
          if (!username && !email) { msg.textContent = 'ใส่ชื่อผู้ใช้ (หรืออีเมล) อย่างน้อยหนึ่งอย่าง'; msg.className = 'msg error'; return; }
          if (username && !/^[A-Za-z0-9._-]{3,32}$/.test(username)) {
            msg.textContent = 'ชื่อผู้ใช้ใช้ได้เฉพาะ a-z A-Z 0-9 . _ - ยาว 3-32 ตัว'; msg.className = 'msg error'; return; }
          if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { msg.textContent = 'อีเมลไม่ถูกต้อง'; msg.className = 'msg error'; return; }
          if (pass.length < 8) { msg.textContent = 'รหัสผ่านต้องยาวอย่างน้อย 8 ตัวอักษร (กด "สุ่มรหัสให้" ก็ได้)'; msg.className = 'msg error'; return; }

          const btn = inv.querySelector('#nuAdd');
          btn.disabled = true; msg.textContent = 'กำลังสร้างบัญชี...';
          try {
            const { data: { session } } = await sb.auth.getSession();
            const res = await fetch(SUPABASE_URL + '/functions/v1/create-user', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + (session ? session.access_token : ''),
                'apikey': SUPABASE_ANON_KEY,
              },
              body: JSON.stringify({ action: 'create', username, email, password: pass, role }),
            });
            const j = await res.json();
            if (!res.ok || j.error) throw new Error(j.error || 'สร้างบัญชีไม่สำเร็จ');
            msg.innerHTML = 'สร้างบัญชีเรียบร้อย — ส่งข้อมูลนี้ให้เขา:<br>' +
              '<b>ชื่อผู้ใช้:</b> ' + esc(username || email) + '<br><b>รหัสผ่าน:</b> ' + esc(pass) +
              '<br>ให้เขาตั้งชื่อเรียกและเปลี่ยนรหัสเองที่เมนู "โปรไฟล์ผู้ใช้"';
            msg.className = 'msg ok';
            inv.querySelector('#nuUser').value = '';
            inv.querySelector('#nuEmail').value = '';
            inv.querySelector('#nuPass').value = '';
            await loadUsers();
          } catch (e) {
            msg.textContent = 'สร้างบัญชีไม่สำเร็จ: ' + e.message; msg.className = 'msg error';
          } finally { btn.disabled = false; }
        });
      }

      // ---- ผู้ใช้ทั้งหมด ----
      const users = document.createElement('div');
      users.className = 'lot-card';
      app.appendChild(users);
      if (error) { users.innerHTML = '<div class="msg error" style="padding:16px">โหลดรายชื่อไม่สำเร็จ: ' + esc(error.message) + '</div>'; return; }

      // รหัสชั่วคราวที่ยังไม่ถูกเปลี่ยน (แอดมินเท่านั้นที่อ่านได้)
      let tempMap = {};
      if (isAdmin()) {
        const { data: tp } = await sb.from('user_temp_passwords').select('user_id,temp_password,set_at');
        (tp || []).forEach(t => { tempMap[t.user_id] = t; });
      }

      users.innerHTML = `
        <div class="lot-head"><span>${icon('user', 16)}ผู้ใช้ที่เข้าระบบนี้ได้ (${list.length})</span></div>
        <div class="table-wrap"><table>
          <thead><tr><th>ผู้ใช้</th><th>สิทธิ์</th>${isAdmin() ? '<th>รหัสชั่วคราว</th>' : ''}<th>เข้าร่วมเมื่อ</th>${isAdmin() ? '<th>จัดการ</th>' : ''}</tr></thead>
          <tbody>${list.map(u => {
            const login = u.username || prettyLogin(u.email);
            const tp = tempMap[u.user_id];
            return `<tr>
            <td data-label="ผู้ใช้"><b>${esc(login || '—')}</b><br><span style="font-size:11.5px;color:var(--sub)">${esc(u.display_name || 'ยังไม่ตั้งชื่อเรียก')}</span></td>
            <td data-label="สิทธิ์"><span class="st ${roleMeta(u.role).cls}">${esc(roleMeta(u.role).label)}</span></td>
            ${isAdmin() ? `<td data-label="รหัสชั่วคราว">${tp
              ? `<code class="temp-pass">${esc(tp.temp_password)}</code>`
              : '<span style="color:var(--ok-text);font-size:12px">เปลี่ยนรหัสเองแล้ว</span>'}</td>` : ''}
            <td data-label="เข้าร่วมเมื่อ">${new Date(u.created_at).toLocaleDateString('th-TH')}</td>
            ${isAdmin() ? `<td data-label="จัดการ" class="row-actions">${u.user_id === (ME && ME.id)
              ? '<span style="color:var(--sub);font-size:12px">ตัวคุณเอง</span>'
              : `${isSuperAdmin() && u.role !== 'super_admin' ? `<select class="u-role" data-id="${u.user_id}" aria-label="สิทธิ์ผู้ใช้">
                   <option value="user" ${u.role === 'user' ? 'selected' : ''}>พนักงาน</option>
                   <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>ผู้ดูแล</option>
                 </select>` : ''}
                 ${u.role === 'super_admin' && !isSuperAdmin() ? '' : `<button class="btn secondary btn-sm u-reset" data-id="${u.user_id}" data-login="${esc(login || '')}">${icon('checkbox', 14)}ตั้งรหัสใหม่</button>`}
                 ${isSuperAdmin() && u.role !== 'super_admin' ? `<button class="icon-btn icon-btn-delete u-del" data-id="${u.user_id}" data-login="${esc(login || '')}" title="ลบผู้ใช้" aria-label="ลบผู้ใช้">${icon('trash', 18)}</button>` : ''}`}</td>` : ''}
          </tr>`;
          }).join('')}</tbody>
        </table></div>
        <div class="msg" id="uMsg" style="padding:0 var(--space-4)"></div>
        <div class="hint" style="padding:0 var(--space-4) var(--space-4)">
          ${isSuperAdmin()
            ? 'ผู้ดูแลสูงสุดเท่านั้นที่เปลี่ยนสิทธิ์และลบบัญชีได้ · ผู้ดูแลทั่วไปสร้างบัญชีพนักงานและตั้งรหัสใหม่ได้'
            : isAdmin()
              ? 'คุณสร้างบัญชีพนักงานและตั้งรหัสใหม่ได้ — การเปลี่ยนสิทธิ์/ลบบัญชี ต้องให้ผู้ดูแลสูงสุดทำ'
              : 'เฉพาะผู้ดูแลเท่านั้นที่จัดการผู้ใช้ได้'}
        </div>`;

      const callUserFn = async (payload) => {
        const { data: { session } } = await sb.auth.getSession();
        const res = await fetch(SUPABASE_URL + '/functions/v1/create-user', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + (session ? session.access_token : ''),
            'apikey': SUPABASE_ANON_KEY,
          },
          body: JSON.stringify(payload),
        });
        const j = await res.json();
        if (!res.ok || j.error) throw new Error(j.error || 'ทำรายการไม่สำเร็จ');
        return j;
      };
      const randomPass = () => {
        const cs = 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        const a = new Uint32Array(10); crypto.getRandomValues(a);
        return Array.from(a, n => cs[n % cs.length]).join('');
      };

      users.querySelectorAll('.u-reset').forEach(b => b.addEventListener('click', async () => {
        const m = users.querySelector('#uMsg');
        if (!confirm('ตั้งรหัสผ่านใหม่ให้ ' + b.dataset.login + ' ?\nรหัสเดิมของเขาจะใช้ไม่ได้ทันที')) return;
        b.disabled = true;
        try {
          const pass = randomPass();
          await callUserFn({ action: 'reset', user_id: b.dataset.id, password: pass });
          m.innerHTML = 'ตั้งรหัสใหม่ให้ <b>' + esc(b.dataset.login) + '</b> แล้ว — รหัสใหม่: <b>' + esc(pass) + '</b>';
          m.className = 'msg ok';
          await loadUsers();
        } catch (e) { m.textContent = 'ตั้งรหัสไม่สำเร็จ: ' + e.message; m.className = 'msg error'; b.disabled = false; }
      }));

      users.querySelectorAll('.u-del').forEach(b => b.addEventListener('click', async () => {
        const m = users.querySelector('#uMsg');
        if (!confirm('ลบผู้ใช้ ' + b.dataset.login + ' ออกจากระบบ?\nเขาจะเข้าใช้งานไม่ได้อีก (ข้อมูลงานในระบบยังอยู่ครบ)')) return;
        b.disabled = true;
        try {
          await callUserFn({ action: 'delete', user_id: b.dataset.id });
          await loadUsers();
        } catch (e) { m.textContent = 'ลบไม่สำเร็จ: ' + e.message; m.className = 'msg error'; b.disabled = false; }
      }));

      users.querySelectorAll('.u-role').forEach(sel => sel.addEventListener('change', async () => {
        const { error } = await sb.from('app_users').update({ role: sel.value }).eq('user_id', sel.dataset.id);
        if (error) { alert('เปลี่ยนสิทธิ์ไม่สำเร็จ: ' + error.message); }
        await loadUsers();
      }));
    }

    // ===== ตรวจสุขภาพระบบ (self-check) =====
    // ใช้แทนชุดทดสอบอัตโนมัติ: กดปุ่มเดียวรู้เลยว่าส่วนไหนเพี้ยน
    async function runHealthChecks() {
      const out = [];
      const add = (name, ok, detail) => out.push({ name, ok, detail: detail || '' });
      const approx = (a, b, tol) => Math.abs(a - b) <= (tol || 0.01);

      // --- 1. สูตรคำนวณ (ตรวจกับค่าที่คำนวณมือไว้แล้ว) ---
      try {
        const st = SETTINGS || await loadSettings();
        const c = calcPiece(50, 200, st);
        const c2 = calcPiece(65, 85, st);
        add('ผ้า 50x200 = 2.68 หลา (200 x 1.20 + 5)', approx(c.yardPerPiece, 2.6794, 0.01), c.yardPerPiece.toFixed(4) + ' หลา');
        add('ผ้า 65x85 = 1.17 หลา (85 x 1.20 + 5)', approx(c2.yardPerPiece, 1.1702, 0.01), c2.yardPerPiece.toFixed(4) + ' หลา');
        add('ด้านกว้างกว่ายาวก็ใช้ด้านที่ยาวกว่า', calcPiece(200, 50, st).yardPerPiece === c.yardPerPiece, 'สลับด้านแล้วได้เท่ากัน');
        add('สูตรราคา: 50x200 = 80 บาท', c.price === 80, c.price + ' บาท');
        add('ราคาต้องเป็นเลขเต็มเสมอ', Number.isInteger(calcPiece(65, 85, st).price), calcPiece(65, 85, st).price + '');
        add('ค่าเผื่อหด 20% + เผื่อริม 5 ซม. / เผื่อซื้อ 5%',
          Number(st.shrink_rate) === 1.2 && Number(st.edge_cm) === 5 && Number(st.buffer_rate) === 1.05,
          'shrink ' + st.shrink_rate + ' · edge ' + st.edge_cm + ' ซม. · buffer ' + st.buffer_rate);
      } catch (e) { add('สูตรคำนวณ', false, e.message); }

      // --- 2. ราคาขั้นบันไดของการ์ด ---
      try {
        const list = PRODUCTS.length ? PRODUCTS : await fetchProducts();
        const card = list.find(p => p.pricing_mode === 'tier');
        if (card) {
          const t = tierList(card);
          const lowQty = tierPrice(card, 50), midQty = tierPrice(card, 700), hiQty = tierPrice(card, 5000);
          add('ราคาตามจำนวน: ต่ำกว่าขั้นแรกใช้ราคาขั้นแรก', lowQty === Number(t[0].price), lowQty + ' บาท');
          add('ราคาตามจำนวน: ถึงขั้นกลางลดราคา', midQty < Number(t[0].price), midQty + ' บาท');
          add('ราคาตามจำนวน: เกินขั้นสูงสุดใช้ราคาถูกสุด', hiQty === Number(t[t.length - 1].price), hiQty + ' บาท');
        } else add('ราคาตามจำนวน (การ์ด)', false, 'ไม่พบสินค้าแบบขั้นบันได');
      } catch (e) { add('ราคาขั้นบันได', false, e.message); }

      // --- 3. ชื่อล็อตเขียนคนละแบบต้องจับคู่กันได้ ---
      const n = normalizeLotName;
      add('จับคู่ชื่อล็อตต่างรูปแบบ', n('30-7-69') === n('30/7/69') && n('10 / 7/ 69') === n('10/7/69') && n('02/07/69') === n('2/7/69'),
        '30-7-69 → ' + n('30-7-69'));

      // --- 4. ต่อฐานข้อมูลได้ + ตัวเลขสมเหตุผล ---
      try {
        const [{ count: nPieces }, { count: nOrders }] = await Promise.all([
          sb.from('pieces').select('id', { count: 'exact', head: true }),
          sb.from('orders').select('id', { count: 'exact', head: true }),
        ]);
        add('เชื่อมต่อฐานข้อมูล', true, 'ชิ้นงาน ' + nPieces + ' · ออเดอร์ ' + nOrders);
      } catch (e) { add('เชื่อมต่อฐานข้อมูล', false, e.message); }

      // --- 5. ยอดออเดอร์ต้องเท่ากับผลรวมรายการในออเดอร์ ---
      try {
        const [ordRes, itRes] = await Promise.all([
          sb.from('orders').select('id,order_no,total'),
          sb.from('order_items').select('order_id,line_total'),
        ]);
        const sumBy = {};
        (itRes.data || []).forEach(i => { sumBy[i.order_id] = (sumBy[i.order_id] || 0) + Number(i.line_total); });
        const bad = (ordRes.data || []).filter(o => !approx(Number(o.total), sumBy[o.id] || 0, 1));
        add('ยอดออเดอร์ตรงกับรายการย่อย', bad.length === 0,
          bad.length ? 'ไม่ตรง: ' + bad.map(b => b.order_no).join(', ') : 'ตรวจแล้ว ' + (ordRes.data || []).length + ' ใบ');
      } catch (e) { add('ยอดออเดอร์ตรงกับรายการย่อย', false, e.message); }

      // --- 6. เงินที่รับต้องไม่เกินยอดรวม ---
      try {
        const { data } = await sb.from('orders').select('order_no,total,paid_amount');
        const over = (data || []).filter(o => Number(o.paid_amount || 0) > Number(o.total) + 1);
        add('เงินที่รับไม่เกินยอดออเดอร์', over.length === 0, over.length ? over.map(o => o.order_no).join(', ') : 'ปกติ');
      } catch (e) { add('เงินที่รับไม่เกินยอดออเดอร์', false, e.message); }

      // --- 7. สต็อกเบิกเกินของที่มีไม่ได้ ---
      try {
        const { data } = await sb.from('stock_items').select('name,total_qty,used_qty').eq('active', true);
        const over = (data || []).filter(i => Number(i.used_qty) > Number(i.total_qty));
        add('สต็อกไม่ติดลบ', over.length === 0, over.length ? over.map(i => i.name).join(', ') : (data || []).length + ' รายการ');
      } catch (e) { add('สต็อกไม่ติดลบ', false, e.message); }

      // --- 8. เลขเอกสารห้ามซ้ำ ---
      try {
        const [o, r] = await Promise.all([
          sb.from('orders').select('order_no'),
          sb.from('receipts').select('receipt_no'),
        ]);
        const dup = (arr, k) => { const s = new Set(), d = []; arr.forEach(x => { if (s.has(x[k])) d.push(x[k]); s.add(x[k]); }); return d; };
        const d1 = dup(o.data || [], 'order_no'), d2 = dup(r.data || [], 'receipt_no');
        add('เลขออเดอร์/ใบเสร็จไม่ซ้ำ', d1.length === 0 && d2.length === 0, [...d1, ...d2].join(', ') || 'ไม่ซ้ำ');
      } catch (e) { add('เลขเอกสารไม่ซ้ำ', false, e.message); }

      // --- 9. ตัวกลางรูปบนไดรฟ์ ---
      try {
        if (!DRIVE_API_URL) add('เชื่อมต่อ Google Drive', false, 'ยังไม่ได้ตั้งค่า');
        else {
          const res = await fetch(DRIVE_API_URL + '?action=counts&root=fabric');
          const j = await res.json();
          add('เชื่อมต่อ Google Drive', !!j.ok, j.ok ? Object.keys(j.counts || {}).length + ' โฟลเดอร์' : (j.error || 'ตอบผิดรูปแบบ'));
        }
      } catch (e) { add('เชื่อมต่อ Google Drive', false, e.message); }

      // --- 10. เตือนเรื่องการสำรองข้อมูล ---
      await fetchLastBackup();
      const dbk = daysSinceBackup();
      add('สำรองข้อมูลไม่เกิน 14 วัน', dbk !== null && dbk <= 14,
        dbk === null ? 'ยังไม่เคยสำรอง' : dbk + ' วันที่แล้ว');

      // --- 11. ยอดรับเงินของออเดอร์ต้องตรงกับรายการรับเงินจริง ---
      try {
        const [oRes, pRes] = await Promise.all([
          sb.from('orders').select('id,order_no,paid_amount'),
          sb.from('order_payments').select('order_id,amount'),
        ]);
        const paid = {};
        (pRes.data || []).forEach(p => { paid[p.order_id] = (paid[p.order_id] || 0) + Number(p.amount); });
        const bad = (oRes.data || []).filter(o => Math.abs(Number(o.paid_amount || 0) - (paid[o.id] || 0)) > 0.01);
        add('ยอดรับเงินตรงกับรายการรับเงิน', bad.length === 0,
          bad.length ? 'ไม่ตรง ' + bad.length + ' ใบ: ' + bad.slice(0, 3).map(o => o.order_no).join(', ') : 'ตรงทุกใบ');
      } catch (e) { add('ยอดรับเงินตรงกับรายการรับเงิน', false, e.message); }

      // --- 12. ตัดสต็อกพร้อมกันหลายคนแล้วยอดต้องไม่หาย ---
      try {
        const item = await getDefaultFabric();
        if (!item) add('ตัดสต็อกพร้อมกันแล้วยอดไม่หาย', false, 'ยังไม่มีผ้าดิบในสต็อก');
        else {
          const before = Number(item.used_qty);
          // ยิงพร้อมกัน 4 ครั้ง ครั้งละ 0.25 -> ต้องเพิ่มขึ้น 1.00 พอดี
          await Promise.all([0, 1, 2, 3].map(() => stockMove(item, 'out', 0.25, 'ตรวจระบบ (คืนให้อัตโนมัติ)')));
          const { data: after } = await sb.from('stock_items').select('used_qty').eq('id', item.id).single();
          const diff = round4(Number(after.used_qty) - before);
          await stockMove(item, 'in', 1, 'ตรวจระบบ: คืนยอดที่ใช้ทดสอบ');
          add('ตัดสต็อกพร้อมกัน 4 รายการแล้วยอดไม่หาย', Math.abs(diff - 1) < 0.001,
            'ยอดใช้ไปเพิ่มขึ้น ' + diff.toFixed(2) + ' (ต้องได้ 1.00)');
        }
      } catch (e) { add('ตัดสต็อกพร้อมกันแล้วยอดไม่หาย', false, e.message); }

      // --- 13. ยอดสต็อกต้องตรงกับประวัติรับเข้า/เบิกใช้ ---
      try {
        const [iRes, mRes] = await Promise.all([
          sb.from('stock_items').select('id,name,total_qty,used_qty').eq('active', true),
          sb.from('stock_moves').select('item_id,kind,qty'),
        ]);
        const sum = {};
        (mRes.data || []).forEach(m => {
          sum[m.item_id] = sum[m.item_id] || { in: 0, out: 0 };
          sum[m.item_id][m.kind] += Number(m.qty);
        });
        const bad = (iRes.data || []).filter(i => {
          const s2 = sum[i.id] || { in: 0, out: 0 };
          return Math.abs(Number(i.used_qty) - s2.out) > 0.01 || Math.abs(Number(i.total_qty) - s2.in) > 0.01;
        });
        add('ยอดสต็อกตรงกับประวัติเบิก-รับเข้า', bad.length === 0,
          bad.length ? 'ไม่ตรง: ' + bad.map(i => i.name).join(', ') : 'ตรงทุกรายการ');
      } catch (e) { add('ยอดสต็อกตรงกับประวัติ', false, e.message); }

      // --- 14. ตัวกันโปรเจกต์ Supabase ถูก pause ---
      // GitHub ปิด scheduled workflow อัตโนมัติถ้า repo เงียบเกิน 60 วัน -> ping หยุด -> ฐานข้อมูลหลับ
      try {
        const res = await fetch('https://api.github.com/repos/' + GH_REPO + '/commits?per_page=1');
        const j = await res.json();
        const last = j && j[0] && j[0].commit && j[0].commit.committer && j[0].commit.committer.date;
        if (!last) throw new Error('อ่านข้อมูล repo ไม่ได้');
        const dRepo = Math.floor((Date.now() - new Date(last).getTime()) / 86400000);
        add('ตัวปลุกฐานข้อมูลยังทำงาน (repo เคลื่อนไหวใน 45 วัน)', dRepo <= 45,
          'แก้ไขล่าสุด ' + dRepo + ' วันที่แล้ว' + (dRepo > 45 ? ' — เข้าแท็บ Actions กด Run workflow สักครั้ง' : ''));
      } catch (e) { add('ตัวปลุกฐานข้อมูลยังทำงาน', false, 'เช็กไม่ได้: ' + e.message); }

      return out;
    }
