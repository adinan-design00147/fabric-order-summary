    // ---- รายละเอียดออเดอร์ ----
    async function loadOrderDetail(id) {
      document.getElementById('statusMsg').textContent = 'กำลังโหลด...';
      const [oRes, iRes] = await Promise.all([
        sb.from('orders').select('id,order_no,customer,channel,status,due_date,note,total,created_at,phone,address,payment_method,paid_amount').eq('id', id).single(),
        sb.from('order_items').select('id,product_id,name,width_cm,length_cm,qty,unit_price,line_total').eq('order_id', id),
      ]);
      const [payRes, logRes] = await Promise.all([
        sb.from('order_payments').select('id,amount,method,note,paid_at').eq('order_id', id).order('paid_at'),
        sb.from('activity_log').select('action,detail,created_at')
          .eq('entity_type', 'order').eq('entity_id', id).order('created_at', { ascending: false }),
      ]);
      await fetchProducts();
      if (oRes.error) throw oRes.error;
      if (iRes.error) throw iRes.error;
      if (payRes.error) throw payRes.error;
      renderOrderDetail(oRes.data, iRes.data, payRes.data, logRes.data || []);
      document.getElementById('statusMsg').textContent = 'อัปเดตล่าสุด: ' + new Date().toLocaleString('th-TH');
    }

    // ออกใบเสร็จจากออเดอร์ (ใช้ราคาขายจริงที่ลูกค้าจ่าย)
    async function createReceiptFromOrder(o, items) {
      const receipt_no = await nextReceiptNo();
      const { data: rc, error: e1 } = await sb.from('receipts').insert({
        receipt_no,
        recipient: o.customer || null,
        note: 'ออกจากออเดอร์ ' + o.order_no + (o.note ? ' · ' + o.note : ''),
        total: Number(o.total),
        item_count: items.length,
        order_id: o.id,
      }).select('id').single();
      if (e1) throw new Error(e1.message);

      const rows = items.map(i => ({
        receipt_id: rc.id, piece_id: null, lot_name: null,
        label: i.name + (i.qty > 1 ? ' x' + i.qty : ''),
        width_cm: i.width_cm, length_cm: i.length_cm, price: i.line_total,
      }));
      const { error: e2 } = await sb.from('receipt_items').insert(rows);
      if (e2) throw new Error(e2.message);

      await logActivity('order', o.id, o.order_no, 'receipt', 'ออกใบเสร็จ ' + receipt_no);
      return rc.id;
    }

    async function nextReceiptNo() {
      const { data } = await sb.from('receipts').select('receipt_no').order('created_at', { ascending: false }).limit(1);
      const now = new Date();
      const prefix = 'RC' + String((now.getFullYear() + 543) % 100) + String(now.getMonth() + 1).padStart(2, '0');
      let run = 1;
      if (data && data.length) {
        const m = String(data[0].receipt_no).match(/^RC(\d{4})-(\d+)$/);
        if (m && m[1] === prefix.slice(2)) run = parseInt(m[2]) + 1;
        else {
          const { count } = await sb.from('receipts').select('id', { count: 'exact', head: true });
          run = (count || 0) + 1;
        }
      }
      return prefix + '-' + String(run).padStart(3, '0');
    }

    async function createReceipt(items, recipient, note, total) {
      const receipt_no = await nextReceiptNo();
      const { data: rc, error: e1 } = await sb.from('receipts').insert({
        receipt_no, recipient: recipient || null, note: note || null,
        total, item_count: items.length,
      }).select('id').single();
      if (e1) throw new Error('บันทึกใบเสร็จไม่สำเร็จ: ' + e1.message);

      const rows = items.map(p => ({
        receipt_id: rc.id, piece_id: p.id, lot_name: p.lotName,
        label: p.label || null, width_cm: p.width_cm, length_cm: p.length_cm, price: p.price,
      }));
      const { error: e2 } = await sb.from('receipt_items').insert(rows);
      if (e2) throw new Error('บันทึกรายการไม่สำเร็จ: ' + e2.message);

      // มาร์คชิ้นที่อยู่ในใบเสร็จว่าจ่ายแล้ว
      const { error: e3 } = await sb.from('pieces').update({ paid: true }).in('id', items.map(p => p.id));
      if (e3) throw new Error('อัปเดตสถานะจ่ายไม่สำเร็จ: ' + e3.message);

      await logActivity('receipt', rc.id, receipt_no, 'created',
        `${items.length} ชิ้น · ${fmtBaht(round2(total))} บาท (จากต้นทุนผลิต)`);
      return rc.id;
    }

    // ===== ปฏิทิน =====
    let calMonth = new Date().getMonth();
    let calYear = new Date().getFullYear();
    let calSelected = null;

    function flattenOrders(lots, pieces, orders) {
      const lotById = {};
      lots.forEach(l => lotById[l.id] = l);
      const all = [];
      pieces.forEach(p => {
        const lot = lotById[p.lot_id];
        all.push({
          kind: 'fabric', title: p.label || 'ไม่ระบุชื่อ',
          sub: p.width_cm + ' x ' + p.length_cm + ' ซม.' + (lot ? ' · ' + lot.name : ''),
          amount: Number(p.price), paid: p.paid,
          date: lot ? parseLotDate(lot.name) : null,
          yard: calcPiece(p.width_cm, p.length_cm, SETTINGS).yardPerPiece,
        });
      });
      orders.forEach(o => {
        const meta = PRODUCT_CATEGORIES[o.category];
        all.push({
          kind: o.category, title: o.name,
          sub: (meta ? meta.label : o.category) + ' · ' + o.quantity + ' ชิ้น' + (o.customer ? ' · ' + o.customer : ''),
          amount: Number(o.unit_cost) * o.quantity, paid: o.paid,
          date: o.created_at ? new Date(o.created_at) : null, yard: 0,
        });
      });
      return all;
    }

    // ชั้นข้อมูลที่โชว์บนปฏิทิน (เปิด/ปิดได้)
    let calLayers = { received: true, due: true, cost: true };

    async function loadCalendar() {
      document.getElementById('statusMsg').textContent = 'กำลังโหลด...';
      SETTINGS = await loadSettings();
      const [lotsRes, piecesRes, ordersRes, salesRes] = await Promise.all([
        sb.from('lots').select('id,name'),
        sb.from('pieces').select('id,lot_id,width_cm,length_cm,label,price,paid'),
        sb.from('product_orders').select('id,category,name,customer,quantity,unit_cost,paid,created_at'),
        sb.from('orders').select('id,order_no,customer,channel,status,total,paid_amount,due_date,created_at'),
      ]);
      if (lotsRes.error) throw lotsRes.error;
      if (piecesRes.error) throw piecesRes.error;
      if (ordersRes.error) throw ordersRes.error;
      if (salesRes.error) throw salesRes.error;

      const events = [];

      // ชั้น 1: วันรับงาน (ออเดอร์ถูกสร้าง)
      salesRes.data.forEach(o => {
        if (o.status === 'cancelled') return;
        events.push({
          layer: 'received', title: 'รับงาน ' + o.order_no,
          sub: (o.customer || 'ไม่ระบุลูกค้า') + (o.channel ? ' · ' + o.channel : ''),
          amount: Number(o.total), date: new Date(o.created_at), orderId: o.id,
        });
      });

      // ชั้น 2: วันส่งงาน (กำหนดส่ง)
      salesRes.data.forEach(o => {
        if (!o.due_date || o.status === 'cancelled') return;
        const [y, m, dd] = o.due_date.split('-').map(Number);
        events.push({
          layer: 'due', title: 'ส่งงาน ' + o.order_no,
          sub: (o.customer || 'ไม่ระบุลูกค้า') + ' · ' + (ORDER_STATUS[o.status] || ORDER_STATUS.new).label,
          amount: Number(o.total), date: new Date(y, m - 1, dd), orderId: o.id,
        });
      });

      // ชั้น 3: ค้างจ่ายร้านผลิต (จากล็อตป้ายผ้า)
      const lotById = {};
      lotsRes.data.forEach(l => lotById[l.id] = l);
      const unpaidByLot = {};
      piecesRes.data.forEach(p => {
        if (p.paid) return;
        const lot = lotById[p.lot_id];
        if (!lot) return;
        if (!unpaidByLot[lot.id]) unpaidByLot[lot.id] = { name: lot.name, amount: 0, count: 0 };
        unpaidByLot[lot.id].amount += Number(p.price);
        unpaidByLot[lot.id].count++;
      });
      Object.values(unpaidByLot).forEach(l => {
        const d = parseLotDate(l.name);
        if (!d) return;
        events.push({
          layer: 'cost', title: 'ค้างจ่ายร้านผลิต',
          sub: 'ล็อต ' + l.name + ' · ' + l.count + ' ชิ้น',
          amount: l.amount, date: d,
        });
      });

      renderCalendar(events);
      document.getElementById('statusMsg').textContent = 'อัปเดตล่าสุด: ' + new Date().toLocaleString('th-TH');
    }

    function renderCalendar(all) {
      const app = document.getElementById('app');
      app.innerHTML = '';
      app.appendChild(buildPageHead('ปฏิทิน', 'วันรับงาน วันส่งงาน และยอดค้างจ่ายร้านผลิต'));

      const LAYER_META = {
        received: { label: 'วันรับงาน',        cls: 'lay-recv' },
        due:      { label: 'วันส่งงาน',        cls: 'lay-due' },
        cost:     { label: 'ค้างจ่ายร้านผลิต', cls: 'lay-cost' },
      };

      // ปุ่มกรองชั้นข้อมูล
      const layerBar = document.createElement('div');
      layerBar.className = 'chips';
      layerBar.innerHTML = Object.entries(LAYER_META).map(([k, v]) => {
        const n = all.filter(e => e.layer === k).length;
        return `<button class="chip ${calLayers[k] ? 'active' : ''}" data-l="${k}">${esc(v.label)} (${n})</button>`;
      }).join('');
      app.appendChild(layerBar);
      layerBar.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
        calLayers[c.dataset.l] = !calLayers[c.dataset.l];
        renderCalendar(all);
      }));

      const shown = all.filter(e => calLayers[e.layer]);

      // จัดกลุ่มตามวัน
      const byDay = {};
      shown.forEach(r => {
        if (!r.date) return;
        const k = r.date.getFullYear() + '-' + r.date.getMonth() + '-' + r.date.getDate();
        (byDay[k] = byDay[k] || []).push(r);
      });

      const monthItems = shown.filter(r => r.date && r.date.getFullYear() === calYear && r.date.getMonth() === calMonth);
      const mRecv = monthItems.filter(r => r.layer === 'received');
      const mDue = monthItems.filter(r => r.layer === 'due');
      const mCost = monthItems.filter(r => r.layer === 'cost');

      const top = document.createElement('div');
      top.className = 'cal-top';
      top.innerHTML = `
        <div>
          <div class="cal-title">${THAI_MONTHS[calMonth + 1]} ${calYear + 543}</div>
          <div class="page-sub">รับงาน ${mRecv.length} · ส่งงาน ${mDue.length} · ค้างจ่ายร้านผลิต ${fmtBaht(round2(mCost.reduce((s, r) => s + r.amount, 0)))} บาท</div>
        </div>
        <div class="cal-nav">
          <button class="btn secondary btn-sm" id="calPrev">‹ ก่อนหน้า</button>
          <button class="btn secondary btn-sm" id="calToday">วันนี้</button>
          <button class="btn secondary btn-sm" id="calNext">ถัดไป ›</button>
        </div>
      `;
      app.appendChild(top);

      const grid = document.createElement('div');
      grid.className = 'cal-grid';
      ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'].forEach(d => {
        const h = document.createElement('div');
        h.className = 'cal-dow';
        h.textContent = d;
        grid.appendChild(h);
      });

      const first = new Date(calYear, calMonth, 1);
      const startOffset = first.getDay();
      const start = new Date(calYear, calMonth, 1 - startOffset);
      const todayKeyStr = (() => { const t = new Date(); return t.getFullYear() + '-' + t.getMonth() + '-' + t.getDate(); })();

      for (let i = 0; i < 42; i++) {
        const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
        const key = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
        const items = byDay[key] || [];
        const inMonth = d.getMonth() === calMonth;
        const cell = document.createElement('button');
        cell.className = 'cal-cell' + (inMonth ? '' : ' muted') + (key === todayKeyStr ? ' today' : '') + (key === calSelected ? ' selected' : '');
        cell.dataset.key = key;
        const shown = items.slice(0, 2);
        cell.innerHTML = `
          <span class="cal-daynum">${d.getDate()}</span>
          ${shown.map(r => `<span class="cal-chip ${LAYER_META[r.layer].cls}">${esc(r.title)}</span>`).join('')}
          ${items.length > 2 ? `<span class="cal-more">+${items.length - 2} รายการ</span>` : ''}
          <span class="cal-dot-row">${items.slice(0, 4).map(r => `<span class="cal-dot ${LAYER_META[r.layer].cls}"></span>`).join('')}</span>
        `;
        cell.addEventListener('click', () => {
          calSelected = calSelected === key ? null : key;
          renderCalendar(all);
        });
        grid.appendChild(cell);
      }
      app.appendChild(grid);

      // รายละเอียดวันที่เลือก
      if (calSelected) {
        const items = byDay[calSelected] || [];
        const [yy, mm, dd] = calSelected.split('-').map(Number);
        const detail = document.createElement('div');
        detail.className = 'panel-card';
        detail.style.marginTop = 'var(--space-4)';
        detail.innerHTML = `
          <h3>${dd} ${THAI_MONTHS[mm + 1]} ${yy + 543}</h3>
          <div class="panel-sub">${items.length} รายการ · รวม ${fmtBaht(round2(items.reduce((s, r) => s + r.amount, 0)))} บาท</div>
          <div class="mini-list">${items.length ? items.map(r => {
            const inner = `
              <div class="mini-main">
                <div class="mini-title">${esc(r.title)}</div>
                <div class="mini-meta">${esc(LAYER_META[r.layer].label)} · ${esc(r.sub)}</div>
              </div>
              <div class="mini-amt">${fmtBaht(round2(r.amount))}</div>`;
            return r.orderId
              ? `<a class="mini-row" href="${routeFor('orderView', r.orderId)}" style="text-decoration:none;color:inherit">${inner}</a>`
              : `<div class="mini-row">${inner}</div>`;
          }).join('') : '<div class="mini-empty">ไม่มีรายการวันนี้</div>'}</div>
        `;
        app.appendChild(detail);
      }

      top.querySelector('#calPrev').addEventListener('click', () => {
        calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; }
        calSelected = null; renderCalendar(all);
      });
      top.querySelector('#calNext').addEventListener('click', () => {
        calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; }
        calSelected = null; renderCalendar(all);
      });
      top.querySelector('#calToday').addEventListener('click', () => {
        const t = new Date();
        calMonth = t.getMonth(); calYear = t.getFullYear();
        calSelected = null; renderCalendar(all);
      });
    }

    function drawChannelChart(byChannel) {
      if (typeof Chart === 'undefined') return;
      const el = document.getElementById('chartChannel');
      if (!el) return;
      const labels = Object.keys(byChannel).filter(k => byChannel[k] > 0);
      if (!labels.length) return;
      const css = getComputedStyle(document.documentElement);
      dashCharts.push(new Chart(el, {
        type: 'doughnut',
        data: {
          labels,
          datasets: [{
            data: labels.map(k => round2(byChannel[k])),
            backgroundColor: ['#3454d1', '#f5b77e', '#5fd497', '#b48ef5', '#f58ea8', '#7ec8f5'],
            borderWidth: 2, borderColor: css.getPropertyValue('--card').trim() || '#fff',
          }],
        },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: '62%',
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, padding: 12, font: { size: 11 } } } },
        },
      }));
    }

    function miniRow(r) {
      return `<div class="mini-row">
        <div class="mini-main">
          <div class="mini-title">${esc(r.title)}</div>
          <div class="mini-meta">${esc(r.sub)}</div>
        </div>
        <div class="mini-amt">${fmtBaht(round2(r.amount))}</div>
      </div>`;
    }

    function parseLotDate(name) {
      const m = String(name).match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
      if (!m) return null;
      let yy = parseInt(m[3]);
      if (yy < 100) yy += 2500;          // พ.ศ. 2 หลัก
      else if (yy > 2400) { /* พ.ศ. เต็ม */ }
      const ce = yy - 543;
      return new Date(ce, parseInt(m[2]) - 1, parseInt(m[1]));
    }

    function drawCharts(all) {
      if (typeof Chart === 'undefined') return;
      const css = getComputedStyle(document.documentElement);
      const accent = css.getPropertyValue('--accent').trim() || '#3454d1';
      const sub = css.getPropertyValue('--sub').trim() || '#6b7280';
      const border = css.getPropertyValue('--border').trim() || '#e6e3dd';
      Chart.defaults.font.family = "'Prompt', sans-serif";
      Chart.defaults.color = sub;

      // 7 วันล่าสุด
      const days = [], labels = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i);
        days.push(d);
        labels.push(d.getDate() + '/' + (d.getMonth() + 1));
      }
      const totals = days.map(d => {
        const key = d.toDateString();
        return round2(all.filter(r => r.date && r.date.toDateString() === key).reduce((s, r) => s + r.amount, 0));
      });

      const c1 = document.getElementById('chartTrend');
      if (c1) {
        dashCharts.push(new Chart(c1, {
          type: 'line',
          data: { labels, datasets: [{
            data: totals, borderColor: accent, backgroundColor: accent + '22',
            fill: true, tension: .35, borderWidth: 2, pointRadius: 3, pointBackgroundColor: accent,
          }]},
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: { beginAtZero: true, grid: { color: border }, border: { display: false } },
              x: { grid: { display: false }, border: { color: border } },
            },
          },
        }));
      }

      // สัดส่วนสินค้า
      const mix = {};
      all.forEach(r => {
        const m = r.kind === 'fabric' ? PRODUCT_CATEGORIES.fabric : PRODUCT_CATEGORIES[r.kind];
        const name = m ? m.label : r.kind;
        mix[name] = (mix[name] || 0) + r.amount;
      });
      const mixLabels = Object.keys(mix).filter(k => mix[k] > 0);
      const c2 = document.getElementById('chartMix');
      if (c2 && mixLabels.length) {
        dashCharts.push(new Chart(c2, {
          type: 'doughnut',
          data: {
            labels: mixLabels,
            datasets: [{
              data: mixLabels.map(k => round2(mix[k])),
              backgroundColor: [accent, '#f5b77e', '#5fd497', '#b48ef5'],
              borderWidth: 2, borderColor: css.getPropertyValue('--card').trim() || '#fff',
            }],
          },
          options: {

    async function loadGlobalCustomers() {
      document.getElementById('statusMsg').textContent = 'กำลังโหลด...';
      const { data: lots, error: e0 } = await sb.from('lots').select('id,name');
      if (e0) throw e0;
      const { data: pieces, error: e1 } = await sb.from('pieces').select('lot_id,label,width_cm,length_cm,sell_price');
      if (e1) throw e1;
      const { data: orders, error: e2 } = await sb.from('product_orders').select('category,customer,name,quantity,unit_sell_price,created_at');
      if (e2) throw e2;
      const { data: sales, error: e3 } = await sb.from('orders')
        .select('id,order_no,customer,channel,status,total,paid_amount,phone,address,due_date,created_at');
      if (e3) throw e3;
      renderGlobalCustomers(lots, pieces, orders, sales);
      document.getElementById('statusMsg').textContent = 'อัปเดตล่าสุด: ' + new Date().toLocaleString('th-TH');
    }

    function renderGlobalCustomers(lots, pieces, orders, sales) {
      sales = sales || [];
      const app = document.getElementById('app');
      app.innerHTML = '';
      app.appendChild(buildPageHead('ข้อมูลลูกค้า', 'ยอดซื้อ ค้างชำระ และประวัติออเดอร์ของลูกค้าแต่ละราย'));

      // ===== ลูกค้าจากระบบออเดอร์ (ฝั่งขาย) =====
      const buyers = {};
      sales.filter(s => s.status !== 'cancelled').forEach(s => {
        const key = (s.customer || '').trim() || 'ไม่ระบุชื่อ';
        if (!buyers[key]) buyers[key] = {
          name: key, orders: [], total: 0, paid: 0,
          channels: new Set(), phone: '', address: '', last: null,
        };
        const b = buyers[key];
        b.orders.push(s);
        b.total += Number(s.total);
        b.paid += Number(s.paid_amount || 0);
        if (s.channel) b.channels.add(s.channel);
        if (s.phone && !b.phone) b.phone = s.phone;
        if (s.address && !b.address) b.address = s.address;
        const d = new Date(s.created_at);
        if (!b.last || d > b.last) b.last = d;
      });
      const buyerList = Object.values(buyers).sort((a, b) => {
        const ao = a.total - a.paid, bo = b.total - b.paid;
        if (bo !== ao) return bo - ao;
        return b.total - a.total;
      });

      if (buyerList.length) {
        const h = document.createElement('h2');
        h.className = 'section-title';
        h.style.marginTop = '0';
        h.innerHTML = icon('cash', 17) + 'ลูกค้าที่สั่งซื้อ (จากออเดอร์)';
        app.appendChild(h);

        const totAll = buyerList.reduce((s, b) => s + b.total, 0);
        const outAll = buyerList.reduce((s, b) => s + Math.max(0, b.total - b.paid), 0);
        const sum = document.createElement('div');
        sum.className = 'summary-grid';
        sum.innerHTML = `
          <div class="stat"><div class="num">${buyerList.length}</div><div class="lbl">ลูกค้าทั้งหมด</div></div>
          <div class="stat"><div class="num">${fmtBaht(round2(totAll))}</div><div class="lbl">ยอดซื้อรวม (บาท)</div></div>
          <div class="stat"><div class="num" style="color:${outAll > 0 ? 'var(--warn-text)' : 'var(--ok-text)'}">${fmtBaht(round2(outAll))}</div><div class="lbl">ค้างเก็บรวม (บาท)</div></div>
          <div class="stat"><div class="num">${sales.filter(s => s.status !== 'cancelled').length}</div><div class="lbl">ออเดอร์ทั้งหมด</div></div>
        `;
        app.appendChild(sum);

        buyerList.forEach(b => {
          const outstanding = Math.max(0, b.total - b.paid);
          const card = document.createElement('div');
          card.className = 'lot-card';
          card.innerHTML = `
            <div class="lot-head">
              <span>${esc(b.name)}${outstanding > 0 ? ` <span class="st st-prod">ค้าง ${fmtBaht(round2(outstanding))}</span>` : ' <span class="st st-paid">ชำระครบ</span>'}</span>
              <span class="lot-head-right">
                <span class="lot-total">${fmtBaht(round2(b.total))} บาท</span>
                <span class="lot-price">${b.orders.length} ออเดอร์ · ${Array.from(b.channels).map(esc).join(', ') || 'ไม่ระบุช่องทาง'}</span>
                ${b.phone || b.address ? `<span class="lot-buffer">${b.phone ? 'โทร ' + esc(b.phone) : ''}</span>` : ''}
              </span>
            </div>
            ${b.address ? `<div style="padding:var(--space-2) var(--space-4);font-size:12px;color:var(--sub);border-top:1px solid var(--border)">${icon('pin2',13)} ${esc(b.address)}</div>` : ''}
            <div class="table-wrap"><table>
              <thead><tr><th>เลขที่</th><th>วันที่</th><th>สถานะ</th><th>ยอด</th><th>ค้าง</th></tr></thead>
              <tbody>${b.orders.map(o => {
                const st = ORDER_STATUS[o.status] || ORDER_STATUS.new;
                const bal = Math.max(0, Number(o.total) - Number(o.paid_amount || 0));
                return `<tr>
                  <td data-label="เลขที่"><a href="${routeFor('orderView', o.id)}" style="color:var(--accent);font-weight:600;text-decoration:none">${esc(o.order_no)}</a></td>
                  <td data-label="วันที่">${new Date(o.created_at).toLocaleDateString('th-TH')}</td>
                  <td data-label="สถานะ"><span class="st ${st.cls}">${esc(st.label)}</span></td>
                  <td data-label="ยอด">${fmtBaht(round2(o.total))}</td>
                  <td data-label="ค้าง">${bal > 0 ? fmtBaht(round2(bal)) : '—'}</td>
                </tr>`;
              }).join('')}</tbody>
            </table></div>
          `;
          app.appendChild(card);
        });

      }

      const prodHead = document.createElement('h2');
      prodHead.className = 'section-title';
      prodHead.innerHTML = icon('factory', 17) + 'ชื่อที่ระบุในงานผลิต (ป้ายผ้า)';
      app.appendChild(prodHead);

      const lotNameById = {};
      lots.forEach(l => lotNameById[l.id] = l.name);

      const customerMap = {};
      function addItem(rawName, item) {
        const key = rawName && rawName.trim() ? rawName.trim() : 'ไม่ระบุชื่อ';
        if (!customerMap[key]) customerMap[key] = { name: key, items: [], categories: new Set() };
        customerMap[key].items.push(item);
        customerMap[key].categories.add(item.category);
      }

      pieces.forEach(r => {
        addItem(r.label, {
          category: PRODUCT_CATEGORIES.fabric.label,
          detail: r.width_cm + ' x ' + r.length_cm + ' ซม.',
          qty: 1,
          when: lotNameById[r.lot_id] || '',
          sortKey: lotSortKey(lotNameById[r.lot_id] || ''),
          sell: (r.sell_price === null || r.sell_price === undefined) ? null : Number(r.sell_price)
        });
      });
      orders.forEach(o => {
        const meta = PRODUCT_CATEGORIES[o.category];
        addItem(o.customer, {
          category: meta ? meta.label : o.category,
          detail: o.name,
          qty: o.quantity,
          when: o.created_at ? new Date(o.created_at).toLocaleDateString('th-TH') : '',
          sortKey: o.created_at ? new Date(o.created_at).getTime() : 0,
          sell: (o.unit_sell_price === null || o.unit_sell_price === undefined) ? null : Number(o.unit_sell_price) * o.quantity
        });
      });

      const customerList = Object.values(customerMap).sort((a, b) => b.items.length - a.items.length);

      if (customerList.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'loading';
        empty.textContent = 'ยังไม่มีข้อมูลลูกค้า';
        app.appendChild(empty);
        return;
      }

      customerList.forEach(c => {
        c.items.sort((a, b) => b.sortKey - a.sortKey);
        const anySell = c.items.some(i => i.sell !== null);
        const card = document.createElement('div');
        card.className = 'lot-card';
        const rowsHtml = c.items.map(i => `
          <tr>
            <td data-label="รายการ">${esc(i.detail)}</td>
            <td data-label="ประเภท">${esc(i.category)}</td>
            <td data-label="จำนวน">${i.qty}</td>
            <td data-label="วันที่/ล็อต">${esc(i.when || '-')}</td>
            ${anySell ? `<td data-label="ราคาขาย">${i.sell !== null ? fmtBaht(i.sell) : '-'}</td>` : ''}
          </tr>
        `).join('');
        card.innerHTML = `
          <div class="lot-head">
            <span>${esc(c.name)}</span>
            <span class="lot-head-right"><span class="lot-total">${c.items.length} รายการ</span><span class="lot-price">${Array.from(c.categories).map(esc).join(' · ')}</span></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>รายการ</th><th>ประเภท</th><th>จำนวน</th><th>วันที่/ล็อต</th>${anySell ? '<th>ราคาขาย</th>' : ''}</tr></thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>
        `;
        app.appendChild(card);
      });
    }

    async function loadProducts(category) {
      document.getElementById('statusMsg').textContent = 'กำลังโหลด...';
      const { data: orders, error } = await sb.from('product_orders')
        .select('id,category,name,quantity,unit_cost,unit_sell_price,customer,notes,paid,created_at')
        .eq('category', category).order('created_at', { ascending: false });
      if (error) throw error;
      renderProductCategory(category, orders);
      document.getElementById('statusMsg').textContent = 'อัปเดตล่าสุด: ' + new Date().toLocaleString('th-TH');
    }

    function buildProductAddPanel(category) {
      const meta = PRODUCT_CATEGORIES[category];
      const panel = document.createElement('div');
      panel.className = 'panel';
      panel.innerHTML = `
        <h2>${icon('plus', 17)}เพิ่มออเดอร์${meta ? ' ' + esc(meta.label) : ''}</h2>
        <div class="form-grid">
          <div class="field">
            <label for="oName">ชื่อ/แบบ</label>
            <input id="oName" placeholder="เช่น การ์ดแต่งงานลายดอกไม้">

            <label for="oSell">ราคาขาย/ชิ้น (บาท)</label>

          </div>
        </div>
        <button id="addOrderBtn" class="btn secondary block">+ เพิ่มออเดอร์</button>
        <div class="msg" id="orderMsg"></div>
      `;
      panel.querySelector('#addOrderBtn').addEventListener('click', async () => {
        const name = panel.querySelector('#oName').value.trim();
        const customer = panel.querySelector('#oCustomer').value.trim();
        const qty = parseInt(panel.querySelector('#oQty').value) || 1;
        const cost = parseFloat(panel.querySelector('#oCost').value);
        const sellRaw = panel.querySelector('#oSell').value;
        const sell = sellRaw === '' ? null : parseFloat(sellRaw);
        const msg = panel.querySelector('#orderMsg');
        const btn = panel.querySelector('#addOrderBtn');
        msg.textContent = ''; msg.className = 'msg';
        if (!name) { msg.textContent = 'กรอกชื่อ/แบบก่อน'; msg.className = 'msg error'; return; }
        if (isNaN(cost)) { msg.textContent = 'กรอกราคาต่อชิ้น'; msg.className = 'msg error'; return; }
        btn.disabled = true; btn.textContent = 'กำลังเพิ่ม...';
        const { error } = await sb.from('product_orders').insert({
          category, name, customer: customer || null, quantity: qty, unit_cost: cost, unit_sell_price: sell, paid: false
        });
        if (error) {
          msg.textContent = 'เพิ่มไม่สำเร็จ: ' + error.message; msg.className = 'msg error';
          btn.disabled = false; btn.textContent = '+ เพิ่มออเดอร์';
          return;
        }
        await loadProducts(category);
      });
      return panel;
    }

    function renderProductCategory(category, orders) {
      const app = document.getElementById('app');
      app.innerHTML = '';
      const catMeta = PRODUCT_CATEGORIES[category];
      app.appendChild(buildPageHead(catMeta ? catMeta.label : category, 'จัดการออเดอร์และสถานะการชำระเงิน'));

      let totalQty = 0, totalCost = 0, totalSell = 0, hasSell = false, unpaidCost = 0, unpaidCount = 0;
      orders.forEach(o => {
        const cost = Number(o.unit_cost) * o.quantity;
        totalQty += o.quantity;
        totalCost += cost;
        if (o.unit_sell_price !== null && o.unit_sell_price !== undefined) { totalSell += Number(o.unit_sell_price) * o.quantity; hasSell = true; }
        if (!o.paid) { unpaidCost += cost; unpaidCount++; }
      });
      const profit = totalSell - totalCost;

      const summary = document.createElement('div');
      summary.className = 'summary-grid';
      summary.innerHTML = `
        <div class="stat"><div class="num">${orders.length}</div><div class="lbl">ออเดอร์ทั้งหมด</div></div>
        <div class="stat"><div class="num">${fmtBaht(round2(totalCost))}</div><div class="lbl">ยอดรวม (บาท)</div></div>
        <div class="stat"><div class="num">${fmtBaht(round2(unpaidCost))}</div><div class="lbl">ยอดค้างชำระ (บาท)</div></div>
        ${hasSell
          ? `<div class="stat"><div class="num">${fmtBaht(round2(profit))}</div><div class="lbl">กำไรรวม (บาท)</div></div>`
          : `<div class="stat"><div class="num">${totalQty}</div><div class="lbl">จำนวนรวม (ชิ้น)</div></div>`}

            <span class="piece-name-text">${esc(o.name)}${o.customer ? ' — ' + esc(o.customer) : ''}</span>

              <button class="icon-btn icon-btn-edit edit-order" data-id="${o.id}" data-name="${esc(o.name)}" data-customer="${esc(o.customer || '')}" data-qty="${o.quantity}" data-cost="${o.unit_cost}" data-sell="${o.unit_sell_price ?? ''}" aria-label="แก้ไขออเดอร์" title="แก้ไข">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
              </button>
              <button class="icon-btn icon-btn-delete delete-order" data-id="${o.id}" aria-label="ลบออเดอร์" title="ลบ">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
              </button>
            </span>
          </td>
          <td data-label="จำนวน">${o.quantity}</td>
          <td data-label="ราคา">${fmtBaht(cost)}</td>
          <td data-label="ราคาขาย">${sell !== null ? fmtBaht(sell) : '-'}</td>
          <td data-label="สถานะ"><span class="paid-badge ${o.paid ? 'paid' : 'unpaid'}" data-id="${o.id}" data-paid="${o.paid}">${o.paid ? 'จ่ายแล้ว' : 'ยังไม่จ่าย'}</span></td>
        </tr>`;
      }).join('');
      listCard.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead><tr><th>รายการ</th><th>จำนวน</th><th>ราคา</th><th>ราคาขาย</th><th>สถานะ</th></tr></thead>
            <tbody>${rowsHtml || '<tr><td colspan="5" class="empty-cell">ยังไม่มีออเดอร์</td></tr>'}</tbody>
          </table>
        </div>
      `;
      app.appendChild(listCard);

      app.querySelectorAll('.paid-badge').forEach(el => {
        el.addEventListener('click', async () => {
          const id = el.dataset.id;
          const next = el.dataset.paid !== 'true';
          el.textContent = '...';
          const { error } = await sb.from('product_orders').update({ paid: next }).eq('id', id);
          if (error) alert('อัปเดตไม่สำเร็จ: ' + error.message);
          await loadProducts(category);
        });
      });

      app.querySelectorAll('.piece-name').forEach(td => {
        td.addEventListener('click', () => td.classList.toggle('active'));
      });

      app.querySelectorAll('.edit-order').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const tr = btn.closest('tr');
          const id = btn.dataset.id;
          tr.innerHTML = `
            <td colspan="5">
              <div class="edit-row">
                <input class="edit-o-name" placeholder="ชื่อ/แบบ" aria-label="ชื่อ/แบบ" value="${esc(btn.dataset.name)}">
                <input class="edit-o-customer" placeholder="ลูกค้า/งาน" aria-label="ลูกค้า/งาน" value="${esc(btn.dataset.customer)}">
                <input class="edit-o-qty" type="number" min="1" step="1" placeholder="จำนวน" aria-label="จำนวน" value="${btn.dataset.qty}">
                <input class="edit-o-cost" type="number" min="0" step="any" placeholder="ราคา/ชิ้น" aria-label="ราคาต่อชิ้น" value="${btn.dataset.cost}">
                <input class="edit-o-sell" type="number" min="0" step="any" placeholder="ราคาขาย/ชิ้น" aria-label="ราคาขายต่อชิ้น" value="${btn.dataset.sell}">
                <button class="btn btn-sm save-order">${icon('check', 15)}บันทึก</button>
                <button class="btn secondary btn-sm cancel-order">${icon('close', 15)}ยกเลิก</button>
              </div>
            </td>
          `;
          tr.querySelector('.cancel-order').addEventListener('click', () => loadProducts(category));
          tr.querySelector('.save-order').addEventListener('click', async () => {
            const name = tr.querySelector('.edit-o-name').value.trim();
            const customer = tr.querySelector('.edit-o-customer').value.trim();
            const qty = parseInt(tr.querySelector('.edit-o-qty').value) || 1;
            const cost = parseFloat(tr.querySelector('.edit-o-cost').value) || 0;
            const sellRaw = tr.querySelector('.edit-o-sell').value;
            const sell = sellRaw === '' ? null : parseFloat(sellRaw);
            if (!name) { alert('กรอกชื่อ/แบบก่อน'); return; }
            const { error } = await sb.from('product_orders').update({ name, customer: customer || null, quantity: qty, unit_cost: cost, unit_sell_price: sell }).eq('id', id);
            if (error) { alert('บันทึกไม่สำเร็จ: ' + error.message); return; }
            await loadProducts(category);
          });
        });
      });

      app.querySelectorAll('.delete-order').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (!confirm('ลบออเดอร์นี้?')) return;
          const { error } = await sb.from('product_orders').delete().eq('id', btn.dataset.id);
          if (error) { alert('ลบไม่สำเร็จ: ' + error.message); return; }
          await loadProducts(category);
        });
      });
    }

    async function loadSettings() {
      const { data, error } = await sb.from('settings').select('key,value');
      if (error) throw error;
      const s = {};
      data.forEach(r => s[r.key] = Number(r.value));
      return s;
    }

    async function loadAll() {
      document.getElementById('statusMsg').textContent = 'กำลังโหลด...';
      SETTINGS = await loadSettings();

      const { data: lots, error: e1 } = await sb.from('lots').select('id,name,lot_date,created_at');
      if (e1) throw e1;
      const { data: pieces, error: e2 } = await sb.from('pieces').select('id,lot_id,width_cm,length_cm,label,price,paid');
      if (e2) throw e2;

      lots.sort((a, b) => lotSortKey(b.name) - lotSortKey(a.name));
      render(lots, pieces);
      document.getElementById('statusMsg').textContent = 'อัปเดตล่าสุด: ' + new Date().toLocaleString('th-TH');
    }

    function render(lots, pieces) {
      if (activeTab === 'customer') activeTab = 'daily';
      const app = document.getElementById('app');
      app.innerHTML = '';
      app.appendChild(buildPageHead('ต้นทุนผลิต (ป้ายผ้า)', 'งานที่ส่งผลิตกับร้านอื่น — ล็อตงาน คำนวณผ้า และยอดที่ต้องจ่ายร้านผลิต'));

      let totalPieces = 0, grandTotalYard = 0, grandTotalPrice = 0;
      const lotBlocks = lots.map(lot => {
        const rows = pieces.filter(p => p.lot_id === lot.id);
        let lotYard = 0, lotPrice = 0;
        rows.forEach(r => {
          lotYard += calcPiece(r.width_cm, r.length_cm, SETTINGS).yardPerPiece;
          lotPrice += Number(r.price);
        });
        totalPieces += rows.length; grandTotalYard += lotYard; grandTotalPrice += lotPrice;
        return { lot, rows, lotYard: round4(lotYard), lotPrice: round2(lotPrice) };
      });
      const bufferYard = round4(grandTotalYard * SETTINGS.buffer_rate);

      // ---- tab bar ----
      const tabs = document.createElement('div');
      tabs.className = 'tabs';
      tabs.innerHTML = `
        <button class="tab-btn ${activeTab === 'daily' ? 'active' : ''}" data-tab="daily">${icon('calendar', 17)}รายวัน</button>
        <button class="tab-btn ${activeTab === 'monthly' ? 'active' : ''}" data-tab="monthly">${icon('chart', 17)}รายเดือน</button>
        <button class="tab-btn ${activeTab === 'payment' ? 'active' : ''}" data-tab="payment">${icon('wallet', 17)}การชำระเงิน</button>
      `;
      app.appendChild(tabs);

      // ---- แท็บรายวัน ----
      const dailyEl = document.createElement('div');
      dailyEl.id = 'dailyContent';

      const summary = document.createElement('div');
      summary.className = 'summary-grid';
      summary.innerHTML = `
        <div class="stat"><div class="num">${totalPieces}</div><div class="lbl">ชิ้นรวม</div></div>
        <div class="stat"><div class="num">${fmtBaht(grandTotalPrice)}</div><div class="lbl">ยอดรวม (บาท)</div></div>
        <div class="stat"><div class="num">${round4(grandTotalYard).toFixed(2)}</div><div class="lbl">ผ้าที่ต้องใช้ (หลา)</div></div>
        <div class="stat"><div class="num">${bufferYard.toFixed(2)}</div><div class="lbl">แนะนำสั่งซื้อ +5% (หลา)</div></div>
      `;
      dailyEl.appendChild(summary);

      const tKey = todayKey();
      const todayBlocks = lotBlocks.filter(b => lotSortKey(b.lot.name) === tKey);
      const todayCard = document.createElement('div');
      todayCard.className = 'today-card';
      if (todayBlocks.length === 0) {
        todayCard.innerHTML = `
          <h2>${icon('pin', 17)}วันนี้ (${esc(todayLabel())})</h2>
          <div class="today-empty">ยังไม่มีออเดอร์วันนี้</div>
        `;
      } else {
        const tPieces = todayBlocks.reduce((s, b) => s + b.rows.length, 0);
        const tYard = round4(todayBlocks.reduce((s, b) => s + b.lotYard, 0));
        const tPrice = round2(todayBlocks.reduce((s, b) => s + b.lotPrice, 0));
        const tBuffer = round4(tYard * SETTINGS.buffer_rate);
        todayCard.innerHTML = `
          <h2>${icon('pin', 17)}วันนี้ (${esc(todayLabel())})</h2>
          <div class="today-stats">
            <div class="stat"><div class="num">${tPieces}</div><div class="lbl">ชิ้นวันนี้</div></div>
            <div class="stat"><div class="num">${fmtBaht(tPrice)}</div><div class="lbl">ยอดเงินวันนี้ (บาท)</div></div>
            <div class="stat"><div class="num">${tYard.toFixed(2)}</div><div class="lbl">ผ้าที่ต้องใช้ (หลา)</div></div>
            <div class="stat"><div class="num">${tBuffer.toFixed(2)}</div><div class="lbl">แนะนำซื้อ +5% (หลา)</div></div>
          </div>
        `;
      }
      dailyEl.appendChild(todayCard);

      dailyEl.appendChild(buildAddPanel(lots));

      const searchWrap = document.createElement('div');
      searchWrap.className = 'search-wrap';
      searchWrap.innerHTML = `<span class="search-ico">${icon('search', 18)}</span>
        <input id="lotSearch" type="text" placeholder="ค้นหาล็อตหรือชื่อลูกค้า..." aria-label="ค้นหาล็อตหรือชื่อลูกค้า">`;
      dailyEl.appendChild(searchWrap);

      lotBlocks.forEach(({ lot, rows, lotYard, lotPrice }) => {
        const lotBufferYard = round4(lotYard * SETTINGS.buffer_rate);
        const hasUnpaid = rows.some(r => !r.paid);
        const card = document.createElement('div');
        card.className = 'lot-card';
        card.dataset.search = (lot.name + ' ' + rows.map(r => r.label || '').join(' ')).toLowerCase();
        const rowsHtml = rows.map(r => {
          const { yardPerPiece } = calcPiece(r.width_cm, r.length_cm, SETTINGS);
          return `<tr>
            <td class="pick-cell" data-label="เลือก">
              <input type="checkbox" class="pick" data-id="${r.id}" data-lot="${esc(lot.name)}"
                data-label-txt="${esc(r.label || '')}" data-w="${r.width_cm}" data-l="${r.length_cm}"
                data-price="${r.price}" aria-label="เลือกชิ้นงานนี้" ${selectedPieces.has(r.id) ? 'checked' : ''}>
            </td>
            <td class="piece-name" data-label="รายการ">
              <span class="piece-name-text">${esc(r.label || '-')}</span>
              <span class="piece-name-actions">
                <button class="icon-btn icon-btn-edit edit-piece" data-id="${r.id}" data-label="${esc(r.label || '')}" data-width="${r.width_cm}" data-length="${r.length_cm}" aria-label="แก้ไขชิ้นงาน" title="แก้ไข">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                </button>
                <button class="icon-btn icon-btn-delete delete-piece" data-id="${r.id}" aria-label="ลบชิ้นงาน" title="ลบ">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
                </button>
              </span>
            </td>
            <td data-label="ขนาด (ซม.)">${r.width_cm} x ${r.length_cm}</td>
            <td data-label="ราคา">${fmtBaht(r.price)}</td>
            <td data-label="ผ้า (หลา)">${yardPerPiece.toFixed(2)}</td>
            <td data-label="สถานะ"><span class="paid-badge ${r.paid ? 'paid' : 'unpaid'}" data-id="${r.id}" data-paid="${r.paid}">${r.paid ? 'จ่ายแล้ว' : 'ยังไม่จ่าย'}</span></td>
          </tr>`;
        }).join('');
        card.innerHTML = `
          <div class="lot-head">
            <span>${esc(lot.name)}</span>
            <span class="lot-head-right"><span class="lot-total">${lotYard.toFixed(2)} หลา</span><span class="lot-price">${fmtBaht(lotPrice)} บาท</span><span class="lot-buffer">+5%: ${lotBufferYard.toFixed(2)} หลา</span></span>
          </div>
          <div class="lot-actions">
            ${hasUnpaid ? `<button class="btn secondary btn-sm mark-lot-paid" data-lot="${lot.id}">${icon('check', 15)}จ่ายครบล็อตนี้</button>` : ''}
            <button class="btn secondary btn-sm toggle-gallery">${icon('image', 15)}รูปงาน</button>
            ${rows.length ? `<button class="btn secondary btn-sm pick-all">${icon('checkbox', 15)}เลือกทั้งล็อต</button>` : ''}
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th class="pick-cell"></th><th>รายการ</th><th>ขนาด (ซม.)</th><th>ราคา</th><th>ผ้า (หลา)</th><th>สถานะ</th></tr></thead>
              <tbody>${rowsHtml || '<tr><td colspan="6" class="empty-cell">ยังไม่มีชิ้นงาน</td></tr>'}</tbody>
            </table>
          </div>
        `;
        const gallery = buildGallery(lot.name);
        card.appendChild(gallery);
        const galBtn = card.querySelector('.toggle-gallery');
        let loaded = false;
        galBtn.addEventListener('click', () => {
          gallery.hidden = !gallery.hidden;
          galBtn.innerHTML = gallery.hidden ? icon('image', 15) + 'รูปงาน' : icon('eyeOff', 15) + 'ซ่อนรูป';
          if (!gallery.hidden && !loaded) { loaded = true; gallery.__load(); }
        });

        dailyEl.appendChild(card);
      });

      app.appendChild(dailyEl);

      searchWrap.querySelector('#lotSearch').addEventListener('input', (e) => {
        const q = e.target.value.trim().toLowerCase();
        dailyEl.querySelectorAll('.lot-card').forEach(card => {
          card.style.display = !q || card.dataset.search.includes(q) ? '' : 'none';
        });
      });

      // ---- แท็บรายเดือน ----
      const monthlyEl = document.createElement('div');
      monthlyEl.id = 'monthlyContent';

      const groups = {};
      const unknown = { pieces: 0, yard: 0, price: 0, lots: [] };
      lotBlocks.forEach(({ lot, rows, lotYard, lotPrice }) => {
        const ym = parseLotYM(lot.name);
        if (!ym) {
          unknown.pieces += rows.length; unknown.yard += lotYard; unknown.price += lotPrice; unknown.lots.push(lot.name);
          return;
        }
        const key = ym.yy + '-' + ym.month;
        if (!groups[key]) groups[key] = { yy: ym.yy, month: ym.month, pieces: 0, yard: 0, price: 0, lots: [] };
        groups[key].pieces += rows.length;
        groups[key].yard += lotYard;
        groups[key].price += lotPrice;
        groups[key].lots.push(lot.name);
      });
      const groupList = Object.values(groups).sort((a, b) => (b.yy * 100 + b.month) - (a.yy * 100 + a.month));

      if (groupList.length === 0 && unknown.lots.length === 0) {
        monthlyEl.innerHTML = `<div class="loading">ยังไม่มีข้อมูล</div>`;
      } else {
        groupList.forEach(g => {
          const card = document.createElement('div');
          card.className = 'month-card';
          card.innerHTML = `
            <h3>${THAI_MONTHS[g.month]} ${g.yy + 2500}</h3>
            <div class="month-sub">รวม ${g.lots.length} ล็อต: ${g.lots.map(esc).join(', ')}</div>
            <div class="month-stats">
              <div class="stat"><div class="num">${g.pieces}</div><div class="lbl">ชิ้นรวม</div></div>
              <div class="stat"><div class="num">${fmtBaht(round2(g.price))}</div><div class="lbl">ยอดเงินรวม (บาท)</div></div>
              <div class="stat"><div class="num">${round4(g.yard).toFixed(2)}</div><div class="lbl">ผ้ารวม (หลา)</div></div>
            </div>
          `;
          monthlyEl.appendChild(card);
        });
        if (unknown.lots.length) {
          const card = document.createElement('div');
          card.className = 'month-card';
          card.innerHTML = `
            <h3>ไม่ระบุเดือน</h3>
            <div class="month-sub">${unknown.lots.length} ล็อต: ${unknown.lots.map(esc).join(', ')}</div>
            <div class="month-stats">
              <div class="stat"><div class="num">${unknown.pieces}</div><div class="lbl">ชิ้นรวม</div></div>
              <div class="stat"><div class="num">${fmtBaht(round2(unknown.price))}</div><div class="lbl">ยอดเงินรวม (บาท)</div></div>
              <div class="stat"><div class="num">${round4(unknown.yard).toFixed(2)}</div><div class="lbl">ผ้ารวม (หลา)</div></div>
            </div>
          `;
          monthlyEl.appendChild(card);
        }
      }

      app.appendChild(monthlyEl);

      // ---- แท็บการชำระเงิน ----
      const paymentEl = document.createElement('div');
      paymentEl.id = 'paymentContent';

      let paidPieces = 0, paidPrice = 0, unpaidPieces = 0, unpaidPrice = 0;
      const lotOutstanding = [];
      lotBlocks.forEach(({ lot, rows }) => {
        let lp = 0, lc = 0;
        rows.forEach(r => {
          if (r.paid) { paidPieces++; paidPrice += Number(r.price); }
          else { unpaidPieces++; unpaidPrice += Number(r.price); lp += Number(r.price); lc++; }
        });
        if (lc > 0) lotOutstanding.push({ lot, count: lc, price: round2(lp) });
      });

      const paySummary = document.createElement('div');
      paySummary.className = 'summary-grid';
      paySummary.innerHTML = `
        <div class="stat"><div class="num">${fmtBaht(round2(unpaidPrice))}</div><div class="lbl">ยอดค้างชำระรวม (บาท)</div></div>
        <div class="stat"><div class="num">${unpaidPieces}</div><div class="lbl">ชิ้นที่ยังไม่จ่าย</div></div>
        <div class="stat"><div class="num">${fmtBaht(round2(paidPrice))}</div><div class="lbl">ยอดจ่ายแล้วรวม (บาท)</div></div>
        <div class="stat"><div class="num">${paidPieces}</div><div class="lbl">ชิ้นที่จ่ายแล้ว</div></div>
      `;
      paymentEl.appendChild(paySummary);

      // ค้างชำระรายเดือน
      const payMonthHeading = document.createElement('h2');
      payMonthHeading.className = 'section-title';
      payMonthHeading.innerHTML = icon('calendar', 17) + 'ค้างชำระรายเดือน';
      paymentEl.appendChild(payMonthHeading);

      const oGroups = {};
      const oUnknown = { count: 0, price: 0, lots: [] };
      lotBlocks.forEach(({ lot, rows }) => {
        const unpaidRows = rows.filter(r => !r.paid);
        if (unpaidRows.length === 0) return;
        const count = unpaidRows.length;
        const price = round2(unpaidRows.reduce((s, r) => s + Number(r.price), 0));
        const ym = parseLotYM(lot.name);
        if (!ym) { oUnknown.count += count; oUnknown.price += price; oUnknown.lots.push(lot.name); return; }
        const key = ym.yy + '-' + ym.month;
        if (!oGroups[key]) oGroups[key] = { yy: ym.yy, month: ym.month, count: 0, price: 0, lots: [] };
        oGroups[key].count += count;
        oGroups[key].price += price;
        oGroups[key].lots.push(lot.name);
      });
      const oGroupList = Object.values(oGroups).sort((a, b) => (b.yy * 100 + b.month) - (a.yy * 100 + a.month));

      if (oGroupList.length === 0 && oUnknown.lots.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'loading';
        empty.textContent = 'ไม่มียอดค้างชำระ';
        paymentEl.appendChild(empty);
      } else {
        oGroupList.forEach(g => {
          const card = document.createElement('div');
          card.className = 'month-card';
          card.innerHTML = `
            <h3>${THAI_MONTHS[g.month]} ${g.yy + 2500}</h3>
            <div class="month-sub">${g.lots.length} ล็อตที่ค้าง: ${g.lots.map(esc).join(', ')}</div>
            <div class="month-stats stats-2">
              <div class="stat"><div class="num">${g.count}</div><div class="lbl">ชิ้นค้าง</div></div>
              <div class="stat"><div class="num">${fmtBaht(round2(g.price))}</div><div class="lbl">ยอดค้าง (บาท)</div></div>
            </div>
          `;
          paymentEl.appendChild(card);
        });
        if (oUnknown.lots.length) {
          const card = document.createElement('div');
          card.className = 'month-card';
          card.innerHTML = `
            <h3>ไม่ระบุเดือน</h3>
            <div class="month-sub">${oUnknown.lots.length} ล็อตที่ค้าง: ${oUnknown.lots.map(esc).join(', ')}</div>
            <div class="month-stats stats-2">
              <div class="stat"><div class="num">${oUnknown.count}</div><div class="lbl">ชิ้นค้าง</div></div>
              <div class="stat"><div class="num">${fmtBaht(round2(oUnknown.price))}</div><div class="lbl">ยอดค้าง (บาท)</div></div>
            </div>
          `;
          paymentEl.appendChild(card);
        }
      }

      // ค้างชำระรายล็อต
      const payLotHeading = document.createElement('h2');
      payLotHeading.className = 'section-title';
      payLotHeading.innerHTML = icon('box', 17) + 'ค้างชำระรายล็อต';
      paymentEl.appendChild(payLotHeading);

      if (lotOutstanding.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'loading';
        empty.textContent = 'ทุกล็อตจ่ายครบแล้ว';
        paymentEl.appendChild(empty);
      } else {
        lotOutstanding.forEach(({ lot, count, price }) => {
          const row = document.createElement('div');
          row.className = 'pay-row';
          row.innerHTML = `
            <span class="pay-row-name">${esc(lot.name)}</span>
            <span class="pay-row-right"><span class="pay-row-count">${count} ชิ้น</span><span class="pay-row-price">${fmtBaht(price)} บาท</span><button class="btn secondary btn-sm mark-lot-paid" data-lot="${lot.id}">${icon('check', 15)}จ่ายครบ</button></span>
          `;
          paymentEl.appendChild(row);
        });
      }

      // ประวัติที่จ่ายแล้ว
      const payHistHeading = document.createElement('h2');
      payHistHeading.className = 'section-title';
      payHistHeading.innerHTML = icon('receipt', 17) + 'ประวัติที่จ่ายแล้ว';
      paymentEl.appendChild(payHistHeading);

      const paidRows = [];
      lotBlocks.forEach(({ lot, rows }) => {
        rows.forEach(r => { if (r.paid) paidRows.push({ lot, r }); });
      });
      paidRows.sort((a, b) => lotSortKey(b.lot.name) - lotSortKey(a.lot.name));

      const histCard = document.createElement('div');
      histCard.className = 'lot-card';
      if (paidRows.length === 0) {
        histCard.innerHTML = `<div class="loading">ยังไม่มีรายการที่จ่ายแล้ว</div>`;
      } else {
        const histRowsHtml = paidRows.map(({ lot, r }) => {
          const { yardPerPiece } = calcPiece(r.width_cm, r.length_cm, SETTINGS);
          return `<tr>
            <td data-label="ล็อต / รายการ">${esc(lot.name)}${r.label ? ' — ' + esc(r.label) : ''}</td>
            <td data-label="ขนาด (ซม.)">${r.width_cm} x ${r.length_cm}</td>
            <td data-label="ราคา">${fmtBaht(r.price)}</td>
            <td data-label="ผ้า (หลา)">${yardPerPiece.toFixed(2)}</td>
            <td data-label="สถานะ"><span class="paid-badge paid" data-id="${r.id}" data-paid="true">จ่ายแล้ว</span></td>
          </tr>`;
        }).join('');
        histCard.innerHTML = `
          <div class="table-wrap">
            <table>
              <thead><tr><th>ล็อต / รายการ</th><th>ขนาด (ซม.)</th><th>ราคา</th><th>ผ้า (หลา)</th><th>สถานะ</th></tr></thead>
              <tbody>${histRowsHtml}</tbody>
            </table>
          </div>
        `;
      }
      paymentEl.appendChild(histCard);

      app.appendChild(paymentEl);

      dailyEl.style.display = activeTab === 'daily' ? '' : 'none';
      monthlyEl.style.display = activeTab === 'monthly' ? '' : 'none';
      paymentEl.style.display = activeTab === 'payment' ? '' : 'none';

      tabs.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeTab = btn.dataset.tab;
          tabs.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
          dailyEl.style.display = activeTab === 'daily' ? '' : 'none';
          monthlyEl.style.display = activeTab === 'monthly' ? '' : 'none';
          paymentEl.style.display = activeTab === 'payment' ? '' : 'none';
        });
      });

      app.querySelectorAll('.paid-badge').forEach(el => {
        el.addEventListener('click', async () => {
          const id = el.dataset.id;
          const next = el.dataset.paid !== 'true';
          el.textContent = '...';
          const { error } = await sb.from('pieces').update({ paid: next }).eq('id', id);
          if (error) { alert('อัปเดตไม่สำเร็จ: ' + error.message); }
          await loadAll();
        });
      });

      app.querySelectorAll('.edit-piece').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const tr = btn.closest('tr');
          const id = btn.dataset.id;
          const label = btn.dataset.label;
          const width = btn.dataset.width;
          const length = btn.dataset.length;
          tr.innerHTML = `
            <td colspan="6">
              <div class="edit-row">
                <input class="edit-label" placeholder="ชื่อ/รายละเอียด" aria-label="ชื่อ/รายละเอียด" value="${esc(label)}">
                <input class="edit-width" type="number" min="0" step="any" value="${width}" placeholder="กว้าง" aria-label="กว้าง (ซม.)">
                <input class="edit-length" type="number" min="0" step="any" value="${length}" placeholder="ยาว" aria-label="ยาว (ซม.)">
                <button class="btn btn-sm save-piece">${icon('check', 15)}บันทึก</button>
                <button class="btn secondary btn-sm cancel-edit">${icon('close', 15)}ยกเลิก</button>
              </div>
            </td>
          `;
          tr.querySelector('.cancel-edit').addEventListener('click', () => loadAll());
          tr.querySelector('.save-piece').addEventListener('click', async () => {
            const newLabel = tr.querySelector('.edit-label').value.trim();
            const newWidth = parseFloat(tr.querySelector('.edit-width').value);
            const newLength = parseFloat(tr.querySelector('.edit-length').value);
            if (!newWidth || !newLength) { alert('กรอกกว้างและยาวให้ครบ'); return; }
            const newPrice = Math.round(newWidth * newLength * SETTINGS.price_rate);
            const { error } = await sb.from('pieces').update({ label: newLabel || null, width_cm: newWidth, length_cm: newLength, price: newPrice }).eq('id', id);
            if (error) { alert('บันทึกไม่สำเร็จ: ' + error.message); return; }
            await loadAll();
          });
        });
      });

      app.querySelectorAll('.delete-piece').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (!confirm('ลบชิ้นงานนี้?')) return;
          const id = btn.dataset.id;
          const { error } = await sb.from('pieces').delete().eq('id', id);
          if (error) { alert('ลบไม่สำเร็จ: ' + error.message); return; }
          await loadAll();
        });
      });

      app.querySelectorAll('.piece-name').forEach(td => {
        td.addEventListener('click', () => {
          td.classList.toggle('active');
        });
      });

      app.querySelectorAll('.pick').forEach(cb => {
        cb.addEventListener('change', () => {
          const id = cb.dataset.id;
          if (cb.checked) {
            selectedPieces.set(id, {
              id, lotName: cb.dataset.lot, label: cb.dataset.labelTxt,
              width_cm: Number(cb.dataset.w), length_cm: Number(cb.dataset.l),
              price: Number(cb.dataset.price),
            });
          } else {
            selectedPieces.delete(id);
          }
          renderSelBar();
        });
      });

      app.querySelectorAll('.pick-all').forEach(btn => {
        btn.addEventListener('click', () => {
          const card = btn.closest('.lot-card');
          const boxes = [...card.querySelectorAll('.pick')];
          const allOn = boxes.every(b => b.checked);
          boxes.forEach(b => {
            b.checked = !allOn;
            b.dispatchEvent(new Event('change'));
          });
          btn.innerHTML = allOn ? icon('checkbox', 15) + 'เลือกทั้งล็อต' : icon('square', 15) + 'ยกเลิกที่เลือก';
        });
      });

      renderSelBar();

      app.querySelectorAll('.mark-lot-paid').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('มาร์คทุกชิ้นในล็อตนี้ว่าจ่ายแล้ว?')) return;
          const lotId = btn.dataset.lot;
          btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
          const { error } = await sb.from('pieces').update({ paid: true }).eq('lot_id', lotId);
          if (error) { alert('อัปเดตไม่สำเร็จ: ' + error.message); btn.disabled = false; return; }
          await loadAll();
        });
      });
    }

    function buildAddPanel(lots) {
      const frag = document.createDocumentFragment();

      if (lastSelectedLotId === null && lots.length) lastSelectedLotId = lots[0].id;

      // ---- panel 1: เพิ่มล็อตใหม่ ----
      const lotPanel = document.createElement('div');
      lotPanel.className = 'panel';
      lotPanel.innerHTML = `
        <h2>${icon('plus', 17)}เพิ่มล็อตใหม่</h2>
        <div class="field-row">
          <div class="field">
            <label for="newLotName">ชื่อล็อต</label>
            <input id="newLotName" placeholder="เช่น 9/8/69">
          </div>
          <button id="addLotBtn" class="btn">+ เพิ่มล็อต</button>
        </div>
        <div class="msg" id="lotMsg"></div>
      `;
      const lotNameInput = lotPanel.querySelector('#newLotName');
      const addLotBtn = lotPanel.querySelector('#addLotBtn');
      const lotMsg = lotPanel.querySelector('#lotMsg');
      async function submitLot() {
        const name = lotNameInput.value.trim();
        lotMsg.textContent = ''; lotMsg.className = 'msg';
        if (!name) { lotMsg.textContent = 'กรอกชื่อล็อตก่อน'; lotMsg.className = 'msg error'; return; }
        addLotBtn.disabled = true; addLotBtn.textContent = 'กำลังเพิ่ม...';
        const { error } = await sb.from('lots').insert({ name });
        if (error) {
          lotMsg.textContent = 'เพิ่มล็อตไม่สำเร็จ: ' + error.message; lotMsg.className = 'msg error';
          addLotBtn.disabled = false; addLotBtn.textContent = '+ เพิ่มล็อต';
          return;
        }
        await loadAll();
      }
      addLotBtn.addEventListener('click', submitLot);
      lotNameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitLot(); });

      // ---- panel 2: เพิ่มชิ้นงาน ----
      const piecePanel = document.createElement('div');
      piecePanel.className = 'panel';
      const lotOptions = lots.map(l => `<option value="${l.id}" ${l.id === lastSelectedLotId ? 'selected' : ''}>${esc(l.name)}</option>`).join('');
      piecePanel.innerHTML = `
        <h2>${icon('thread', 17)}เพิ่มชิ้นงาน</h2>
        <div class="field" style="margin-bottom:var(--space-3)">
          <label for="pieceLot">เลือกล็อต</label>
          <select id="pieceLot">${lotOptions || '<option value="">-- ยังไม่มีล็อต --</option>'}</select>
        </div>
        <div class="form-grid">
          <div class="field">
            <label for="pieceLabel">ชื่อ/รายละเอียด</label>
            <input id="pieceLabel" placeholder="ไม่บังคับ">
          </div>
          <div class="field">
            <label for="pieceWidth">กว้าง (ซม.)</label>
            <input id="pieceWidth" type="number" min="0" placeholder="0" inputmode="decimal">
          </div>
          <div class="field">
            <label for="pieceLength">ยาว (ซม.)</label>
            <input id="pieceLength" type="number" min="0" placeholder="0" inputmode="decimal">
          </div>
          <div class="field">
            <label for="pieceQty">จำนวน</label>
            <input id="pieceQty" type="number" min="1" value="1" inputmode="numeric">
          </div>
        </div>
        <button id="addPieceBtn" class="btn secondary block">+ เพิ่มชิ้นงาน</button>
        <div class="msg" id="pieceMsg"></div>
        <div class="hint">ราคาต่อชิ้นคำนวณอัตโนมัติ = กว้าง x ยาว x ${SETTINGS.price_rate} บาท/ตร.ซม.</div>
      `;
      piecePanel.querySelector('#pieceLot').addEventListener('change', (e) => {
        lastSelectedLotId = e.target.value;
      });
      piecePanel.querySelector('#addPieceBtn').addEventListener('click', async () => {
        const lotId = piecePanel.querySelector('#pieceLot').value;
        const label = piecePanel.querySelector('#pieceLabel').value.trim();
        const width = parseFloat(piecePanel.querySelector('#pieceWidth').value);
        const length = parseFloat(piecePanel.querySelector('#pieceLength').value);
        const qty = parseInt(piecePanel.querySelector('#pieceQty').value) || 1;
        const msg = piecePanel.querySelector('#pieceMsg');
        const btn = piecePanel.querySelector('#addPieceBtn');
        msg.textContent = ''; msg.className = 'msg';
        if (!lotId) { msg.textContent = 'ยังไม่มีล็อต กรุณาเพิ่มล็อตก่อน'; msg.className = 'msg error'; return; }
        if (!width || !length) { msg.textContent = 'กรอกกว้างและยาวให้ครบ'; msg.className = 'msg error'; return; }
        btn.disabled = true; btn.textContent = 'กำลังเพิ่ม...';
        lastSelectedLotId = lotId;
        const price = Math.round(width * length * SETTINGS.price_rate);
        const rowsToInsert = Array.from({ length: qty }, () => ({
          lot_id: lotId, width_cm: width, length_cm: length, label: label || null, price, paid: false
        }));
        const { error } = await sb.from('pieces').insert(rowsToInsert);
        if (error) {
          msg.textContent = 'เพิ่มชิ้นงานไม่สำเร็จ: ' + error.message; msg.className = 'msg error';
          btn.disabled = false; btn.textContent = '+ เพิ่มชิ้นงาน';
          return;
        }
        await loadAll();
      });

      frag.appendChild(lotPanel);
      frag.appendChild(piecePanel);
      return frag;
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    initTheme();
    applyHash();
    boot();
  </script>
</body>
</html>
