<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haifa Design</title>
<!-- ติดตั้งเป็นแอปบนหน้าจอมือถือได้ (Add to Home Screen) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Haifa Design">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- ล็อกเวอร์ชันไว้ชัดเจน กันวันหน้าไลบรารีออกเวอร์ชันใหม่แล้วโค้ดพัง -->
<script src="https://unpkg.com/@supabase/supabase-js@2.112.2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  // ถ้า CDN หลักล่ม ให้ลองโหลดจาก CDN สำรอง (jsdelivr) ก่อนเริ่มระบบ
  window.__libsReady = (function () {
    function load(src) {
      return new Promise(function (ok, no) {
        var s = document.createElement('script');
        s.src = src; s.onload = ok; s.onerror = no;
        document.head.appendChild(s);
      });
    }
    async function tryLoad(check, src) {
      if (window[check]) return;
      try { await load(src); } catch (e) { /* สำรองก็ล่ม -> ปล่อยให้ระบบจัดการต่อ */ }
    }
    return (async function () {
      await tryLoad('supabase',   'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.js');
      await tryLoad('Chart',      'https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js');
      await tryLoad('html2canvas','https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js');
    })();
  })();
</script>
<style>
  :root {
    --bg: #f7f5f2; --card: #ffffff; --text: #1f2430; --sub: #586273;
    --accent: #3454d1; --accent-soft: #eef1fd; --border: #e6e3dd;
    --warn-bg: #fff6ed; --warn-border: #f5b77e; --warn-text: #92400e;
    --ok-bg: #eefbf3; --ok-text: #067647;
    --err-bg: #fdecea; --err-text: #b42318;
    --soft: #f2f4f7;
    --radius: 14px;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
    --space-5: 20px; --space-6: 24px; --space-8: 32px;
  }
  html[data-theme="dark"] {
    --bg: #12151c; --card: #191d26; --text: #e8eaf0; --sub: #9aa3b4;
    --accent: #6b87ff; --accent-soft: #232a3d; --border: #2a303c;
    --warn-bg: #3a2a17; --warn-border: #7a5320; --warn-text: #f0b866;
    --ok-bg: #16301f; --ok-text: #5fd497;
    --err-bg: #3a1a16; --err-text: #ff8b7d;
    --soft: #232833;
  }
  html[data-theme="dark"] .switch-knob { background: #e8eaf0; }
  html[data-theme="dark"] .lot-actions { background: var(--accent-soft); }
  html[data-theme="dark"] .icon-btn { background: var(--card); }
  html[data-theme="dark"] input:where(:not([type="checkbox"]):not([type="radio"])),
  html[data-theme="dark"] select,
  html[data-theme="dark"] textarea { background: var(--bg); color: var(--text); }
  html[data-theme="dark"] select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%239aa3b4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>"); }
  * { box-sizing: border-box; }

  /* ===== ช่องกรอกทุกช่องในระบบใช้หน้าตาเดียวกัน =====
     เดิมสไตล์ผูกกับ .field เท่านั้น ช่องที่วางลอยๆ (เช่น ช่องจำนวนในสต็อก) เลยเป็นสไตล์ดิบของเบราว์เซอร์ */
  input:where(:not([type="checkbox"]):not([type="radio"]):not([type="file"])),
  select, textarea {
    font-family: inherit; font-size: 16px; color: var(--text);
    padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--card); min-height: 44px; width: 100%;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input:where(:not([type="checkbox"]):not([type="radio"]):not([type="file"])):focus,
  select:focus, textarea:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
  }
  input::placeholder, textarea::placeholder { color: var(--sub); opacity: .75; }
  input:disabled, select:disabled { background: var(--soft); color: var(--sub); cursor: not-allowed; }
  select { appearance: none; -webkit-appearance: none; padding-right: 34px; cursor: pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
    background-repeat: no-repeat; background-position: right 11px center; }
  /* ปุ่มลูกศรขึ้น-ลงของช่องตัวเลขทำให้ช่องแคบและกดพลาดบ่อย ตัดออกทั้งระบบ */
  input[type="number"] { -moz-appearance: textfield; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="checkbox"], input[type="radio"] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }

  /* ช่องเล็กที่วางแทรกในบรรทัด (จุดเตือน, จำนวนในตาราง) */
  .inline-input { width: auto; max-width: 120px; min-height: 40px; padding: 8px 10px; font-size: 15px; }
  html {
    -webkit-text-size-adjust: 100%;   /* iOS Safari ขยายตัวหนังสือเองตอนตะแคงจอ ถ้าไม่ล็อกไว้ */
    scroll-padding-bottom: 120px;     /* กดช่องกรอกแล้วเลื่อนขึ้นเหนือแถบเมนูล่าง */
  }
  body {
    margin: 0; font-family: 'Prompt', -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
    background: var(--bg); color: var(--text);
    padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }
  /* iOS ขึ้นกล่องเทาทับตอนแตะ — ปิดทิ้ง ใช้ :active ของเราเองแทน */
  a, button, .chip, .tab-btn, .job-card, .hero-stat, .att-btn, .nav-item {
    -webkit-tap-highlight-color: transparent;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--card);
    border-bottom: 1px solid var(--border); padding: var(--space-4) var(--space-5);
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
    margin-left: 220px;
  }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  /* ปุ่มกลับหน้าแรก — โผล่เฉพาะจอมือถือ จอคอมมีเมนูข้างอยู่แล้ว */
  .home-back { display: none; }
  .home-back[hidden] { display: none !important; }
  .ic { display: block; flex-shrink: 0; }
  header .meta { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .container { padding: var(--space-5) var(--space-5) 0; max-width: 1100px; margin: 0 auto; margin-left: 220px; }
  @media (max-width: 900px) {
    header { margin-left: 0; padding: var(--space-3) var(--space-4); }
    .container { margin-left: auto; padding: var(--space-4) var(--space-4) 0; max-width: 720px; }
  }

  .tabs { display: flex; gap: var(--space-2); margin-bottom: var(--space-4); }
  .tab-btn {
    flex: 1; font-family: inherit; font-size: 14px; font-weight: 600; padding: 10px 16px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--card); color: var(--sub);
    cursor: pointer; min-height: 44px; transition: background .15s ease, color .15s ease;
  }
  .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-2); margin-bottom: var(--space-4); }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-4) var(--space-2); text-align: center; }
  .stat .num { font-size: 20px; font-weight: 700; }
  .stat .lbl { font-size: 11px; color: var(--sub); margin-top: 2px; }

  .today-card { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: var(--radius); padding: var(--space-4); margin-bottom: var(--space-4); }
  .today-card h2 { margin: 0 0 var(--space-3); font-size: 15px; font-weight: 600; color: var(--accent); }
  .today-empty { font-size: 13px; color: var(--sub); }
  .today-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-2); }
  .today-stats .stat { background: #fff; }

  .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-4); margin-bottom: var(--space-3); }
  .panel h2 { margin: 0 0 var(--space-3); font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px; }

  .field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 110px; }
  .field label { font-size: 12px; color: var(--sub); font-weight: 500; }
  .field-row { display: flex; gap: var(--space-3); align-items: flex-end; flex-wrap: wrap; }
  /* ช่องที่วางตรงๆ ใน field-row (ไม่ได้ห่อด้วย .field) ให้ยืดเต็มที่ว่าง ไม่หดจนพิมพ์ลำบาก */
  .field-row > input:not(.inline-input), .field-row > select:not(.inline-input) { flex: 1 1 170px; min-width: 140px; }
  .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-2); margin-bottom: var(--space-3); }

  .btn {
    font-family: inherit; font-size: 14px; font-weight: 600; padding: 12px 20px; border: none;
    border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; min-height: 44px;
    white-space: nowrap; transition: background .15s ease, transform .1s ease;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  }
  .tab-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
  .panel h2 .ic, .section-title .ic, .today-card h2 .ic { flex-shrink: 0; }
  .btn:hover { background: #2a44b8; }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .6; cursor: default; transform: none; }
  .btn.secondary { background: var(--accent-soft); color: var(--accent); }
  .btn.secondary:hover { background: #dfe4fb; }
  .btn.block { width: 100%; }

  .msg { font-size: 13px; margin-top: var(--space-2); min-height: 16px; }
  .msg.error { color: var(--err-text); }

  .hint { font-size: 12px; color: var(--sub); margin-top: var(--space-2); }

  @media (max-width: 640px) {
    .field-row { flex-direction: column; align-items: stretch; }
    .field-row .btn { width: 100%; }

    .form-grid { grid-template-columns: repeat(2, 1fr); }

    .tabs { display: grid; grid-template-columns: repeat(2, 1fr); }

    .pay-row { flex-wrap: wrap; row-gap: var(--space-2); }
    .pay-row-right { flex-wrap: wrap; row-gap: var(--space-2); }

    /* ตาราง -> การ์ดรายการ บนจอมือถือ กันเลื่อนแนวนอน อ่านง่ายขึ้น */
    .table-wrap table, .table-wrap tbody, .table-wrap tr, .table-wrap td {
      display: block; width: 100%;
    }
    .table-wrap thead { display: none; }
    .table-wrap tr { border-top: 1px solid var(--border); padding: var(--space-3) var(--space-4); }
    .table-wrap tr:first-child { border-top: none; }
    .table-wrap td {
      display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
      padding: 5px 0; border-top: none; text-align: right;
    }
    .table-wrap td::before {
      content: attr(data-label); font-size: 11px; font-weight: 500; color: var(--sub);
      text-align: left; flex-shrink: 0;
    }
    .table-wrap td.empty-cell { display: block; text-align: center; }
    .table-wrap td.empty-cell::before { display: none; }
    .table-wrap tr.cat-row { padding: 0; border-top: none; }
    .table-wrap tr.cat-row td { display: block; text-align: left; }
    .table-wrap tr.cat-row td::before { display: none; }
  }

  .lot-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: var(--space-3); overflow: hidden; }
  .lot-head { padding: var(--space-3) var(--space-4); font-weight: 600; font-size: 14px; background: var(--accent-soft); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: var(--space-2); }
  .lot-head .lot-total { color: var(--accent); font-variant-numeric: tabular-nums; }
  .lot-head-right { text-align: right; }
  .lot-head .lot-price { display: block; font-size: 11px; font-weight: 400; color: var(--sub); margin-top: 1px; }
  .lot-head .lot-buffer { display: block; font-size: 11px; font-weight: 400; color: var(--accent); margin-top: 1px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: var(--space-2) var(--space-3); text-align: right; border-top: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; font-variant-numeric: normal; }
  th { color: var(--sub); font-weight: 500; font-size: 11px; }
  .paid-badge {
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    padding: 0 16px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer;
    min-height: 44px; border: none; font-family: inherit; transition: filter .15s ease;
  }
  .paid-badge:hover { filter: brightness(.96); }
  .paid-badge:active { transform: scale(.97); }
  .paid-badge:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .paid-badge.paid { background: var(--ok-bg); color: var(--ok-text); }
  .paid-badge.unpaid { background: var(--warn-bg); color: var(--warn-text); }

  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .empty-cell { text-align: center; color: var(--sub); }

  .month-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-4); margin-bottom: var(--space-3); }
  .month-card h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .month-card .month-sub { font-size: 12px; color: var(--sub); margin-top: 2px; margin-bottom: var(--space-3); }
  .month-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); }
  .month-stats .stat { padding: var(--space-3) var(--space-2); }
  .month-stats.stats-2 { grid-template-columns: repeat(2, 1fr); }

  .section-title { font-size: 15px; font-weight: 600; margin: var(--space-5) 0 var(--space-3); display: flex; align-items: center; gap: 6px; }

  .pay-row { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-3) var(--space-4); margin-bottom: var(--space-2); display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; }
  .pay-row-right { display: flex; gap: var(--space-3); align-items: baseline; }
  .pay-row-count { font-size: 12px; font-weight: 400; color: var(--sub); }
  .pay-row-price { color: var(--accent); font-variant-numeric: tabular-nums; }

  .piece-name { cursor: pointer; }
  .piece-name:hover .piece-name-text { color: var(--accent); }
  .piece-name-actions { display: none; gap: 6px; }
  .piece-name.active .piece-name-text { display: none; }
  .piece-name.active .piece-name-actions { display: flex; }
  .tag-redo { margin-left: 6px; font-size: 10.5px; }
  .vendor-tag { display: inline-flex; align-items: center; gap: 4px; margin-left: 6px; font-size: 11px;
                color: var(--sub); background: var(--soft); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
  .badge-pair { display: inline-flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  /* จอคอม: โชว์ปุ่มแก้ไข/งานเสีย/ลบ ไว้ข้างชื่อเลย ไม่ต้องกดชื่อก่อน */
  @media (min-width: 900px) {
    .piece-name { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); cursor: default; }
    .piece-name .piece-name-text { display: inline !important; }
    .piece-name .piece-name-actions { display: flex !important; opacity: .25; transition: opacity .15s ease; }
    tr:hover .piece-name .piece-name-actions { opacity: 1; }
    .piece-name .icon-btn { width: 34px; height: 34px; }
  }
  /* ความคืบหน้าของล็อต */
  .lot-progress { padding: 10px var(--space-4) 0; }
  .lp-line { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-bottom: 8px; }
  .lp-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600;
            color: var(--sub); background: var(--soft); border-radius: 999px; padding: 4px 10px; }
  .lp-tag.done { background: var(--ok-bg); color: var(--ok-text); }
  .lp-bar { height: 5px; border-radius: 999px; background: var(--soft); overflow: hidden; }
  .lp-bar > div { height: 100%; background: #22a06b; border-radius: 999px; transition: width .3s ease; }
  .lot-more-box { display: contents; }
  .lot-more-box[hidden] { display: none; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; padding: 0; flex-shrink: 0;
    border: 1px solid var(--border); border-radius: 10px; background: #fff; color: var(--sub);
    cursor: pointer; transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn:active { transform: scale(.96); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .icon-btn-edit:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .icon-btn-delete:hover { background: #fdecea; color: var(--err-text); border-color: var(--err-text); }

  .edit-row { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; padding: var(--space-2) 0; }
  .edit-row input { flex: 1; min-width: 90px; }
  .edit-row .btn { padding: 0 14px; font-size: 12px; min-height: 44px; }

  .lot-actions { padding: var(--space-2) var(--space-4); border-top: 1px solid var(--border); background: #fafafa; display: flex; gap: var(--space-2); flex-wrap: wrap; }

  .gallery { padding: var(--space-3) var(--space-4) var(--space-4); border-top: 1px solid var(--border); }
  .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: var(--space-2); }
  .gallery-item { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: var(--bg); }
  .gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gallery-item a { display: block; width: 100%; height: 100%; }
  .gallery-fallback {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    width: 100%; height: 100%; padding: var(--space-2); text-align: center; font-size: 18px;
    background: var(--accent-soft); color: var(--accent);
  }
  .gallery-fallback .gf-name {
    font-size: 10px; font-weight: 600; color: var(--text); line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all;
  }
  .gallery-fallback .gf-hint { font-size: 9px; color: var(--sub); }
  .gallery-empty { font-size: 12px; color: var(--sub); padding: var(--space-3) 0; }
  .gallery-bar { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-3); }
  .gallery-msg { font-size: 12px; color: var(--sub); }
  .gallery-msg.error { color: var(--err-text); }
  html[data-theme="dark"] .lot-actions { background: var(--accent-soft); }
  .btn-sm { font-size: 12px; padding: 0 14px; min-height: 44px; white-space: nowrap; }

  .search-wrap { margin-bottom: var(--space-3); position: relative; }
  /* ยึดกับกึ่งกลางช่องกรอก (สูง ~49px) ไม่ใช่กึ่งกลางกล่องรวมที่มีบรรทัดนับผลลัพธ์ด้วย */
  .search-ico { position: absolute; left: 14px; top: 25px; transform: translateY(-50%); color: var(--sub); pointer-events: none; display: flex; }
  .search-wrap input { padding-left: 42px; }

  .loading { text-align: center; color: var(--sub); padding: var(--space-6); font-size: 13px; }

  /* ===== เลือกรายการ + ใบเสร็จ ===== */
  .pick { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; margin: 0; }
  td.pick-cell, th.pick-cell { width: 40px; text-align: center; }

  .selbar {
    position: fixed; left: 220px; right: 0; bottom: 0; z-index: 40;
    background: var(--card); border-top: 1px solid var(--border);
    padding: var(--space-3) var(--space-5); display: flex; align-items: center;
    justify-content: space-between; gap: var(--space-3); flex-wrap: wrap;
    box-shadow: 0 -4px 16px rgba(0,0,0,.08);
  }
  .selbar-info { font-size: 14px; font-weight: 600; }
  .selbar-info .sb-sum { color: var(--accent); }
  .selbar-actions { display: flex; gap: var(--space-2); flex-wrap: wrap; }

  .receipt-paper {
    background: #fff; color: #1f2430; border: 1px solid var(--border); border-radius: var(--radius);
    padding: var(--space-6); max-width: 620px; margin: 0 auto;
  }
  .receipt-head { display: flex; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; border-bottom: 2px solid #1f2430; padding-bottom: var(--space-3); margin-bottom: var(--space-4); }
  .receipt-shop { font-size: 18px; font-weight: 700; }
  .receipt-shop-sub { font-size: 11px; color: #6b7280; letter-spacing: .12em; text-transform: uppercase; margin-top: 2px; }
  .receipt-meta { text-align: right; font-size: 12px; color: #6b7280; }
  .receipt-meta .r-no { font-size: 14px; font-weight: 700; color: #1f2430; }
  .receipt-to { font-size: 13px; margin-bottom: var(--space-4); }
  .receipt-to .r-label { font-size: 11px; color: #6b7280; }
  .receipt-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .receipt-table th { text-align: right; font-size: 11px; color: #6b7280; border-bottom: 1px solid #e6e3dd; padding: 6px 8px; }
  .receipt-table th:first-child, .receipt-table td:first-child { text-align: left; }
  .receipt-table td { text-align: right; padding: 8px; border-bottom: 1px solid #f0eeea; font-variant-numeric: tabular-nums; }
  .receipt-total { display: flex; justify-content: flex-end; gap: var(--space-5); margin-top: var(--space-4); padding-top: var(--space-3); border-top: 2px solid #1f2430; font-size: 16px; font-weight: 700; }
  .receipt-note { margin-top: var(--space-4); font-size: 12px; color: #6b7280; white-space: pre-wrap; }
  .receipt-foot { margin-top: var(--space-6); font-size: 11px; color: #9aa3b4; text-align: center; }

  .search-count { margin-top: 6px; min-height: 16px; }

  .temp-pass { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px;
               background: var(--accent-soft); color: var(--accent); padding: 3px 8px; border-radius: 6px; }

  /* หัวข้อขั้นตอนในฟอร์ม */
  .step-head { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700;
               margin-bottom: var(--space-3); }
  .step-no { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px;
             border-radius: 8px; background: var(--accent); color: #fff; font-size: 12.5px; }
  .cust-results { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: var(--space-3); }
  .cust-hit { display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left; padding: 10px 12px;
              background: var(--card); border: none; border-bottom: 1px solid var(--border); cursor: pointer; font-family: inherit; }
  .cust-hit:last-child { border-bottom: none; }
  .cust-hit:hover { background: var(--accent-soft); }
  .ch-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .ch-sub { font-size: 12px; color: var(--sub); }
  .cust-none { padding: 12px; font-size: 13px; color: var(--sub); }

  .gallery-item { position: relative; }
  .cover-btn { position: absolute; left: 6px; right: 6px; bottom: 6px; font-family: inherit; font-size: 11.5px;
               font-weight: 600; padding: 5px 6px; border-radius: 8px; border: none; cursor: pointer;
               background: rgba(31,36,48,.82); color: #fff; display: inline-flex; align-items: center;
               justify-content: center; gap: 4px; }
  .cover-btn:hover { background: rgba(31,36,48,.95); }
  .cover-btn.is-cover { background: var(--accent); }

  /* ===== My Job — การ์ดใบงาน ===== */
  .job-hero { background: #1f2430; color: #fff; border-radius: 16px; padding: 16px 18px; margin-bottom: var(--space-3); }
  .job-hero-top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
  .hero-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .hero-stat { background: rgba(255,255,255,.10); border: none; border-radius: 12px; padding: 10px 8px;
               color: #fff; font-family: inherit; cursor: pointer; text-align: center; }
  .hero-stat:hover { background: rgba(255,255,255,.18); }
  .hs-num { display: block; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .hs-num.warn { color: #ff453a; }
  .hs-lbl { display: block; font-size: 11.5px; opacity: .8; margin-top: 2px; }
  .quick-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
               background: var(--accent-soft); color: var(--accent); border-radius: var(--radius);
               padding: 10px 14px; margin-bottom: var(--space-3); font-size: 13px; font-weight: 600; }
  .quick-bar span { display: inline-flex; align-items: center; gap: 6px; }
  html[data-theme="dark"] .job-hero { background: #11141c; border: 1px solid var(--border); }
  .job-hero-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .job-hero-ico { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px;
                  border-radius: 12px; background: rgba(255,255,255,.12); flex-shrink: 0; }
  .job-hero-title { font-size: 18px; font-weight: 700; }
  .job-hero-sub { font-size: 12.5px; opacity: .75; margin-top: 2px; }
  .job-hero-btn { background: #fff !important; color: #1f2430 !important; border-color: #fff !important; flex-shrink: 0; }
  .job-searchrow { display: flex; gap: var(--space-2); align-items: stretch; margin-bottom: var(--space-3); }
  .job-filter-btn { flex-shrink: 0; }

  .job-list { display: flex; flex-direction: column; gap: var(--space-3); }
  .job-card { display: flex; gap: 14px; align-items: stretch; text-decoration: none; color: inherit;
              background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
  .job-card:hover { border-color: var(--accent); }
  .job-thumb { width: 78px; min-width: 78px; height: 78px; border-radius: 10px; background: var(--accent-soft);
               display: flex; align-items: center; justify-content: center; color: var(--sub); overflow: hidden; }
  .job-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .job-thumb { position: relative; }
  .thumb-up { position: absolute; right: 4px; bottom: 4px; width: 26px; height: 26px; border-radius: 8px;
              background: rgba(31,36,48,.8); color: #fff; display: flex; align-items: center;
              justify-content: center; cursor: pointer; opacity: 0; transition: opacity .15s; }
  .job-card:hover .thumb-up, .job-thumb:focus-within .thumb-up { opacity: 1; }
  @media (hover: none) { .thumb-up { opacity: .9; } }
  .job-thumb.uploading { opacity: .5; }

  .job-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .job-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .job-id { font-size: 12.5px; color: var(--sub); font-weight: 600; letter-spacing: .3px; }
  .job-chan { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
              background: #ede9fe; color: #6d28d9; }
  html[data-theme="dark"] .job-chan { background: #3b2f63; color: #ddd0ff; }
  .job-name { font-size: 16px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
  .job-meta { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--sub); flex-wrap: wrap; }
  .job-meta .ic { opacity: .7; }
  .job-dot { opacity: .5; }
  .job-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .job-due { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600;
             padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .job-due.late { background: #fee4e2; color: #b42318; }
  html[data-theme="dark"] .job-due.late { background: #4a1d1a; color: #ffb4ab; }
  .job-amt { text-align: right; display: flex; flex-direction: column; justify-content: flex-end; flex-shrink: 0; }
  .job-amt-lbl { font-size: 11px; color: var(--sub); }
  .job-amt-num { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }

  @media (max-width: 640px) {
    .job-hero-top { flex-direction: column; align-items: stretch; gap: 12px; }
    .job-hero-btn { width: 100%; justify-content: center; }
    .hero-stats { gap: 8px; }
    .hs-num { font-size: 17px; }
    .job-card { gap: 10px; padding: 10px; }
    .job-thumb { width: 62px; min-width: 62px; height: 62px; }
    .job-name { font-size: 15px; }
    .job-amt { justify-content: flex-start; }
    .job-amt-num { font-size: 16px; }
  }

  .cust-extra > summary { cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--accent);
                          display: flex; align-items: center; gap: 6px; padding: 8px 0; }
  .cust-extra[open] > summary { margin-bottom: 4px; }

  /* การ์ดลูกค้าแบบยุบ/กางได้ */
  .cust-toggle { cursor: pointer; user-select: none; }
  .cust-toggle:hover { filter: brightness(0.98); }
  .cust-chev { display: inline-flex; align-items: center; color: var(--sub); margin-left: 10px;
               transition: transform .18s ease; flex-shrink: 0; }
  .cust-card.open .cust-chev { transform: rotate(180deg); }
  .cust-card + .cust-card { margin-top: -2px; }

  /* โหมดพนักงาน (role = user) — ซ่อนเฉพาะปุ่มที่ต้องเป็นแอดมิน ฐานข้อมูลกันอีกชั้นอยู่แล้ว
     พนักงานยัง เพิ่ม/แก้ออเดอร์ · กดปริ้น · เบิก-รับเข้าสต็อก · ลงเวลา ได้ตามปกติ */
  body.role-staff .admin-only,
  body.role-staff .icon-btn-delete,
  body.role-staff #oDel,
  body.role-staff #pAdd,
  body.role-staff #stOpen,
  body.role-staff #stAdd,
  body.role-staff .s-del,
  body.role-staff #sSave { display: none !important; }
  .viewer-banner { background: #fff7ed; border: 1px solid #fed7aa; color: #92400e; border-radius: var(--radius);
                   padding: 10px var(--space-4); font-size: 13px; margin-bottom: var(--space-3); }
  html[data-theme="dark"] .viewer-banner { background: #3a2f1c; border-color: #6b4f1d; color: #fcd9a5; }

  .update-bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px; z-index: 300;
                display: flex; align-items: center; gap: 12px; background: #1f2430; color: #fff;
                padding: 10px 14px; border-radius: 999px; box-shadow: 0 8px 30px rgba(0,0,0,.25); font-size: 14px; }
  .update-bar .btn { background: #fff !important; color: #1f2430 !important; border-color: #fff !important; }
  @media (max-width: 640px) { .update-bar { bottom: 78px; left: 12px; right: 12px; transform: none; justify-content: space-between; } }

  .alert-grid { display: grid; gap: var(--space-3); grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); margin-bottom: var(--space-5); }
  .alert-card { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--radius);
                border: 1px solid var(--border); background: var(--card); text-decoration: none; color: inherit; border-left-width: 4px; }
  .alert-card:hover { border-color: var(--accent); }
  .alert-card.danger { border-left-color: #b42318; }
  .alert-card.warn   { border-left-color: #b8862b; }
  .alert-card.info   { border-left-color: #3454d1; }
  .alert-card.danger .alert-ico, .alert-card.danger .alert-num { color: #b42318; }
  .alert-card.warn .alert-ico,   .alert-card.warn .alert-num   { color: #b8862b; }
  .alert-card.info .alert-ico,   .alert-card.info .alert-num   { color: #3454d1; }
  .alert-body { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
  .alert-num { font-size: 20px; font-weight: 700; line-height: 1.1; }
  .alert-lbl { font-size: 13px; font-weight: 600; }
  .alert-sub { font-size: 11.5px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .alert-go { color: var(--sub); flex-shrink: 0; }

  /* แถบเปลี่ยนหน้า */
  .pager { display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
           padding: 10px var(--space-4); border-bottom: 1px solid var(--border); }
  .pg-btn { min-width: 34px; height: 34px; padding: 0 8px; border-radius: 10px; cursor: pointer;
            border: 1px solid var(--border); background: var(--card); color: var(--text);
            font-family: inherit; font-size: 13px; font-weight: 600;
            display: inline-flex; align-items: center; justify-content: center; }
  .pg-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .pg-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pg-btn:disabled { opacity: .35; cursor: default; }
  .pg-dots { color: var(--sub); padding: 0 2px; }
  .pg-info { margin-left: auto; font-size: 12px; color: var(--sub); }
  @media (max-width: 640px) {
    .pager { gap: 4px; padding: 10px var(--space-3); }
    .pg-info { width: 100%; margin: 4px 0 0; order: 9; }
  }

  /* ===== ตารางแบบสมุดบัญชี ===== */
  .passbook .num-col { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .passbook .in { color: #b42318; }
  .passbook .out { color: #067647; }
  .passbook .bal { font-weight: 700; }
  .passbook .pb-item { display: flex; align-items: center; gap: 10px; }
  .passbook .pb-ico { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
                      display: inline-flex; align-items: center; justify-content: center; }
  .passbook .pb-row.in .pb-ico { background: #fdecea; color: #b42318; }
  .passbook .pb-row.out .pb-ico { background: #e7f6ec; color: #067647; }
  html[data-theme="dark"] .passbook .pb-row.in .pb-ico { background: #3a1d1b; color: #f4a49b; }
  html[data-theme="dark"] .passbook .pb-row.out .pb-ico { background: #123324; color: #6ee7a8; }
  .passbook .pb-tag { margin-left: 6px; font-size: 10px; }
  .passbook .pb-total td { border-top: 2px solid var(--border); font-weight: 700;
                           background: linear-gradient(180deg, transparent, var(--soft)); }
  .passbook .pb-row:hover { background: var(--soft); }
  /* ไม่มีปุ่มในแถวแล้ว — แตะที่ตัวเลขเงินเพื่อเปิดเมนูแก้ไข/ลบ (ใช้ได้ทุกขนาดจอ) */
  .passbook .num-col { cursor: pointer; }
  .passbook .num-col:active { opacity: .55; }
  .passbook .pb-total .num-col { cursor: default; }

  /* จอแคบ (≤640px ตรงกับจุดที่ตารางทั้งระบบเปลี่ยนเป็นการ์ด):
     1 รายการ = 2 บรรทัด — ซ้าย: ไอคอน+ชื่อ / วันที่ · ขวา: จำนวน / คงเหลือ · สุดขวา: ปุ่มแก้ไข-ลบ */
  @media (max-width: 640px) {
    .table-wrap table.passbook tr.pb-row {
      display: grid; grid-template-columns: 1fr auto; align-items: center;
      column-gap: 10px; row-gap: 2px; padding: 12px var(--space-4);
    }
    .table-wrap table.passbook tr.pb-row td { display: block; padding: 0; border: none; text-align: left; }
    .table-wrap table.passbook tr.pb-row td::before { display: none; }

    .passbook .pb-item { grid-column: 1; grid-row: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
    .passbook .pb-ico { width: 34px; height: 34px; flex-shrink: 0; }
    .passbook .pb-text { font-size: 14.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .passbook .pb-date { grid-column: 1; grid-row: 2; padding-left: 44px; font-size: 11.5px; color: var(--sub); }

    .passbook .num-col.in, .passbook .num-col.out {
      grid-column: 2; grid-row: 1; text-align: right; font-size: 16px; font-weight: 700;
    }
    .passbook .num-col:empty { display: none; }
    .passbook .num-col.bal {
      grid-column: 2; grid-row: 2; text-align: right; font-size: 12px; font-weight: 600; color: var(--sub);
    }
    .passbook .num-col.bal::before { content: 'คงเหลือ '; font-weight: 400; opacity: .8; }

    .passbook .pb-row .hint { display: none; }

    .table-wrap table.passbook tr.pb-total {
      display: flex; justify-content: space-between; align-items: baseline; padding: 14px var(--space-4);
    }
    .table-wrap table.passbook tr.pb-total td { display: none; padding: 0; border: none; }
    .table-wrap table.passbook tr.pb-total td:first-child { display: block; font-size: 13px; color: var(--sub); }
    .table-wrap table.passbook tr.pb-total td.bal { display: block; font-size: 17px; }
    .table-wrap table.passbook tr.pb-total td.bal::before { content: 'คงเหลือ '; font-size: 12px; font-weight: 500; color: var(--sub); }
  }

  /* แท็บเล็ต (641–900px): ยังเป็นตารางเต็ม แค่ลดขนาดตัวหนังสือลงนิด */
  @media (min-width: 641px) and (max-width: 900px) {
    .passbook .pb-text { font-size: 14px; }
  }

  /* กล่องกรอกกลางจอ (ใช้ตอนแจ้งงานเสีย/เศษผ้า) */
  .modal-back { position: fixed; inset: 0; background: rgba(15,18,25,.45); z-index: 400;
                display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal-card { background: var(--card); border-radius: var(--radius); width: 100%; max-width: 420px;
                padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .modal-card h3 { margin: 0 0 4px; font-size: 17px; }
  .modal-card .modal-sub { font-size: 12.5px; color: var(--sub); margin-bottom: 14px; line-height: 1.5; }
  .icon-btn-warn { color: #b8862b; }
  .icon-btn-warn:hover { background: #fdf3e2; }
  html[data-theme="dark"] .icon-btn-warn:hover { background: #3a2f1c; }

  /* ===== หน้าลงเวลา ===== */
  .att-clock { padding: var(--space-5) var(--space-4); text-align: center; }
  .att-time { font-size: 42px; font-weight: 800; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
  .att-date { color: var(--sub); font-size: 13px; margin-top: 2px; }
  .att-plan { font-size: 13px; margin-top: 10px; color: var(--text); }
  .att-geo { margin: 14px auto 0; display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px;
             border-radius: 999px; background: var(--soft); color: var(--sub); font-size: 12.5px; }
  .att-geo.in-range { background: var(--ok-bg); color: var(--ok-text); }
  .att-geo.out-range { background: var(--err-bg); color: var(--err-text); }
  html[data-theme="dark"] .att-geo.in-range { background: #123324; color: #6ee7a8; }
  html[data-theme="dark"] .att-geo.out-range { background: #3a1d1b; color: #f4a49b; }
  .att-actions { display: flex; gap: var(--space-4); justify-content: center; flex-wrap: wrap; margin: 20px 0 6px; }
  .att-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
             width: 220px; height: 220px; border-radius: 50%; border: none; cursor: pointer;
             font-family: inherit; font-size: 22px; font-weight: 800; color: #fff;
             box-shadow: 0 10px 30px rgba(0,0,0,.16); transition: transform .12s ease, background .2s ease; }
  .att-btn:active:not(:disabled) { transform: scale(.96); }
  .att-btn small { font-size: 13px; font-weight: 500; opacity: .92; }
  .att-btn.finished { background: var(--soft); color: var(--sub); box-shadow: none; cursor: default; }
  .att-btn.in { background: #22a06b; }
  .att-btn.out { background: #d1493f; }
  .att-btn:disabled { cursor: not-allowed; }
  .att-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-3); margin-top: 18px;
                 border-top: 1px solid var(--border); padding-top: 16px; }
  .att-summary .lbl { display: block; font-size: 11.5px; color: var(--sub); }
  .att-summary .val { display: block; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .att-summary .val.ok { color: var(--ok-text); }
  .att-summary .val.danger { color: var(--err-text); }
  @media (max-width: 560px) {
    .att-time { font-size: 34px; }
    .att-btn { width: 200px; height: 200px; font-size: 20px; }
    .att-summary { grid-template-columns: repeat(2, 1fr); }
    /* บนมือถือปุ่มลงเวลาต้องอยู่บนสุด ไม่ต้องเลื่อนผ่านแผนที่ก่อน
       ใช้ order สลับที่ ไม่ต้องแตะลำดับใน HTML (จอคอมยังเรียงเหมือนเดิม) */
    .att-clock { display: flex; flex-direction: column; }
    .att-now     { order: 1; }
    .att-actions { order: 2; margin-top: 14px; }
    .att-clock > .msg  { order: 3; }
    .att-clock > .hint { order: 3; }
    .att-geo-row { order: 4; }
    .att-summary { order: 5; }
    .att-map-box { order: 6; }
  }

  .att-geo-row { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .att-geo-row .att-geo { margin: 0; }
  .att-map-box { margin-top: 12px; }
  .att-map-box > summary { cursor: pointer; font-size: 13px; color: var(--accent); font-weight: 600;
                           list-style: none; padding: 10px; min-height: 44px; display: flex;
                           align-items: center; justify-content: center; gap: 6px; }
  .att-map-box > summary::-webkit-details-marker { display: none; }
  .att-map { height: 210px; margin: 4px 0; border-radius: var(--radius); overflow: hidden;
             border: 1px solid var(--border); background: var(--soft); }
  .att-map-hint { font-size: 12px; color: var(--sub); display: flex; align-items: center; justify-content: center;
                  gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .leaflet-container { font: inherit; }

  /* แท็บแบบแบ่งช่องเท่ากัน (ใช้ในหน้าลงเวลา) */
  .tabs.tabs-fixed { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); }
  .tabs.tabs-fixed .tab-btn { justify-content: center; white-space: nowrap; padding-left: 6px; padding-right: 6px; }

  /* รายการคนที่ลงเวลาวันนี้ */
  .att-people { display: flex; flex-direction: column; }
  .att-person { display: flex; align-items: center; gap: var(--space-3); justify-content: space-between;
                padding: 12px var(--space-4); border-top: 1px solid var(--border); }
  .att-person .ap-name { font-size: 14px; font-weight: 600; }
  .att-person .ap-sub { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .att-person .ap-state { font-size: 12px; font-weight: 600; white-space: nowrap; }
  .att-person.off .ap-state { color: var(--sub); }
  .att-person.on .ap-state { color: #067647; }
  .att-person.done .ap-state { color: #3454d1; }

  /* การ์ดอธิบายสิทธิ์ในหน้าผู้ใช้ */
  .role-legend { display: grid; gap: var(--space-3); grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); margin-bottom: var(--space-5); }
  .role-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .role-card .role-desc { font-size: 12.5px; color: var(--sub); margin-top: 8px; line-height: 1.55; }

  /* หน้าจอเข้าสู่ระบบ */
  #authScreen { position: fixed; inset: 0; z-index: 200; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: var(--space-4); }
  /* ต้องมี !important เพราะ display:flex ด้านบนชนะ attribute hidden ของเบราว์เซอร์ */
  #authScreen[hidden] { display: none !important; }
  .auth-box { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-6) var(--space-5); box-shadow: 0 10px 40px rgba(0,0,0,.08); }
  .auth-brand { font-size: 22px; font-weight: 700; }
  .auth-sub { font-size: 13px; color: var(--sub); margin-bottom: var(--space-5); }
  .auth-box .field { margin-bottom: var(--space-3); }
  .auth-links { display: flex; justify-content: space-between; margin-top: var(--space-4); }
  .linklike { background: none; border: none; color: var(--accent); font-family: inherit; font-size: 13px; cursor: pointer; padding: 6px 2px; }
  .auth-note { margin-top: var(--space-3); font-size: 12px; color: var(--sub); line-height: 1.6; }
  .logout-btn { width: 100%; margin-top: var(--space-3); }

  .print-badge { display: inline-flex; align-items: center; justify-content: center; min-height: 34px;
                 padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer;
                 background: var(--accent-soft); color: var(--accent); user-select: none; }
  .print-badge:hover { filter: brightness(0.96); }
  .print-badge.printed { background: var(--ok-bg); color: var(--ok-text); }


  /* สต็อกวัตถุดิบ */
  .stock-bar { height: 12px; background: var(--accent-soft); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .stock-bar > div { height: 100%; border-radius: 8px 0 0 8px; transition: width .3s ease; }
  .threshold-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--sub); margin-top: 12px;
                   flex-wrap: wrap; background: var(--soft); padding: 10px 12px; border-radius: 10px; }
  .threshold-row input { width: 96px; min-height: 40px; padding: 8px 10px; font-size: 15px; background: var(--card); }
  .stock-log { margin-top: 12px; font-size: 12.5px; }
  .stock-log summary { cursor: pointer; color: var(--sub); font-weight: 600; padding: 4px 0; }
  .log-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--border); }
  .log-ord { color: var(--accent); font-weight: 600; }
  .log-note { color: var(--sub); }
  .log-date { margin-left: auto; color: var(--sub); font-size: 11.5px; }

  /* หัวข้อหมวดในตารางสินค้า */
  .cat-row td { background: var(--accent-soft); font-weight: 700; font-size: 13px; letter-spacing: .2px; padding: 10px 12px !important; }
  .cat-count { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 600; color: var(--sub); }

  /* กล่องเลขบัญชีท้ายใบออเดอร์/ใบเสร็จ */
  .pay-block { margin-top: var(--space-5); padding: var(--space-4); border: 1px dashed #c9c3b8; border-radius: 10px; background: #faf8f4; color: #1f2430; }
  .pay-title { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #6b7280; margin-bottom: 6px; }
  .pay-line { font-size: 13px; }
  .pay-acc { margin-top: 4px; font-size: 20px; font-weight: 700; letter-spacing: 0.5px; font-variant-numeric: tabular-nums; }

  .rc-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--space-4); background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: var(--space-2); cursor: pointer; font-family: inherit; width: 100%; text-align: left; }
  .rc-row:hover { border-color: var(--accent); }
  .rc-wrap { display: flex; align-items: center; gap: var(--space-2); }
  .rc-wrap .rc-row { flex: 1; margin-bottom: 0; }
  .rc-wrap { margin-bottom: var(--space-2); }
  .rc-main { min-width: 0; }
  .rc-no { font-size: 14px; font-weight: 700; }
  .rc-sub { font-size: 11px; color: var(--sub); margin-top: 2px; }
  .rc-amt { font-size: 14px; font-weight: 700; color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ===== ออเดอร์ / สินค้า ===== */
  .chips { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-3); }
  .chip {
    font-family: inherit; font-size: 13px; font-weight: 600; padding: 8px 14px; min-height: 40px;
    border: 1px solid var(--border); border-radius: 999px; background: var(--card); color: var(--sub); cursor: pointer;
  }
  .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .st { font-size: 11px; font-weight: 700; padding: 5px 11px; border-radius: 999px; white-space: nowrap; }
  .st-new    { background: var(--accent-soft); color: var(--accent); }
  .st-prod   { background: var(--warn-bg);     color: var(--warn-text); }
  .st-deliv  { background: #e8f1fe;            color: #1f5fbf; }
  .st-paid   { background: var(--ok-bg);       color: var(--ok-text); }
  .st-cancel { background: var(--bg);          color: var(--sub); }
  html[data-theme="dark"] .st-deliv { background: #1b2a44; color: #8ab4f8; }

  .ord-row {
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
    padding: var(--space-3) var(--space-4); background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: var(--space-2); cursor: pointer;
    font-family: inherit; width: 100%; text-align: left;
  }
  a.ord-row, a.rc-row, a.nav-item { text-decoration: none; color: inherit; }
  a.nav-item { color: var(--sub); }
  a.nav-item.active { color: var(--accent); }
  .ord-row:hover { border-color: var(--accent); }
  .ord-main { min-width: 0; flex: 1; }
  .ord-top { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
  .ord-no { font-size: 14px; font-weight: 700; }
  .ord-cust { font-size: 13px; font-weight: 600; }
  .ord-sub { font-size: 11px; color: var(--sub); margin-top: 3px; }
  .ord-amt { font-size: 15px; font-weight: 700; color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }

  .item-row { display: grid; grid-template-columns: 1fr 78px 78px 96px 44px; gap: var(--space-2); align-items: end; margin-bottom: var(--space-2); }
  .item-row .field { min-width: 0; }
  .item-row.no-size { grid-template-columns: 1fr 78px 96px 44px; }
  .line-sum { text-align: right; font-size: 13px; font-weight: 600; padding-bottom: 12px; font-variant-numeric: tabular-nums; }
  .order-total { display: flex; justify-content: flex-end; gap: var(--space-4); align-items: baseline; margin-top: var(--space-3); padding-top: var(--space-3); border-top: 2px solid var(--border); font-size: 18px; font-weight: 700; }
  .order-total .ot-num { color: var(--accent); font-variant-numeric: tabular-nums; }

  @media (max-width: 640px) {
    .item-row, .item-row.no-size { grid-template-columns: 1fr 1fr; }
    .item-row .line-sum { grid-column: 1 / -1; text-align: left; padding-bottom: 0; }
  }

  .tax-block { font-size: 11.5px; color: #555; line-height: 1.6; margin-top: 6px; }
  .vat-line { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
  .vat-line.total { font-weight: 700; border-top: 1px solid var(--border); margin-top: 4px; padding-top: 6px; }

  /* ===== แถวรายการแบบหน้าตั้งค่า (ใช้ซ้ำได้ทั้งระบบ) ===== */
  .list-group { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
                overflow: hidden; margin-bottom: var(--space-4); }
  .list-label { font-size: 12px; font-weight: 600; color: var(--sub); text-transform: none;
                margin: 0 0 var(--space-2) 2px; }
  .list-row { display: flex; align-items: center; gap: var(--space-3); width: 100%; min-height: 56px;
              padding: 12px var(--space-4); background: none; border: none; border-top: 1px solid var(--border);
              font-family: inherit; font-size: 15px; color: var(--text); text-align: left; cursor: pointer;
              text-decoration: none; }
  .list-row:first-child { border-top: none; }
  .list-row:hover { background: var(--soft); }
  .list-row .lr-ico { width: 34px; height: 34px; border-radius: 10px; background: var(--accent-soft); color: var(--accent);
                      display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .list-row .lr-main { flex: 1; min-width: 0; }
  /* title กับ sub ต้องคนละบรรทัด (span เป็น inline ต้องบังคับ block) */
  .list-row .lr-title { display: block; font-weight: 600; line-height: 1.35; }
  .list-row .lr-sub { display: block; font-size: 12px; color: var(--sub); margin-top: 1px; line-height: 1.4; }
  .list-row .lr-value { font-size: 13px; color: var(--sub); white-space: nowrap; }
  /* ลูกศรชี้ขวาเป็นค่าเริ่มต้น พอกางฟอร์มออกมาถึงหมุนลง */
  .list-row .lr-go { color: var(--sub); flex-shrink: 0; display: flex; transform: rotate(-90deg); transition: transform .18s ease; }
  .list-row.open .lr-go { transform: rotate(0deg); }
  .list-row.danger .lr-ico { background: #fdecea; color: #b42318; }
  .list-row.danger .lr-title { color: #b42318; }
  html[data-theme="dark"] .list-row.danger .lr-ico { background: #3a1d1b; color: #f4a49b; }
  .list-panel { padding: 0 var(--space-4) var(--space-4); border-top: 1px solid var(--border); background: var(--soft); }
  .list-panel[hidden] { display: none; }

  /* การ์ดคนที่ล็อกอินอยู่ (หัวหน้าโปรไฟล์) */
  .me-card { display: flex; align-items: center; gap: var(--space-3); background: var(--card);
             border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-4); margin-bottom: var(--space-4); }
  .me-avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #fff;
               display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 700; flex-shrink: 0; }
  .me-name { font-size: 17px; font-weight: 700; }
  .me-mail { font-size: 12.5px; color: var(--sub); margin-top: 2px; word-break: break-all; }

  /* ===== ชีตเมนูเพิ่มเติม (มือถือ) ===== */
  .sheet-backdrop { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; }
  .sheet {
    background: var(--card); width: 100%; border-radius: 18px 18px 0 0;
    padding: var(--space-3) var(--space-4) calc(var(--space-5) + env(safe-area-inset-bottom, 0px));
    max-height: 80vh; overflow-y: auto;
  }
  .sheet-bar { width: 42px; height: 4px; border-radius: 999px; background: var(--border); margin: 0 auto var(--space-3); }
  .sheet-title { font-size: 12px; font-weight: 700; color: var(--sub); margin: var(--space-3) 0 4px 2px; }
  .sheet-title:first-of-type { margin-top: 0; }
  .sheet-item .si-label { flex: 1; }
  .sheet-item .si-go { color: var(--sub); display: flex; }
  .sheet-item {
    display: flex; align-items: center; gap: var(--space-3); width: 100%; min-height: 52px;
    background: none; border: none; border-radius: 12px; cursor: pointer; font-family: inherit;
    font-size: 15px; font-weight: 600; color: var(--text); text-align: left; padding: 0 var(--space-3);
  }
  .sheet-item.active, .sheet-item:hover { background: var(--accent-soft); color: var(--accent); }
  .sheet-item.danger { color: var(--err-text); }
  .sheet-item.danger:hover { background: #fdecea; color: var(--err-text); }
  html[data-theme="dark"] .sheet-item.danger:hover { background: #3a1d1b; }

  /* ===== การชำระเงิน / ใบปะหน้าพัสดุ ===== */
  .pay-line { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-2) 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .pay-line:last-child { border-bottom: none; }
  .pay-amt { font-weight: 700; color: var(--ok-text); font-variant-numeric: tabular-nums; }
  .bal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); margin-bottom: var(--space-3); }
  @media (max-width: 640px) { .bal-grid { grid-template-columns: 1fr; } }

  .ship-label {
    background: #fff; color: #1f2430; border: 2px dashed #9aa3b4; border-radius: 12px;
    padding: var(--space-5); max-width: 480px; margin: 0 auto;
  }
  .ship-from { font-size: 11px; color: #6b7280; border-bottom: 1px solid #e6e3dd; padding-bottom: var(--space-3); margin-bottom: var(--space-3); }
  .ship-to-label { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: #6b7280; }
  .ship-name { font-size: 20px; font-weight: 700; margin: 4px 0 6px; }
  .ship-addr { font-size: 15px; line-height: 1.7; white-space: pre-wrap; }
  .ship-phone { font-size: 16px; font-weight: 600; margin-top: var(--space-3); }
  .ship-foot { margin-top: var(--space-4); padding-top: var(--space-3); border-top: 1px solid #e6e3dd; font-size: 12px; color: #6b7280; display: flex; justify-content: space-between; gap: var(--space-3); }

  @media (max-width: 900px) {
    .selbar { left: 0; bottom: 76px; padding: var(--space-3) var(--space-4); }
    .receipt-paper { padding: var(--space-4); }
  }

  /* ===== ฟอร์มรายจ่ายซื้อของ =====
     ใช้คลาสของตัวเอง ไม่ใช้ .form-grid / .field-row กลาง เพราะ 2 อันนั้นมีอีก 8 ที่ในระบบใช้อยู่
     และกฎ .field-row > input { flex: 1 1 170px } จะไปยืดช่องติ๊กจนข้อความตกบรรทัด */
  .pu-form { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-2); margin-bottom: var(--space-3); }
  .pu-form[hidden] { display: none; }
  .pu-wide { grid-column: 1 / -1; }
  /* กล่องนี้โผล่เฉพาะตอนพิมพ์ชื่อของที่ยังไม่มีในสต็อก — ต้องมี [hidden] ของตัวเอง
     ไม่งั้น display: grid จะชนะ hidden แล้วซ่อนไม่ลง */
  .pu-new { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-2);
            background: var(--accent-soft); border: 1px dashed var(--accent);
            border-radius: var(--radius); padding: var(--space-3); margin-bottom: var(--space-3); }
  .pu-new[hidden] { display: none; }
  .pu-new-hint { grid-column: 1 / -1; color: var(--accent); font-size: 12.5px; font-weight: 600; line-height: 1.5; }
  .pu-check { display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 8px 14px;
              margin: 0 0 var(--space-3); border: 1px solid var(--border); border-radius: var(--radius);
              background: var(--card); cursor: pointer; font-size: 13.5px; line-height: 1.4; }
  .pu-check input { flex: 0 0 auto; width: 20px; height: 20px; margin: 0; }
  @media (max-width: 900px) { .pu-form { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) {
    .pu-form, .pu-new { grid-template-columns: 1fr; }
    /* 16px ขึ้นไป iOS จะไม่ซูมหน้าจอเองตอนแตะช่องกรอก */
    .pu-form input, .pu-form select, .pu-new select { font-size: 16px; }
    #puSave { width: 100%; justify-content: center; }
  }

  /* แถบแจ้งผลมุมล่างจอ — ลอยเหนือแถบเมนูล่างของมือถือ */
  /* ---- ให้รู้สึกเป็นแอปมือถือ ---- */
  @keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  #app.view-in { animation: viewIn .18s ease both; }

  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
  .sheet-backdrop { animation: fadeIn .2s ease both; }
  .sheet { animation: sheetUp .28s cubic-bezier(.32,.72,0,1) both; }


  /* เครื่องที่ตั้ง "ลดการเคลื่อนไหว" ไว้ ให้ปิดแอนิเมชันทั้งหมด */
  @media (prefers-reduced-motion: reduce) {
    #app.view-in, .sheet, .sheet-backdrop, .toast { animation: none; transition: none; }
  }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%) translateY(120%);
    bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 500;
    display: inline-flex; align-items: center; gap: 8px; max-width: calc(100vw - 32px);
    padding: 12px 18px; border-radius: 999px; font-size: 14px; font-weight: 600;
    box-shadow: 0 8px 24px rgba(15,18,25,.22); opacity: 0; pointer-events: none;
    transition: transform .25s ease, opacity .25s ease;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast.ok { background: var(--ok-bg); color: var(--ok-text); border: 1px solid var(--ok-text); }
  .toast.error { background: var(--err-bg); color: var(--err-text); border: 1px solid var(--err-text); }
  @media (min-width: 901px) { .toast { bottom: 28px; } }

  /* ชิปเลือกหมวดรายจ่าย — แตะทีเดียว ไม่ต้องพิมพ์ */
  .cat-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 2px; }
  .cat-chip {
    font-family: inherit; font-size: 13px; font-weight: 600; padding: 9px 14px; min-height: 42px;
    border: 1px solid var(--border); border-radius: 999px; background: var(--card);
    color: var(--sub); cursor: pointer;
  }
  .cat-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* แนบรูปใบเสร็จ */
  .rc-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: var(--space-3); }
  .rc-pick { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 10px 16px;
             border: 1px dashed var(--accent); border-radius: var(--radius); background: var(--accent-soft);
             color: var(--accent); font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .rc-thumb { width: 54px; height: 54px; border-radius: 10px; object-fit: cover; border: 1px solid var(--border); }

  /* ===== หน้าแรก (#/home) ===== */
  .home-head {
    background: linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 72%, #0b1f6b) 100%);
    color: #fff; border-radius: var(--radius); padding: var(--space-5);
    margin: 0 0 var(--space-4); position: relative; overflow: hidden;
  }
  .home-head::after {
    content: ''; position: absolute; right: -50px; top: -70px;
    width: 190px; height: 190px; border-radius: 50%; background: rgba(255,255,255,.08);
  }
  .home-head-top { display: flex; align-items: center; justify-content: space-between; }
  .home-greet { font-size: 14px; opacity: .9; }
  .home-out { background: rgba(255,255,255,.16); border: none; color: #fff; cursor: pointer;
              width: 40px; height: 40px; border-radius: 12px; display: inline-flex;
              align-items: center; justify-content: center; }
  .home-out:active { transform: scale(.94); }
  .home-me { display: flex; align-items: center; gap: 14px; margin-top: var(--space-4); position: relative; }
  .home-avatar { width: 66px; height: 66px; border-radius: 18px; flex: none; position: relative;
                 background: rgba(255,255,255,.2); border: 2px solid rgba(255,255,255,.45);
                 display: flex; align-items: center; justify-content: center;
                 font-size: 26px; font-weight: 800; }
  .home-online { position: absolute; right: -3px; bottom: -3px; width: 16px; height: 16px;
                 border-radius: 50%; background: #22c55e; border: 3px solid var(--accent); }
  .home-me-txt { min-width: 0; }
  .home-name { font-size: 21px; font-weight: 800; line-height: 1.25; }
  .home-role { font-size: 13.5px; opacity: .92; margin-top: 1px; }
  .home-login { font-size: 12px; opacity: .62; margin-top: 1px; }

  .home-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
               padding: var(--space-4); margin-bottom: var(--space-4); }
  .home-card-head { display: flex; align-items: center; gap: 8px; font-size: 15px; margin-bottom: var(--space-3); }
  .home-card-head .ic { color: var(--accent); }
  .home-more { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--accent);
               text-decoration: none; display: inline-flex; align-items: center; gap: 2px; }

  .home-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); }
  .home-slot { background: var(--soft); border-radius: 12px; padding: 12px 8px; text-align: center; }
  .home-slot.ok { background: var(--ok-bg); }
  .hs-l { display: block; font-size: 11.5px; color: var(--sub); }
  .hs-v { display: block; font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .home-slot.ok .hs-v { color: var(--ok-text); }
  .home-badge { display: inline-block; margin-top: 4px; padding: 4px 10px; border-radius: 999px;
                font-size: 12px; font-weight: 700; }
  .home-badge.ok   { background: var(--ok-bg); color: var(--ok-text); }
  .home-badge.late { background: var(--warn-bg); color: var(--warn-text); }
  .home-badge.warn { background: var(--warn-bg); color: var(--warn-text); }
  .home-badge.off  { background: var(--soft); color: var(--sub); }

  .home-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .home-day { background: var(--soft); border-radius: 10px; padding: 8px 2px; text-align: center; line-height: 1.35; }
  .home-day.today { background: var(--accent); color: #fff; }
  .home-day.off { opacity: .55; }
  .hd-n { display: block; font-size: 11px; color: var(--sub); }
  .home-day.today .hd-n { color: rgba(255,255,255,.85); }
  .hd-s { display: block; font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .hd-e { display: block; font-size: 11px; color: var(--sub); font-variant-numeric: tabular-nums; }
  .home-day.today .hd-e { color: rgba(255,255,255,.8); }
  .hd-off { display: block; font-size: 11px; color: var(--sub); }

  .home-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3); }
  .home-tile { display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none;
               color: var(--text); background: var(--card); border: 1px solid var(--border);
               border-radius: 16px; padding: var(--space-4) 6px; min-height: 104px;
               justify-content: center; transition: transform .12s ease; }
  .home-tile:active { transform: scale(.95); }
  .tile-ico { width: 52px; height: 52px; border-radius: 15px; color: #fff; position: relative;
              display: inline-flex; align-items: center; justify-content: center; }
  .tile-lbl { font-size: 12.5px; font-weight: 600; text-align: center; line-height: 1.3; }
  .tile-dot { position: absolute; top: -5px; right: -5px; min-width: 19px; height: 19px; padding: 0 5px;
              border-radius: 999px; background: #d92d20; color: #fff; font-size: 11px; font-weight: 700;
              line-height: 19px; text-align: center; box-shadow: 0 0 0 2px var(--card); }
  html[data-theme="dark"] .tile-dot { background: #ff8b7d; color: #2a1210; }
  .home-foot { text-align: center; font-size: 11.5px; color: var(--sub); margin: var(--space-5) 0 var(--space-3); }

  @media (max-width: 380px) { .home-grid { gap: var(--space-2); } .tile-ico { width: 46px; height: 46px; } }
  @media (min-width: 901px) { .home-grid { grid-template-columns: repeat(6, 1fr); } }

  @media print {
    .sidebar, header, .selbar, .no-print { display: none !important; }
    .container { margin: 0 !important; padding: 0 !important; max-width: none !important; }
    .receipt-paper { border: none; max-width: none; padding: 0; }
    .ship-label { border: 2px dashed #000; max-width: none; }
    .sheet-backdrop { display: none !important; }
    body { background: #fff; padding: 0; }
  }

  .info-note {
    background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn-text);
    border-radius: var(--radius); padding: var(--space-3) var(--space-4); font-size: 12px;
    line-height: 1.6; margin-bottom: var(--space-3);
  }

  /* ===== Sidebar (จอคอม) ===== */
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; width: 220px; z-index: 20;
    background: var(--card); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: var(--space-4) var(--space-3);
  }
  .sidebar-brand { padding: var(--space-2) var(--space-3) var(--space-4); }
  .sidebar-brand .b-name { font-size: 15px; font-weight: 700; letter-spacing: .01em; }
  .sidebar-brand .b-sub { font-size: 10px; color: var(--sub); letter-spacing: .16em; text-transform: uppercase; margin-top: 2px; }
  .nav-list { display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }
  .nav-item {
    display: flex; align-items: center; gap: var(--space-3); width: 100%;
    background: none; border: none; border-radius: 10px; cursor: pointer; font-family: inherit;
    font-size: 13.5px; font-weight: 500; color: var(--sub); text-align: left;
    padding: 10px var(--space-3); min-height: 42px; transition: background .15s ease, color .15s ease;
  }
  /* ป้ายตัวเลขบนเมนู — ตัวหนังสือขาวบน --err-text ใช้ไม่ได้ในโหมดมืด (แดงอ่อน contrast 2.3:1)
     โหมดมืดเลยสลับเป็นตัวหนังสือเข้มบนพื้นแดงอ่อนแทน */
  .nav-badge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px;
               background: #d92d20; color: #fff; font-size: 11px; font-weight: 700;
               display: inline-flex; align-items: center; justify-content: center; }
  html[data-theme="dark"] .nav-badge { background: #ff8b7d; color: #2a1210; }
  .nav-item:hover { background: var(--accent-soft); color: var(--accent); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .nav-ico { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; flex-shrink: 0; }
  .nav-sep { height: 1px; background: var(--border); margin: var(--space-2) var(--space-3); }
  .sidebar-foot { border-top: 1px solid var(--border); padding-top: var(--space-3); margin-top: var(--space-2); }
  .theme-row {
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-2);
    padding: 8px var(--space-3); font-size: 13px; color: var(--sub);
  }
  .switch { position: relative; width: 40px; height: 24px; flex-shrink: 0; border: none; background: none; padding: 0; cursor: pointer; }
  .switch-track { display: block; width: 40px; height: 24px; border-radius: 999px; background: var(--border); transition: background .18s ease; }
  .switch-knob { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .18s ease; }
  .switch[aria-checked="true"] .switch-track { background: var(--accent); }
  .switch[aria-checked="true"] .switch-knob { transform: translateX(16px); }

  /* ===== Bottom nav (มือถือ) ===== */

  .page-head { margin-bottom: var(--space-4); }
  .page-head h2 { margin: 0; font-size: 20px; font-weight: 700; }
  .page-head .page-sub { font-size: 12px; color: var(--sub); margin-top: 2px; }

  /* ===== Dashboard ===== */
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-3); margin-bottom: var(--space-4); }
  .kpi {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3);
    min-width: 0;
  }
  .kpi-top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
  .kpi-ico {
    width: 30px; height: 30px; border-radius: 9px; background: var(--accent-soft); color: var(--accent);
    display: inline-flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0;
  }
  .kpi-trend { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .kpi-trend.up { background: var(--ok-bg); color: var(--ok-text); }
  .kpi-trend.down { background: var(--warn-bg); color: var(--warn-text); }
  .kpi-trend.flat { background: var(--bg); color: var(--sub); }
  .kpi-num { font-size: 24px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kpi-lbl { font-size: 11px; color: var(--sub); letter-spacing: .04em; text-transform: uppercase; margin-top: 3px; }

  .dash-row { display: grid; grid-template-columns: 1.6fr 1fr; gap: var(--space-3); margin-bottom: var(--space-3); }
  .dash-row.thirds { grid-template-columns: repeat(2, 1fr); }
  .panel-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-4); min-width: 0; }
  .panel-card h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .panel-card .panel-sub { font-size: 11px; color: var(--sub); margin-top: 2px; margin-bottom: var(--space-3); }
  .chart-box { position: relative; height: 220px; }
  .chart-box.donut { height: 200px; }

  .mini-list { display: flex; flex-direction: column; gap: var(--space-2); max-height: 260px; overflow-y: auto; }
  .mini-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-2) 0; border-bottom: 1px solid var(--border); }
  .mini-row:last-child { border-bottom: none; }
  .mini-main { min-width: 0; }
  .mini-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini-meta { font-size: 11px; color: var(--sub); margin-top: 1px; }
  .mini-amt { font-size: 13px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mini-empty { font-size: 12px; color: var(--sub); text-align: center; padding: var(--space-5) 0; }

  /* ===== ปฏิทิน ===== */
  .cal-top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-3); flex-wrap: wrap; }
  .cal-title { font-size: 17px; font-weight: 700; }
  .cal-nav { display: flex; gap: var(--space-2); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-dow { font-size: 11px; font-weight: 600; color: var(--sub); text-align: center; padding: 4px 0; }
  .cal-cell {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    min-height: 92px; padding: 6px; display: flex; flex-direction: column; gap: 3px;
    font-family: inherit; text-align: left; cursor: pointer; min-width: 0;
    transition: border-color .15s ease;
  }
  .cal-cell:hover { border-color: var(--accent); }
  .cal-cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cal-cell.muted { opacity: .38; }
  .cal-cell.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .cal-cell.selected { background: var(--accent-soft); border-color: var(--accent); }
  .cal-daynum { font-size: 12px; font-weight: 600; }
  .cal-cell.today .cal-daynum { color: var(--accent); }
  .cal-chip {
    font-size: 10px; line-height: 1.3; padding: 2px 5px; border-radius: 5px;
    background: var(--accent-soft); color: var(--accent); font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cal-chip.unpaid { background: var(--warn-bg); color: var(--warn-text); }
  .cal-chip.lay-recv { background: var(--accent-soft); color: var(--accent); }
  .cal-chip.lay-due  { background: #e8f1fe; color: #1f5fbf; }
  .cal-chip.lay-cost { background: var(--warn-bg); color: var(--warn-text); }
  html[data-theme="dark"] .cal-chip.lay-due { background: #1b2a44; color: #8ab4f8; }
  .cal-more { font-size: 10px; color: var(--sub); }
  .cal-dot-row { display: none; gap: 3px; flex-wrap: wrap; }
  .cal-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .cal-dot.unpaid { background: var(--warn-border); }
  .cal-dot.lay-recv { background: var(--accent); }
  .cal-dot.lay-due  { background: #1f5fbf; }
  .cal-dot.lay-cost { background: var(--warn-border); }

  @media (max-width: 900px) {
    .cal-grid { gap: 4px; }
    .cal-cell { min-height: 56px; padding: 4px; align-items: center; justify-content: flex-start; }
    .cal-chip, .cal-more { display: none; }
    .cal-dot-row { display: flex; justify-content: center; }
  }

  @media (max-width: 900px) {
    .sidebar { display: none; }
    /* ไม่มีแถบเมนูล่างแล้ว เหลือเผื่อแค่ขอบจอไอโฟน */
    body { padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
    .home-back {
      display: inline-flex; align-items: center; gap: 7px; flex: none;
      min-height: 44px; padding: 10px 16px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent);
      font-size: 14px; font-weight: 600; text-decoration: none;
      transition: transform .12s ease;
    }
    .home-back:active { transform: scale(.95); }

    .kpi-grid { grid-template-columns: repeat(2, 1fr); gap: var(--space-2); }
    .kpi { padding: var(--space-3); gap: var(--space-2); }
    .kpi-num { font-size: 19px; }
    .dash-row, .dash-row.thirds { grid-template-columns: 1fr; }
    .chart-box { height: 190px; }
  }

  /* =====================================================================
     ปรับหน้าตาฝั่งมือถือให้ทันสมัยขึ้น (เพิ่มทีหลัง จึงทับกฎด้านบนได้)
     หลักคิด: การ์ดนุ่มขึ้น เงาแทนเส้นขอบ · ตัวอักษรมีลำดับชัด · แถบล่างลอยแบบแอป
     ===================================================================== */
  @media (max-width: 900px) {
    :root { --radius: 16px; }

    body { background: var(--bg); padding-bottom: 104px; -webkit-font-smoothing: antialiased; }

    /* ---- หัวเรื่องด้านบน: บางลง เบลอพื้นหลัง ---- */
    header {
      padding: 10px var(--space-4); border-bottom: none;
      background: color-mix(in srgb, var(--card) 88%, transparent);
      backdrop-filter: saturate(1.4) blur(10px);
      -webkit-backdrop-filter: saturate(1.4) blur(10px);
    }
    header h1 { font-size: 15px; }
    header .meta { font-size: 10.5px; opacity: .8; }

    .container { padding: var(--space-3) var(--space-4) 0; }

    /* ---- หัวหน้าเพจ ---- */
    .page-head { margin-bottom: var(--space-3); }
    .page-head h2 { font-size: 22px; letter-spacing: -.3px; }
    .page-head .page-sub { font-size: 12.5px; line-height: 1.5; }

    /* ---- การ์ดทุกใบ: เงานุ่มแทนเส้นขอบแข็ง ---- */
    .lot-card, .panel, .job-card, .stat, .kpi, .list-group, .me-card,
    .alert-card, .rc-row, .ord-row, .month-card, .stock-card, .search-wrap input {
      border-color: color-mix(in srgb, var(--border) 55%, transparent);
      box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 6px 16px -8px rgba(16,24,40,.10);
    }
    html[data-theme="dark"] .lot-card, html[data-theme="dark"] .panel,
    html[data-theme="dark"] .job-card, html[data-theme="dark"] .stat,
    html[data-theme="dark"] .kpi, html[data-theme="dark"] .list-group { box-shadow: none; }

    .lot-card, .panel { border-radius: 18px; }
    .lot-head { border-radius: 18px 18px 0 0; }

    /* ---- ตัวเลขสรุป: ไล่สีอ่อนๆ ให้ดูมีมิติ ---- */
    .summary-grid { gap: var(--space-2); }
    .stat, .kpi {
      border-radius: 16px;
      background: linear-gradient(180deg, var(--card) 0%, color-mix(in srgb, var(--accent-soft) 45%, var(--card)) 100%);
    }
    .stat .num { font-size: 20px; letter-spacing: -.4px; }
    .stat .lbl { font-size: 11px; }

    /* ---- ปุ่ม: มนขึ้น กดแล้วมีฟีดแบ็ก ---- */
    .btn { border-radius: 12px; font-size: 14.5px; box-shadow: 0 1px 2px rgba(16,24,40,.06); }
    .btn:active { transform: scale(.97); }
    .btn.secondary { box-shadow: none; }
    .btn-sm { border-radius: 10px; }
    .icon-btn { border-radius: 12px; }

    /* ---- ป้ายสถานะ ---- */
    .st, .paid-badge, .print-badge { border-radius: 999px; font-size: 11px; letter-spacing: .1px; }

    /* ---- ชิป/ตัวกรอง: เลื่อนแนวนอนแทนตกบรรทัด ---- */
    .chips {
      display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 8px;
      padding-bottom: 4px; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: 0 0 auto; border-radius: 999px; }

    /* ---- แท็บ ---- */
    .tabs { gap: 6px; }
    .tab-btn { border-radius: 12px; font-size: 13px; }

    /* ---- ชีตเมนู (ใช้ในหน้าหนี้ส่วนตัว) ---- */
    .sheet { border-radius: 24px 24px 0 0; padding-top: var(--space-2); }
    .sheet-item { border-radius: 14px; min-height: 50px; }

    /* ---- แถวรายการ (หน้าโปรไฟล์ ฯลฯ) ---- */
    .list-group { border-radius: 16px; }
    .list-row { min-height: 58px; }
    .list-row:active { background: var(--soft); }

    /* ---- ตารางที่กลายเป็นการ์ดบนมือถือ ---- */
    tbody tr { border-radius: 14px; }

    /* ---- ค่อยๆ ปรากฏตอนเปลี่ยนหน้า ---- */
    #app > * { animation: fadeUp .22s ease both; }
