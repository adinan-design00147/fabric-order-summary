<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>คำนวณผ้าดิบ (Supabase)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --bg: #f7f5f2; --card: #ffffff; --text: #1f2430; --sub: #586273;
    --accent: #3454d1; --accent-soft: #eef1fd; --border: #e6e3dd;
    --warn-bg: #fff6ed; --warn-border: #f5b77e; --warn-text: #92400e;
    --ok-bg: #eefbf3; --ok-text: #067647;
    --err-text: #b42318;
    --radius: 14px;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
    --space-5: 20px; --space-6: 24px; --space-8: 32px;
  }
  html[data-theme="dark"] {
    --bg: #12151c; --card: #191d26; --text: #e8eaf0; --sub: #9aa3b4;
    --accent: #6b87ff; --accent-soft: #232a3d; --border: #2a303c;
    --warn-bg: #3a2a17; --warn-border: #7a5320; --warn-text: #f0b866;
    --ok-bg: #16301f; --ok-text: #5fd497;
    --err-text: #ff8b7d;
  }
  html[data-theme="dark"] .switch-knob { background: #e8eaf0; }
  html[data-theme="dark"] .lot-actions { background: var(--accent-soft); }
  html[data-theme="dark"] .icon-btn { background: var(--card); }
  html[data-theme="dark"] .field input,
  html[data-theme="dark"] .field select,
  html[data-theme="dark"] .edit-row input,
  html[data-theme="dark"] .search-wrap input { background: var(--bg); color: var(--text); }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Prompt', -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
    background: var(--bg); color: var(--text); padding-bottom: 96px;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--card);
    border-bottom: 1px solid var(--border); padding: var(--space-4) var(--space-5);
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
    margin-left: 220px;
  }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .ic { display: block; flex-shrink: 0; }
  header .meta { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .container { padding: var(--space-5) var(--space-5) 0; max-width: 1100px; margin: 0 auto; margin-left: 220px; }
  @media (max-width: 900px) {
    header { margin-left: 0; padding: var(--space-3) var(--space-4); }
    .container { margin-left: auto; padding: var(--space-4) var(--space-4) 0; max-width: 720px; }
  }

  .tabs { display: flex; gap: var(--space-2); margin-bottom: var(--space-4); }
  .tab-btn {
    flex: 1; font-family: inherit; font-size: 14px; font-weight: 600; padding: 10px 16px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--card); color: var(--sub);
    cursor: pointer; min-height: 44px; transition: background .15s ease, color .15s ease;
  }
  .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-2); margin-bottom: var(--space-4); }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-4) var(--space-2); text-align: center; }
  .stat .num { font-size: 20px; font-weight: 700; }
  .stat .lbl { font-size: 11px; color: var(--sub); margin-top: 2px; }

  .today-card { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: var(--radius); padding: var(--space-4); margin-bottom: var(--space-4); }
  .today-card h2 { margin: 0 0 var(--space-3); font-size: 15px; font-weight: 600; color: var(--accent); }
  .today-empty { font-size: 13px; color: var(--sub); }
  .today-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-2); }
  .today-stats .stat { background: #fff; }

  .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-4); margin-bottom: var(--space-3); }
  .panel h2 { margin: 0 0 var(--space-3); font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px; }

  .field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 110px; }
  .field label { font-size: 12px; color: var(--sub); font-weight: 500; }
  .field input, .field select {
    font-family: inherit; font-size: 16px; padding: 11px 12px; border: 1px solid var(--border);
    border-radius: 10px; background: #fff; min-height: 44px; width: 100%;
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

  .field-row { display: flex; gap: var(--space-3); align-items: flex-end; flex-wrap: wrap; }
  .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-2); margin-bottom: var(--space-3); }

  .btn {
    font-family: inherit; font-size: 14px; font-weight: 600; padding: 12px 20px; border: none;
    border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; min-height: 44px;
    white-space: nowrap; transition: background .15s ease, transform .1s ease;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  }
  .tab-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
  .panel h2 .ic, .section-title .ic, .today-card h2 .ic { flex-shrink: 0; }
  .btn:hover { background: #2a44b8; }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .6; cursor: default; transform: none; }
  .btn.secondary { background: var(--accent-soft); color: var(--accent); }
  .btn.secondary:hover { background: #dfe4fb; }
  .btn.block { width: 100%; }

  .msg { font-size: 13px; margin-top: var(--space-2); min-height: 16px; }
  .msg.error { color: var(--err-text); }

  .hint { font-size: 12px; color: var(--sub); margin-top: var(--space-2); }

  @media (max-width: 640px) {
    .field-row { flex-direction: column; align-items: stretch; }
    .field-row .btn { width: 100%; }

    .form-grid { grid-template-columns: repeat(2, 1fr); }

    .tabs { display: grid; grid-template-columns: repeat(2, 1fr); }

    .pay-row { flex-wrap: wrap; row-gap: var(--space-2); }
    .pay-row-right { flex-wrap: wrap; row-gap: var(--space-2); }

    /* ตาราง -> การ์ดรายการ บนจอมือถือ กันเลื่อนแนวนอน อ่านง่ายขึ้น */
    .table-wrap table, .table-wrap tbody, .table-wrap tr, .table-wrap td {
      display: block; width: 100%;
    }
    .table-wrap thead { display: none; }
    .table-wrap tr { border-top: 1px solid var(--border); padding: var(--space-3) var(--space-4); }
    .table-wrap tr:first-child { border-top: none; }
    .table-wrap td {
      display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
      padding: 5px 0; border-top: none; text-align: right;
    }
    .table-wrap td::before {
      content: attr(data-label); font-size: 11px; font-weight: 500; color: var(--sub);
      text-align: left; flex-shrink: 0;
    }
    .table-wrap td.empty-cell { display: block; text-align: center; }
    .table-wrap td.empty-cell::before { display: none; }
    .table-wrap tr.cat-row { padding: 0; border-top: none; }
    .table-wrap tr.cat-row td { display: block; text-align: left; }
    .table-wrap tr.cat-row td::before { display: none; }
  }

  .lot-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: var(--space-3); overflow: hidden; }
  .lot-head { padding: var(--space-3) var(--space-4); font-weight: 600; font-size: 14px; background: var(--accent-soft); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: var(--space-2); }
  .lot-head .lot-total { color: var(--accent); font-variant-numeric: tabular-nums; }
  .lot-head-right { text-align: right; }
  .lot-head .lot-price { display: block; font-size: 11px; font-weight: 400; color: var(--sub); margin-top: 1px; }
  .lot-head .lot-buffer { display: block; font-size: 11px; font-weight: 400; color: var(--accent); margin-top: 1px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: var(--space-2) var(--space-3); text-align: right; border-top: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; font-variant-numeric: normal; }
  th { color: var(--sub); font-weight: 500; font-size: 11px; }
  .paid-badge {
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    padding: 0 16px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer;
    min-height: 44px; border: none; font-family: inherit; transition: filter .15s ease;
  }
  .paid-badge:hover { filter: brightness(.96); }
  .paid-badge:active { transform: scale(.97); }
  .paid-badge:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .paid-badge.paid { background: var(--ok-bg); color: var(--ok-text); }
  .paid-badge.unpaid { background: var(--warn-bg); color: var(--warn-text); }

  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .empty-cell { text-align: center; color: var(--sub); }

  .month-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-4); margin-bottom: var(--space-3); }
  .month-card h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .month-card .month-sub { font-size: 12px; color: var(--sub); margin-top: 2px; margin-bottom: var(--space-3); }
  .month-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); }
  .month-stats .stat { padding: var(--space-3) var(--space-2); }
  .month-stats.stats-2 { grid-template-columns: repeat(2, 1fr); }

  .section-title { font-size: 15px; font-weight: 600; margin: var(--space-5) 0 var(--space-3); display: flex; align-items: center; gap: 6px; }

  .pay-row { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-3) var(--space-4); margin-bottom: var(--space-2); display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; }
  .pay-row-right { display: flex; gap: var(--space-3); align-items: baseline; }
  .pay-row-count { font-size: 12px; font-weight: 400; color: var(--sub); }
  .pay-row-price { color: var(--accent); font-variant-numeric: tabular-nums; }

  .piece-name { cursor: pointer; }
  .piece-name:hover .piece-name-text { color: var(--accent); }
  .piece-name-actions { display: none; gap: var(--space-2); }
  .piece-name.active .piece-name-text { display: none; }
  .piece-name.active .piece-name-actions { display: flex; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; padding: 0; flex-shrink: 0;
    border: 1px solid var(--border); border-radius: 10px; background: #fff; color: var(--sub);
    cursor: pointer; transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn:active { transform: scale(.96); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .icon-btn-edit:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .icon-btn-delete:hover { background: #fdecea; color: var(--err-text); border-color: var(--err-text); }

  .edit-row { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; padding: var(--space-2) 0; }
  .edit-row input { font-family: inherit; font-size: 16px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; flex: 1; min-width: 90px; min-height: 44px; }
  .edit-row .btn { padding: 0 14px; font-size: 12px; min-height: 44px; }

  .lot-actions { padding: var(--space-2) var(--space-4); border-top: 1px solid var(--border); background: #fafafa; display: flex; gap: var(--space-2); flex-wrap: wrap; }

  .gallery { padding: var(--space-3) var(--space-4) var(--space-4); border-top: 1px solid var(--border); }
  .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: var(--space-2); }
  .gallery-item { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: var(--bg); }
  .gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gallery-item a { display: block; width: 100%; height: 100%; }
  .gallery-fallback {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    width: 100%; height: 100%; padding: var(--space-2); text-align: center; font-size: 18px;
    background: var(--accent-soft); color: var(--accent);
  }
  .gallery-fallback .gf-name {
    font-size: 10px; font-weight: 600; color: var(--text); line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all;
  }
  .gallery-fallback .gf-hint { font-size: 9px; color: var(--sub); }
  .gallery-empty { font-size: 12px; color: var(--sub); padding: var(--space-3) 0; }
  .gallery-bar { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-3); }
  .gallery-msg { font-size: 12px; color: var(--sub); }
  .gallery-msg.error { color: var(--err-text); }
  html[data-theme="dark"] .lot-actions { background: var(--accent-soft); }
  .btn-sm { font-size: 12px; padding: 0 14px; min-height: 44px; white-space: nowrap; }

  .search-wrap { margin-bottom: var(--space-3); position: relative; }
  .search-ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--sub); pointer-events: none; display: flex; }
  .search-wrap input { font-family: inherit; font-size: 16px; padding: 11px 14px 11px 42px; border: 1px solid var(--border); border-radius: 10px; background: #fff; min-height: 44px; width: 100%; }
  .search-wrap input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

  .loading { text-align: center; color: var(--sub); padding: var(--space-6); font-size: 13px; }

  /* ===== เลือกรายการ + ใบเสร็จ ===== */
  .pick { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; margin: 0; }
  td.pick-cell, th.pick-cell { width: 40px; text-align: center; }

  .selbar {
    position: fixed; left: 220px; right: 0; bottom: 0; z-index: 40;
    background: var(--card); border-top: 1px solid var(--border);
    padding: var(--space-3) var(--space-5); display: flex; align-items: center;
    justify-content: space-between; gap: var(--space-3); flex-wrap: wrap;
    box-shadow: 0 -4px 16px rgba(0,0,0,.08);
  }
  .selbar-info { font-size: 14px; font-weight: 600; }
  .selbar-info .sb-sum { color: var(--accent); }
  .selbar-actions { display: flex; gap: var(--space-2); flex-wrap: wrap; }

  .receipt-paper {
    background: #fff; color: #1f2430; border: 1px solid var(--border); border-radius: var(--radius);
    padding: var(--space-6); max-width: 620px; margin: 0 auto;
  }
  .receipt-head { display: flex; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; border-bottom: 2px solid #1f2430; padding-bottom: var(--space-3); margin-bottom: var(--space-4); }
  .receipt-shop { font-size: 18px; font-weight: 700; }
  .receipt-shop-sub { font-size: 11px; color: #6b7280; letter-spacing: .12em; text-transform: uppercase; margin-top: 2px; }
  .receipt-meta { text-align: right; font-size: 12px; color: #6b7280; }
  .receipt-meta .r-no { font-size: 14px; font-weight: 700; color: #1f2430; }
  .receipt-to { font-size: 13px; margin-bottom: var(--space-4); }
  .receipt-to .r-label { font-size: 11px; color: #6b7280; }
  .receipt-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .receipt-table th { text-align: right; font-size: 11px; color: #6b7280; border-bottom: 1px solid #e6e3dd; padding: 6px 8px; }
  .receipt-table th:first-child, .receipt-table td:first-child { text-align: left; }
  .receipt-table td { text-align: right; padding: 8px; border-bottom: 1px solid #f0eeea; font-variant-numeric: tabular-nums; }
  .receipt-total { display: flex; justify-content: flex-end; gap: var(--space-5); margin-top: var(--space-4); padding-top: var(--space-3); border-top: 2px solid #1f2430; font-size: 16px; font-weight: 700; }
  .receipt-note { margin-top: var(--space-4); font-size: 12px; color: #6b7280; white-space: pre-wrap; }
  .receipt-foot { margin-top: var(--space-6); font-size: 11px; color: #9aa3b4; text-align: center; }

  /* หัวข้อหมวดในตารางสินค้า */
  .cat-row td { background: var(--accent-soft); font-weight: 700; font-size: 13px; letter-spacing: .2px; padding: 10px 12px !important; }
  .cat-count { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 600; color: var(--sub); }

  /* กล่องเลขบัญชีท้ายใบออเดอร์/ใบเสร็จ */
  .pay-block { margin-top: var(--space-5); padding: var(--space-4); border: 1px dashed #c9c3b8; border-radius: 10px; background: #faf8f4; color: #1f2430; }
  .pay-title { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #6b7280; margin-bottom: 6px; }
  .pay-line { font-size: 13px; }
  .pay-acc { margin-top: 4px; font-size: 20px; font-weight: 700; letter-spacing: 0.5px; font-variant-numeric: tabular-nums; }

  .rc-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--space-4); background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: var(--space-2); cursor: pointer; font-family: inherit; width: 100%; text-align: left; }
  .rc-row:hover { border-color: var(--accent); }
  .rc-main { min-width: 0; }
  .rc-no { font-size: 14px; font-weight: 700; }
  .rc-sub { font-size: 11px; color: var(--sub); margin-top: 2px; }
  .rc-amt { font-size: 14px; font-weight: 700; color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ===== ออเดอร์ / สินค้า ===== */
  .chips { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-3); }
  .chip {
    font-family: inherit; font-size: 13px; font-weight: 600; padding: 8px 14px; min-height: 40px;
    border: 1px solid var(--border); border-radius: 999px; background: var(--card); color: var(--sub); cursor: pointer;
  }
  .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .st { font-size: 11px; font-weight: 700; padding: 5px 11px; border-radius: 999px; white-space: nowrap; }
  .st-new    { background: var(--accent-soft); color: var(--accent); }
  .st-prod   { background: var(--warn-bg);     color: var(--warn-text); }
  .st-deliv  { background: #e8f1fe;            color: #1f5fbf; }
  .st-paid   { background: var(--ok-bg);       color: var(--ok-text); }
  .st-cancel { background: var(--bg);          color: var(--sub); }
  html[data-theme="dark"] .st-deliv { background: #1b2a44; color: #8ab4f8; }

  .ord-row {
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
    padding: var(--space-3) var(--space-4); background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: var(--space-2); cursor: pointer;
    font-family: inherit; width: 100%; text-align: left;
  }
  a.ord-row, a.rc-row, a.nav-item { text-decoration: none; color: inherit; }
  a.nav-item { color: var(--sub); }
  a.nav-item.active { color: var(--accent); }
  .ord-row:hover { border-color: var(--accent); }
  .ord-main { min-width: 0; flex: 1; }
  .ord-top { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
  .ord-no { font-size: 14px; font-weight: 700; }
  .ord-cust { font-size: 13px; font-weight: 600; }
  .ord-sub { font-size: 11px; color: var(--sub); margin-top: 3px; }
  .ord-amt { font-size: 15px; font-weight: 700; color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }

  .item-row { display: grid; grid-template-columns: 1fr 78px 78px 96px 44px; gap: var(--space-2); align-items: end; margin-bottom: var(--space-2); }
  .item-row .field { min-width: 0; }
  .item-row.no-size { grid-template-columns: 1fr 78px 96px 44px; }
  .line-sum { text-align: right; font-size: 13px; font-weight: 600; padding-bottom: 12px; font-variant-numeric: tabular-nums; }
  .order-total { display: flex; justify-content: flex-end; gap: var(--space-4); align-items: baseline; margin-top: var(--space-3); padding-top: var(--space-3); border-top: 2px solid var(--border); font-size: 18px; font-weight: 700; }
  .order-total .ot-num { color: var(--accent); font-variant-numeric: tabular-nums; }

  @media (max-width: 640px) {
    .item-row, .item-row.no-size { grid-template-columns: 1fr 1fr; }
    .item-row .line-sum { grid-column: 1 / -1; text-align: left; padding-bottom: 0; }
  }

  /* ===== ชีตเมนูเพิ่มเติม (มือถือ) ===== */
  .sheet-backdrop { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; }
  .sheet {
    background: var(--card); width: 100%; border-radius: 18px 18px 0 0;
    padding: var(--space-3) var(--space-4) calc(var(--space-5) + env(safe-area-inset-bottom, 0px));
    max-height: 80vh; overflow-y: auto;
  }
  .sheet-bar { width: 42px; height: 4px; border-radius: 999px; background: var(--border); margin: 0 auto var(--space-3); }
  .sheet-title { font-size: 13px; font-weight: 700; color: var(--sub); margin-bottom: var(--space-2); }
  .sheet-item {
    display: flex; align-items: center; gap: var(--space-3); width: 100%; min-height: 52px;
    background: none; border: none; border-radius: 12px; cursor: pointer; font-family: inherit;
    font-size: 15px; font-weight: 600; color: var(--text); text-align: left; padding: 0 var(--space-3);
  }
  .sheet-item.active, .sheet-item:hover { background: var(--accent-soft); color: var(--accent); }

  /* ===== การชำระเงิน / ใบปะหน้าพัสดุ ===== */
  .pay-line { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-2) 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .pay-line:last-child { border-bottom: none; }
  .pay-amt { font-weight: 700; color: var(--ok-text); font-variant-numeric: tabular-nums; }
  .bal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); margin-bottom: var(--space-3); }
  @media (max-width: 640px) { .bal-grid { grid-template-columns: 1fr; } }

  .ship-label {
    background: #fff; color: #1f2430; border: 2px dashed #9aa3b4; border-radius: 12px;
    padding: var(--space-5); max-width: 480px; margin: 0 auto;
  }
  .ship-from { font-size: 11px; color: #6b7280; border-bottom: 1px solid #e6e3dd; padding-bottom: var(--space-3); margin-bottom: var(--space-3); }
  .ship-to-label { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: #6b7280; }
  .ship-name { font-size: 20px; font-weight: 700; margin: 4px 0 6px; }
  .ship-addr { font-size: 15px; line-height: 1.7; white-space: pre-wrap; }
  .ship-phone { font-size: 16px; font-weight: 600; margin-top: var(--space-3); }
  .ship-foot { margin-top: var(--space-4); padding-top: var(--space-3); border-top: 1px solid #e6e3dd; font-size: 12px; color: #6b7280; display: flex; justify-content: space-between; gap: var(--space-3); }

  @media (max-width: 900px) {
    .selbar { left: 0; bottom: 76px; padding: var(--space-3) var(--space-4); }
    .receipt-paper { padding: var(--space-4); }
  }

  @media print {
    .sidebar, .bottom-nav, header, .selbar, .no-print { display: none !important; }
    .container { margin: 0 !important; padding: 0 !important; max-width: none !important; }
    .receipt-paper { border: none; max-width: none; padding: 0; }
    .ship-label { border: 2px dashed #000; max-width: none; }
    .sheet-backdrop { display: none !important; }
    body { background: #fff; padding: 0; }
  }

  .info-note {
    background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn-text);
    border-radius: var(--radius); padding: var(--space-3) var(--space-4); font-size: 12px;
    line-height: 1.6; margin-bottom: var(--space-3);
  }

  /* ===== Sidebar (จอคอม) ===== */
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; width: 220px; z-index: 20;
    background: var(--card); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: var(--space-4) var(--space-3);
  }
  .sidebar-brand { padding: var(--space-2) var(--space-3) var(--space-4); }
  .sidebar-brand .b-name { font-size: 15px; font-weight: 700; letter-spacing: .01em; }
  .sidebar-brand .b-sub { font-size: 10px; color: var(--sub); letter-spacing: .16em; text-transform: uppercase; margin-top: 2px; }
  .nav-list { display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }
  .nav-item {
    display: flex; align-items: center; gap: var(--space-3); width: 100%;
    background: none; border: none; border-radius: 10px; cursor: pointer; font-family: inherit;
    font-size: 13.5px; font-weight: 500; color: var(--sub); text-align: left;
    padding: 10px var(--space-3); min-height: 42px; transition: background .15s ease, color .15s ease;
  }
  .nav-item:hover { background: var(--accent-soft); color: var(--accent); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .nav-ico { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; flex-shrink: 0; }
  .nav-sep { height: 1px; background: var(--border); margin: var(--space-2) var(--space-3); }
  .sidebar-foot { border-top: 1px solid var(--border); padding-top: var(--space-3); margin-top: var(--space-2); }
  .theme-row {
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-2);
    padding: 8px var(--space-3); font-size: 13px; color: var(--sub);
  }
  .switch { position: relative; width: 40px; height: 24px; flex-shrink: 0; border: none; background: none; padding: 0; cursor: pointer; }
  .switch-track { display: block; width: 40px; height: 24px; border-radius: 999px; background: var(--border); transition: background .18s ease; }
  .switch-knob { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .18s ease; }
  .switch[aria-checked="true"] .switch-track { background: var(--accent); }
  .switch[aria-checked="true"] .switch-knob { transform: translateX(16px); }

  /* ===== Bottom nav (มือถือ) ===== */
  .bottom-nav { display: none; }

  .page-head { margin-bottom: var(--space-4); }
  .page-head h2 { margin: 0; font-size: 20px; font-weight: 700; }
  .page-head .page-sub { font-size: 12px; color: var(--sub); margin-top: 2px; }

  /* ===== Dashboard ===== */
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-3); margin-bottom: var(--space-4); }
  .kpi {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3);
    min-width: 0;
  }
  .kpi-top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
  .kpi-ico {
    width: 30px; height: 30px; border-radius: 9px; background: var(--accent-soft); color: var(--accent);
    display: inline-flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0;
  }
  .kpi-trend { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .kpi-trend.up { background: var(--ok-bg); color: var(--ok-text); }
  .kpi-trend.down { background: var(--warn-bg); color: var(--warn-text); }
  .kpi-trend.flat { background: var(--bg); color: var(--sub); }
  .kpi-num { font-size: 24px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kpi-lbl { font-size: 11px; color: var(--sub); letter-spacing: .04em; text-transform: uppercase; margin-top: 3px; }

  .dash-row { display: grid; grid-template-columns: 1.6fr 1fr; gap: var(--space-3); margin-bottom: var(--space-3); }
  .dash-row.thirds { grid-template-columns: repeat(2, 1fr); }
  .panel-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-4); min-width: 0; }
  .panel-card h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .panel-card .panel-sub { font-size: 11px; color: var(--sub); margin-top: 2px; margin-bottom: var(--space-3); }
  .chart-box { position: relative; height: 220px; }
  .chart-box.donut { height: 200px; }

  .mini-list { display: flex; flex-direction: column; gap: var(--space-2); max-height: 260px; overflow-y: auto; }
  .mini-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-2) 0; border-bottom: 1px solid var(--border); }
  .mini-row:last-child { border-bottom: none; }
  .mini-main { min-width: 0; }
  .mini-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini-meta { font-size: 11px; color: var(--sub); margin-top: 1px; }
  .mini-amt { font-size: 13px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mini-empty { font-size: 12px; color: var(--sub); text-align: center; padding: var(--space-5) 0; }

  /* ===== ปฏิทิน ===== */
  .cal-top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-3); flex-wrap: wrap; }
  .cal-title { font-size: 17px; font-weight: 700; }
  .cal-nav { display: flex; gap: var(--space-2); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-dow { font-size: 11px; font-weight: 600; color: var(--sub); text-align: center; padding: 4px 0; }
  .cal-cell {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    min-height: 92px; padding: 6px; display: flex; flex-direction: column; gap: 3px;
    font-family: inherit; text-align: left; cursor: pointer; min-width: 0;
    transition: border-color .15s ease;
  }
  .cal-cell:hover { border-color: var(--accent); }
  .cal-cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cal-cell.muted { opacity: .38; }
  .cal-cell.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .cal-cell.selected { background: var(--accent-soft); border-color: var(--accent); }
  .cal-daynum { font-size: 12px; font-weight: 600; }
  .cal-cell.today .cal-daynum { color: var(--accent); }
  .cal-chip {
    font-size: 10px; line-height: 1.3; padding: 2px 5px; border-radius: 5px;
    background: var(--accent-soft); color: var(--accent); font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cal-chip.unpaid { background: var(--warn-bg); color: var(--warn-text); }
  .cal-chip.lay-recv { background: var(--accent-soft); color: var(--accent); }
  .cal-chip.lay-due  { background: #e8f1fe; color: #1f5fbf; }
  .cal-chip.lay-cost { background: var(--warn-bg); color: var(--warn-text); }
  html[data-theme="dark"] .cal-chip.lay-due { background: #1b2a44; color: #8ab4f8; }
  .cal-more { font-size: 10px; color: var(--sub); }
  .cal-dot-row { display: none; gap: 3px; flex-wrap: wrap; }
  .cal-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .cal-dot.unpaid { background: var(--warn-border); }
  .cal-dot.lay-recv { background: var(--accent); }
  .cal-dot.lay-due  { background: #1f5fbf; }
  .cal-dot.lay-cost { background: var(--warn-border); }

  @media (max-width: 900px) {
    .cal-grid { gap: 4px; }
    .cal-cell { min-height: 56px; padding: 4px; align-items: center; justify-content: flex-start; }
    .cal-chip, .cal-more { display: none; }
    .cal-dot-row { display: flex; justify-content: center; }
  }

  @media (max-width: 900px) {
    .sidebar { display: none; }
    body { padding-bottom: 88px; }
    .bottom-nav {
      display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      background: var(--card); border-top: 1px solid var(--border);
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
    }
    .bottom-nav .nav-item {
      flex-direction: column; gap: 3px; flex: 1; min-width: 0; padding: 6px 2px;
      font-size: 10px; font-weight: 500; text-align: center; min-height: 52px; justify-content: center;
    }
    .bottom-nav .nav-ico { width: 22px; height: 22px; }
    .bottom-nav .nav-item span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

    .kpi-grid { grid-template-columns: repeat(2, 1fr); gap: var(--space-2); }
    .kpi { padding: var(--space-3); gap: var(--space-2); }
    .kpi-num { font-size: 19px; }
    .dash-row, .dash-row.thirds { grid-template-columns: 1fr; }
    .chart-box { height: 190px; }
  }
</style>
</head>
<body>
  <header>
    <div>
      <h1>คำนวณผ้าดิบ</h1>
      <div class="meta" id="statusMsg">กำลังโหลด...</div>
    </div>
  </header>

  <nav class="sidebar" aria-label="เมนูหลัก">
    <div class="sidebar-brand">
      <div class="b-name">Haifa Design</div>
      <div class="b-sub">Order Suite</div>
    </div>
    <div class="nav-list" id="navList"></div>
    <div class="sidebar-foot">
      <div class="theme-row">
        <span style="display:inline-flex;align-items:center;gap:8px"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.6A8.6 8.6 0 0 1 9.4 4 8.5 8.5 0 1 0 20 14.6Z"/></svg>โหมดมืด</span>
        <button class="switch" id="themeToggle" role="switch" aria-checked="false" aria-label="สลับโหมดมืด">
          <span class="switch-track"></span><span class="switch-knob"></span>
        </button>
      </div>
    </div>
  </nav>

  <div class="container" id="app">
    <div class="loading">กำลังโหลดข้อมูล...</div>
  </div>

  <nav class="bottom-nav" id="bottomNav" aria-label="เมนูหลัก (มือถือ)"></nav>

  <script>
    // ===== ตั้งค่า Supabase =====
    const SUPABASE_URL = 'https://pmcnamlesodpuynakkuk.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_qkWioinGX5ybtENThpRjLw_9R3OL_Gw';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ===== ตัวกลางรูปงานบน Google Drive (Apps Script Web App) =====
    // วาง URL ที่ได้จากการ deploy drive-images.gs ตรงนี้ (ลงท้ายด้วย /exec)
    const DRIVE_API_URL = 'https://script.google.com/macros/s/AKfycbywrr_aXf_GWT4UCHJzJMAFB_a8jxfwfP93MrhGVuQsFASQJy6TpHkmLRppdwd-Cx5syQ/exec';

    // ชื่อโฟลเดอร์ในไดรฟ์เขียนไม่เหมือนกัน (30-7-69 / 10 / 7/ 69 / 7/8/69)
    // ทำให้เป็นรูปแบบเดียวกันก่อนจับคู่ ให้ตรงกับ normalizeLotName ใน drive-images.gs
    function normalizeLotName(name) {
      return String(name == null ? '' : name)
        .replace(/[\s ]/g, '')
        .replace(/[-.]/g, '/')
        .split('/')
        .filter(p => p !== '')
        .map(p => /^\d+$/.test(p) ? String(parseInt(p, 10)) : p)
        .join('/');
    }

    // root: 'fabric' = โฟลเดอร์งานป้ายผ้า (แยกตามล็อต) · 'order' = รูปงานออเดอร์ลูกค้า (แยกตามเลขออเดอร์)
    async function driveList(lot, root) {
      if (!DRIVE_API_URL) return [];
      const url = DRIVE_API_URL + '?action=list&root=' + encodeURIComponent(root || 'fabric')
        + '&lot=' + encodeURIComponent(lot);
      const res = await fetch(url);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'โหลดรูปไม่สำเร็จ');
      return data.files || [];
    }

    async function drivePost(payload) {
      if (!DRIVE_API_URL) throw new Error('ยังไม่ได้ตั้งค่า DRIVE_API_URL');
      // ใช้ text/plain เพื่อเลี่ยง CORS preflight ที่ Apps Script รองรับไม่ได้
      const res = await fetch(DRIVE_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'ทำรายการไม่สำเร็จ');
      return data;
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onload = () => resolve(String(fr.result).split(',')[1]);
        fr.onerror = () => reject(new Error('อ่านไฟล์ไม่สำเร็จ'));
        fr.readAsDataURL(file);
      });
    }

    function buildGallery(lotName, opts) {
      const root = (opts && opts.root) || 'fabric';
      const emptyText = (opts && opts.emptyText) || 'ยังไม่มีรูปในล็อตนี้';
      const wrap = document.createElement('div');
      wrap.className = 'gallery';
      wrap.hidden = !(opts && opts.open);
      wrap.innerHTML = `
        <div class="gallery-bar">
          <label class="btn secondary btn-sm" style="display:inline-flex;align-items:center;cursor:pointer">
            ${icon('plus', 15)}เพิ่มรูป
            <input type="file" accept="image/*" multiple hidden class="gal-input">
          </label>
          <span class="gallery-msg"></span>
        </div>
        <div class="gallery-grid"></div>
      `;
      const grid = wrap.querySelector('.gallery-grid');
      const msg = wrap.querySelector('.gallery-msg');
      const input = wrap.querySelector('.gal-input');

      function setMsg(text, isErr) {
        msg.textContent = text || '';
        msg.className = 'gallery-msg' + (isErr ? ' error' : '');
      }

      function paint(files) {
        if (!files.length) {
          grid.innerHTML = '';
          grid.insertAdjacentHTML('beforebegin', '');
          grid.innerHTML = `<div class="gallery-empty">${esc(emptyText)}</div>`;
          return;
        }
        grid.innerHTML = files.map(f => `
          <div class="gallery-item">
            <a href="${esc(f.view)}" target="_blank" rel="noopener" title="${esc(f.name)}">
              <img src="${esc(f.thumb)}" alt="${esc(f.name)}" loading="lazy" referrerpolicy="no-referrer">
              <span class="gallery-fallback" hidden>${icon('image', 22)}<span class="gf-name">${esc(f.name)}</span><span class="gf-hint">เปิดในไดรฟ์</span></span>
            </a>
          </div>
        `).join('');
        // Drive บางทีไม่สร้าง thumbnail ให้ หรือจำกัดโควตาแล้วค้างไม่ตอบ
        // -> ลองลิงก์สำรอง ถ้ายังไม่ได้ (หรือค้างเกิน 12 วิ) ให้โชว์ชื่อไฟล์แทนช่องว่าง
        grid.querySelectorAll('.gallery-item img').forEach((img, i) => {
          const id = files[i].id;
          let tried = 0;
          let done = false;
          const showFallback = () => {
            if (done) return;
            done = true;
            img.hidden = true;
            const fb = img.parentElement.querySelector('.gallery-fallback');
            if (fb) fb.hidden = false;
          };
          img.addEventListener('load', () => { done = true; });
          img.addEventListener('error', () => {
            if (done) return;
            tried++;
            if (tried === 1) { img.src = 'https://lh3.googleusercontent.com/d/' + id + '=w800'; return; }
            if (tried === 2) { img.src = 'https://drive.google.com/thumbnail?id=' + id + '&sz=w400'; return; }
            showFallback();
          });
          setTimeout(() => { if (!img.complete || img.naturalWidth === 0) showFallback(); }, 12000);
        });
      }

      async function load() {
        if (!DRIVE_API_URL) {
          grid.innerHTML = `<div class="gallery-empty">ยังไม่ได้เชื่อมต่อ Google Drive — ดูขั้นตอนใน CLAUDE.md</div>`;
          return;
        }
        setMsg('กำลังโหลดรูป...');
        try {
          paint(await driveList(lotName, root));
          setMsg('');
        } catch (e) { setMsg(e.message, true); }
      }

      input.addEventListener('change', async () => {
        const files = Array.from(input.files || []);
        if (!files.length) return;
        for (let i = 0; i < files.length; i++) {
          setMsg('กำลังอัปโหลด ' + (i + 1) + '/' + files.length + '...');
          try {
            await drivePost({
              action: 'upload', root, lot: lotName,
              filename: files[i].name, mimeType: files[i].type,
              data: await fileToBase64(files[i]),
            });
          } catch (e) { setMsg(e.message, true); input.value = ''; return; }
        }
        input.value = '';
        await load();
        setMsg('อัปโหลดเรียบร้อย');
      });

      wrap.__load = load;
      return wrap;
    }

    // ===== ชุดไอคอน SVG =====
    // เส้นเดียวกันหมด (24px grid, stroke 1.8, ปลายมน) ใช้ currentColor เปลี่ยนสีตามธีมได้

    function icon(name, size) {
      const s = size || 18;
      return '<svg class="ic" viewBox="0 0 24 24" width="' + s + '" height="' + s + '" fill="none" ' +

    // ===== logic คำนวณ (ย้ายมาจาก calc.js) =====
    function round2(n) { return Math.round(n * 100) / 100; }
    function round4(n) { return Math.round(n * 10000) / 10000; }
    function calcPiece(widthCm, lengthCm, settings) {
      const shrinkLength = round2(lengthCm * settings.shrink_rate);
      const yardPerPiece = round4((widthCm * shrinkLength) / settings.yard_area_cm2);
      const price = Math.round(widthCm * lengthCm * settings.price_rate);
      return { shrinkLength, yardPerPiece, price };
    }
    function lotSortKey(name) {
      const m = name.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
      if (!m) return -1;
      return parseInt(m[3]) * 10000 + parseInt(m[2]) * 100 + parseInt(m[1]);
    }
    function fmtBaht(n) { return Number(n).toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 0 }); }

    const THAI_MONTHS = ['', 'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];

    function todayKey() {
      const now = new Date();
      const yy = (now.getFullYear() + 543) % 100;
      const m = now.getMonth() + 1;
      const d = now.getDate();
      return yy * 10000 + m * 100 + d;
    }
    function todayLabel() {
      const now = new Date();
      const yy = (now.getFullYear() + 543) % 100;
      return now.getDate() + '/' + (now.getMonth() + 1) + '/' + yy;
    }
    function parseLotYM(name) {
      const m = name.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
      if (!m) return null;
      let yy = parseInt(m[3]);
      if (yy >= 100) yy = yy % 100;
      return { month: parseInt(m[2]), yy };
    }

      if (key === 'dashboard') return { label: 'แดชบอร์ด', icon: 'dashboard' };

      if (key === 'fabric') return { label: 'ต้นทุนผลิต (ป้ายผ้า)', icon: 'factory' };

    // ===== URL routing (ทำให้กดค้าง/คลิกขวา → เปิดในแท็บใหม่ได้ และปุ่ม back ใช้งานได้) =====
    const VALID_VIEWS = ['dashboard', 'calendar', 'orders', 'products', 'fabric', 'customers', 'receipts'];

    function routeFor(view, id) {
      if (view === 'orderView') return '#/order/' + id;
      if (view === 'receiptView') return '#/receipt/' + id;
      return '#/' + view;
    }

    function currentHash() {
      if (currentView === 'orderView') return routeFor('orderView', viewingOrderId);
      if (currentView === 'receiptView') return routeFor('receiptView', viewingReceiptId);
      return '#/' + currentView;
    }

    let suppressHash = false;
    function syncHash() {
      const h = currentHash();
      if (location.hash !== h) {
        suppressHash = true;
        location.hash = h;
        setTimeout(() => { suppressHash = false; }, 0);
      }
    }

    function applyHash() {
      const raw = (location.hash || '').replace(/^#\/?/, '');
      if (!raw) { currentView = 'dashboard'; return; }
      const [seg, id] = raw.split('/');
      if (seg === 'order' && id) { currentView = 'orderView'; viewingOrderId = id; return; }
      if (seg === 'receipt' && id) { currentView = 'receiptView'; viewingReceiptId = id; return; }
      currentView = VALID_VIEWS.includes(seg) ? seg : 'dashboard';
    }

    window.addEventListener('hashchange', () => {
      if (suppressHash) return;
      applyHash();
      boot();
    });

    function renderNav() {
      const list = document.getElementById('navList');
      list.innerHTML = NAV_ITEMS.map(it => it.sep

        : `<a class="nav-item ${currentView === it.key ? 'active' : ''}" href="${routeFor(it.key)}" data-key="${it.key}">

           </a>`
      ).join('');

      const bottom = document.getElementById('bottomNav');
      const moreActive = MOBILE_MORE.includes(currentView);
      bottom.innerHTML = MOBILE_NAV.map(k => {
        const m = viewMeta(k);
        const label = k === 'fabric' ? 'ต้นทุนผลิต' : m.label;
        return `<a class="nav-item ${currentView === k ? 'active' : ''}" href="${routeFor(k)}" data-key="${k}">
                  <span class="nav-ico">${icon(m.icon, 21)}</span><span>${esc(label)}</span>
                </a>`;
      }).join('') + `
        <button class="nav-item ${moreActive ? 'active' : ''}" id="moreBtn">
          <span class="nav-ico">${icon('more', 21)}</span><span>เพิ่มเติม</span>
        </button>`;

      // ลิงก์เปลี่ยนหน้าเองผ่าน hash — ไม่ต้องผูก click (จะได้กดค้างเปิดแท็บใหม่ได้)
      document.getElementById('moreBtn')?.addEventListener('click', openMoreSheet);
    }

    function openMoreSheet() {
      document.getElementById('moreSheet')?.remove();
      const wrap = document.createElement('div');
      wrap.id = 'moreSheet';
      wrap.className = 'sheet-backdrop no-print';
      wrap.innerHTML = `
        <div class="sheet">
          <div class="sheet-bar"></div>
          <div class="sheet-title">เมนูเพิ่มเติม</div>
          ${MOBILE_MORE.map(k => {
            const m = viewMeta(k);
            return `<button class="sheet-item ${currentView === k ? 'active' : ''}" data-key="${k}">
                      <span class="nav-ico">${icon(m.icon, 20)}</span><span>${esc(m.label)}</span>
                    </button>`;
          }).join('')}
          <button class="btn secondary block" id="sheetClose" style="margin-top:var(--space-3)">ปิด</button>
        </div>
      `;
      document.body.appendChild(wrap);
      const close = () => wrap.remove();
      wrap.addEventListener('click', (e) => { if (e.target === wrap) close(); });
      wrap.querySelector('#sheetClose').addEventListener('click', close);
      wrap.querySelectorAll('.sheet-item').forEach(b => b.addEventListener('click', () => {
        currentView = b.dataset.key; close(); boot();
      }));
    }

    function updateHeaderTitle() {
      const m = viewMeta(currentView);
      document.querySelector('header h1').innerHTML =
        (m.icon ? icon(m.icon, 20) : '') + '<span>' + esc(m.label) + '</span>';

      dashCharts.forEach(c => { try { c.destroy(); } catch (e) {} });
      dashCharts = [];

    function buildPageHead(title, sub) {
      const el = document.createElement('div');
      el.className = 'page-head';

      return el;
    }

    // ---- Theme ----
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      const t = document.getElementById('themeToggle');
      if (t) t.setAttribute('aria-checked', theme === 'dark' ? 'true' : 'false');
      try { localStorage.setItem('theme', theme); } catch (e) {}
    }
    function initTheme() {
      let saved = 'light';
      try { saved = localStorage.getItem('theme') || 'light'; } catch (e) {}
      applyTheme(saved);
      document.getElementById('themeToggle').addEventListener('click', () => {
        const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        applyTheme(next);
        if (currentView === 'dashboard') boot();
      });
    }

    async function boot() {
      syncHash();

      if (currentView !== 'fabric' && selectedPieces.size) selectedPieces.clear();
      renderSelBar();
      document.getElementById('receiptForm')?.remove();
      updateHeaderTitle();
      renderNav();
      document.getElementById('app').innerHTML = '<div class="loading">กำลังโหลดข้อมูล...</div>';
      try {
        if (currentView === 'dashboard') {
          await loadDashboard();
        } else if (currentView === 'calendar') {
          await loadCalendar();
        } else if (currentView === 'fabric') {
          await loadAll();
        } else if (currentView === 'customers') {
          await loadGlobalCustomers();
        } else if (currentView === 'receipts') {
          await loadReceipts();
        } else if (currentView === 'receiptView') {
          await loadReceiptDetail(viewingReceiptId);
        } else if (currentView === 'orders') {
          await loadOrders();
        } else if (currentView === 'orderView') {
          await loadOrderDetail(viewingOrderId);
        } else if (currentView === 'products') {
          await loadProductCatalog();
        } else {
          await loadProducts(currentView);

        document.getElementById('statusMsg').textContent = 'โหลดไม่สำเร็จ: ' + err.message;

    // ===== แดชบอร์ดรวม =====
    async function loadDashboard() {
      document.getElementById('statusMsg').textContent = 'กำลังโหลด...';
      SETTINGS = await loadSettings();
      const [lotsRes, piecesRes, ordersRes, salesRes] = await Promise.all([
        sb.from('lots').select('id,name'),
        sb.from('pieces').select('id,lot_id,width_cm,length_cm,label,price,paid'),
        sb.from('product_orders').select('id,category,name,customer,quantity,unit_cost,paid,created_at'),
        sb.from('orders').select('id,order_no,customer,channel,status,total,paid_amount,due_date,created_at'),
      ]);
      if (lotsRes.error) throw lotsRes.error;
      if (piecesRes.error) throw piecesRes.error;
      if (ordersRes.error) throw ordersRes.error;
      if (salesRes.error) throw salesRes.error;
      renderDashboard(lotsRes.data, piecesRes.data, ordersRes.data, salesRes.data);
      document.getElementById('statusMsg').textContent = 'อัปเดตล่าสุด: ' + new Date().toLocaleString('th-TH');
    }

    function renderDashboard(lots, pieces, orders, sales) {

      // ===== ฝั่งขาย (ออเดอร์) =====
      const now2 = new Date();
      const salesThisMonth = sales.filter(s => {
        const d = new Date(s.created_at);
        return d.getFullYear() === now2.getFullYear() && d.getMonth() === now2.getMonth() && s.status !== 'cancelled';
      });
      const salesTotal = salesThisMonth.reduce((s, o) => s + Number(o.total), 0);
      const activeOrders = sales.filter(s => s.status !== 'paid' && s.status !== 'cancelled');
      const custOutstanding = sales
        .filter(s => s.status !== 'cancelled')
        .reduce((s, o) => s + Math.max(0, Number(o.total) - Number(o.paid_amount || 0)), 0);
      const dueSoon = sales.filter(s => {
        if (!s.due_date || s.status === 'paid' || s.status === 'cancelled') return false;
        const diff = (new Date(s.due_date) - new Date(new Date().toDateString())) / 86400000;
        return diff >= 0 && diff <= 7;
      });

      const salesHead = document.createElement('h2');
      salesHead.className = 'section-title';
      salesHead.style.marginTop = '0';
      salesHead.innerHTML = icon('clipboard', 17) + 'ฝั่งขาย (ออเดอร์)';
      app.appendChild(salesHead);

      const salesKpi = document.createElement('div');
      salesKpi.className = 'kpi-grid';
      salesKpi.innerHTML = `

      const all = flattenOrders(lots, pieces, orders);

      const now = new Date();
      const inMonth = (d, offset) => {
        if (!d) return false;
        const t = new Date(now.getFullYear(), now.getMonth() + offset, 1);
        return d.getFullYear() === t.getFullYear() && d.getMonth() === t.getMonth();
      };

      const unpaid = all.filter(r => !r.paid);

      const bufferYard = round4(totalYard * SETTINGS.buffer_rate);

      const thisSum = sum(thisMonth), lastSum = sum(lastMonth);
      const pct = lastSum > 0 ? Math.round(((thisSum - lastSum) / lastSum) * 100) : null;
      const trendCls = pct === null ? 'flat' : (pct >= 0 ? 'up' : 'down');

        </div>

          <div><div class="kpi-num">${all.length}</div><div class="kpi-lbl">ออเดอร์ทั้งหมด</div></div>
        </div>

          <div><div class="kpi-num">${bufferYard.toFixed(2)}</div><div class="kpi-lbl">ผ้าที่ต้องสั่ง (หลา)</div></div>

      // แถวกราฟ
      const row1 = document.createElement('div');
      row1.className = 'dash-row';
      row1.innerHTML = `
        <div class="panel-card">
          <h3>ยอดออเดอร์ 7 วันล่าสุด</h3>

      // แถวลิสต์

      const oldestUnpaid = unpaid.slice().sort((a, b) => (a.date ? a.date.getTime() : 0) - (b.date ? b.date.getTime() : 0)).slice(0, 8);

      const row2 = document.createElement('div');
      row2.className = 'dash-row thirds';
      row2.innerHTML = `
        <div class="panel-card">
          <h3>ออเดอร์วันนี้</h3>
          <div class="panel-sub">${todayItems.length} รายการ</div>
          <div class="mini-list">${todayItems.length ? todayItems.map(miniRow).join('') : '<div class="mini-empty">ยังไม่มีออเดอร์วันนี้</div>'}</div>
        </div>
        <div class="panel-card">
          <h3>ค้างชำระนานสุด</h3>
          <div class="panel-sub">${unpaid.length} รายการที่ยังไม่จ่าย</div>
          <div class="mini-list">${oldestUnpaid.length ? oldestUnpaid.map(miniRow).join('') : '<div class="mini-empty">ไม่มียอดค้างชำระ</div>'}</div>
        </div>

      app.appendChild(row2);

      drawCharts(all);

    // ===== ข้อมูลร้าน / ช่องทางชำระเงิน =====
    let SHOP = {};

    async function fetchShopInfo() {
      if (Object.keys(SHOP).length) return SHOP;
      try {
        const { data } = await sb.from('shop_info').select('key,value');
        (data || []).forEach(r => { SHOP[r.key] = r.value; });
      } catch (e) { /* ไม่มีข้อมูลร้านไม่ควรทำให้หน้าเว็บพัง */ }
      return SHOP;
    }

    /** กล่องเลขบัญชี ใช้ในใบออเดอร์/ใบเสร็จ (โชว์เฉพาะตอนมีข้อมูล) */
    function bankBlockHTML() {
      if (!SHOP.account_no) return '';
      return `<div class="pay-block">
        <div class="pay-title">${icon('wallet', 15)}ช่องทางชำระเงิน</div>
        <div class="pay-line">ธนาคาร ${esc(SHOP.bank_name || '')}</div>
        <div class="pay-line">ชื่อบัญชี ${esc(SHOP.account_name || '')}</div>
        <div class="pay-acc">${esc(SHOP.account_no)}</div>
      </div>`;
    }

    // ===== สินค้า & ราคาขาย =====
    let PRODUCTS = [];

    async function fetchProducts() {
      const { data, error } = await sb.from('products')
        .select('id,name,category,pricing_mode,unit_price,area_rate,tiers,unit,note,active,width_cm,length_cm,sort_order')
        .eq('active', true)
        .order('sort_order').order('created_at');
      if (error) throw error;
      PRODUCTS = data;
      return data;
    }

    /** ราคาขั้นบันได: เลือกช่วงที่จำนวนถึงเกณฑ์สูงสุด (ต่ำกว่าขั้นแรกใช้ราคาขั้นแรก) */
    function tierList(p) {
      const t = Array.isArray(p.tiers) ? p.tiers.slice() : [];
      return t.sort((a, b) => Number(a.min_qty) - Number(b.min_qty));
    }

    function tierPrice(p, qty) {
      const t = tierList(p);
      if (!t.length) return Number(p.unit_price || 0);
      let price = Number(t[0].price);
      t.forEach(x => { if (qty >= Number(x.min_qty)) price = Number(x.price); });
      return price;
    }

    /** แปลง "100=4.5, 700=4, 1000=3.5" -> array | null */
    function parseTierText(txt) {
      const out = [];
      String(txt || '').split(/[,\n]/).forEach(part => {
        const m = part.trim().match(/^(\d+)\s*=\s*([\d.]+)$/);
        if (m) out.push({ min_qty: parseInt(m[1], 10), price: parseFloat(m[2]) });
      });
      return out.length ? out.sort((a, b) => a.min_qty - b.min_qty) : null;
    }

    function tierText(p) {
      return tierList(p).map(t => t.min_qty + '=' + t.price).join(', ');
    }

    function productOptionLabel(p) {
      let price;
      if (p.pricing_mode === 'per_area') price = fmtBaht(p.area_rate) + ' บ./ตร.ซม.';
      else if (p.pricing_mode === 'tier') {
        const t = tierList(p);
        price = t.length ? t[t.length - 1].price + '–' + t[0].price + ' บ./' + p.unit + ' (ตามจำนวน)' : '—';
      } else price = fmtBaht(p.unit_price || 0) + ' บ.';
      return p.name + ' — ' + price + (p.note === 'ขนาดขายดี' ? ' ★' : '');
    }

    /** ตัวเลือกสินค้าในฟอร์มออเดอร์ จัดกลุ่มตามหมวด (optgroup) */
    function productOptionsHTML() {
      const groups = new Map();
      PRODUCTS.forEach(p => {
        const key = p.category || 'อื่นๆ';
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(p);
      });
      return [...groups.entries()].map(([cat, items]) => {
        const opts = items
          .slice()
          .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0))
          .map(p => `<option value="${p.id}">${esc(productOptionLabel(p))}</option>`)
          .join('');
        return `<optgroup label="${esc(cat)}">${opts}</optgroup>`;
      }).join('');
    }

    async function loadProductCatalog() {
      document.getElementById('statusMsg').textContent = 'กำลังโหลด...';
      renderProductCatalog(await fetchProducts());
      document.getElementById('statusMsg').textContent = 'อัปเดตล่าสุด: ' + new Date().toLocaleString('th-TH');
    }

    function priceLabel(p) {
      if (p.pricing_mode === 'per_area') return fmtBaht(p.area_rate) + ' บาท/ตร.ซม.';
      if (p.pricing_mode === 'tier') {
        const t = tierList(p);
        return t.length
          ? t.map(x => Number(x.min_qty).toLocaleString('th-TH') + '+ = ' + x.price).join(' · ') + ' บาท/' + p.unit
          : 'ยังไม่ได้ตั้งขั้นราคา';
      }
      return fmtBaht(p.unit_price || 0) + ' บาท/' + p.unit;
    }

        if (error) { msg.textContent = 'บันทึกไม่สำเร็จ: ' + error.message; msg.className = 'msg error'; return; }
        rows.forEach(r => { SHOP[r.key] = r.value; });
        msg.textContent = 'บันทึกแล้ว'; msg.className = 'msg ok';
      });

      app.querySelectorAll('.del-product').forEach(b => b.addEventListener('click', async () => {
        if (!confirm('ลบสินค้านี้? (ออเดอร์เก่ายังเก็บราคาเดิมไว้ ไม่กระทบ)')) return;
        const { error } = await sb.from('products').delete().eq('id', b.dataset.id);
        if (error) { alert('ลบไม่สำเร็จ: ' + error.message); return; }
        await loadProductCatalog();
      }));

      app.querySelectorAll('.edit-product').forEach(b => b.addEventListener('click', () => {
        const tr = b.closest('tr');
        const d = b.dataset;
        tr.innerHTML = `<td colspan="4"><div class="edit-row">
          <input class="e-name" value="${esc(d.name)}" placeholder="ชื่อสินค้า" aria-label="ชื่อสินค้า">
          <input class="e-cat" value="${esc(d.cat)}" placeholder="หมวด" aria-label="หมวด">
          <input class="e-unit" value="${esc(d.unit)}" placeholder="หน่วย" aria-label="หน่วย">
          <select class="e-mode" aria-label="วิธีคิดราคา">
            <option value="fixed" ${d.mode === 'fixed' ? 'selected' : ''}>ตายตัว</option>
            <option value="per_area" ${d.mode === 'per_area' ? 'selected' : ''}>ตามขนาด</option>
            <option value="tier" ${d.mode === 'tier' ? 'selected' : ''}>ตามจำนวน</option>
          </select>
          <input class="e-price" type="number" step="any" min="0" value="${d.price}" placeholder="ราคา" aria-label="ราคา">
          <input class="e-tiers" value="${esc(d.tiers || '')}" placeholder="100=4.5, 700=4, 1000=3.5" aria-label="ขั้นราคา" style="${d.mode === 'tier' ? '' : 'display:none'}">
          <button class="btn btn-sm e-save">${icon('check', 15)}บันทึก</button>
          <button class="btn secondary btn-sm e-cancel">${icon('close', 15)}ยกเลิก</button>
        </div></td>`;
        tr.querySelector('.e-cancel').addEventListener('click', () => loadProductCatalog());
        tr.querySelector('.e-mode').addEventListener('change', (e) => {
          tr.querySelector('.e-tiers').style.display = e.target.value === 'tier' ? '' : 'none';
        });
        tr.querySelector('.e-save').addEventListener('click', async () => {
          const mode = tr.querySelector('.e-mode').value;
          const price = parseFloat(tr.querySelector('.e-price').value) || 0;
          const { error } = await sb.from('products').update({
            name: tr.querySelector('.e-name').value.trim(),
            category: tr.querySelector('.e-cat').value.trim() || null,
            unit: tr.querySelector('.e-unit').value.trim() || 'ชิ้น',
            pricing_mode: mode,
            unit_price: mode === 'per_area' ? null : price,
            area_rate: mode === 'per_area' ? price : null,
            tiers: mode === 'tier' ? parseTierText(tr.querySelector('.e-tiers').value) : null,
          }).eq('id', d.id);
          if (error) { alert('บันทึกไม่สำเร็จ: ' + error.message); return; }
          await loadProductCatalog();
        });
      }));
    }

    // ===== ประวัติการแก้ไข =====
    const ACTION_META = {
      created:        { label: 'สร้าง',        cls: 'st-new' },
      updated:        { label: 'แก้ไข',        cls: 'st-prod' },
      status:         { label: 'เปลี่ยนสถานะ', cls: 'st-deliv' },
      payment:        { label: 'รับเงิน',      cls: 'st-paid' },
      payment_delete: { label: 'ลบรายการเงิน', cls: 'st-cancel' },
      receipt:        { label: 'ออกใบเสร็จ',   cls: 'st-paid' },
      deleted:        { label: 'ลบ',           cls: 'st-cancel' },
    };

    async function logActivity(entityType, entityId, label, action, detail) {
      try {
        await sb.from('activity_log').insert({
          entity_type: entityType, entity_id: entityId || null,
          entity_label: label || null, action, detail: detail || null,
        });
      } catch (e) { /* บันทึกประวัติล้มเหลวไม่ควรทำให้งานหลักพัง */ }
    }

    function buildHistoryPanel(logs) {
      const panel = document.createElement('div');
      panel.className = 'panel no-print';
      panel.innerHTML = `
        <h2>${icon('clock', 17)}ประวัติการแก้ไข</h2>
        ${logs.length ? logs.map(l => {
          const m = ACTION_META[l.action] || { label: l.action, cls: 'st-cancel' };
          const d = new Date(l.created_at);
          return `<div class="pay-line">
            <span style="min-width:0">
              <span class="st ${m.cls}">${esc(m.label)}</span>
              <span style="margin-left:8px">${esc(l.detail || '')}</span>
            </span>
            <span style="font-size:11px;color:var(--sub);white-space:nowrap">
              ${d.toLocaleDateString('th-TH')} ${d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })}
            </span>
          </div>`;
        }).join('') : '<div class="hint" style="margin:0">ยังไม่มีประวัติ</div>'}
      `;
      return panel;
    }

    // ===== ออเดอร์ (รับออเดอร์ลูกค้า) =====
    async function nextOrderNo() {
      const now = new Date();
      const prefix = 'OD' + String((now.getFullYear() + 543) % 100) + String(now.getMonth() + 1).padStart(2, '0');
      const { data } = await sb.from('orders').select('order_no').like('order_no', prefix + '%')
        .order('order_no', { ascending: false }).limit(1);
      let run = 1;
      if (data && data.length) {
        const m = String(data[0].order_no).match(/-(\d+)$/);
        if (m) run = parseInt(m[1]) + 1;
      }
      return prefix + '-' + String(run).padStart(3, '0');
    }

    async function loadOrders() {
      document.getElementById('statusMsg').textContent = 'กำลังโหลด...';
      const [ordRes] = await Promise.all([
        sb.from('orders').select('id,order_no,customer,channel,status,due_date,total,created_at')
          .order('created_at', { ascending: false }),
        fetchProducts(),
      ]);
      if (ordRes.error) throw ordRes.error;
      renderOrders(ordRes.data);
      document.getElementById('statusMsg').textContent = 'อัปเดตล่าสุด: ' + new Date().toLocaleString('th-TH');
    }

    function renderOrders(list) {
      const app = document.getElementById('app');
      app.innerHTML = '';
      app.appendChild(buildPageHead('ออเดอร์', 'รับออเดอร์ลูกค้าจากทุกช่องทาง'));

      const bar = document.createElement('div');
      bar.style.cssText = 'display:flex;gap:var(--space-2);flex-wrap:wrap;margin-bottom:var(--space-4)';
      bar.innerHTML = `
        <button class="btn" id="newOrder">${icon('plus', 16)}สร้างออเดอร์ใหม่</button>
        <button class="btn secondary" id="goProducts">${icon('price', 16)}จัดการสินค้า & ราคา</button>
      `;
      app.appendChild(bar);
      bar.querySelector('#newOrder').addEventListener('click', openOrderForm);
      bar.querySelector('#goProducts').addEventListener('click', () => { currentView = 'products'; boot(); });

      const open = list.filter(o => o.status !== 'paid' && o.status !== 'cancelled');
      const unpaidTotal = open.reduce((s, o) => s + Number(o.total), 0);
      const sum = document.createElement('div');
      sum.className = 'summary-grid';
      sum.innerHTML = `
        <div class="stat"><div class="num">${open.length}</div><div class="lbl">ออเดอร์ที่ยังไม่ปิด</div></div>
        <div class="stat"><div class="num">${fmtBaht(round2(unpaidTotal))}</div><div class="lbl">ยอดรอเก็บ (บาท)</div></div>
      `;
      app.appendChild(sum);

      const chips = document.createElement('div');
      chips.className = 'chips';
      const filters = [['all', 'ทั้งหมด']].concat(Object.entries(ORDER_STATUS).map(([k, v]) => [k, v.label]));
      chips.innerHTML = filters.map(([k, label]) => {
        const n = k === 'all' ? list.length : list.filter(o => o.status === k).length;
        return `<button class="chip ${orderFilter === k ? 'active' : ''}" data-f="${k}">${esc(label)} (${n})</button>`;
      }).join('');
      app.appendChild(chips);
      chips.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
        orderFilter = c.dataset.f;
        renderOrders(list);
      }));

      const shown = orderFilter === 'all' ? list : list.filter(o => o.status === orderFilter);
      if (!shown.length) {
        const e = document.createElement('div');
        e.className = 'loading';
        e.textContent = list.length ? 'ไม่มีออเดอร์ในสถานะนี้' : 'ยังไม่มีออเดอร์ — กด "สร้างออเดอร์ใหม่" เพื่อเริ่ม';
        app.appendChild(e);
        return;
      }

      shown.forEach(o => {
        const st = ORDER_STATUS[o.status] || ORDER_STATUS.new;
        const btn = document.createElement('a');
        btn.className = 'ord-row';
        btn.href = routeFor('orderView', o.id);
        btn.innerHTML = `
          <span class="ord-main">
            <span class="ord-top">
              <span class="ord-no">${esc(o.order_no)}</span>
              <span class="st ${st.cls}">${esc(st.label)}</span>
              ${o.channel ? `<span class="st st-cancel">${esc(o.channel)}</span>` : ''}
            </span>
            <span class="ord-sub">${o.customer ? esc(o.customer) + ' · ' : ''}${new Date(o.created_at).toLocaleDateString('th-TH')}${o.due_date ? ' · ส่ง ' + new Date(o.due_date).toLocaleDateString('th-TH') : ''}</span>
          </span>
          <span class="ord-amt">${fmtBaht(round2(o.total))} บาท</span>
        `;
        app.appendChild(btn);
      });
    }

    // ---- ฟอร์มสร้างออเดอร์ ----
    function openOrderForm(editOrder, editItems) {
      const isEdit = !!editOrder;
      const app = document.getElementById('app');
      app.innerHTML = '';
      app.appendChild(buildPageHead(
        isEdit ? 'แก้ไขออเดอร์ ' + editOrder.order_no : 'สร้างออเดอร์ใหม่',
        isEdit ? 'เพิ่ม/ลบรายการได้ ยอดรวมคำนวณใหม่อัตโนมัติ' : 'เลือกสินค้าจากรายการราคา หรือพิมพ์รายการเองก็ได้'
      ));

      const back = document.createElement('button');
      back.className = 'btn secondary btn-sm';
      back.style.marginBottom = 'var(--space-3)';
      back.innerHTML = icon('back', 15) + (isEdit ? 'ยกเลิกการแก้ไข' : 'กลับไปรายการออเดอร์');
      back.addEventListener('click', () => {
        if (isEdit) { currentView = 'orderView'; }
        else { currentView = 'orders'; }
        boot();
      });
      app.appendChild(back);

      const head = document.createElement('div');
      head.className = 'panel';
      head.innerHTML = `
        <div class="form-grid">
          <div class="field"><label for="oCust">ชื่อลูกค้า</label><input id="oCust" placeholder="ไม่บังคับ" value="${isEdit ? esc(editOrder.customer || '') : ''}"></div>
          <div class="field">
            <label for="oChan">ช่องทาง</label>
            <select id="oChan">${CHANNELS.map(c => `<option ${isEdit && editOrder.channel === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
          </div>
          <div class="field"><label for="oDue">กำหนดส่ง</label><input id="oDue" type="date" value="${isEdit ? (editOrder.due_date || '') : ''}"></div>
          <div class="field"><label for="oPhone">เบอร์โทร</label><input id="oPhone" placeholder="เพิ่มทีหลังได้" value="${isEdit ? esc(editOrder.phone || '') : ''}"></div>
          <div class="field">
            <label for="oPay">ช่องทางชำระ</label>
            <select id="oPay">
              <option value="">— ยังไม่ระบุ —</option>
              ${PAY_METHODS.map(m => `<option ${isEdit && editOrder.payment_method === m ? 'selected' : ''}>${esc(m)}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label for="oNote">หมายเหตุ</label><input id="oNote" placeholder="ไม่บังคับ" value="${isEdit ? esc(editOrder.note || '') : ''}"></div>
        </div>
        <div class="field" style="margin-top:var(--space-3)">
          <label for="oAddr">ที่อยู่จัดส่ง (เพิ่มทีหลังได้)</label>
          <input id="oAddr" placeholder="บ้านเลขที่ ถนน ตำบล อำเภอ จังหวัด รหัสไปรษณีย์" value="${isEdit ? esc(editOrder.address || '') : ''}">
        </div>
      `;
      app.appendChild(head);

      const itemsPanel = document.createElement('div');
      itemsPanel.className = 'panel';
      itemsPanel.innerHTML = `
        <h2>${icon('clipboard', 17)}รายการในออเดอร์</h2>
        <div id="itemList"></div>
        <button class="btn secondary btn-sm" id="addItem">${icon('plus', 15)}เพิ่มรายการ</button>
        <div class="order-total"><span>ยอดรวม</span><span class="ot-num" id="ordTotal">0 บาท</span></div>
      `;
      app.appendChild(itemsPanel);

      const foot = document.createElement('div');
      foot.style.cssText = 'display:flex;gap:var(--space-2);margin-top:var(--space-4)';
      foot.innerHTML = `<button class="btn block" id="saveOrder">${icon('check', 16)}${isEdit ? 'บันทึกการแก้ไข' : 'บันทึกออเดอร์'}</button>`;
      app.appendChild(foot);
      const msg = document.createElement('div');
      msg.className = 'msg';
      app.appendChild(msg);

      const list = itemsPanel.querySelector('#itemList');
      const totalEl = itemsPanel.querySelector('#ordTotal');

      function recalcAll() {
        let total = 0;
        list.querySelectorAll('.item-row').forEach(row => { total += calcRow(row); });
        totalEl.textContent = fmtBaht(round2(total)) + ' บาท';
        return total;
      }

      function calcRow(row) {
        const sel = row.querySelector('.i-prod');
        const p = PRODUCTS.find(x => x.id === sel.value);
        const qty = parseInt(row.querySelector('.i-qty').value) || 0;
        const w = parseFloat(row.querySelector('.i-w')?.value) || 0;
        const l = parseFloat(row.querySelector('.i-l')?.value) || 0;
        let unit;
        if (p && p.pricing_mode === 'per_area') {
          unit = Math.round(w * l * Number(p.area_rate || 0));
          row.querySelector('.i-price').value = unit;
        } else if (p && p.pricing_mode === 'tier') {
          unit = tierPrice(p, qty);
          row.querySelector('.i-price').value = unit;
          const hint = row.querySelector('.i-tier-hint');
          if (hint) hint.textContent = priceLabel(p);
        } else {
          unit = parseFloat(row.querySelector('.i-price').value) || 0;
        }
        const line = Math.round(unit * qty);
        row.querySelector('.line-sum').textContent = fmtBaht(line) + ' บาท';
        row.dataset.line = line;
        row.dataset.unit = unit;
        return line;
      }

      function addRow(init) {
        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `
          <div class="field">
            <label>สินค้า</label>
            <select class="i-prod">
              <option value="">— ขนาดพิเศษ / พิมพ์เอง —</option>
              ${productOptionsHTML()}
            </select>
            <input class="i-name" placeholder="ชื่อรายการ / ขนาดที่ลูกค้าต้องการ" aria-label="ชื่อรายการ" style="margin-top:6px">
            <div class="i-tier-hint hint" style="display:none;margin-top:4px"></div>
          </div>
          <div class="field i-size"><label>กว้าง</label><input class="i-w" type="number" min="0" step="any" placeholder="ซม." inputmode="decimal"></div>
          <div class="field i-size"><label>ยาว</label><input class="i-l" type="number" min="0" step="any" placeholder="ซม." inputmode="decimal"></div>
          <div class="field"><label>จำนวน</label><input class="i-qty" type="number" min="1" value="1" inputmode="numeric"></div>
          <div class="field"><label>ราคา/หน่วย</label><input class="i-price" type="number" min="0" step="any" value="0" inputmode="decimal"></div>
          <div class="line-sum">0 บาท</div>
          <button class="icon-btn icon-btn-delete i-del" aria-label="ลบรายการ" title="ลบรายการ">${icon('trash', 18)}</button>
        `;
        list.appendChild(row);

        const sel = row.querySelector('.i-prod');
        const nameInput = row.querySelector('.i-name');
        function syncMode() {
          const p = PRODUCTS.find(x => x.id === sel.value);
          const perArea = p && p.pricing_mode === 'per_area';
          const tier = p && p.pricing_mode === 'tier';
          // โชว์ช่องขนาดเมื่อ: คิดตามพื้นที่ หรือ ขนาดพิเศษ (พิมพ์เอง)
          const showSize = perArea || !p;
          row.querySelectorAll('.i-size').forEach(el => { el.style.display = showSize ? '' : 'none'; });
          row.classList.toggle('no-size', !showSize);
          row.querySelector('.i-price').readOnly = !!(perArea || tier);
          nameInput.style.display = sel.value ? 'none' : '';
          const hint = row.querySelector('.i-tier-hint');
          hint.style.display = tier ? '' : 'none';
          if (tier) hint.textContent = priceLabel(p);
          if (p && p.pricing_mode === 'fixed') {
            row.querySelector('.i-price').value = p.unit_price || 0;
            // สินค้าที่มีขนาดกำหนดไว้แล้ว ให้ใช้ขนาดนั้น
            row.querySelector('.i-w').value = p.width_cm ?? '';
            row.querySelector('.i-l').value = p.length_cm ?? '';
          }
          recalcAll();
        }
        sel.addEventListener('change', syncMode);
        row.querySelectorAll('input').forEach(i => i.addEventListener('input', recalcAll));
        row.querySelector('.i-del').addEventListener('click', () => { row.remove(); recalcAll(); });

        if (init) {
          // สินค้าที่เคยเลือกไว้อาจถูกลบไปแล้ว -> ตกเป็นรายการพิมพ์เอง ราคาเดิมยังอยู่
          const stillExists = init.product_id && PRODUCTS.some(p => p.id === init.product_id);
          sel.value = stillExists ? init.product_id : '';
          syncMode();
          if (!stillExists) nameInput.value = init.name || '';
          row.querySelector('.i-w').value = init.width_cm ?? '';
          row.querySelector('.i-l').value = init.length_cm ?? '';
          row.querySelector('.i-qty').value = init.qty ?? 1;
          if (!row.querySelector('.i-price').readOnly) row.querySelector('.i-price').value = init.unit_price ?? 0;
          recalcAll();
        } else {
          syncMode();
        }
      }

      itemsPanel.querySelector('#addItem').addEventListener('click', () => addRow());
      if (isEdit && editItems && editItems.length) editItems.forEach(it => addRow(it));
      else addRow();

      foot.querySelector('#saveOrder').addEventListener('click', async () => {
        const rows = [...list.querySelectorAll('.item-row')];
        const items = rows.map(r => {
          const sel = r.querySelector('.i-prod');
          const p = PRODUCTS.find(x => x.id === sel.value);
          return {
            product_id: p ? p.id : null,
            name: p ? p.name : (r.querySelector('.i-name').value.trim() || 'ไม่ระบุ'),
            width_cm: parseFloat(r.querySelector('.i-w').value) || null,
            length_cm: parseFloat(r.querySelector('.i-l').value) || null,
            qty: parseInt(r.querySelector('.i-qty').value) || 1,
            unit_price: Number(r.dataset.unit || 0),
            line_total: Number(r.dataset.line || 0),
          };
        }).filter(i => i.line_total > 0 || i.name !== 'ไม่ระบุ');

        msg.textContent = ''; msg.className = 'msg';
        if (!items.length) { msg.textContent = 'ใส่รายการอย่างน้อย 1 อย่าง'; msg.className = 'msg error'; return; }

        const btn = foot.querySelector('#saveOrder');
        btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
        try {
          const total = items.reduce((s, i) => s + i.line_total, 0);
          const headFields = {
            customer: head.querySelector('#oCust').value.trim() || null,
            channel: head.querySelector('#oChan').value,
            due_date: head.querySelector('#oDue').value || null,
            note: head.querySelector('#oNote').value.trim() || null,
            phone: head.querySelector('#oPhone').value.trim() || null,
            address: head.querySelector('#oAddr').value.trim() || null,
            payment_method: head.querySelector('#oPay').value || null,
            total,
          };

          let orderId, orderNo;
          if (isEdit) {
            const { error: e1 } = await sb.from('orders').update(headFields).eq('id', editOrder.id);
            if (e1) throw new Error(e1.message);
            // เขียนรายการใหม่ทั้งชุด (ง่ายและกันข้อมูลค้าง)
            const { error: eDel } = await sb.from('order_items').delete().eq('order_id', editOrder.id);
            if (eDel) throw new Error(eDel.message);
            orderId = editOrder.id;
            orderNo = editOrder.order_no;
          } else {
            orderNo = await nextOrderNo();
            const { data: ord, error: e1 } = await sb.from('orders')
              .insert({ order_no: orderNo, ...headFields })
              .select('id').single();
            if (e1) throw new Error(e1.message);
            orderId = ord.id;
          }

          const { error: e2 } = await sb.from('order_items')
            .insert(items.map(i => ({ ...i, order_id: orderId })));
          if (e2) throw new Error(e2.message);

          if (isEdit) {
            const oldTotal = Number(editOrder.total);
            const diff = total - oldTotal;
            await logActivity('order', orderId, orderNo, 'updated',
              `${items.length} รายการ · ยอด ${fmtBaht(round2(oldTotal))} → ${fmtBaht(round2(total))} บาท` +
              (diff !== 0 ? ` (${diff > 0 ? '+' : ''}${fmtBaht(round2(diff))})` : ''));
          } else {
            await logActivity('order', orderId, orderNo, 'created',
              `${items.length} รายการ · รวม ${fmtBaht(round2(total))} บาท` +
              (headFields.customer ? ' · ' + headFields.customer : ''));
          }

          viewingOrderId = orderId;
          currentView = 'orderView';
          await boot();
        } catch (err) {
          msg.textContent = 'บันทึกไม่สำเร็จ: ' + err.message; msg.className = 'msg error';
