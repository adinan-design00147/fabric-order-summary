              <div class="field"><label for="xShop">ชื่อร้าน / องค์กร</label><input id="xShop"></div>
              <div class="field"><label for="xPhone2">เบอร์สำรอง</label><input id="xPhone2" inputmode="tel"></div>
              <div class="field"><label for="xLine">Line ID</label><input id="xLine"></div>
              <div class="field"><label for="xFb">Facebook</label><input id="xFb"></div>
              <div class="field"><label for="xIg">Instagram</label><input id="xIg"></div>
              <div class="field"><label for="xEmail">อีเมล</label><input id="xEmail" type="email"></div>
              <div class="field"><label for="xProv">จังหวัด</label><input id="xProv"></div>
              <div class="field"><label for="xPost">รหัสไปรษณีย์</label><input id="xPost" inputmode="numeric"></div>
              <div class="field"><label for="xSize">ไซซ์/ขนาดที่ใช้ประจำ</label><input id="xSize" placeholder="เช่น 65x85 ซม."></div>
              <div class="field"><label for="xColor">สีที่ชอบ/ใช้ประจำ</label><input id="xColor"></div>
              <div class="field"><label for="xFabric">ผ้า/วัสดุที่เคยใช้</label><input id="xFabric"></div>
              <div class="field"><label for="xTeam">ทีม/องค์กรที่สังกัด</label><input id="xTeam"></div>
              <div class="field"><label for="xType">ประเภทลูกค้า</label>
                <select id="xType">${CUSTOMER_TYPES.map(t => `<option>${esc(t)}</option>`).join('')}</select></div>
            </div>
            <div class="field"><label for="xNote">หมายเหตุลูกค้า</label>
              <input id="xNote" placeholder='เช่น "โทรก่อนส่ง", "ไซซ์ใหญ่กว่าปกติ"'></div>
            <div class="hint">ช่องที่เว้นว่างจะไม่ไปทับข้อมูลเดิมของลูกค้าเก่า</div>
          </div>
        </details>
      `;
      app.appendChild(head);

      // เลือกลูกค้าจากสมุด -> เติมชื่อ/เบอร์/ที่อยู่ให้อัตโนมัติ
      const XMAP = {
        '#xShop': 'shop_name', '#xPhone2': 'phone2', '#xLine': 'line_id', '#xFb': 'facebook',
        '#xIg': 'instagram', '#xEmail': 'email', '#xProv': 'province', '#xPost': 'postcode',
        '#xSize': 'default_size', '#xColor': 'fav_color', '#xFabric': 'fabric_type',
        '#xTeam': 'team_name', '#xType': 'customer_type', '#xNote': 'note',
      };
      // ค้นหาลูกค้าเดิม: ชื่อ / เบอร์ / รหัส -> กดเลือกแล้วเติมข้อมูลให้
      const custSearch = head.querySelector('#oCustSearch');
      const custResults = head.querySelector('#oCustResults');
      function pickCustomer(c) {
        head.querySelector('#oCustPick').value = c.id;
        head.querySelector('#oCustPick').dispatchEvent(new Event('change'));
        custSearch.value = '';
        custResults.hidden = true;
      }
      custSearch.addEventListener('input', () => {
        const q = custSearch.value.trim().toLowerCase();
        if (!q) { custResults.hidden = true; custResults.innerHTML = ''; return; }
        const hits = CUSTOMERS.filter(c => [c.name, c.shop_name, c.phone, c.phone2, c.code, c.line_id]
          .filter(Boolean).join(' ').toLowerCase().includes(q)).slice(0, 8);
        custResults.hidden = false;
        custResults.innerHTML = hits.length
          ? hits.map((c, i) => `<button type="button" class="cust-hit" data-i="${i}">
              <span class="ch-name">${esc(c.name)}${c.shop_name ? ' · ' + esc(c.shop_name) : ''}</span>
              <span class="ch-sub">${esc(c.code || '')}${c.phone ? ' · ' + esc(c.phone) : ''}</span>
            </button>`).join('')
          : `<div class="cust-none">ไม่เจอลูกค้าชื่อนี้ — พิมพ์ชื่อในช่อง "ชื่อลูกค้า" ได้เลย ระบบจะสร้างให้ตอนบันทึก</div>`;
        custResults.querySelectorAll('.cust-hit').forEach(b => b.addEventListener('click', () => pickCustomer(hits[+b.dataset.i])));
      });

      const custPick = head.querySelector('#oCustPick');
      if (custPick) custPick.addEventListener('change', () => {
        const c = CUSTOMERS.find(x => x.id === custPick.value);
        if (!c) return;
        head.querySelector('#oCust').value = c.name || '';
        if (c.phone) head.querySelector('#oPhone').value = c.phone;
        if (c.address) head.querySelector('#oAddr').value = c.address;
        Object.entries(XMAP).forEach(([sel, col]) => {
          const el = head.querySelector(sel);
          if (el) el.value = c[col] == null ? '' : c[col];
        });
      });
      // เปิดฟอร์มแก้ไข: เติมข้อมูลลูกค้าที่ผูกไว้ให้เห็นเลย
      if (isEdit && editOrder.customer_id) {
        const c = CUSTOMERS.find(x => x.id === editOrder.customer_id);
        if (c) Object.entries(XMAP).forEach(([sel, col]) => {
          const el = head.querySelector(sel);
          if (el) el.value = c[col] == null ? '' : c[col];
        });
      }


      const itemsPanel = document.createElement('div');
      itemsPanel.className = 'panel';
      itemsPanel.innerHTML = `
        <div class="step-head"><span class="step-no">2</span>${icon('clipboard', 17)}รายการในใบงาน</div>
        <div id="itemList"></div>
        <button class="btn secondary btn-sm" id="addItem">${icon('plus', 15)}เพิ่มรายการ</button>
        <div class="order-total"><span>ยอดรวม</span><span class="ot-num" id="ordTotal">0 บาท</span></div>
      `;
      app.appendChild(itemsPanel);

      const foot = document.createElement('div');
      foot.style.cssText = 'display:flex;gap:var(--space-2);margin-top:var(--space-4)';
      foot.innerHTML = `<button class="btn block" id="saveOrder">${icon('check', 16)}${isEdit ? 'บันทึกการแก้ไข' : 'บันทึกออเดอร์'}</button>`;
      app.appendChild(foot);
      const msg = document.createElement('div');
      msg.className = 'msg';
      app.appendChild(msg);

      const list = itemsPanel.querySelector('#itemList');
      const totalEl = itemsPanel.querySelector('#ordTotal');

      function recalcAll() {
        let total = 0;
        list.querySelectorAll('.item-row').forEach(row => { total += calcRow(row); });
        totalEl.textContent = fmtBaht(round2(total)) + ' บาท';
        return total;
      }

      function calcRow(row) {
        const sel = row.querySelector('.i-prod');
        const p = PRODUCTS.find(x => x.id === sel.value);
        const qty = parseInt(row.querySelector('.i-qty').value) || 0;
        const w = parseFloat(row.querySelector('.i-w')?.value) || 0;
        const l = parseFloat(row.querySelector('.i-l')?.value) || 0;
        let unit;
        if (p && p.pricing_mode === 'per_area') {
          unit = Math.round(w * l * Number(p.area_rate || 0));
          row.querySelector('.i-price').value = unit;
        } else if (p && p.pricing_mode === 'tier') {
          unit = tierPrice(p, qty);
          row.querySelector('.i-price').value = unit;
          const hint = row.querySelector('.i-tier-hint');
          if (hint) hint.textContent = priceLabel(p);
        } else {
          unit = parseFloat(row.querySelector('.i-price').value) || 0;
        }
        const line = Math.round(unit * qty);
        row.querySelector('.line-sum').textContent = fmtBaht(line) + ' บาท';
        row.dataset.line = line;
        row.dataset.unit = unit;
        return line;
      }

      function addRow(init) {
        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `
          <div class="field">
            <label>สินค้า</label>
            <select class="i-prod">
              <option value="">— ขนาดพิเศษ / พิมพ์เอง —</option>
              ${productOptionsHTML()}
            </select>
            <input class="i-name" placeholder="ชื่อรายการ / ขนาดที่ลูกค้าต้องการ" aria-label="ชื่อรายการ" style="margin-top:6px">
            <div class="i-tier-hint hint" style="display:none;margin-top:4px"></div>
          </div>
          <div class="field i-size"><label>กว้าง</label><input class="i-w" type="number" min="0" step="any" placeholder="ซม." inputmode="decimal"></div>
          <div class="field i-size"><label>ยาว</label><input class="i-l" type="number" min="0" step="any" placeholder="ซม." inputmode="decimal"></div>
          <div class="field"><label>จำนวน</label><input class="i-qty" type="number" min="1" value="1" inputmode="numeric"></div>
          <div class="field"><label>ราคา/หน่วย</label><input class="i-price" type="number" min="0" step="any" value="0" inputmode="decimal"></div>
          <div class="line-sum">0 บาท</div>
          <button class="icon-btn icon-btn-delete i-del" aria-label="ลบรายการ" title="ลบรายการ">${icon('trash', 18)}</button>
        `;
        list.appendChild(row);

        const sel = row.querySelector('.i-prod');
        const nameInput = row.querySelector('.i-name');
        function syncMode() {
          const p = PRODUCTS.find(x => x.id === sel.value);
          const perArea = p && p.pricing_mode === 'per_area';
          const tier = p && p.pricing_mode === 'tier';
          // โชว์ช่องขนาดเมื่อ: คิดตามพื้นที่ หรือ ขนาดพิเศษ (พิมพ์เอง)
          const showSize = perArea || !p;
          row.querySelectorAll('.i-size').forEach(el => { el.style.display = showSize ? '' : 'none'; });
          row.classList.toggle('no-size', !showSize);
          row.querySelector('.i-price').readOnly = !!(perArea || tier);
          nameInput.style.display = sel.value ? 'none' : '';
          const hint = row.querySelector('.i-tier-hint');
          hint.style.display = tier ? '' : 'none';
          if (tier) hint.textContent = priceLabel(p);
          if (p && p.pricing_mode === 'fixed') {
            row.querySelector('.i-price').value = p.unit_price || 0;
            // สินค้าที่มีขนาดกำหนดไว้แล้ว ให้ใช้ขนาดนั้น
            row.querySelector('.i-w').value = p.width_cm ?? '';
            row.querySelector('.i-l').value = p.length_cm ?? '';
          }
          recalcAll();
        }
        sel.addEventListener('change', syncMode);
        row.querySelectorAll('input').forEach(i => i.addEventListener('input', recalcAll));
        row.querySelector('.i-del').addEventListener('click', () => { row.remove(); recalcAll(); });

        if (init) {
          // สินค้าที่เคยเลือกไว้อาจถูกลบไปแล้ว -> ตกเป็นรายการพิมพ์เอง ราคาเดิมยังอยู่
          const stillExists = init.product_id && PRODUCTS.some(p => p.id === init.product_id);
          sel.value = stillExists ? init.product_id : '';
          syncMode();
          if (!stillExists) nameInput.value = init.name || '';
          row.querySelector('.i-w').value = init.width_cm ?? '';
          row.querySelector('.i-l').value = init.length_cm ?? '';
          row.querySelector('.i-qty').value = init.qty ?? 1;
          if (!row.querySelector('.i-price').readOnly) row.querySelector('.i-price').value = init.unit_price ?? 0;
          recalcAll();
        } else {
          syncMode();
        }
      }

      itemsPanel.querySelector('#addItem').addEventListener('click', () => addRow());
      if (isEdit && editItems && editItems.length) editItems.forEach(it => addRow(it));
      else addRow();

      foot.querySelector('#saveOrder').addEventListener('click', async () => {
        const rows = [...list.querySelectorAll('.item-row')];
        const items = rows.map(r => {
          const sel = r.querySelector('.i-prod');
          const p = PRODUCTS.find(x => x.id === sel.value);
          return {
            product_id: p ? p.id : null,
            name: p ? p.name : (r.querySelector('.i-name').value.trim() || 'ไม่ระบุ'),
            width_cm: parseFloat(r.querySelector('.i-w').value) || null,
            length_cm: parseFloat(r.querySelector('.i-l').value) || null,
            qty: parseInt(r.querySelector('.i-qty').value) || 1,
            unit_price: Number(r.dataset.unit || 0),
            line_total: Number(r.dataset.line || 0),
          };
        }).filter(i => i.line_total > 0 || i.name !== 'ไม่ระบุ');

        msg.textContent = ''; msg.className = 'msg';
        if (!items.length) { msg.textContent = 'ใส่รายการอย่างน้อย 1 อย่าง'; msg.className = 'msg error'; return; }

        const btn = foot.querySelector('#saveOrder');
        btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
        try {
          const total = items.reduce((s, i) => s + i.line_total, 0);
          // ลูกค้าเก่า -> ผูกกับรายเดิม · ลูกค้าใหม่ -> สร้างเข้าสมุดให้เลย
          const extra = {};
          Object.entries(XMAP).forEach(([sel, col]) => {
            const el = head.querySelector(sel);
            const v = el ? el.value.trim() : '';
            if (v) extra[col] = v;
          });
          const custId = await resolveCustomerId({
            pickedId: head.querySelector('#oCustPick') ? head.querySelector('#oCustPick').value : '',
            name: head.querySelector('#oCust').value,
            phone: head.querySelector('#oPhone').value,
            address: head.querySelector('#oAddr').value,
            extra,
          });
          const headFields = {
            customer: head.querySelector('#oCust').value.trim() || null,
            customer_id: custId,
            channel: head.querySelector('#oChan').value,
            due_date: head.querySelector('#oDue').value || null,
            note: head.querySelector('#oNote').value.trim() || null,
            phone: head.querySelector('#oPhone').value.trim() || null,
            address: head.querySelector('#oAddr').value.trim() || null,
            payment_method: head.querySelector('#oPay').value || null,
            total,
          };

          let orderId, orderNo;
          if (isEdit) {
            if (!editId) throw new Error('หาเลขอ้างอิงออเดอร์ไม่เจอ — กดปุ่ม "รายการออเดอร์" แล้วเปิดออเดอร์ใหม่อีกครั้ง ข้อมูลเดิมยังอยู่ครบ');
            const { error: e1 } = await sb.from('orders').update(headFields).eq('id', editId);
            if (e1) throw new Error(e1.message);
            // เขียนรายการใหม่ทั้งชุด (ง่ายและกันข้อมูลค้าง)
            const { error: eDel } = await sb.from('order_items').delete().eq('order_id', editId);
            if (eDel) throw new Error(eDel.message);
            orderId = editId;
            orderNo = editOrder.order_no;
          } else {
            const res = await insertWithDocNo('orders', nextOrderNo,
              (no) => ({ order_no: no, ...headFields }));
            orderNo = res.no; orderId = res.id;
          }

          const { error: e2 } = await sb.from('order_items')
            .insert(items.map(i => ({ ...i, order_id: orderId })));
          if (e2) throw new Error(e2.message);

          if (isEdit) {
            const oldTotal = Number(editOrder.total);
            const diff = total - oldTotal;
            await logActivity('order', orderId, orderNo, 'updated',
              `${items.length} รายการ · ยอด ${fmtBaht(round2(oldTotal))} → ${fmtBaht(round2(total))} บาท` +
              (diff !== 0 ? ` (${diff > 0 ? '+' : ''}${fmtBaht(round2(diff))})` : ''));
          } else {
            await logActivity('order', orderId, orderNo, 'created',
              `${items.length} รายการ · รวม ${fmtBaht(round2(total))} บาท` +
              (headFields.customer ? ' · ' + headFields.customer : ''));
          }

          viewingOrderId = orderId;
          currentView = 'orderView';
          await boot();
        } catch (err) {
          msg.textContent = 'บันทึกไม่สำเร็จ: ' + err.message; msg.className = 'msg error';
          btn.disabled = false;
          btn.innerHTML = icon('check', 16) + (isEdit ? 'บันทึกการแก้ไข' : 'บันทึกออเดอร์');
        }
      });
    }

    // ---- รายละเอียดออเดอร์ ----
    async function loadOrderDetail(id) {
      if (!CUSTOMERS.length) { try { await fetchCustomers(); } catch (e) {} }
      document.getElementById('statusMsg').textContent = 'กำลังโหลด...';
      const [oRes, iRes] = await Promise.all([
        sb.from('orders').select('id,order_no,customer,customer_id,channel,status,due_date,delivered_at,note,total,created_at,phone,address,payment_method,paid_amount,cover_file_id,cover_name').eq('id', id).single(),
        sb.from('order_items').select('id,product_id,name,width_cm,length_cm,qty,unit_price,line_total').eq('order_id', id),
      ]);
      const [payRes, logRes] = await Promise.all([
        sb.from('order_payments').select('id,amount,method,note,paid_at').eq('order_id', id).order('paid_at'),
        sb.from('activity_log').select('action,detail,created_at')
          .eq('entity_type', 'order').eq('entity_id', id).order('created_at', { ascending: false }),
      ]);
      await fetchProducts();
      if (oRes.error) throw oRes.error;
      if (iRes.error) throw iRes.error;
      if (payRes.error) throw payRes.error;
      renderOrderDetail(oRes.data, iRes.data, payRes.data, logRes.data || []);
      document.getElementById('statusMsg').textContent = 'อัปเดตล่าสุด: ' + new Date().toLocaleString('th-TH');
    }

    function renderOrderDetail(o, items, payments, logs) {
      payments = payments || [];
      logs = logs || [];
      const paid = payments.reduce((s, p) => s + Number(p.amount), 0);
      const balance = round2(Number(o.total) - paid);
      const app = document.getElementById('app');
      app.innerHTML = '';

      const bar = document.createElement('div');
      bar.className = 'no-print';
      bar.style.cssText = 'display:flex;gap:var(--space-2);margin-bottom:var(--space-4);flex-wrap:wrap';
      bar.innerHTML = `
        <button class="btn secondary btn-sm" id="oBack">${icon('back', 15)}รายการออเดอร์</button>
        <button class="btn btn-sm" id="oEdit">${icon('edit', 15)}แก้ไขออเดอร์</button>
        <button class="btn secondary btn-sm" id="oPrint">${icon('printer', 15)}พิมพ์ออเดอร์</button>
        <button class="btn secondary btn-sm" id="oShip">${icon('truck', 15)}ใบปะหน้าพัสดุ</button>
        <button class="btn secondary btn-sm" id="oReceipt">${icon('receipt', 15)}ออกใบเสร็จ</button>
        <button class="btn secondary btn-sm icon-btn-delete" id="oDel" style="width:auto;height:auto;padding:0 14px;min-height:44px">${icon('trash', 15)}ลบออเดอร์</button>
      `;
      app.appendChild(bar);
      bar.querySelector('#oBack').addEventListener('click', () => { currentView = 'orders'; boot(); });
      bar.querySelector('#oEdit').addEventListener('click', () => openOrderForm(o, items));
      bar.querySelector('#oPrint').addEventListener('click', () => window.print());
      bar.querySelector('#oShip').addEventListener('click', () => openShippingLabel(o));
      bar.querySelector('#oReceipt').addEventListener('click', async () => {
        const b = bar.querySelector('#oReceipt');
        b.disabled = true; b.textContent = 'กำลังออกใบเสร็จ...';
        try {
          const rid = await createReceiptFromOrder(o, items);
          viewingReceiptId = rid;
          currentView = 'receiptView';
          await boot();
        } catch (e) {
          alert('ออกใบเสร็จไม่สำเร็จ: ' + e.message);
          b.disabled = false; b.innerHTML = icon('receipt', 15) + 'ออกใบเสร็จ';
        }
      });
      bar.querySelector('#oDel').addEventListener('click', async () => {
        if (!confirm('ลบออเดอร์ ' + o.order_no + ' ?\n(กู้คืนได้ที่เมนูถังขยะ)')) return;
        try { await trashDelete('orders', o.id, { label: o.order_no, detail: o.customer || '' }); }
        catch (e) { alert('ลบไม่สำเร็จ: ' + e.message); return; }
        currentView = 'orders'; boot();
      });

      // ---- ส่งงาน: แยกจากสถานะและจากเรื่องเงินโดยสิ้นเชิง ----
      const delBar = document.createElement('div');
      delBar.className = 'panel no-print';
      const delSync = () => {
        const sent = isDelivered(o);
        delBar.innerHTML = `<h2>${icon('truck', 17)}การส่งงาน</h2>
          <div class="field-row" style="align-items:center">
            <span class="st ${sent ? 'st-deliv' : 'st-prod'}">${sent ? 'ส่งแล้ว' : 'ยังไม่ส่ง'}</span>
            <span class="hint">${sent
              ? 'ส่งเมื่อ ' + new Date(o.delivered_at).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' })
              : (o.due_date ? 'กำหนดส่ง ' + thDate(o.due_date) : 'ยังไม่ได้ตั้งวันกำหนดส่ง')}</span>
            <button class="btn ${sent ? 'secondary' : ''} btn-sm admin-only" id="oDeliv" style="margin-left:auto">
              ${sent ? icon('back', 15) + 'ยังไม่ได้ส่ง' : icon('check', 15) + 'ทำเครื่องหมายว่าส่งแล้ว'}</button>
          </div>
          <div class="hint" style="margin-top:8px">เรื่องส่งกับเรื่องเงินแยกกัน — เก็บเงินครบแล้วแต่ยังไม่ส่งก็ได้ และกลับกัน</div>`;
        delBar.querySelector('#oDeliv')?.addEventListener('click', async () => {
          const sentNow = isDelivered(o);
          const val = sentNow ? null : new Date().toISOString();
          const { error } = await sb.from('orders').update({ delivered_at: val }).eq('id', o.id);
          if (error) { alert('บันทึกไม่สำเร็จ: ' + error.message); return; }
          await logActivity('order', o.id, o.order_no, 'status', sentNow ? 'ถอนเครื่องหมายส่งแล้ว' : 'ทำเครื่องหมายว่าส่งแล้ว');
          o.delivered_at = val;
          delSync();
        });
      };
      delSync();
      app.appendChild(delBar);

      // แถบเปลี่ยนสถานะ
      const stBar = document.createElement('div');
      stBar.className = 'chips no-print';
      stBar.innerHTML = Object.entries(ORDER_STATUS)

    // ออกใบเสร็จจากออเดอร์ (ใช้ราคาขายจริงที่ลูกค้าจ่าย)
    async function createReceiptFromOrder(o, items) {
      const { no: receipt_no, id: receiptId } = await insertWithDocNo('receipts', nextReceiptNo, (no) => ({
        receipt_no: no,
        recipient: o.customer || null,
        note: 'ออกจากออเดอร์ ' + o.order_no + (o.note ? ' · ' + o.note : ''),
        total: Number(o.total),
        item_count: items.length,
        order_id: o.id,
      }));
      const rc = { id: receiptId };

      const rows = items.map(i => ({
        receipt_id: rc.id, piece_id: null, lot_name: null,
        label: i.name + (i.qty > 1 ? ' x' + i.qty : ''),
        width_cm: i.width_cm, length_cm: i.length_cm, price: i.line_total,
      }));
      const { error: e2 } = await sb.from('receipt_items').insert(rows);
      if (e2) throw new Error(e2.message);

      await logActivity('order', o.id, o.order_no, 'receipt', 'ออกใบเสร็จ ' + receipt_no);
      return rc.id;
    }

      selectedPieces.clear();

        bar = document.createElement('div');
        bar.id = 'selBar';
        bar.className = 'selbar no-print';
        document.body.appendChild(bar);

      const total = [...selectedPieces.values()].reduce((s, p) => s + Number(p.price), 0);
      bar.innerHTML = `
        <div class="selbar-info">เลือก ${selectedPieces.size} ชิ้น · <span class="sb-sum">${fmtBaht(round2(total))} บาท</span></div>

    const nextReceiptNo = () => nextDocNo('RC');

    async function createReceipt(items, recipient, note, total) {
      const { no: receipt_no, id: receiptId } = await insertWithDocNo('receipts', nextReceiptNo, (no) => ({
        receipt_no: no, recipient: recipient || null, note: note || null,
        total, item_count: items.length,
      }));
      const rc = { id: receiptId };

      const rows = items.map(p => ({
        receipt_id: rc.id, piece_id: p.id, lot_name: p.lotName,
        label: p.label || null, width_cm: p.width_cm, length_cm: p.length_cm, price: p.price,
      }));
      const { error: e2 } = await sb.from('receipt_items').insert(rows);
      if (e2) throw new Error('บันทึกรายการไม่สำเร็จ: ' + e2.message);

      // มาร์คชิ้นที่อยู่ในใบเสร็จว่าจ่ายแล้ว
      const { error: e3 } = await sb.from('pieces').update({ paid: true }).in('id', items.map(p => p.id));
      if (e3) throw new Error('อัปเดตสถานะจ่ายไม่สำเร็จ: ' + e3.message);

      await logActivity('receipt', rc.id, receipt_no, 'created',
        `${items.length} ชิ้น · ${fmtBaht(round2(total))} บาท (จากงานผลิต)`);
      return rc.id;
    }

            <span class="rc-sub">${new Date(r.created_at).toLocaleString('th-TH')} · ${r.item_count} รายการ${r.recipient ? ' · ' + esc(r.recipient) : ''}</span>

    // ===== ปฏิทิน =====
    let calMonth = new Date().getMonth();
    let calYear = new Date().getFullYear();
    let calSelected = null;

    function flattenOrders(lots, pieces, orders) {
      const lotById = {};
      lots.forEach(l => lotById[l.id] = l);
      const all = [];
      pieces.forEach(p => {
        const lot = lotById[p.lot_id];
        all.push({
          kind: 'fabric', title: p.label || 'ไม่ระบุชื่อ',
          sub: p.width_cm + ' x ' + p.length_cm + ' ซม.' + (lot ? ' · ' + lot.name : ''),
          amount: Number(p.price), paid: p.paid,
          date: lot ? parseLotDate(lot.name) : null,
          yard: pieceYard(p, SETTINGS),
        });
      });
      orders.forEach(o => {
        const meta = PRODUCT_CATEGORIES[o.category];
        all.push({
          kind: o.category, title: o.name,
          sub: (meta ? meta.label : o.category) + ' · ' + o.quantity + ' ชิ้น' + (o.customer ? ' · ' + o.customer : ''),
          amount: Number(o.unit_cost) * o.quantity, paid: o.paid,
          date: o.created_at ? new Date(o.created_at) : null, yard: 0,
        });
      });
      return all;
    }

    // ชั้นข้อมูลที่โชว์บนปฏิทิน (เปิด/ปิดได้)
    let calLayers = { received: true, due: true, cost: true };

    async function loadCalendar() {
      document.getElementById('statusMsg').textContent = 'กำลังโหลด...';
      SETTINGS = await loadSettings();
      const [lotsRes, piecesRes, ordersRes, salesRes] = await Promise.all([
        sb.from('lots').select('id,name'),
        sb.from('pieces').select('id,lot_id,width_cm,length_cm,label,price,paid,item_type,printed,printed_at,stock_move_id'),
        sb.from('product_orders').select('id,category,name,customer,quantity,unit_cost,paid,created_at'),
        sb.from('orders').select('id,order_no,customer,customer_id,channel,status,total,paid_amount,due_date,delivered_at,created_at,cover_file_id,phone'),
      ]);
      if (lotsRes.error) throw lotsRes.error;
      if (piecesRes.error) throw piecesRes.error;
      if (ordersRes.error) throw ordersRes.error;
      if (salesRes.error) throw salesRes.error;

      const events = [];

      // ชั้น 1: วันรับงาน (ออเดอร์ถูกสร้าง)
      salesRes.data.forEach(o => {
        if (o.status === 'cancelled') return;
        events.push({
          layer: 'received', title: 'รับงาน ' + o.order_no,
          sub: (o.customer || 'ไม่ระบุลูกค้า') + (o.channel ? ' · ' + o.channel : ''),
          amount: Number(o.total), date: new Date(o.created_at), orderId: o.id,
        });
      });

      // ชั้น 2: วันส่งงาน (กำหนดส่ง)
      salesRes.data.forEach(o => {
        if (!o.due_date || o.status === 'cancelled') return;
        const [y, m, dd] = o.due_date.split('-').map(Number);
        events.push({
          layer: 'due', title: 'ส่งงาน ' + o.order_no,
          sub: (o.customer || 'ไม่ระบุลูกค้า') + ' · ' + (ORDER_STATUS[o.status] || ORDER_STATUS.new).label,
          amount: Number(o.total), date: new Date(y, m - 1, dd), orderId: o.id,
        });
      });

      // ชั้น 3: ค้างจ่ายร้านผลิต (จากล็อตป้ายผ้า)
      const lotById = {};
      lotsRes.data.forEach(l => lotById[l.id] = l);
      const unpaidByLot = {};
      piecesRes.data.forEach(p => {
        if (p.paid) return;
        const lot = lotById[p.lot_id];
        if (!lot) return;
        if (!unpaidByLot[lot.id]) unpaidByLot[lot.id] = { name: lot.name, amount: 0, count: 0 };
        unpaidByLot[lot.id].amount += Number(p.price);
        unpaidByLot[lot.id].count++;
      });
      Object.values(unpaidByLot).forEach(l => {
        const d = parseLotDate(l.name);
        if (!d) return;
        events.push({
          layer: 'cost', title: 'ค้างจ่ายร้านผลิต',
          sub: 'ล็อต ' + l.name + ' · ' + l.count + ' ชิ้น',
          amount: l.amount, date: d,
        });
      });

      renderCalendar(events);
      document.getElementById('statusMsg').textContent = 'อัปเดตล่าสุด: ' + new Date().toLocaleString('th-TH');
    }

    function renderCalendar(all) {
      const app = document.getElementById('app');
      app.innerHTML = '';
      app.appendChild(buildPageHead('ปฏิทิน', 'วันรับงาน วันส่งงาน และยอดค้างจ่ายร้านผลิต'));

      const LAYER_META = {
        received: { label: 'วันรับงาน',        cls: 'lay-recv' },
        due:      { label: 'วันส่งงาน',        cls: 'lay-due' },
        cost:     { label: 'ค้างจ่ายร้านผลิต', cls: 'lay-cost' },
      };

      // ปุ่มกรองชั้นข้อมูล
      const layerBar = document.createElement('div');
      layerBar.className = 'chips';
      layerBar.innerHTML = Object.entries(LAYER_META).map(([k, v]) => {
        const n = all.filter(e => e.layer === k).length;
        return `<button class="chip ${calLayers[k] ? 'active' : ''}" data-l="${k}">${esc(v.label)} (${n})</button>`;
      }).join('');
      app.appendChild(layerBar);
      layerBar.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
        calLayers[c.dataset.l] = !calLayers[c.dataset.l];
        renderCalendar(all);
      }));

      const shown = all.filter(e => calLayers[e.layer]);

      // จัดกลุ่มตามวัน
      const byDay = {};
      shown.forEach(r => {
        if (!r.date) return;
        const k = r.date.getFullYear() + '-' + r.date.getMonth() + '-' + r.date.getDate();
        (byDay[k] = byDay[k] || []).push(r);
      });

      const monthItems = shown.filter(r => r.date && r.date.getFullYear() === calYear && r.date.getMonth() === calMonth);
      const mRecv = monthItems.filter(r => r.layer === 'received');
      const mDue = monthItems.filter(r => r.layer === 'due');
      const mCost = monthItems.filter(r => r.layer === 'cost');

      const top = document.createElement('div');
      top.className = 'cal-top';
      top.innerHTML = `
        <div>
          <div class="cal-title">${THAI_MONTHS[calMonth + 1]} ${calYear + 543}</div>
          <div class="page-sub">รับงาน ${mRecv.length} · ส่งงาน ${mDue.length} · ค้างจ่ายร้านผลิต ${fmtBaht(round2(mCost.reduce((s, r) => s + r.amount, 0)))} บาท</div>
        </div>
        <div class="cal-nav">
          <button class="btn secondary btn-sm" id="calPrev">‹ ก่อนหน้า</button>
          <button class="btn secondary btn-sm" id="calToday">วันนี้</button>
          <button class="btn secondary btn-sm" id="calNext">ถัดไป ›</button>
        </div>
      `;
      app.appendChild(top);

      const grid = document.createElement('div');
      grid.className = 'cal-grid';
      ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'].forEach(d => {
        const h = document.createElement('div');
        h.className = 'cal-dow';
        h.textContent = d;
        grid.appendChild(h);
      });

      const first = new Date(calYear, calMonth, 1);
      const startOffset = first.getDay();
      const start = new Date(calYear, calMonth, 1 - startOffset);
      const todayKeyStr = (() => { const t = new Date(); return t.getFullYear() + '-' + t.getMonth() + '-' + t.getDate(); })();

      for (let i = 0; i < 42; i++) {
        const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
        const key = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
        const items = byDay[key] || [];
        const inMonth = d.getMonth() === calMonth;
        const cell = document.createElement('button');
        cell.className = 'cal-cell' + (inMonth ? '' : ' muted') + (key === todayKeyStr ? ' today' : '') + (key === calSelected ? ' selected' : '');
        cell.dataset.key = key;
        const shown = items.slice(0, 2);
        cell.innerHTML = `
          <span class="cal-daynum">${d.getDate()}</span>
          ${shown.map(r => `<span class="cal-chip ${LAYER_META[r.layer].cls}">${esc(r.title)}</span>`).join('')}
          ${items.length > 2 ? `<span class="cal-more">+${items.length - 2} รายการ</span>` : ''}
          <span class="cal-dot-row">${items.slice(0, 4).map(r => `<span class="cal-dot ${LAYER_META[r.layer].cls}"></span>`).join('')}</span>
        `;
        cell.addEventListener('click', () => {
          calSelected = calSelected === key ? null : key;
          renderCalendar(all);
        });
        grid.appendChild(cell);
      }
      app.appendChild(grid);

      // รายละเอียดวันที่เลือก
      if (calSelected) {
        const items = byDay[calSelected] || [];
        const [yy, mm, dd] = calSelected.split('-').map(Number);
        const detail = document.createElement('div');
        detail.className = 'panel-card';
        detail.style.marginTop = 'var(--space-4)';
        detail.innerHTML = `
          <h3>${dd} ${THAI_MONTHS[mm + 1]} ${yy + 543}</h3>
          <div class="panel-sub">${items.length} รายการ · รวม ${fmtBaht(round2(items.reduce((s, r) => s + r.amount, 0)))} บาท</div>
          <div class="mini-list">${items.length ? items.map(r => {
            const inner = `
              <div class="mini-main">
                <div class="mini-title">${esc(r.title)}</div>
                <div class="mini-meta">${esc(LAYER_META[r.layer].label)} · ${esc(r.sub)}</div>
              </div>
              <div class="mini-amt">${fmtBaht(round2(r.amount))}</div>`;
            return r.orderId
              ? `<a class="mini-row" href="${routeFor('orderView', r.orderId)}" style="text-decoration:none;color:inherit">${inner}</a>`
              : `<div class="mini-row">${inner}</div>`;
          }).join('') : '<div class="mini-empty">ไม่มีรายการวันนี้</div>'}</div>
        `;
        app.appendChild(detail);
      }

      top.querySelector('#calPrev').addEventListener('click', () => {
        calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; }
        calSelected = null; renderCalendar(all);
      });
      top.querySelector('#calNext').addEventListener('click', () => {
        calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; }
        calSelected = null; renderCalendar(all);
      });
      top.querySelector('#calToday').addEventListener('click', () => {
        const t = new Date();
        calMonth = t.getMonth(); calYear = t.getFullYear();
        calSelected = null; renderCalendar(all);
      });
    }

    function drawChannelChart(byChannel) {
      if (typeof Chart === 'undefined') return;
      const el = document.getElementById('chartChannel');
      if (!el) return;
      const labels = Object.keys(byChannel).filter(k => byChannel[k] > 0);
      if (!labels.length) return;
      const css = getComputedStyle(document.documentElement);
      dashCharts.push(new Chart(el, {
        type: 'doughnut',
        data: {
          labels,
          datasets: [{
            data: labels.map(k => round2(byChannel[k])),
            backgroundColor: ['#3454d1', '#f5b77e', '#5fd497', '#b48ef5', '#f58ea8', '#7ec8f5'],
            borderWidth: 2, borderColor: css.getPropertyValue('--card').trim() || '#fff',
          }],
        },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: '62%',
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, padding: 12, font: { size: 11 } } } },
        },
      }));
    }

    function drawMonthsChart(months) {
      if (typeof Chart === 'undefined') return;
      const el = document.getElementById('chartMonths');
      if (!el) return;
      const css = getComputedStyle(document.documentElement);
      dashCharts.push(new Chart(el, {
        type: 'bar',
        data: {
          labels: months.map(m => m.label),
          datasets: [{ data: months.map(m => round2(m.total)), backgroundColor: '#3454d1', borderRadius: 6, maxBarThickness: 44 }],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, ticks: { callback: v => fmtBaht(v), font: { size: 11 } }, grid: { color: css.getPropertyValue('--border').trim() || '#eee' } },
            x: { grid: { display: false }, ticks: { font: { size: 11 } } },

      }));

    function miniRow(r) {
      return `<div class="mini-row">

    function parseLotDate(name) {
      const m = String(name).match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
      if (!m) return null;
      let yy = parseInt(m[3]);
      if (yy < 100) yy += 2500;          // พ.ศ. 2 หลัก
      else if (yy > 2400) { /* พ.ศ. เต็ม */ }
      const ce = yy - 543;
      return new Date(ce, parseInt(m[2]) - 1, parseInt(m[1]));
    }

    function drawCharts(all) {
      if (typeof Chart === 'undefined') return;
      const css = getComputedStyle(document.documentElement);
      const accent = css.getPropertyValue('--accent').trim() || '#3454d1';
      const sub = css.getPropertyValue('--sub').trim() || '#6b7280';
      const border = css.getPropertyValue('--border').trim() || '#e6e3dd';
      Chart.defaults.font.family = "'Prompt', sans-serif";
      Chart.defaults.color = sub;

      // 7 วันล่าสุด
      const days = [], labels = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i);
        days.push(d);
        labels.push(d.getDate() + '/' + (d.getMonth() + 1));
      }
      const totals = days.map(d => {
        const key = d.toDateString();
        return round2(all.filter(r => r.date && r.date.toDateString() === key).reduce((s, r) => s + r.amount, 0));
      });

      const c1 = document.getElementById('chartTrend');
      if (c1) {
        dashCharts.push(new Chart(c1, {
          type: 'line',
          data: { labels, datasets: [{
            data: totals, borderColor: accent, backgroundColor: accent + '22',
            fill: true, tension: .35, borderWidth: 2, pointRadius: 3, pointBackgroundColor: accent,
          }]},
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: { beginAtZero: true, grid: { color: border }, border: { display: false } },
              x: { grid: { display: false }, border: { color: border } },
            },
          },
        }));
      }

      // สัดส่วนสินค้า
      const mix = {};
      all.forEach(r => {
        const m = r.kind === 'fabric' ? PRODUCT_CATEGORIES.fabric : PRODUCT_CATEGORIES[r.kind];
        const name = m ? m.label : r.kind;
        mix[name] = (mix[name] || 0) + r.amount;
      });
      const mixLabels = Object.keys(mix).filter(k => mix[k] > 0);
      const c2 = document.getElementById('chartMix');
      if (c2 && mixLabels.length) {
        dashCharts.push(new Chart(c2, {
          type: 'doughnut',
          data: {
            labels: mixLabels,
            datasets: [{
              data: mixLabels.map(k => round2(mix[k])),
              backgroundColor: [accent, '#f5b77e', '#5fd497', '#b48ef5'],
              borderWidth: 2, borderColor: css.getPropertyValue('--card').trim() || '#fff',
            }],
          },
          options: {
            responsive: true, maintainAspectRatio: false, cutout: '62%',
            plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, padding: 12, font: { size: 11 } } } },
          },
        }));
      }
    }

              : '<div class="empty-cell" style="padding:14px">ยังไม่มีออเดอร์</div>'}

              <button class="btn secondary btn-sm edit-cust" data-id="${c.id}">${icon('edit', 15)}แก้ไขข้อมูลลูกค้า</button>
            </div>
          </div>`;
        app.appendChild(card);
      });

      app.querySelectorAll('.edit-cust').forEach(b => b.addEventListener('click', (e) => {
        e.stopPropagation();
        openCustomerForm(CUSTOMERS.find(x => x.id === b.dataset.id));
      }));

      // ---- เตือนออเดอร์ที่ยังไม่ผูกกับสมุดลูกค้า ----
      const unlinked = sales.filter(o => !o.customer_id && (o.customer || '').trim());
      if (unlinked.length) {
        const warn = document.createElement('div');
        warn.className = 'info-note no-print';
        warn.innerHTML = `<div>${icon('pin', 14)} มีออเดอร์ ${unlinked.length} ใบที่ยังไม่ผูกกับสมุดลูกค้า
          (${unlinked.slice(0, 5).map(o => esc(o.order_no)).join(', ')}${unlinked.length > 5 ? '...' : ''})</div>
          <button class="btn btn-sm" id="linkAll" style="margin-top:10px">${icon('check', 15)}ผูกให้อัตโนมัติจากชื่อในออเดอร์</button>`;
        app.appendChild(warn);
        warn.querySelector('#linkAll').addEventListener('click', async () => {
          const b = warn.querySelector('#linkAll');
          b.disabled = true; b.textContent = 'กำลังผูก...';
          try {
            for (const o of unlinked) {
              const cid = await resolveCustomerId({
                pickedId: '', name: o.customer, phone: o.phone, address: o.address,
              });
              if (cid) await sb.from('orders').update({ customer_id: cid }).eq('id', o.id);
            }
            await loadGlobalCustomers();
          } catch (e) {
            alert('ผูกไม่สำเร็จ: ' + e.message);
            b.disabled = false; b.innerHTML = icon('check', 15) + 'ผูกให้อัตโนมัติจากชื่อในออเดอร์';
          }
        });
      }

      wireCustomerCards(app, searchMsg);
    }

    /** กด/กด Enter ที่หัวการ์ด = กางหรือยุบ · ช่องค้นหา = กรองการ์ด แล้วกางอันที่ตรงให้เลย */
    function wireCustomerCards(app, searchMsg) {
      const cards = [...app.querySelectorAll('.cust-card')];

      const toggle = (card, open) => {
        const head = card.querySelector('.cust-toggle');
        const body = card.querySelector('.cust-body');
        const show = (open === undefined) ? body.hidden : open;
        body.hidden = !show;
        head.setAttribute('aria-expanded', show ? 'true' : 'false');
        card.classList.toggle('open', show);
      };

      cards.forEach(card => {
        const head = card.querySelector('.cust-toggle');
        head.addEventListener('click', (e) => {
          if (e.target.closest('a')) return;    // กดลิงก์เลขออเดอร์ไม่ต้องยุบ
          toggle(card);
        });
        head.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(card); }
        });
      });

      const input = app.querySelector('#custSearch');
      if (!input) return;
      const sections = [...app.querySelectorAll('.section-title')];

      input.addEventListener('input', () => {
        const q = input.value.trim().toLowerCase();
        let found = 0;
        cards.forEach(card => {
          const hit = !q || (card.dataset.search || '').includes(q);
          card.style.display = hit ? '' : 'none';
          if (hit) found++;
          if (q) toggle(card, hit && q.length >= 2);   // พิมพ์ค้นหาแล้วกางให้เห็นเลย
        });
        // ซ่อนหัวข้อส่วนที่ไม่มีการ์ดเหลือ
        sections.forEach(h => {
          let sib = h.nextElementSibling, any = false;
          while (sib && !sib.classList.contains('section-title')) {
            if (sib.classList.contains('cust-card') && sib.style.display !== 'none') any = true;
            sib = sib.nextElementSibling;
          }
          h.style.display = (!q || any) ? '' : 'none';
        });
        searchMsg.textContent = q ? (found ? 'เจอ ' + found + ' ราย' : 'ไม่เจอลูกค้าที่ตรงกับ "' + input.value + '"') : '';
      });
    }

      if (error) throw error;
      renderProductCategory(category, orders);
      document.getElementById('statusMsg').textContent = 'อัปเดตล่าสุด: ' + new Date().toLocaleString('th-TH');
    }

        const customer = panel.querySelector('#oCustomer').value.trim();

        const cost = parseFloat(panel.querySelector('#oCost').value);

        });
        if (error) {
          msg.textContent = 'เพิ่มไม่สำเร็จ: ' + error.message; msg.className = 'msg error';
          btn.disabled = false; btn.textContent = '+ เพิ่มออเดอร์';

      listCard.innerHTML = `

            <tbody>${rowsHtml || '<tr><td colspan="5" class="empty-cell">ยังไม่มีออเดอร์</td></tr>'}</tbody>
          </table>

      app.querySelectorAll('.paid-badge').forEach(el => {
        el.addEventListener('click', async () => {

          el.textContent = '...';
          const { error } = await sb.from('product_orders').update({ paid: next }).eq('id', id);
          if (error) alert('อัปเดตไม่สำเร็จ: ' + error.message);
          await loadProducts(category);

      app.querySelectorAll('.piece-name').forEach(td => {
        td.addEventListener('click', () => td.classList.toggle('active'));

      app.querySelectorAll('.edit-order').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const tr = btn.closest('tr');
          const id = btn.dataset.id;
          tr.innerHTML = `
            <td colspan="5">
              <div class="edit-row">
                <input class="edit-o-name" placeholder="ชื่อ/แบบ" aria-label="ชื่อ/แบบ" value="${esc(btn.dataset.name)}">
                <input class="edit-o-customer" placeholder="ลูกค้า/งาน" aria-label="ลูกค้า/งาน" value="${esc(btn.dataset.customer)}">
                <input class="edit-o-qty" type="number" min="1" step="1" placeholder="จำนวน" aria-label="จำนวน" value="${btn.dataset.qty}">
                <input class="edit-o-cost" type="number" min="0" step="any" placeholder="ราคา/ชิ้น" aria-label="ราคาต่อชิ้น" value="${btn.dataset.cost}">
                <input class="edit-o-sell" type="number" min="0" step="any" placeholder="ราคาขาย/ชิ้น" aria-label="ราคาขายต่อชิ้น" value="${btn.dataset.sell}">

          if (!confirm('ลบออเดอร์นี้? (กู้คืนได้ที่เมนูถังขยะ)')) return;
          try { await trashDelete('product_orders', btn.dataset.id, { label: btn.dataset.name || 'ออเดอร์สินค้า' }); }
