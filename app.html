<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>คำนวณผ้าดิบ (Supabase)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #f7f5f2; --card: #ffffff; --text: #1f2430; --sub: #586273;
    --accent: #3454d1; --accent-soft: #eef1fd; --border: #e6e3dd;
    --warn-bg: #fff6ed; --warn-border: #f5b77e; --warn-text: #92400e;
    --ok-bg: #eefbf3; --ok-text: #067647;
    --err-text: #b42318;
    --radius: 14px;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
    --space-5: 20px; --space-6: 24px; --space-8: 32px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Prompt', -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
    background: var(--bg); color: var(--text); padding-bottom: 96px;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border); padding: var(--space-4) var(--space-5);
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
  }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  header .meta { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .container { padding: var(--space-4) var(--space-4) 0; max-width: 720px; margin: 0 auto; }

  .tabs { display: flex; gap: var(--space-2); margin-bottom: var(--space-4); }
  .tab-btn {
    flex: 1; font-family: inherit; font-size: 14px; font-weight: 600; padding: 10px 16px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--card); color: var(--sub);
    cursor: pointer; min-height: 44px; transition: background .15s ease, color .15s ease;
  }
  .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-2); margin-bottom: var(--space-4); }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-4) var(--space-2); text-align: center; }
  .stat .num { font-size: 20px; font-weight: 700; }
  .stat .lbl { font-size: 11px; color: var(--sub); margin-top: 2px; }

  .today-card { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: var(--radius); padding: var(--space-4); margin-bottom: var(--space-4); }
  .today-card h2 { margin: 0 0 var(--space-3); font-size: 15px; font-weight: 600; color: var(--accent); }
  .today-empty { font-size: 13px; color: var(--sub); }
  .today-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-2); }
  .today-stats .stat { background: #fff; }

  .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-4); margin-bottom: var(--space-3); }
  .panel h2 { margin: 0 0 var(--space-3); font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px; }

  .field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 110px; }
  .field label { font-size: 12px; color: var(--sub); font-weight: 500; }
  .field input, .field select {
    font-family: inherit; font-size: 16px; padding: 11px 12px; border: 1px solid var(--border);
    border-radius: 10px; background: #fff; min-height: 44px; width: 100%;
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

  .field-row { display: flex; gap: var(--space-3); align-items: flex-end; flex-wrap: wrap; }
  .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-2); margin-bottom: var(--space-3); }

  .btn {
    font-family: inherit; font-size: 14px; font-weight: 600; padding: 12px 20px; border: none;
    border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; min-height: 44px;
    white-space: nowrap; transition: background .15s ease, transform .1s ease;
  }
  .btn:hover { background: #2a44b8; }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .6; cursor: default; transform: none; }
  .btn.secondary { background: var(--accent-soft); color: var(--accent); }
  .btn.secondary:hover { background: #dfe4fb; }
  .btn.block { width: 100%; }

  .msg { font-size: 13px; margin-top: var(--space-2); min-height: 16px; }
  .msg.error { color: var(--err-text); }

  .hint { font-size: 12px; color: var(--sub); margin-top: var(--space-2); }

  @media (max-width: 640px) {
    .field-row { flex-direction: column; align-items: stretch; }
    .field-row .btn { width: 100%; }

    .form-grid { grid-template-columns: repeat(2, 1fr); }

    .tabs { display: grid; grid-template-columns: repeat(2, 1fr); }

    .pay-row { flex-wrap: wrap; row-gap: var(--space-2); }
    .pay-row-right { flex-wrap: wrap; row-gap: var(--space-2); }

    /* ตาราง -> การ์ดรายการ บนจอมือถือ กันเลื่อนแนวนอน อ่านง่ายขึ้น */
    .table-wrap table, .table-wrap tbody, .table-wrap tr, .table-wrap td {
      display: block; width: 100%;
    }
    .table-wrap thead { display: none; }
    .table-wrap tr { border-top: 1px solid var(--border); padding: var(--space-3) var(--space-4); }
    .table-wrap tr:first-child { border-top: none; }
    .table-wrap td {
      display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
      padding: 5px 0; border-top: none; text-align: right;
    }
    .table-wrap td::before {
      content: attr(data-label); font-size: 11px; font-weight: 500; color: var(--sub);
      text-align: left; flex-shrink: 0;
    }
    .table-wrap td.empty-cell { display: block; text-align: center; }
    .table-wrap td.empty-cell::before { display: none; }
  }

  .lot-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: var(--space-3); overflow: hidden; }
  .lot-head { padding: var(--space-3) var(--space-4); font-weight: 600; font-size: 14px; background: var(--accent-soft); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: var(--space-2); }
  .lot-head .lot-total { color: var(--accent); font-variant-numeric: tabular-nums; }
  .lot-head-right { text-align: right; }
  .lot-head .lot-price { display: block; font-size: 11px; font-weight: 400; color: var(--sub); margin-top: 1px; }
  .lot-head .lot-buffer { display: block; font-size: 11px; font-weight: 400; color: var(--accent); margin-top: 1px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: var(--space-2) var(--space-3); text-align: right; border-top: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; font-variant-numeric: normal; }
  th { color: var(--sub); font-weight: 500; font-size: 11px; }
  .paid-badge {
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    padding: 0 16px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer;
    min-height: 44px; border: none; font-family: inherit; transition: filter .15s ease;
  }
  .paid-badge:hover { filter: brightness(.96); }
  .paid-badge:active { transform: scale(.97); }
  .paid-badge:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .paid-badge.paid { background: var(--ok-bg); color: var(--ok-text); }
  .paid-badge.unpaid { background: var(--warn-bg); color: var(--warn-text); }

  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .empty-cell { text-align: center; color: var(--sub); }

  .month-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-4); margin-bottom: var(--space-3); }
  .month-card h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .month-card .month-sub { font-size: 12px; color: var(--sub); margin-top: 2px; margin-bottom: var(--space-3); }
  .month-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); }
  .month-stats .stat { padding: var(--space-3) var(--space-2); }
  .month-stats.stats-2 { grid-template-columns: repeat(2, 1fr); }

  .section-title { font-size: 15px; font-weight: 600; margin: var(--space-5) 0 var(--space-3); display: flex; align-items: center; gap: 6px; }

  .pay-row { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-3) var(--space-4); margin-bottom: var(--space-2); display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; }
  .pay-row-right { display: flex; gap: var(--space-3); align-items: baseline; }
  .pay-row-count { font-size: 12px; font-weight: 400; color: var(--sub); }
  .pay-row-price { color: var(--accent); font-variant-numeric: tabular-nums; }

  .piece-name { cursor: pointer; }
  .piece-name:hover .piece-name-text { color: var(--accent); }
  .piece-name-actions { display: none; gap: var(--space-2); }
  .piece-name.active .piece-name-text { display: none; }
  .piece-name.active .piece-name-actions { display: flex; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; padding: 0; flex-shrink: 0;
    border: 1px solid var(--border); border-radius: 10px; background: #fff; color: var(--sub);
    cursor: pointer; transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn:active { transform: scale(.96); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .icon-btn-edit:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .icon-btn-delete:hover { background: #fdecea; color: var(--err-text); border-color: var(--err-text); }

  .edit-row { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; padding: var(--space-2) 0; }
  .edit-row input { font-family: inherit; font-size: 16px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; flex: 1; min-width: 90px; min-height: 44px; }
  .edit-row .btn { padding: 0 14px; font-size: 12px; min-height: 44px; }

  .lot-actions { padding: var(--space-2) var(--space-4); border-top: 1px solid var(--border); background: #fafafa; }
  .btn-sm { font-size: 12px; padding: 0 14px; min-height: 44px; white-space: nowrap; }

  .search-wrap { margin-bottom: var(--space-3); }
  .search-wrap input { font-family: inherit; font-size: 16px; padding: 11px 14px; border: 1px solid var(--border); border-radius: 10px; background: #fff; min-height: 44px; width: 100%; }
  .search-wrap input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

  .loading { text-align: center; color: var(--sub); padding: var(--space-6); font-size: 13px; }
</style>
</head>
<body>
  <header>
    <div>
      <h1>คำนวณผ้าดิบ</h1>
      <div class="meta" id="statusMsg">กำลังโหลด...</div>
    </div>
  </header>

  <div class="container" id="app">
    <div class="loading">กำลังโหลดข้อมูล...</div>
  </div>

  <script>
    // ===== ตั้งค่า Supabase =====
    const SUPABASE_URL = 'https://pmcnamlesodpuynakkuk.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_qkWioinGX5ybtENThpRjLw_9R3OL_Gw';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ===== logic คำนวณ (ย้ายมาจาก calc.js) =====
    function round2(n) { return Math.round(n * 100) / 100; }
    function round4(n) { return Math.round(n * 10000) / 10000; }
    function calcPiece(widthCm, lengthCm, settings) {
      const shrinkLength = round2(lengthCm * settings.shrink_rate);
      const yardPerPiece = round4((widthCm * shrinkLength) / settings.yard_area_cm2);
      const price = Math.round(widthCm * lengthCm * settings.price_rate);
      return { shrinkLength, yardPerPiece, price };
    }
    function lotSortKey(name) {
      const m = name.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
      if (!m) return -1;
      return parseInt(m[3]) * 10000 + parseInt(m[2]) * 100 + parseInt(m[1]);
    }
    function fmtBaht(n) { return Number(n).toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 0 }); }

    const THAI_MONTHS = ['', 'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];

    function todayKey() {
      const now = new Date();
      const yy = (now.getFullYear() + 543) % 100;
      const m = now.getMonth() + 1;
      const d = now.getDate();
      return yy * 10000 + m * 100 + d;
    }
    function todayLabel() {
      const now = new Date();
      const yy = (now.getFullYear() + 543) % 100;
      return now.getDate() + '/' + (now.getMonth() + 1) + '/' + yy;
    }
    function parseLotYM(name) {
      const m = name.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
      if (!m) return null;
      let yy = parseInt(m[3]);
      if (yy >= 100) yy = yy % 100;
      return { month: parseInt(m[2]), yy };
    }

    let SETTINGS = null;
    let lastSelectedLotId = null;
    let activeTab = 'daily';

    async function loadSettings() {
      const { data, error } = await sb.from('settings').select('key,value');
      if (error) throw error;
      const s = {};
      data.forEach(r => s[r.key] = Number(r.value));
      return s;
    }

    async function loadAll() {
      document.getElementById('statusMsg').textContent = 'กำลังโหลด...';
      SETTINGS = await loadSettings();

      const { data: lots, error: e1 } = await sb.from('lots').select('id,name,lot_date,created_at');
      if (e1) throw e1;
      const { data: pieces, error: e2 } = await sb.from('pieces').select('id,lot_id,width_cm,length_cm,label,price,paid');
      if (e2) throw e2;

      lots.sort((a, b) => lotSortKey(b.name) - lotSortKey(a.name));
      render(lots, pieces);
      document.getElementById('statusMsg').textContent = 'อัปเดตล่าสุด: ' + new Date().toLocaleString('th-TH');
    }

    function render(lots, pieces) {
      const app = document.getElementById('app');
      app.innerHTML = '';

      let totalPieces = 0, grandTotalYard = 0, grandTotalPrice = 0;
      const lotBlocks = lots.map(lot => {
        const rows = pieces.filter(p => p.lot_id === lot.id);
        let lotYard = 0, lotPrice = 0;
        rows.forEach(r => { lotYard += calcPiece(r.width_cm, r.length_cm, SETTINGS).yardPerPiece; lotPrice += Number(r.price); });
        totalPieces += rows.length; grandTotalYard += lotYard; grandTotalPrice += lotPrice;
        return { lot, rows, lotYard: round4(lotYard), lotPrice: round2(lotPrice) };
      });
      const bufferYard = round4(grandTotalYard * SETTINGS.buffer_rate);

      // ---- tab bar ----
      const tabs = document.createElement('div');
      tabs.className = 'tabs';
      tabs.innerHTML = `
        <button class="tab-btn ${activeTab === 'daily' ? 'active' : ''}" data-tab="daily">📅 รายวัน</button>
        <button class="tab-btn ${activeTab === 'monthly' ? 'active' : ''}" data-tab="monthly">🗓️ รายเดือน</button>
        <button class="tab-btn ${activeTab === 'payment' ? 'active' : ''}" data-tab="payment">💰 การชำระเงิน</button>
        <button class="tab-btn ${activeTab === 'customer' ? 'active' : ''}" data-tab="customer">👤 ลูกค้า</button>
      `;
      app.appendChild(tabs);

      // ---- แท็บรายวัน ----
      const dailyEl = document.createElement('div');
      dailyEl.id = 'dailyContent';

      const summary = document.createElement('div');
      summary.className = 'summary-grid';
      summary.innerHTML = `
        <div class="stat"><div class="num">${totalPieces}</div><div class="lbl">ชิ้นรวม</div></div>
        <div class="stat"><div class="num">${fmtBaht(grandTotalPrice)}</div><div class="lbl">ยอดรวมราคา (บาท)</div></div>
        <div class="stat"><div class="num">${round4(grandTotalYard).toFixed(2)}</div><div class="lbl">ผ้าที่ต้องใช้ (หลา)</div></div>
        <div class="stat"><div class="num">${bufferYard.toFixed(2)}</div><div class="lbl">แนะนำสั่งซื้อ +5% (หลา)</div></div>
      `;
      dailyEl.appendChild(summary);

      const tKey = todayKey();
      const todayBlocks = lotBlocks.filter(b => lotSortKey(b.lot.name) === tKey);
      const todayCard = document.createElement('div');
      todayCard.className = 'today-card';
      if (todayBlocks.length === 0) {
        todayCard.innerHTML = `
          <h2>📌 วันนี้ (${esc(todayLabel())})</h2>
          <div class="today-empty">ยังไม่มีออเดอร์วันนี้</div>
        `;
      } else {
        const tPieces = todayBlocks.reduce((s, b) => s + b.rows.length, 0);
        const tYard = round4(todayBlocks.reduce((s, b) => s + b.lotYard, 0));
        const tPrice = round2(todayBlocks.reduce((s, b) => s + b.lotPrice, 0));
        const tBuffer = round4(tYard * SETTINGS.buffer_rate);
        todayCard.innerHTML = `
          <h2>📌 วันนี้ (${esc(todayLabel())})</h2>
          <div class="today-stats">
            <div class="stat"><div class="num">${tPieces}</div><div class="lbl">ชิ้นวันนี้</div></div>
            <div class="stat"><div class="num">${fmtBaht(tPrice)}</div><div class="lbl">ยอดเงินวันนี้ (บาท)</div></div>
            <div class="stat"><div class="num">${tYard.toFixed(2)}</div><div class="lbl">ผ้าที่ต้องใช้ (หลา)</div></div>
            <div class="stat"><div class="num">${tBuffer.toFixed(2)}</div><div class="lbl">แนะนำซื้อ +5% (หลา)</div></div>
          </div>
        `;
      }
      dailyEl.appendChild(todayCard);

      dailyEl.appendChild(buildAddPanel(lots));

      const searchWrap = document.createElement('div');
      searchWrap.className = 'search-wrap';
      searchWrap.innerHTML = `<input id="lotSearch" type="text" placeholder="🔍 ค้นหาล็อตหรือชื่อลูกค้า..." aria-label="ค้นหาล็อตหรือชื่อลูกค้า">`;
      dailyEl.appendChild(searchWrap);

      lotBlocks.forEach(({ lot, rows, lotYard, lotPrice }) => {
        const lotBufferYard = round4(lotYard * SETTINGS.buffer_rate);
        const hasUnpaid = rows.some(r => !r.paid);
        const card = document.createElement('div');
        card.className = 'lot-card';
        card.dataset.search = (lot.name + ' ' + rows.map(r => r.label || '').join(' ')).toLowerCase();
        const rowsHtml = rows.map(r => {
          const { yardPerPiece } = calcPiece(r.width_cm, r.length_cm, SETTINGS);
          return `<tr>
            <td class="piece-name" data-label="รายการ">
              <span class="piece-name-text">${esc(r.label || '-')}</span>
              <span class="piece-name-actions">
                <button class="icon-btn icon-btn-edit edit-piece" data-id="${r.id}" data-label="${esc(r.label || '')}" data-width="${r.width_cm}" data-length="${r.length_cm}" aria-label="แก้ไขชิ้นงาน" title="แก้ไข">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                </button>
                <button class="icon-btn icon-btn-delete delete-piece" data-id="${r.id}" aria-label="ลบชิ้นงาน" title="ลบ">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
                </button>
              </span>
            </td>
            <td data-label="ขนาด (ซม.)">${r.width_cm} x ${r.length_cm}</td>
            <td data-label="ราคา">${fmtBaht(r.price)}</td>
            <td data-label="ผ้า (หลา)">${yardPerPiece.toFixed(2)}</td>
            <td data-label="สถานะ"><span class="paid-badge ${r.paid ? 'paid' : 'unpaid'}" data-id="${r.id}" data-paid="${r.paid}">${r.paid ? 'จ่ายแล้ว' : 'ยังไม่จ่าย'}</span></td>
          </tr>`;
        }).join('');
        card.innerHTML = `
          <div class="lot-head">
            <span>${esc(lot.name)}</span>
            <span class="lot-head-right"><span class="lot-total">${lotYard.toFixed(2)} หลา</span><span class="lot-price">${fmtBaht(lotPrice)} บาท</span><span class="lot-buffer">+5%: ${lotBufferYard.toFixed(2)} หลา</span></span>
          </div>
          ${hasUnpaid ? `<div class="lot-actions"><button class="btn secondary btn-sm mark-lot-paid" data-lot="${lot.id}">✅ จ่ายครบล็อตนี้</button></div>` : ''}
          <div class="table-wrap">
            <table>
              <thead><tr><th>รายการ</th><th>ขนาด (ซม.)</th><th>ราคา</th><th>ผ้า (หลา)</th><th>สถานะ</th></tr></thead>
              <tbody>${rowsHtml || '<tr><td colspan="5" class="empty-cell">ยังไม่มีชิ้นงาน</td></tr>'}</tbody>
            </table>
          </div>
        `;
        dailyEl.appendChild(card);
      });

      app.appendChild(dailyEl);

      searchWrap.querySelector('#lotSearch').addEventListener('input', (e) => {
        const q = e.target.value.trim().toLowerCase();
        dailyEl.querySelectorAll('.lot-card').forEach(card => {
          card.style.display = !q || card.dataset.search.includes(q) ? '' : 'none';
        });
      });

      // ---- แท็บรายเดือน ----
      const monthlyEl = document.createElement('div');
      monthlyEl.id = 'monthlyContent';

      const groups = {};
      const unknown = { pieces: 0, yard: 0, price: 0, lots: [] };
      lotBlocks.forEach(({ lot, rows, lotYard, lotPrice }) => {
        const ym = parseLotYM(lot.name);
        if (!ym) {
          unknown.pieces += rows.length; unknown.yard += lotYard; unknown.price += lotPrice; unknown.lots.push(lot.name);
          return;
        }
        const key = ym.yy + '-' + ym.month;
        if (!groups[key]) groups[key] = { yy: ym.yy, month: ym.month, pieces: 0, yard: 0, price: 0, lots: [] };
        groups[key].pieces += rows.length;
        groups[key].yard += lotYard;
        groups[key].price += lotPrice;
        groups[key].lots.push(lot.name);
      });
      const groupList = Object.values(groups).sort((a, b) => (b.yy * 100 + b.month) - (a.yy * 100 + a.month));

      if (groupList.length === 0 && unknown.lots.length === 0) {
        monthlyEl.innerHTML = `<div class="loading">ยังไม่มีข้อมูล</div>`;
      } else {
        groupList.forEach(g => {
          const card = document.createElement('div');
          card.className = 'month-card';
          card.innerHTML = `
            <h3>${THAI_MONTHS[g.month]} ${g.yy + 2500}</h3>
            <div class="month-sub">รวม ${g.lots.length} ล็อต: ${g.lots.map(esc).join(', ')}</div>
            <div class="month-stats">
              <div class="stat"><div class="num">${g.pieces}</div><div class="lbl">ชิ้นรวม</div></div>
              <div class="stat"><div class="num">${fmtBaht(round2(g.price))}</div><div class="lbl">ยอดเงินรวม (บาท)</div></div>
              <div class="stat"><div class="num">${round4(g.yard).toFixed(2)}</div><div class="lbl">ผ้ารวม (หลา)</div></div>
            </div>
          `;
          monthlyEl.appendChild(card);
        });
        if (unknown.lots.length) {
          const card = document.createElement('div');
          card.className = 'month-card';
          card.innerHTML = `
            <h3>ไม่ระบุเดือน</h3>
            <div class="month-sub">${unknown.lots.length} ล็อต: ${unknown.lots.map(esc).join(', ')}</div>
            <div class="month-stats">
              <div class="stat"><div class="num">${unknown.pieces}</div><div class="lbl">ชิ้นรวม</div></div>
              <div class="stat"><div class="num">${fmtBaht(round2(unknown.price))}</div><div class="lbl">ยอดเงินรวม (บาท)</div></div>
              <div class="stat"><div class="num">${round4(unknown.yard).toFixed(2)}</div><div class="lbl">ผ้ารวม (หลา)</div></div>
            </div>
          `;
          monthlyEl.appendChild(card);
        }
      }

      app.appendChild(monthlyEl);

      // ---- แท็บการชำระเงิน ----
      const paymentEl = document.createElement('div');
      paymentEl.id = 'paymentContent';

      let paidPieces = 0, paidPrice = 0, unpaidPieces = 0, unpaidPrice = 0;
      const lotOutstanding = [];
      lotBlocks.forEach(({ lot, rows }) => {
        let lp = 0, lc = 0;
        rows.forEach(r => {
          if (r.paid) { paidPieces++; paidPrice += Number(r.price); }
          else { unpaidPieces++; unpaidPrice += Number(r.price); lp += Number(r.price); lc++; }
        });
        if (lc > 0) lotOutstanding.push({ lot, count: lc, price: round2(lp) });
      });

      const paySummary = document.createElement('div');
      paySummary.className = 'summary-grid';
      paySummary.innerHTML = `
        <div class="stat"><div class="num">${fmtBaht(round2(unpaidPrice))}</div><div class="lbl">ยอดค้างชำระรวม (บาท)</div></div>
        <div class="stat"><div class="num">${unpaidPieces}</div><div class="lbl">ชิ้นที่ยังไม่จ่าย</div></div>
        <div class="stat"><div class="num">${fmtBaht(round2(paidPrice))}</div><div class="lbl">ยอดจ่ายแล้วรวม (บาท)</div></div>
        <div class="stat"><div class="num">${paidPieces}</div><div class="lbl">ชิ้นที่จ่ายแล้ว</div></div>
      `;
      paymentEl.appendChild(paySummary);

      // ค้างชำระรายเดือน
      const payMonthHeading = document.createElement('h2');
      payMonthHeading.className = 'section-title';
      payMonthHeading.textContent = '📆 ค้างชำระรายเดือน';
      paymentEl.appendChild(payMonthHeading);

      const oGroups = {};
      const oUnknown = { count: 0, price: 0, lots: [] };
      lotBlocks.forEach(({ lot, rows }) => {
        const unpaidRows = rows.filter(r => !r.paid);
        if (unpaidRows.length === 0) return;
        const count = unpaidRows.length;
        const price = round2(unpaidRows.reduce((s, r) => s + Number(r.price), 0));
        const ym = parseLotYM(lot.name);
        if (!ym) { oUnknown.count += count; oUnknown.price += price; oUnknown.lots.push(lot.name); return; }
        const key = ym.yy + '-' + ym.month;
        if (!oGroups[key]) oGroups[key] = { yy: ym.yy, month: ym.month, count: 0, price: 0, lots: [] };
        oGroups[key].count += count;
        oGroups[key].price += price;
        oGroups[key].lots.push(lot.name);
      });
      const oGroupList = Object.values(oGroups).sort((a, b) => (b.yy * 100 + b.month) - (a.yy * 100 + a.month));

      if (oGroupList.length === 0 && oUnknown.lots.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'loading';
        empty.textContent = 'ไม่มียอดค้างชำระ 🎉';
        paymentEl.appendChild(empty);
      } else {
        oGroupList.forEach(g => {
          const card = document.createElement('div');
          card.className = 'month-card';
          card.innerHTML = `
            <h3>${THAI_MONTHS[g.month]} ${g.yy + 2500}</h3>
            <div class="month-sub">${g.lots.length} ล็อตที่ค้าง: ${g.lots.map(esc).join(', ')}</div>
            <div class="month-stats stats-2">
              <div class="stat"><div class="num">${g.count}</div><div class="lbl">ชิ้นค้าง</div></div>
              <div class="stat"><div class="num">${fmtBaht(round2(g.price))}</div><div class="lbl">ยอดค้าง (บาท)</div></div>
            </div>
          `;
          paymentEl.appendChild(card);
        });
        if (oUnknown.lots.length) {
          const card = document.createElement('div');
          card.className = 'month-card';
          card.innerHTML = `
            <h3>ไม่ระบุเดือน</h3>
            <div class="month-sub">${oUnknown.lots.length} ล็อตที่ค้าง: ${oUnknown.lots.map(esc).join(', ')}</div>
            <div class="month-stats stats-2">
              <div class="stat"><div class="num">${oUnknown.count}</div><div class="lbl">ชิ้นค้าง</div></div>
              <div class="stat"><div class="num">${fmtBaht(round2(oUnknown.price))}</div><div class="lbl">ยอดค้าง (บาท)</div></div>
            </div>
          `;
          paymentEl.appendChild(card);
        }
      }

      // ค้างชำระรายล็อต
      const payLotHeading = document.createElement('h2');
      payLotHeading.className = 'section-title';
      payLotHeading.textContent = '📦 ค้างชำระรายล็อต';
      paymentEl.appendChild(payLotHeading);

      if (lotOutstanding.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'loading';
        empty.textContent = 'ทุกล็อตจ่ายครบแล้ว 🎉';
        paymentEl.appendChild(empty);
      } else {
        lotOutstanding.forEach(({ lot, count, price }) => {
          const row = document.createElement('div');
          row.className = 'pay-row';
          row.innerHTML = `
            <span class="pay-row-name">${esc(lot.name)}</span>
            <span class="pay-row-right"><span class="pay-row-count">${count} ชิ้น</span><span class="pay-row-price">${fmtBaht(price)} บาท</span><button class="btn secondary btn-sm mark-lot-paid" data-lot="${lot.id}">✅ จ่ายครบ</button></span>
          `;
          paymentEl.appendChild(row);
        });
      }

      // ประวัติที่จ่ายแล้ว
      const payHistHeading = document.createElement('h2');
      payHistHeading.className = 'section-title';
      payHistHeading.textContent = '🧾 ประวัติที่จ่ายแล้ว';
      paymentEl.appendChild(payHistHeading);

      const paidRows = [];
      lotBlocks.forEach(({ lot, rows }) => {
        rows.forEach(r => { if (r.paid) paidRows.push({ lot, r }); });
      });
      paidRows.sort((a, b) => lotSortKey(b.lot.name) - lotSortKey(a.lot.name));

      const histCard = document.createElement('div');
      histCard.className = 'lot-card';
      if (paidRows.length === 0) {
        histCard.innerHTML = `<div class="loading">ยังไม่มีรายการที่จ่ายแล้ว</div>`;
      } else {
        const histRowsHtml = paidRows.map(({ lot, r }) => {
          const { yardPerPiece } = calcPiece(r.width_cm, r.length_cm, SETTINGS);
          return `<tr>
            <td data-label="ล็อต / รายการ">${esc(lot.name)}${r.label ? ' — ' + esc(r.label) : ''}</td>
            <td data-label="ขนาด (ซม.)">${r.width_cm} x ${r.length_cm}</td>
            <td data-label="ราคา">${fmtBaht(r.price)}</td>
            <td data-label="ผ้า (หลา)">${yardPerPiece.toFixed(2)}</td>
            <td data-label="สถานะ"><span class="paid-badge paid" data-id="${r.id}" data-paid="true">จ่ายแล้ว</span></td>
          </tr>`;
        }).join('');
        histCard.innerHTML = `
          <div class="table-wrap">
            <table>
              <thead><tr><th>ล็อต / รายการ</th><th>ขนาด (ซม.)</th><th>ราคา</th><th>ผ้า (หลา)</th><th>สถานะ</th></tr></thead>
              <tbody>${histRowsHtml}</tbody>
            </table>
          </div>
        `;
      }
      paymentEl.appendChild(histCard);

      app.appendChild(paymentEl);

      // ---- แท็บลูกค้า ----
      const customerEl = document.createElement('div');
      customerEl.id = 'customerContent';

      const customerMap = {};
      lotBlocks.forEach(({ rows }) => {
        rows.forEach(r => {
          const name = r.label && r.label.trim() ? r.label.trim() : 'ไม่ระบุชื่อ';
          if (!customerMap[name]) customerMap[name] = { name, pieces: 0, total: 0, unpaid: 0, unpaidCount: 0 };
          customerMap[name].pieces += 1;
          customerMap[name].total += Number(r.price);
          if (!r.paid) { customerMap[name].unpaid += Number(r.price); customerMap[name].unpaidCount += 1; }
        });
      });
      const customerList = Object.values(customerMap).sort((a, b) => {
        if (b.unpaid !== a.unpaid) return b.unpaid - a.unpaid;
        return b.total - a.total;
      });

      if (customerList.length === 0) {
        customerEl.innerHTML = `<div class="loading">ยังไม่มีข้อมูลลูกค้า</div>`;
      } else {
        customerList.forEach(c => {
          const card = document.createElement('div');
          card.className = 'month-card';
          card.innerHTML = `
            <h3>${esc(c.name)}</h3>
            <div class="month-sub">${c.unpaidCount > 0 ? `ค้าง ${c.unpaidCount} ชิ้น` : 'จ่ายครบแล้ว ✅'}</div>
            <div class="month-stats">
              <div class="stat"><div class="num">${c.pieces}</div><div class="lbl">ชิ้นรวม</div></div>
              <div class="stat"><div class="num">${fmtBaht(round2(c.total))}</div><div class="lbl">ยอดรวม (บาท)</div></div>
              <div class="stat"><div class="num">${fmtBaht(round2(c.unpaid))}</div><div class="lbl">ค้างชำระ (บาท)</div></div>
            </div>
          `;
          customerEl.appendChild(card);
        });
      }

      app.appendChild(customerEl);

      dailyEl.style.display = activeTab === 'daily' ? '' : 'none';
      monthlyEl.style.display = activeTab === 'monthly' ? '' : 'none';
      paymentEl.style.display = activeTab === 'payment' ? '' : 'none';
      customerEl.style.display = activeTab === 'customer' ? '' : 'none';

      tabs.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeTab = btn.dataset.tab;
          tabs.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
          dailyEl.style.display = activeTab === 'daily' ? '' : 'none';
          monthlyEl.style.display = activeTab === 'monthly' ? '' : 'none';
          paymentEl.style.display = activeTab === 'payment' ? '' : 'none';
          customerEl.style.display = activeTab === 'customer' ? '' : 'none';
        });
      });

      app.querySelectorAll('.paid-badge').forEach(el => {
        el.addEventListener('click', async () => {
          const id = el.dataset.id;
          const next = el.dataset.paid !== 'true';
          el.textContent = '...';
          const { error } = await sb.from('pieces').update({ paid: next }).eq('id', id);
          if (error) { alert('อัปเดตไม่สำเร็จ: ' + error.message); }
          await loadAll();
        });
      });

      app.querySelectorAll('.edit-piece').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const tr = btn.closest('tr');
          const id = btn.dataset.id;
          const label = btn.dataset.label;
          const width = btn.dataset.width;
          const length = btn.dataset.length;
          tr.innerHTML = `
            <td colspan="5">
              <div class="edit-row">
                <input class="edit-label" placeholder="ชื่อ/รายละเอียด" aria-label="ชื่อ/รายละเอียด" value="${esc(label)}">
                <input class="edit-width" type="number" min="0" step="any" value="${width}" placeholder="กว้าง" aria-label="กว้าง (ซม.)">
                <input class="edit-length" type="number" min="0" step="any" value="${length}" placeholder="ยาว" aria-label="ยาว (ซม.)">
                <button class="btn btn-sm save-piece">✅ บันทึก</button>
                <button class="btn secondary btn-sm cancel-edit">✖️ ยกเลิก</button>
              </div>
            </td>
          `;
          tr.querySelector('.cancel-edit').addEventListener('click', () => loadAll());
          tr.querySelector('.save-piece').addEventListener('click', async () => {
            const newLabel = tr.querySelector('.edit-label').value.trim();
            const newWidth = parseFloat(tr.querySelector('.edit-width').value);
            const newLength = parseFloat(tr.querySelector('.edit-length').value);
            if (!newWidth || !newLength) { alert('กรอกกว้างและยาวให้ครบ'); return; }
            const newPrice = Math.round(newWidth * newLength * SETTINGS.price_rate);
            const { error } = await sb.from('pieces').update({ label: newLabel || null, width_cm: newWidth, length_cm: newLength, price: newPrice }).eq('id', id);
            if (error) { alert('บันทึกไม่สำเร็จ: ' + error.message); return; }
            await loadAll();
          });
        });
      });

      app.querySelectorAll('.delete-piece').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (!confirm('ลบชิ้นงานนี้?')) return;
          const id = btn.dataset.id;
          const { error } = await sb.from('pieces').delete().eq('id', id);
          if (error) { alert('ลบไม่สำเร็จ: ' + error.message); return; }
          await loadAll();
        });
      });

      app.querySelectorAll('.piece-name').forEach(td => {
        td.addEventListener('click', () => {
          td.classList.toggle('active');
        });
      });

      app.querySelectorAll('.mark-lot-paid').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('มาร์คทุกชิ้นในล็อตนี้ว่าจ่ายแล้ว?')) return;
          const lotId = btn.dataset.lot;
          btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
          const { error } = await sb.from('pieces').update({ paid: true }).eq('lot_id', lotId);
          if (error) { alert('อัปเดตไม่สำเร็จ: ' + error.message); btn.disabled = false; return; }
          await loadAll();
        });
      });
    }

    function buildAddPanel(lots) {
      const frag = document.createDocumentFragment();

      if (lastSelectedLotId === null && lots.length) lastSelectedLotId = lots[0].id;

      // ---- panel 1: เพิ่มล็อตใหม่ ----
      const lotPanel = document.createElement('div');
      lotPanel.className = 'panel';
      lotPanel.innerHTML = `
        <h2>➕ เพิ่มล็อตใหม่</h2>
        <div class="field-row">
          <div class="field">
            <label for="newLotName">ชื่อล็อต</label>
            <input id="newLotName" placeholder="เช่น 9/8/69">
          </div>
          <button id="addLotBtn" class="btn">+ เพิ่มล็อต</button>
        </div>
        <div class="msg" id="lotMsg"></div>
      `;
      const lotNameInput = lotPanel.querySelector('#newLotName');
      const addLotBtn = lotPanel.querySelector('#addLotBtn');
      const lotMsg = lotPanel.querySelector('#lotMsg');
      async function submitLot() {
        const name = lotNameInput.value.trim();
        lotMsg.textContent = ''; lotMsg.className = 'msg';
        if (!name) { lotMsg.textContent = 'กรอกชื่อล็อตก่อน'; lotMsg.className = 'msg error'; return; }
        addLotBtn.disabled = true; addLotBtn.textContent = 'กำลังเพิ่ม...';
        const { error } = await sb.from('lots').insert({ name });
        if (error) {
          lotMsg.textContent = 'เพิ่มล็อตไม่สำเร็จ: ' + error.message; lotMsg.className = 'msg error';
          addLotBtn.disabled = false; addLotBtn.textContent = '+ เพิ่มล็อต';
          return;
        }
        await loadAll();
      }
      addLotBtn.addEventListener('click', submitLot);
      lotNameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitLot(); });

      // ---- panel 2: เพิ่มชิ้นงาน ----
      const piecePanel = document.createElement('div');
      piecePanel.className = 'panel';
      const lotOptions = lots.map(l => `<option value="${l.id}" ${l.id === lastSelectedLotId ? 'selected' : ''}>${esc(l.name)}</option>`).join('');
      piecePanel.innerHTML = `
        <h2>🧵 เพิ่มชิ้นงาน</h2>
        <div class="field" style="margin-bottom:var(--space-3)">
          <label for="pieceLot">เลือกล็อต</label>
          <select id="pieceLot">${lotOptions || '<option value="">-- ยังไม่มีล็อต --</option>'}</select>
        </div>
        <div class="form-grid">
          <div class="field">
            <label for="pieceLabel">ชื่อ/รายละเอียด</label>
            <input id="pieceLabel" placeholder="ไม่บังคับ">
          </div>
          <div class="field">
            <label for="pieceWidth">กว้าง (ซม.)</label>
            <input id="pieceWidth" type="number" min="0" placeholder="0" inputmode="decimal">
          </div>
          <div class="field">
            <label for="pieceLength">ยาว (ซม.)</label>
            <input id="pieceLength" type="number" min="0" placeholder="0" inputmode="decimal">
          </div>
          <div class="field">
            <label for="pieceQty">จำนวน</label>
            <input id="pieceQty" type="number" min="1" value="1" inputmode="numeric">
          </div>
        </div>
        <button id="addPieceBtn" class="btn secondary block">+ เพิ่มชิ้นงาน</button>
        <div class="msg" id="pieceMsg"></div>
        <div class="hint">ราคาต่อชิ้นคำนวณอัตโนมัติ = กว้าง x ยาว x ${SETTINGS.price_rate} บาท/ตร.ซม.</div>
      `;
      piecePanel.querySelector('#pieceLot').addEventListener('change', (e) => {
        lastSelectedLotId = e.target.value;
      });
      piecePanel.querySelector('#addPieceBtn').addEventListener('click', async () => {
        const lotId = piecePanel.querySelector('#pieceLot').value;
        const label = piecePanel.querySelector('#pieceLabel').value.trim();
        const width = parseFloat(piecePanel.querySelector('#pieceWidth').value);
        const length = parseFloat(piecePanel.querySelector('#pieceLength').value);
        const qty = parseInt(piecePanel.querySelector('#pieceQty').value) || 1;
        const msg = piecePanel.querySelector('#pieceMsg');
        const btn = piecePanel.querySelector('#addPieceBtn');
        msg.textContent = ''; msg.className = 'msg';
        if (!lotId) { msg.textContent = 'ยังไม่มีล็อต กรุณาเพิ่มล็อตก่อน'; msg.className = 'msg error'; return; }
        if (!width || !length) { msg.textContent = 'กรอกกว้างและยาวให้ครบ'; msg.className = 'msg error'; return; }
        btn.disabled = true; btn.textContent = 'กำลังเพิ่ม...';
        lastSelectedLotId = lotId;
        const price = Math.round(width * length * SETTINGS.price_rate);
        const rowsToInsert = Array.from({ length: qty }, () => ({
          lot_id: lotId, width_cm: width, length_cm: length, label: label || null, price, paid: false
        }));
        const { error } = await sb.from('pieces').insert(rowsToInsert);
        if (error) {
          msg.textContent = 'เพิ่มชิ้นงานไม่สำเร็จ: ' + error.message; msg.className = 'msg error';
          btn.disabled = false; btn.textContent = '+ เพิ่มชิ้นงาน';
          return;
        }
        await loadAll();
      });

      frag.appendChild(lotPanel);
      frag.appendChild(piecePanel);
      return frag;
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    loadAll().catch(err => {
      document.getElementById('statusMsg').textContent = 'โหลดไม่สำเร็จ: ' + err.message;
    });
  </script>
</body>
</html>
