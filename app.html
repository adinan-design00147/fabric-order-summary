          // งานเสียที่ลบทิ้ง -> ลดตัวนับ "ทำใหม่" ลง 1
          if (w.kind === 'defect' && w.piece_id) {
            const p = pieces.find(x => x.id === w.piece_id);
            if (p && Number(p.redo_count) > 0) {
              await sb.from('pieces').update({ redo_count: Number(p.redo_count) - 1 }).eq('id', p.id);
            }
          }
          await trashDelete('fabric_waste', w.id, {
            label: Number(w.yards).toFixed(2) + ' หลา · ' + (w.reason || 'ไม่ระบุสาเหตุ'),
            detail: (w.kind === 'defect' ? 'งานเสีย' : 'เศษผ้า') +
              (giveBack ? ' · คืนผ้าเข้าสต็อกแล้ว' : ' · ไม่ได้คืนผ้า') +
              ' · กู้คืนจากถังขยะจะไม่ตัดสต็อกซ้ำให้',
          });
          await loadAll();
        } catch (e) { alert('ลบไม่สำเร็จ: ' + e.message); b.disabled = false; }
      }));

      return el;
    }

    // ===== ลงเวลาทำงาน =====
    // เก็บ 3 อย่าง: ตารางงานรายคน (work_schedules) · การเข้า-ออกรายวัน (attendances) · คำขอโอที (ot_requests)
    // กดเข้า/ออกงานได้เฉพาะตอนอยู่ในรัศมีร้าน (พิกัดร้านตั้งได้ในหน้านี้ ฝั่งผู้ดูแล)
    // แผนที่โหลดแบบ lazy — หน้าอื่นจะได้ไม่ต้องแบกไฟล์นี้
    let leafletPromise = null;
    function loadLeaflet() {
      if (window.L) return Promise.resolve(window.L);
      if (leafletPromise) return leafletPromise;
      leafletPromise = new Promise((resolve, reject) => {
        const css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
        document.head.appendChild(css);
        const js = document.createElement('script');
        js.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
        js.onload = () => resolve(window.L);
        js.onerror = () => {
          const alt = document.createElement('script');
          alt.src = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';
          alt.onload = () => resolve(window.L);
          alt.onerror = () => reject(new Error('โหลดแผนที่ไม่สำเร็จ'));
          document.head.appendChild(alt);
        };
        document.head.appendChild(js);
      });
      return leafletPromise;
    }

    /** อ่านพิกัดจากข้อความที่วางมา เช่น "7.1234, 100.5678" (ลิงก์ Google Maps ที่มีตัวเลขก็ได้) */
    function parseLatLng(text) {
      const m = String(text || '').match(/(-?\d{1,3}\.\d{2,})[,\s/@]+(-?\d{1,3}\.\d{2,})/);
      if (!m) return null;
      const lat = parseFloat(m[1]), lng = parseFloat(m[2]);
      if (Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
      return { lat, lng };
    }

    const DOW_TH = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
    const DOW_SHORT = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
    const DEFAULT_DAYS = [0, 1, 2, 3, 4, 5, 6].map(i => ({ work: i !== 0, start: '09:00', end: '17:00' }));

    let attTab = 'clock';
    let attWho = null;          // ผู้ดูแลเลือกดูของคนอื่นได้
    let attMonth = new Date();
    let ATT = { users: [], schedules: [], records: [], ots: [], todayAll: [] };
    let attClockTimer = null;

    const dateKey = (d) => {
      const x = d || new Date();
      return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
    };
    const hhmm = (iso) => iso ? new Date(iso).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) : '--:--';
    const minToHM = (m) => {
      const v = Math.max(0, Math.round(Number(m) || 0));
      return Math.floor(v / 60) + ' ชม. ' + (v % 60) + ' น.';
    };

    /** ระยะห่างระหว่างพิกัด 2 จุด (เมตร) — สูตร haversine */
    function distanceMeters(lat1, lng1, lat2, lng2) {
      const R = 6371000, toRad = x => x * Math.PI / 180;
      const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
      return Math.round(2 * R * Math.asin(Math.sqrt(a)));
    }

    function getPosition() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) return reject(new Error('เครื่องนี้ไม่รองรับการหาตำแหน่ง'));
        navigator.geolocation.getCurrentPosition(
          pos => resolve(pos.coords),
          err => reject(new Error(
            err.code === 1 ? 'ไม่ได้อนุญาตให้เข้าถึงตำแหน่ง — เปิดสิทธิ์ตำแหน่งให้เว็บนี้ก่อน'
              : err.code === 3 ? 'หาตำแหน่งไม่ทัน ลองใหม่อีกครั้ง (ออกไปที่โล่งจะจับสัญญาณง่ายขึ้น)'
                : 'หาตำแหน่งไม่สำเร็จ')),
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
      });
    }

    function scheduleOf(userId) {
      const row = ATT.schedules.find(s => s.user_id === userId);
      return {
        days: (row && Array.isArray(row.days) && row.days.length === 7) ? row.days : DEFAULT_DAYS,
        grace_minutes: row ? Number(row.grace_minutes) : 30,
        break_minutes: row ? Number(row.break_minutes) : 60,
        exists: !!row,
      };
    }

    async function loadAttendance() {
      document.getElementById('statusMsg').textContent = 'กำลังโหลด...';

      if (!attWho) attWho = ME ? ME.id : null;
      if (!isAdmin()) attWho = ME ? ME.id : null;

      const from = new Date(attMonth.getFullYear(), attMonth.getMonth(), 1);
      const to = new Date(attMonth.getFullYear(), attMonth.getMonth() + 1, 0);

      const [uRes, sRes, rRes, oRes, tRes] = await Promise.all([
        sb.from('app_users').select('user_id,email,username,display_name,role').order('created_at'),
        sb.from('work_schedules').select('*'),
        sb.from('attendances').select('*').eq('user_id', attWho).gte('work_date', dateKey(from)).lte('work_date', dateKey(to)).order('work_date', { ascending: false }),
        sb.from('ot_requests').select('*').order('work_date', { ascending: false }).limit(50),
        sb.from('attendances').select('*').eq('work_date', dateKey()),
      ]);
      if (uRes.error) throw uRes.error;
      ATT = {
        users: uRes.data || [], schedules: sRes.data || [], records: rRes.data || [],
        ots: oRes.data || [], todayAll: tRes.data || [],
      };
      renderAttendance();
      document.getElementById('statusMsg').textContent = 'อัปเดตล่าสุด: ' + new Date().toLocaleString('th-TH');
    }

    function userLabel(u) {
      if (!u) return '—';
      if (u.display_name) return u.display_name;
      if (u.username) return u.username;

      return e.includes('@') ? e.split('@')[0] : (e || '—');

    function renderAttendance() {
      const app = document.getElementById('app');
      if (attClockTimer) { clearInterval(attClockTimer); attClockTimer = null; }
      app.innerHTML = '';
      app.appendChild(buildPageHead(
        attTab === 'clock' ? 'ลงเวลา' : attTab === 'schedule' ? 'ตารางงาน' : 'ประวัติลงเวลา & โอที',
        attTab === 'clock' ? 'กดเข้างาน-ออกงาน ระบบเช็กว่าอยู่ที่ร้านให้เอง'
          : attTab === 'schedule' ? 'วันทำงาน เวลาเข้า-ออก และที่ตั้งร้าน'
            : 'สรุปรายเดือน ประวัติการลงเวลา และคำขอโอที'));

      if (attTab === 'clock') renderClockTab(app);
      else if (attTab === 'schedule') renderScheduleTab(app);
      else renderHistoryTab(app);
    }

    // ---------- แท็บ 1: ลงเวลา ----------
    function renderClockTab(app) {
      const today = ATT.records.find(r => r.work_date === dateKey());
      // ปุ่มเดียวเปลี่ยนหน้าที่ตามสถานะ: ยังไม่เข้า -> เข้างาน · เข้าแล้ว -> ออกงาน · ครบแล้ว -> ปิดปุ่ม
      const phase = !today || !today.clock_in ? 'in' : !today.clock_out ? 'out' : 'finished';
      const sc = scheduleOf(ME ? ME.id : null);
      const dow = new Date().getDay();
      const plan = sc.days[dow] || DEFAULT_DAYS[dow];
      const shopSet = Number(SETTINGS.shop_lat) !== 0 || Number(SETTINGS.shop_lng) !== 0;

      const card = document.createElement('div');
      card.className = 'lot-card att-clock';
      card.innerHTML = `
        <div class="att-now">
          <div class="att-time" id="attClock">--:--:--</div>
          <div class="att-date">${new Date().toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long' })} ${new Date().getFullYear() + 543}</div>
          <div class="att-plan">${plan.work
            ? 'วันนี้เข้างาน <b>' + esc(plan.start) + '</b> — ออกงาน <b>' + esc(plan.end) + '</b> · สายเกิน ' + sc.grace_minutes + ' น. นับว่าสาย'
            : '<b>วันนี้เป็นวันหยุดตามตารางงาน</b> — ถ้ามาทำงานก็กดลงเวลาได้ตามปกติ'}</div>
        </div>
        <div class="att-geo-row">
          <div class="att-geo" id="attGeo">${icon('pin', 15)}<span id="attGeoTxt">${shopSet ? 'กด "Sync GPS" เพื่อเช็กตำแหน่ง' : 'ยังไม่ได้ตั้งพิกัดร้าน'}</span></div>
          <button class="btn secondary btn-sm" id="attSync">${icon('refresh', 15)}Sync GPS</button>
        </div>
        <details class="att-map-box" id="attMapBox">
          <summary>${icon('pin', 15)}แผนที่ · ตำแหน่งของฉัน</summary>
          <div class="att-map" id="attMap"></div>
          ${isAdmin() ? `<div class="att-map-hint">${shopSet ? 'แตะบนแผนที่เพื่อย้ายจุดร้าน' : 'ยังไม่ได้ตั้งจุดร้าน — แตะบนแผนที่ตรงที่ตั้งร้าน หรือกดปุ่มด้านล่าง'}
            <button class="btn secondary btn-sm" id="attSetHere">${icon('pin', 15)}ใช้ตำแหน่งปัจจุบันเป็นที่ตั้งร้าน</button></div>` : ''}
        </details>
        ${!shopSet && !isAdmin() ? '<div class="hint" style="margin-top:8px">แจ้งผู้ดูแลให้ตั้งพิกัดร้านก่อน ถึงจะกดลงเวลาได้</div>' : ''}
        <div class="att-actions">
          <button class="att-btn ${phase}" id="attPunch" ${phase === 'finished' ? 'disabled' : ''}>
            ${icon(phase === 'out' ? 'signout' : 'signin', 40)}
            <span>${phase === 'in' ? 'เข้างาน' : phase === 'out' ? 'ออกงาน' : 'ครบแล้ววันนี้'}</span>
            <small>${phase === 'in' ? 'แตะเพื่อลงเวลา'
              : phase === 'out' ? 'เข้างาน ' + hhmm(today.clock_in)
                : hhmm(today.clock_in) + ' – ' + hhmm(today.clock_out)}</small>
          </button>
        </div>
        <div class="msg" id="attMsg"></div>
        <div class="att-summary">
          <div><span class="lbl">เข้างาน</span><span class="val ok">${hhmm(today && today.clock_in)}</span></div>
          <div><span class="lbl">ออกงาน</span><span class="val danger">${hhmm(today && today.clock_out)}</span></div>
          <div><span class="lbl">สาย</span><span class="val">${today && today.late_minutes ? today.late_minutes + ' นาที' : '-'}</span></div>
          <div><span class="lbl">ชั่วโมงงาน</span><span class="val">${today && today.work_minutes ? minToHM(today.work_minutes) : '-'}</span></div>
        </div>
      `;
      app.appendChild(card);

      const tick = () => {
        const el = document.getElementById('attClock');
        if (!el) { clearInterval(attClockTimer); attClockTimer = null; return; }
        el.textContent = new Date().toLocaleTimeString('th-TH', { hour12: false });
      };
      tick();
      attClockTimer = setInterval(tick, 1000);

      const msg = card.querySelector('#attMsg');
      const geo = card.querySelector('#attGeo');
      const geoTxt = card.querySelector('#attGeoTxt');
      const radius = Number(SETTINGS.geo_radius_m) || 150;

      // ---- แผนที่: วงกลม = พื้นที่ร้าน · หมุด = ตำแหน่งคุณตอนนี้ ----
      let map = null, meMarker = null, shopMarker = null, shopCircle = null;
      const shopLL = () => [Number(SETTINGS.shop_lat) || 13.7563, Number(SETTINGS.shop_lng) || 100.5018];

      const drawShop = (L, lat, lng) => {
        if (shopMarker) map.removeLayer(shopMarker);
        if (shopCircle) map.removeLayer(shopCircle);
        shopCircle = L.circle([lat, lng], { radius, color: '#3454d1', weight: 1.5, fillOpacity: .12 }).addTo(map);
        shopMarker = L.circleMarker([lat, lng], { radius: 7, color: '#fff', weight: 2, fillColor: '#3454d1', fillOpacity: 1 })
          .addTo(map).bindTooltip('ที่ตั้งร้าน');
      };

      const showMe = (L, lat, lng, inRange) => {
        if (meMarker) map.removeLayer(meMarker);
        meMarker = L.circleMarker([lat, lng], {
          radius: 8, color: '#fff', weight: 2, fillColor: inRange ? '#22a06b' : '#d1493f', fillOpacity: 1,
        }).addTo(map).bindTooltip('คุณอยู่ตรงนี้');
      };

      // จอคอมกางแผนที่ไว้เลย · มือถือยุบไว้ก่อน จะได้เห็นปุ่มลงเวลาทันทีที่เปิดหน้า
      const mapBox = card.querySelector('#attMapBox');
      mapBox.open = window.matchMedia('(min-width: 561px)').matches;

      loadLeaflet().then(L => {
        const el = card.querySelector('#attMap');
        if (!el) return;
        map = L.map(el, { attributionControl: false, zoomControl: true }).setView(shopLL(), shopSet ? 17 : 13);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
        if (shopSet) drawShop(L, ...shopLL());
        setTimeout(() => map.invalidateSize(), 200);
        // แผนที่ที่ถูกยุบไว้จะมีขนาด 0 ต้องสั่งวัดใหม่ทุกครั้งที่กางออก ไม่งั้นขึ้นเป็นแผ่นเทา
        mapBox.addEventListener('toggle', () => { if (mapBox.open) setTimeout(() => map.invalidateSize(), 60); });

        // ผู้ดูแลแตะบนแผนที่เพื่อย้ายจุดร้าน
        if (isAdmin()) map.on('click', async (e) => {
          if (!confirm('ตั้งจุดนี้เป็นที่ตั้งร้าน?')) return;
          const { error } = await sb.from('settings').upsert([
            { key: 'shop_lat', value: String(e.latlng.lat) },
            { key: 'shop_lng', value: String(e.latlng.lng) },
          ], { onConflict: 'key' });
          if (error) { alert('บันทึกไม่สำเร็จ: ' + error.message); return; }
          SETTINGS = await loadSettings(true);
          drawShop(L, e.latlng.lat, e.latlng.lng);
          await loadAttendance();
        });
      }).catch(() => {
        const el = card.querySelector('#attMap');
        if (el) el.innerHTML = '<div class="empty-cell" style="padding:20px">เปิดแผนที่ไม่ได้ (เน็ตอาจไม่ถึง CDN) — ปุ่มลงเวลายังใช้ได้ตามปกติ</div>';
      });

      /** เช็กตำแหน่งปัจจุบัน อัปเดตข้อความ+หมุดบนแผนที่ แล้วคืนค่าระยะห่าง */
      const syncGps = async () => {
        geoTxt.textContent = 'กำลังหาตำแหน่ง...';
        geo.className = 'att-geo';
        const c = await getPosition();
        const dist = shopSet ? distanceMeters(c.latitude, c.longitude, ...shopLL()) : null;
        const inRange = dist !== null && dist <= radius;
        if (dist === null) {
          geoTxt.textContent = 'ได้ตำแหน่งแล้ว (ยังไม่ได้ตั้งจุดร้าน)';
        } else {
          geoTxt.textContent = inRange
            ? 'อยู่ในพื้นที่ร้าน (ห่าง ' + dist.toLocaleString('th-TH') + ' ม.)'
            : 'อยู่นอกพื้นที่ร้าน ห่าง ' + dist.toLocaleString('th-TH') + ' ม. · อนุญาตไม่เกิน ' + radius + ' ม.';
          geo.className = 'att-geo ' + (inRange ? 'in-range' : 'out-range');
        }
        if (map && window.L) {
          showMe(window.L, c.latitude, c.longitude, inRange);
          map.setView([c.latitude, c.longitude], Math.max(map.getZoom(), 16));
        }
        return { c, dist, inRange };
      };

      // เช็กตำแหน่งให้เองตอนเปิดหน้า จะได้รู้ล่วงหน้าว่ากดลงเวลาผ่านไหม ไม่ต้องกด Sync ก่อน
      if (shopSet && phase !== 'finished') {
        syncGps().catch(e => { geoTxt.textContent = e.message || 'เช็กตำแหน่งไม่ได้ — กด "Sync GPS" ลองใหม่'; });
      }

      card.querySelector('#attSync').addEventListener('click', async () => {
        const b = card.querySelector('#attSync');
        b.disabled = true;
        msg.textContent = ''; msg.className = 'msg';
        try { await syncGps(); } catch (e) { msg.textContent = e.message; msg.className = 'msg error'; }
        b.disabled = false;
      });

      // ผู้ดูแลตั้งพิกัดร้านได้จากหน้านี้เลย ไม่ต้องข้ามไปแท็บอื่น
      const setHere = card.querySelector('#attSetHere');
      if (setHere) setHere.addEventListener('click', async () => {
        setHere.disabled = true;
        msg.textContent = 'กำลังหาตำแหน่ง...'; msg.className = 'msg';
        try {
          const c = await getPosition();
          const { error } = await sb.from('settings').upsert([
            { key: 'shop_lat', value: String(c.latitude) },
            { key: 'shop_lng', value: String(c.longitude) },
          ], { onConflict: 'key' });
          if (error) throw new Error(error.message);
          SETTINGS = await loadSettings(true);
          await loadAttendance();
        } catch (e) { msg.textContent = e.message; msg.className = 'msg error'; setHere.disabled = false; }
      });

      const punch = async (kind) => {
        msg.textContent = ''; msg.className = 'msg';
        const btn = card.querySelector('#attPunch');
        btn.disabled = true;
        try {
          if (!shopSet) throw new Error('ยังไม่ได้ตั้งพิกัดร้าน — ให้ผู้ดูแลแตะจุดร้านบนแผนที่ก่อน');
          const { c, dist, inRange } = await syncGps();
          if (!inRange) throw new Error('อยู่นอกพื้นที่ร้าน (' + dist.toLocaleString('th-TH') + ' ม.) กดลงเวลาไม่ได้');

          const now = new Date();
          if (kind === 'in') {
            let late = 0;
            if (plan.work) {
              const [h, m] = String(plan.start).split(':').map(Number);
              const startAt = new Date(now); startAt.setHours(h, m, 0, 0);
              const diff = Math.round((now - startAt) / 60000);
              late = diff > sc.grace_minutes ? diff : 0;
            }
            const { error } = await sb.from('attendances').upsert({
              user_id: ME.id, work_date: dateKey(), clock_in: now.toISOString(),
              in_lat: c.latitude, in_lng: c.longitude, in_distance_m: dist, late_minutes: late,
            }, { onConflict: 'user_id,work_date' });
            if (error) throw new Error(error.message);
          } else {
            const rec = ATT.records.find(r => r.work_date === dateKey());
            const mins = Math.max(0, Math.round((now - new Date(rec.clock_in)) / 60000) - sc.break_minutes);
            const { error } = await sb.from('attendances').update({
              clock_out: now.toISOString(), out_lat: c.latitude, out_lng: c.longitude,
              out_distance_m: dist, work_minutes: mins,
            }).eq('id', rec.id);
            if (error) throw new Error(error.message);
          }
          await loadAttendance();
        } catch (e) {
          msg.textContent = e.message; msg.className = 'msg error';
          btn.disabled = false;
        }
      };
      if (phase !== 'finished') card.querySelector('#attPunch').addEventListener('click', () => punch(phase));

      // ---- ผู้ดูแล: ใครมาแล้วบ้างวันนี้ ----
      if (isAdmin()) {
        const staff = ATT.users;
        const panel = document.createElement('div');
        panel.className = 'lot-card';
        panel.innerHTML = `
          <div class="lot-head"><span>${icon('user', 16)}วันนี้ใครลงเวลาแล้วบ้าง</span>
            <span class="st ${ATT.todayAll.length ? 'st-paid' : 'st-prod'}">มาแล้ว ${ATT.todayAll.length}/${staff.length}</span></div>
          <div class="att-people">${staff.map(u => {
            const r = ATT.todayAll.find(x => x.user_id === u.user_id);
            const state = !r || !r.clock_in ? 'ยังไม่มา' : r.clock_out ? 'ออกงานแล้ว' : 'กำลังทำงาน';
            const cls = !r || !r.clock_in ? 'off' : r.clock_out ? 'done' : 'on';
            return `<div class="att-person ${cls}">
              <div class="ap-main">
                <div class="ap-name">${esc(userLabel(u))} <span class="st ${roleMeta(u.role).cls}">${esc(roleMeta(u.role).label)}</span></div>
                <div class="ap-sub">${r && r.clock_in ? 'เข้า ' + hhmm(r.clock_in) + ' · ออก ' + hhmm(r.clock_out)
                  + (r.late_minutes ? ' · สาย ' + r.late_minutes + ' น.' : '')
                  + (r.work_minutes ? ' · ' + minToHM(r.work_minutes) : '') : 'ยังไม่ได้ลงเวลาวันนี้'}</div>
              </div>
              <span class="ap-state">${state}</span>
            </div>`;
          }).join('')}</div>`;
        app.appendChild(panel);
      }
    }

    // ---------- แท็บ 2: ตารางงาน ----------
    function renderScheduleTab(app) {
      const targetId = isAdmin() ? (attWho || (ME && ME.id)) : (ME && ME.id);
      const target = ATT.users.find(u => u.user_id === targetId);
      const sc = scheduleOf(targetId);
      const canEdit = isAdmin();

      if (isAdmin()) {
        const pick = document.createElement('div');
        pick.className = 'field-row no-print';
        pick.style.marginBottom = '12px';
        pick.innerHTML = `<label for="attUserPick" class="hint" style="align-self:center">ดู/ตั้งตารางของ</label>
          <select id="attUserPick" style="max-width:260px">${ATT.users.map(u =>
            `<option value="${u.user_id}" ${u.user_id === targetId ? 'selected' : ''}>${esc(userLabel(u))}</option>`).join('')}</select>`;
        app.appendChild(pick);
        pick.querySelector('#attUserPick').addEventListener('change', async (e) => {
          attWho = e.target.value; await loadAttendance();
        });
      }

      const card = document.createElement('div');
      card.className = 'lot-card';
      card.innerHTML = `
        <div class="lot-head"><span>${icon('calendar', 16)}ตารางงานของ ${esc(userLabel(target))}</span>
          ${sc.exists ? '' : '<span class="st st-prod">ยังไม่ได้ตั้ง — ใช้ค่าเริ่มต้น</span>'}</div>
        <div class="table-wrap"><table>
          <thead><tr><th>วัน</th><th>ทำงาน</th><th>เข้างาน</th><th>ออกงาน</th></tr></thead>
          <tbody>${DOW_TH.map((name, i) => {
            const d = sc.days[i] || DEFAULT_DAYS[i];
            const isToday = new Date().getDay() === i;
            return `<tr${isToday ? ' style="background:var(--soft)"' : ''}>
              <td data-label="วัน"><b>${name}</b>${isToday ? ' <span class="st st-new">วันนี้</span>' : ''}</td>
              <td data-label="ทำงาน"><label style="display:flex;gap:6px;align-items:center">
                <input type="checkbox" class="sc-work" data-i="${i}" ${d.work ? 'checked' : ''} ${canEdit ? '' : 'disabled'}>
                <span>${d.work ? 'วันทำงาน' : 'วันหยุด'}</span></label></td>
              <td data-label="เข้างาน"><input type="time" class="sc-start" data-i="${i}" value="${esc(d.start)}" ${canEdit ? '' : 'disabled'}></td>
              <td data-label="ออกงาน"><input type="time" class="sc-end" data-i="${i}" value="${esc(d.end)}" ${canEdit ? '' : 'disabled'}></td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>
        <div class="form-grid" style="padding:0 var(--space-4)">
          <div class="field"><label for="scGrace">สายเกินกี่นาทีถึงนับว่าสาย</label>
            <input id="scGrace" type="number" min="0" step="1" value="${sc.grace_minutes}" ${canEdit ? '' : 'disabled'}></div>
          <div class="field"><label for="scBreak">พักกลางวัน (นาที) — หักออกจากชั่วโมงงาน</label>
            <input id="scBreak" type="number" min="0" step="5" value="${sc.break_minutes}" ${canEdit ? '' : 'disabled'}></div>
        </div>
        ${canEdit ? `<div class="field-row" style="padding:0 var(--space-4) var(--space-4)">
          <button class="btn" id="scSave">${icon('check', 15)}บันทึกตารางงาน</button>
          <div class="msg" id="scMsg"></div></div>` : ''}
      `;
      app.appendChild(card);

      if (canEdit) card.querySelector('#scSave').addEventListener('click', async () => {
        const msg = card.querySelector('#scMsg');
        const days = DOW_TH.map((_, i) => ({
          work: card.querySelector('.sc-work[data-i="' + i + '"]').checked,
          start: card.querySelector('.sc-start[data-i="' + i + '"]').value || '09:00',
          end: card.querySelector('.sc-end[data-i="' + i + '"]').value || '17:00',
        }));
        const { error } = await sb.from('work_schedules').upsert({
          user_id: targetId, days,
          grace_minutes: parseInt(card.querySelector('#scGrace').value) || 0,
          break_minutes: parseInt(card.querySelector('#scBreak').value) || 0,
          updated_at: new Date().toISOString(),
        }, { onConflict: 'user_id' });
        if (error) { msg.textContent = 'บันทึกไม่สำเร็จ: ' + error.message; msg.className = 'msg error'; return; }
        msg.textContent = 'บันทึกแล้ว'; msg.className = 'msg ok';
        await loadAttendance();
      });

      // ---- ผู้ดูแล: ตั้งพิกัดร้าน ----
      if (isAdmin()) {
        const geoCard = document.createElement('div');
        geoCard.className = 'lot-card';
        geoCard.innerHTML = `
          <div class="lot-head"><span>${icon('box', 16)}พิกัดร้าน & รัศมีที่กดลงเวลาได้</span></div>
          <div style="padding:var(--space-4)">
            <div class="hint" style="margin-bottom:10px">พนักงานต้องอยู่ในรัศมีนี้ถึงจะกดเข้า/ออกงานได้ — ให้ไปยืนที่ร้านแล้วกด "ใช้ตำแหน่งปัจจุบัน"</div>
            <div class="form-grid">
              <div class="field"><label for="gLat">ละติจูด</label><input id="gLat" type="number" step="any" value="${Number(SETTINGS.shop_lat) || 0}"></div>
              <div class="field"><label for="gLng">ลองจิจูด</label><input id="gLng" type="number" step="any" value="${Number(SETTINGS.shop_lng) || 0}"></div>
              <div class="field"><label for="gRad">รัศมี (เมตร)</label><input id="gRad" type="number" min="20" step="10" value="${Number(SETTINGS.geo_radius_m) || 150}"></div>
            </div>
            <div class="field" style="margin-bottom:10px">
              <label for="gPaste">หรือวางพิกัดจากแอปแผนที่ (เช่น 6.8712, 101.2500)</label>
              <input id="gPaste" placeholder="วางตัวเลขพิกัด lat, lng ตรงนี้">
            </div>
            <div class="field-row">
              <button class="btn secondary" id="gPasteBtn">${icon('pin', 15)}ใช้พิกัดที่วาง</button>
              <button class="btn secondary" id="gHere">${icon('pin', 15)}ใช้ตำแหน่งปัจจุบัน</button>
              <button class="btn" id="gSave">${icon('check', 15)}บันทึกพิกัด</button>
            </div>
            <div class="msg" id="gMsg"></div>
          </div>`;
        app.appendChild(geoCard);

        const gMsg = geoCard.querySelector('#gMsg');
        geoCard.querySelector('#gHere').addEventListener('click', async () => {
          gMsg.textContent = 'กำลังหาตำแหน่ง...'; gMsg.className = 'msg';
          try {
            const c = await getPosition();
            geoCard.querySelector('#gLat').value = c.latitude;
            geoCard.querySelector('#gLng').value = c.longitude;
            gMsg.textContent = 'ได้ตำแหน่งแล้ว (ความแม่นยำ ~' + Math.round(c.accuracy) + ' ม.) กด "บันทึกพิกัด" เพื่อยืนยัน';
            gMsg.className = 'msg ok';
          } catch (e) { gMsg.textContent = e.message; gMsg.className = 'msg error'; }
        });
        geoCard.querySelector('#gPasteBtn').addEventListener('click', () => {
          const p = parseLatLng(geoCard.querySelector('#gPaste').value);
          if (!p) {
            gMsg.textContent = 'อ่านพิกัดไม่ออก — ต้องมีตัวเลข 2 ตัวคั่นด้วยจุลภาค เช่น 6.8712, 101.2500 (ลิงก์ย่อของ Apple Maps ใช้ไม่ได้ ต้องเปิดลิงก์แล้วก๊อปพิกัดออกมา)';
            gMsg.className = 'msg error'; return;
          }
          geoCard.querySelector('#gLat').value = p.lat;
          geoCard.querySelector('#gLng').value = p.lng;
          gMsg.textContent = 'ใส่พิกัดให้แล้ว กด "บันทึกพิกัด" เพื่อยืนยัน'; gMsg.className = 'msg ok';
        });

        geoCard.querySelector('#gSave').addEventListener('click', async () => {
          const rows = [
            { key: 'shop_lat', value: String(geoCard.querySelector('#gLat').value || 0) },
            { key: 'shop_lng', value: String(geoCard.querySelector('#gLng').value || 0) },
            { key: 'geo_radius_m', value: String(geoCard.querySelector('#gRad').value || 150) },
          ];
          const { error } = await sb.from('settings').upsert(rows, { onConflict: 'key' });
          if (error) { gMsg.textContent = 'บันทึกไม่สำเร็จ: ' + error.message; gMsg.className = 'msg error'; return; }
          gMsg.textContent = 'บันทึกแล้ว'; gMsg.className = 'msg ok';
          SETTINGS = await loadSettings(true);
        });
      }
    }

    // ---------- แท็บ 3: ประวัติ + โอที ----------
    function renderHistoryTab(app) {
      const targetId = isAdmin() ? (attWho || (ME && ME.id)) : (ME && ME.id);
      const target = ATT.users.find(u => u.user_id === targetId);
      const myOts = ATT.ots.filter(o => o.user_id === targetId);
      const okOtMin = {};
      myOts.filter(o => o.status === 'approved').forEach(o => {
        okOtMin[o.work_date] = (okOtMin[o.work_date] || 0) + Number(o.hours) * 60;

    // ===== ถังขยะ (soft delete) =====
    // ลบอะไรก็ตามในระบบ จะไม่หายทันที — ย้ายมาเก็บในตาราง trash พร้อมข้อมูลลูก
    // กู้คืน = เอา payload ยัดกลับตารางเดิม (ใช้ id เดิม ทุกอย่างที่เคยผูกไว้จึงกลับมาเหมือนเดิม)
    const TRASH_KINDS = {
      orders:         { label: 'ออเดอร์',      view: 'orders',    children: [{ table: 'order_items', fk: 'order_id' }, { table: 'order_payments', fk: 'order_id' }] },

      pieces:         { label: 'ชิ้นงานผลิต',  view: 'fabric',    children: [] },
      lots:           { label: 'ล็อตงาน',      view: 'fabric',    children: [{ table: 'pieces', fk: 'lot_id' }] },
      products:       { label: 'สินค้า',       view: 'products',  children: [] },
      stock_items:    { label: 'วัตถุดิบ',     view: 'stock',     children: [{ table: 'stock_moves', fk: 'item_id' }] },
      product_orders: { label: 'ออเดอร์สินค้า', view: 'products',  children: [] },
      receipts:       { label: 'ใบเสร็จ',      view: 'receipts',  children: [{ table: 'receipt_items', fk: 'receipt_id' }] },
      order_payments: { label: 'รายการรับเงิน', view: 'orders',    children: [] },
      purchases:      { label: 'รายจ่าย',      view: 'purchases', children: [{ table: 'purchase_orders', fk: 'purchase_id' }] },
      fabric_waste:   { label: 'ผ้าเสีย',      view: 'fabric',    children: [] },
      debt_entries:   { label: 'รายการหนี้',   view: 'debts',     children: [] },
      debt_recurring: { label: 'หนี้รายเดือน', view: 'debts',     children: [] },
    };

    /** ลบแบบกู้คืนได้ — เก็บแถวหลัก + แถวลูกลงถังขยะก่อน แล้วค่อยลบของจริง */
    async function trashDelete(table, id, opts) {
      opts = opts || {};
      const cfg = TRASH_KINDS[table];
      if (!cfg) throw new Error('ยังไม่รองรับถังขยะของตาราง ' + table);

      const { data: row, error: e1 } = await sb.from(table).select('*').eq('id', id).single();
      if (e1) throw new Error(e1.message);

      const children = {};
      for (const c of cfg.children) {
        const { data } = await sb.from(c.table).select('*').eq(c.fk, id);
        if (data && data.length) children[c.table] = data;
      }

      const { data: t, error: e2 } = await sb.from('trash').insert({
        table_name: table,
        row_id: id,
        label: opts.label || row.name || row.order_no || '',
        detail: opts.detail || '',
        payload: { row, children },
        deleted_by: (ME && ME.email) ? prettyLogin(ME.email) : null,
      }).select('id').single();
      if (e2) throw new Error('เก็บลงถังขยะไม่สำเร็จ: ' + e2.message);

      const { error: e3 } = await sb.from(table).delete().eq('id', id);
      if (e3) {
        await sb.from('trash').delete().eq('id', t.id);   // ลบจริงไม่ผ่าน -> ถอนของในถังคืน จะได้ไม่ค้างซ้ำ
        throw new Error(e3.message);
      }
    }

    /** กู้คืน — ยัดแถวหลักกลับก่อน แล้วค่อยแถวลูก (ลูกต้องมีพ่อแม่ก่อนเสมอ) */
    async function trashRestore(t) {
      const row = t.payload && t.payload.row;
      const children = (t.payload && t.payload.children) || {};
      if (!row) throw new Error('ข้อมูลในถังเสียหาย กู้คืนไม่ได้');

      const { error } = await sb.from(t.table_name).insert(row);
      if (error) {
        if (String(error.message).includes('duplicate')) throw new Error('มีข้อมูลนี้อยู่ในระบบแล้ว (อาจถูกกู้คืนไปก่อนหน้า)');
        if (String(error.message).includes('foreign key')) throw new Error('กู้ไม่ได้ — ของที่เกี่ยวข้องถูกลบไปด้วย ให้กู้ตัวนั้นก่อน');
        throw new Error(error.message);
      }
      for (const [tbl, rows] of Object.entries(children)) {
        if (rows && rows.length) await sb.from(tbl).insert(rows);
      }
      await sb.from('trash').delete().eq('id', t.id);
    }

    const TRASH_KEEP_DAYS = 90;

    async function loadTrash() {
      // ของที่อยู่ในถังเกิน 90 วัน ถือว่าไม่กู้แล้ว ล้างทิ้งอัตโนมัติ ไม่ให้บวมไปเรื่อยๆ
      if (isAdmin()) {
        const cutoff = new Date(Date.now() - TRASH_KEEP_DAYS * 86400000).toISOString();
        try { await sb.from('trash').delete().lt('deleted_at', cutoff); } catch (e) {}
      }
      const { data, error } = await sb.from('trash').select('*').order('deleted_at', { ascending: false });
      if (error) throw error;
      renderTrash(data || []);
    }

    function trashAgeText(iso) {
      const days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
      if (days <= 0) return 'วันนี้';
      if (days === 1) return 'เมื่อวาน';
      return days + ' วันก่อน';
    }

      app.appendChild(buildPageHead('ถังขยะ', 'ของที่ลบไปจะมาพักที่นี่ กู้คืนได้ หรือลบถาวรเมื่อแน่ใจแล้ว'));

      const bar = document.createElement('div');
      bar.className = 'no-print';

        app.appendChild(empty);
        return;
      }

      const card = document.createElement('div');
      card.className = 'lot-card';
      card.innerHTML = `<div class="table-wrap"><table>
        <thead><tr><th>ประเภท</th><th>รายการ</th><th>ลบเมื่อ</th><th>ลบโดย</th><th></th></tr></thead>
        <tbody>${list.map(t => {
          const kind = TRASH_KINDS[t.table_name] || { label: t.table_name };
          const nChild = Object.values((t.payload && t.payload.children) || {}).reduce((a, r) => a + r.length, 0);
          return `<tr>
            <td data-label="ประเภท"><span class="st st-prod">${esc(kind.label)}</span></td>
            <td data-label="รายการ">${esc(t.label || '(ไม่มีชื่อ)')}
              ${t.detail ? `<div class="hint">${esc(t.detail)}</div>` : ''}
              ${nChild ? `<div class="hint">พ่วงข้อมูลย่อย ${nChild} รายการ</div>` : ''}</td>
            <td data-label="ลบเมื่อ">${trashAgeText(t.deleted_at)}
              <div class="hint">${new Date(t.deleted_at).toLocaleString('th-TH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</div></td>
            <td data-label="ลบโดย">${esc(t.deleted_by || '-')}</td>
            <td data-label="" class="admin-only"><div class="field-row" style="justify-content:flex-end">
              <button class="btn btn-sm tr-restore" data-id="${t.id}">${icon('back', 15)}กู้คืน</button>
              <button class="icon-btn icon-btn-delete tr-purge" data-id="${t.id}" aria-label="ลบถาวร" title="ลบถาวร">${icon('trash', 18)}</button>

          </tr>`;

      const byId = id => list.find(x => x.id === id);

      card.querySelectorAll('.tr-restore').forEach(b => b.addEventListener('click', async () => {

          await trashRestore(t);

      }));

      card.querySelectorAll('.tr-purge').forEach(b => b.addEventListener('click', async () => {

        if (error) { alert('ล้างไม่สำเร็จ: ' + error.message); return; }

    /** กล่องแก้ไขรายจ่าย
     *  ของเข้าสต็อก — แก้จำนวน/ราคา/ยอด · เปลี่ยน "ซื้ออะไร" ไม่ได้ (item_name เป็น snapshot)

     */
    function editPurchase(p) {
      const isStock = p.kind !== 'expense';
      return new Promise(resolve => {
        const back = document.createElement('div');
        back.className = 'modal-back no-print';
        back.innerHTML = `
          <div class="modal-card" role="dialog" aria-modal="true">
            <h3>แก้ไขรายจ่าย</h3>
            <div class="modal-sub">${isStock
              ? esc(p.item_name || '') + (p.stock_move_id
                  ? ' · แก้จำนวนแล้วยอดในสต็อกจะขยับตามให้เอง'
                  : ' · รายการนี้ไม่ได้รับเข้าสต็อก แก้แล้วไม่กระทบสต็อก')
              : 'รายจ่ายอื่น · ไม่เกี่ยวกับสต็อก'}</div>
            ${isStock ? `
              <div class="field"><label for="epQty">จำนวน (${esc(p.unit || '')})</label>
                <input id="epQty" type="number" min="0" step="any" inputmode="decimal" value="${p.qty}"></div>
              <div class="field"><label for="epPrice">ราคาต่อหน่วย (บาท)</label>
                <input id="epPrice" type="number" min="0" step="any" inputmode="decimal" value="${p.unit_price != null ? p.unit_price : ''}"></div>
            ` : `
              <div class="field"><label for="epCat">หมวดรายจ่าย</label>
                <input id="epCat" list="epCatList" value="${esc(p.category || '')}" autocomplete="off">
                <datalist id="epCatList">${expenseCats().map(c => `<option value="${esc(c)}"></option>`).join('')}</datalist></div>
              <div class="field"><label for="epOrderInput">ผูกกับออเดอร์ (ใส่ได้หลายใบ)</label>
                ${orderMultiHTML('epOrder', 'epOrderList')}</div>
            `}
            <div class="field"><label for="epTotal">ยอดที่จ่ายจริง (บาท)</label>
              <input id="epTotal" type="number" min="0" step="any" inputmode="decimal" value="${p.total}"></div>
            <div class="field"><label for="epDate">วันที่</label>
              <input id="epDate" type="date" value="${esc(p.purchase_date)}"></div>
            <div class="field"><label for="epVendor">${isStock ? 'ซื้อจากร้าน' : 'จ่ายให้ใคร'}</label>
              <input id="epVendor" value="${esc(p.vendor || '')}" placeholder="เว้นว่างได้"></div>
            <div class="field"><label for="epNote">หมายเหตุ</label>
              <input id="epNote" value="${esc(p.note || '')}" placeholder="เว้นว่างได้"></div>
            <div class="msg" id="epMsg"></div>
            <div class="field-row" style="justify-content:flex-end;margin-top:6px">
              <button class="btn secondary" id="epCancel">ยกเลิก</button>
              <button class="btn" id="epOk">${icon('check', 15)}บันทึกการแก้ไข</button>
            </div>
          </div>`;
        document.body.appendChild(back);
        const close = (v) => { back.remove(); resolve(v); };
        const q = (id) => back.querySelector('#' + id);

        if (isStock) {
          let totalTouched = false;
          const recalc = () => {
            if (totalTouched) return;
            const a = parseFloat(q('epQty').value), b = parseFloat(q('epPrice').value);
            if (a > 0 && b >= 0) q('epTotal').value = round2(a * b);
          };
          q('epQty').addEventListener('input', recalc);
          q('epPrice').addEventListener('input', recalc);
          q('epTotal').addEventListener('input', () => { totalTouched = true; });
        }

        let epOrders = null;
        if (!isStock) {
          epOrders = wireOrderMulti(back, 'epOrder', orderLinksOf(p.id).map(l => l.order_id),
            () => parseFloat(q('epTotal').value));
          q('epTotal').addEventListener('input', epOrders.refresh);
        }
        q('epCancel').addEventListener('click', () => close(null));
        back.addEventListener('click', (ev) => { if (ev.target === back) close(null); });
        q('epOk').addEventListener('click', () => {
          const msg = q('epMsg');
          const total = parseFloat(q('epTotal').value);
          if (!(total >= 0)) { msg.textContent = 'ใส่ยอดที่จ่ายจริงก่อน'; msg.className = 'msg error'; return; }
          const patch = {
            p_id: p.id,
            p_date: q('epDate').value || p.purchase_date,
            p_total: total,
            p_vendor: q('epVendor').value.trim() || null,
            p_note: q('epNote').value.trim() || null,
            p_qty: null, p_unit_price: null, p_category: null, p_order_ids: null,
          };
          if (isStock) {
            const qty = parseFloat(q('epQty').value);
            const price = parseFloat(q('epPrice').value);
            if (!(qty > 0)) { msg.textContent = 'ใส่จำนวนก่อน'; msg.className = 'msg error'; return; }
            patch.p_qty = qty;
            patch.p_unit_price = price >= 0 ? price : null;
          } else {
            const cat = q('epCat').value.trim();
            if (!cat) { msg.textContent = 'ใส่หมวดรายจ่ายก่อน'; msg.className = 'msg error'; return; }
            if (epOrders.hasPending()) { msg.textContent = 'ยังมีออเดอร์ที่พิมพ์ค้างไว้ — กด Enter เพื่อเพิ่ม หรือลบข้อความทิ้ง'; msg.className = 'msg error'; return; }
            patch.p_category = cat;
            patch.p_order_ids = epOrders.getIds();
          }
          close(patch);
        });
        setTimeout(() => q(isStock ? 'epQty' : 'epCat').focus(), 50);
      });
    }

    // ===== รายจ่ายซื้อของเข้าร้าน (#/purchases) =====
    // ตาราง purchases เก็บเงินที่จ่ายออก 2 ชนิด (คอลัมน์ kind)
    //   'stock'   = ซื้อของเข้าสต็อก · ติ๊กแล้ว RPC purchase_create ยิง stock_apply_move ให้ในคำสั่งเดียว
    //   'expense' = รายจ่ายอื่น (ค่าส่ง ค่าน้ำมัน ฯลฯ) · ไม่แตะสต็อกเลย · ผูกกับออเดอร์ได้
    // ลบ = ผ่านถังขยะเสมอ · ของเข้าสต็อกจะถามแยกอีกทีว่าถอนของออกด้วยไหม
    let PURCHASES = [];
    let PURCH_ORDERS = [];
    let PURCH_LINKS = [];   // purchase_orders — 1 รายจ่าย ผูกได้หลายออเดอร์ พร้อมส่วนแบ่งเงิน
    let purchaseMonth = '';            // '' = ทั้งหมด · 'YYYY-MM' = เฉพาะเดือนนั้น
    let purchaseTab = 'stock';         // stock | expense | summary

    const EXPENSE_CATS = ['ค่าน้ำมัน', 'ค่าส่งพัสดุ', 'ค่ารถ/ทางด่วน', 'ค่าไฟ-น้ำ', 'ค่าจ้างผลิต', 'อื่นๆ'];
    // หมวดที่เคยพิมพ์เองไว้ ให้เด้งขึ้นมาให้เลือกครั้งต่อไปด้วย
    function expenseCats() {
      const used = PURCHASES.filter(p => p.kind === 'expense' && p.category).map(p => p.category);
      return [...new Set([...EXPENSE_CATS, ...used])];
    }

    async function loadPurchases() {
      document.getElementById('statusMsg').textContent = 'กำลังโหลด...';
      const [pRes, oRes, lRes] = await Promise.all([
        sb.from('purchases').select('*')
          .order('purchase_date', { ascending: false }).order('created_at', { ascending: false }),
        sb.from('orders').select('id,order_no,customer').order('created_at', { ascending: false }),
        sb.from('purchase_orders').select('purchase_id,order_id,share_amount'),
        fetchStock(),
      ]);
      if (pRes.error) throw pRes.error;
      PURCHASES = pRes.data || [];
      PURCH_ORDERS = oRes.data || [];
      PURCH_LINKS = lRes.data || [];
      renderPurchases();
      document.getElementById('statusMsg').textContent = 'อัปเดตล่าสุด: ' + new Date().toLocaleString('th-TH');
    }

    // ช่องผูกออเดอร์เป็น input + datalist ไม่ใช่ select
    // ออเดอร์เยอะแล้ว dropdown เลื่อนหายาก · datalist พิมพ์กรองได้ทั้งเลขออเดอร์และชื่อลูกค้า
    const orderPickLabel = (o) => o.order_no + (o.customer ? ' · ' + o.customer : '');

    /** แปลงข้อความที่พิมพ์ -> ออเดอร์ · คืน null ถ้าว่าง · คืน undefined ถ้าพิมพ์มาแต่หาไม่เจอ */
    function findOrderByText(text) {
      const t = String(text || '').trim();
      if (!t) return null;
      const low = t.toLowerCase();
      let hit = PURCH_ORDERS.find(o => orderPickLabel(o).toLowerCase() === low);
      if (!hit) hit = PURCH_ORDERS.find(o => String(o.order_no).toLowerCase() === low);
      if (!hit) {
        const many = PURCH_ORDERS.filter(o => orderPickLabel(o).toLowerCase().includes(low));
        if (many.length === 1) hit = many[0];
      }
      return hit || undefined;
    }

    function orderPickDatalist(id) {
      return `<datalist id="${id}">${PURCH_ORDERS.map(o => `<option value="${esc(orderPickLabel(o))}"></option>`).join('')}</datalist>`;
    }

    function orderLinksOf(purchaseId) {
      return PURCH_LINKS.filter(l => l.purchase_id === purchaseId);
    }

    /** HTML ของกล่องเลือกออเดอร์หลายใบ — ใช้ทั้งฟอร์มบันทึกและกล่องแก้ไข */
    function orderMultiHTML(prefix, listId) {
      return `<input id="${prefix}Input" list="${listId}" autocomplete="off" placeholder="พิมพ์เลขออเดอร์ หรือชื่อลูกค้า แล้วกด Enter">
        ${orderPickDatalist(listId)}
        <div class="chips" id="${prefix}Chips" style="margin:8px 0 0"></div>
        <div class="hint" id="${prefix}Hint"></div>`;
    }

    /**
     * ผูกกล่องเลือกออเดอร์หลายใบ · คืน () => uuid[]
     * ค่าส่งก้อนเดียวที่ไปส่งหลายเจ้า -> หารเท่ากันทุกใบ เศษยกให้ใบสุดท้าย (ฝั่ง SQL เป็นคนหาร)
     * ตรงนี้แค่โชว์ให้เห็นล่วงหน้าว่าจะได้ใบละเท่าไหร่
     */
    function wireOrderMulti(root, prefix, initialIds, getTotal) {
      const inputEl = root.querySelector('#' + prefix + 'Input');
      const chipsEl = root.querySelector('#' + prefix + 'Chips');
      const hintEl = root.querySelector('#' + prefix + 'Hint');
      const ids = [...(initialIds || [])];

      const draw = () => {
        chipsEl.innerHTML = ids.map(id => {
          const o = PURCH_ORDERS.find(x => x.id === id);
          return `<button type="button" class="chip active" data-rm="${id}">${esc(o ? orderPickLabel(o) : id)} ✕</button>`;
        }).join('');
        chipsEl.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => {
          const i = ids.indexOf(b.dataset.rm);
          if (i >= 0) ids.splice(i, 1);
          draw();
        }));

        const total = Number(getTotal()) || 0;
        if (!ids.length) { hintEl.textContent = 'เว้นว่าง = ไม่ผูกออเดอร์'; hintEl.style.color = ''; return; }
        if (!(total > 0)) { hintEl.textContent = 'ผูกไว้ ' + ids.length + ' ใบ — ใส่ยอดเงินแล้วจะบอกว่าหารใบละเท่าไหร่'; hintEl.style.color = ''; return; }
        const base = round2(total / ids.length);
        const last = round2(total - base * (ids.length - 1));
        hintEl.textContent = ids.length === 1
          ? 'ผูก 1 ใบ · ลงเต็ม ' + fmtBaht(total) + ' บาท'
          : 'หาร ' + ids.length + ' ใบ · ใบละ ' + fmtBaht(base) + ' บาท' +
            (last !== base ? ' (ใบสุดท้าย ' + fmtBaht(last) + ' รับเศษไป)' : '');
        hintEl.style.color = 'var(--ok-text)';
      };

      const add = () => {
        const v = inputEl.value.trim();
        if (!v) return;
        const hit = findOrderByText(v);
        if (!hit) {
          hintEl.textContent = 'ยังหาออเดอร์นี้ไม่เจอ — พิมพ์เลขออเดอร์หรือชื่อลูกค้าให้ตรงกว่านี้';
          hintEl.style.color = 'var(--err-text)';
          return;
        }
        if (!ids.includes(hit.id)) ids.push(hit.id);
        inputEl.value = '';
        draw();
      };

      inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
      inputEl.addEventListener('change', add);      // เลือกจาก datalist
      inputEl.addEventListener('blur', () => { if (inputEl.value.trim()) add(); });
      draw();
      return { getIds: () => [...ids], refresh: draw, hasPending: () => inputEl.value.trim() !== '' };
    }

    function purchaseMonthLabel(ym) {
      return new Date(ym + '-01T00:00:00').toLocaleDateString('th-TH', { month: 'short', year: '2-digit' });
    }
    const purchSum = (arr) => arr.reduce((a, p) => a + Number(p.total || 0), 0);

    function renderPurchases() {
      const app = document.getElementById('app');
      app.innerHTML = '';
      app.appendChild(buildPageHead('รายจ่าย', 'เงินที่จ่ายออกทั้งหมด — ซื้อของเข้าสต็อก และรายจ่ายอื่นเช่นค่าส่ง ค่าน้ำมัน'));

      const now = new Date();
      const thisMonth = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
      const thisYear = String(now.getFullYear());
      const ofMonth = PURCHASES.filter(p => String(p.purchase_date).startsWith(thisMonth));
      const ofYear = PURCHASES.filter(p => String(p.purchase_date).startsWith(thisYear));

      const stats = document.createElement('div');
      stats.className = 'month-stats';
      stats.style.marginBottom = 'var(--space-4)';
      stats.innerHTML =
        `<div class="stat"><div class="num">${fmtBaht(round2(purchSum(ofMonth)))}</div><div class="lbl">เดือนนี้ (บาท)</div></div>
         <div class="stat"><div class="num">${fmtBaht(round2(purchSum(ofYear)))}</div><div class="lbl">ปีนี้ (บาท)</div></div>
         <div class="stat"><div class="num">${ofMonth.length}</div><div class="lbl">ครั้งเดือนนี้</div></div>`;
      app.appendChild(stats);

      const tabs = document.createElement('div');
      tabs.className = 'tabs no-print';
      tabs.innerHTML = [
        ['stock', 'ซื้อของเข้าสต็อก'],
        ['expense', 'รายจ่ายอื่น'],
        ['summary', 'สรุปรายเดือน'],
      ].map(([k, l]) => `<button class="tab-btn ${purchaseTab === k ? 'active' : ''}" data-t="${k}">${esc(l)}</button>`).join('');
      app.appendChild(tabs);
      tabs.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => {
        purchaseTab = b.dataset.t; renderPurchases();
      }));

      if (purchaseTab === 'summary') { renderPurchaseSummary(app); return; }
      if (purchaseTab === 'stock') renderStockPurchaseForm(app);
      else renderExpenseForm(app);

      // ---- ตัวกรองเดือน (เฉพาะชนิดที่เปิดอยู่) ----
      const kindRows = PURCHASES.filter(p => (p.kind === 'expense') === (purchaseTab === 'expense'));
      const months = [...new Set(kindRows.map(p => String(p.purchase_date).slice(0, 7)))].sort().reverse();
      if (months.length) {
        const chips = document.createElement('div');
        chips.className = 'chips no-print';
        chips.innerHTML = `<button class="chip ${purchaseMonth === '' ? 'active' : ''}" data-m="">ทั้งหมด (${kindRows.length})</button>` +
          months.map(m => {
            const n = kindRows.filter(p => String(p.purchase_date).startsWith(m)).length;
            return `<button class="chip ${purchaseMonth === m ? 'active' : ''}" data-m="${m}">${esc(purchaseMonthLabel(m))} (${n})</button>`;
          }).join('');
        app.appendChild(chips);
        chips.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
          purchaseMonth = b.dataset.m; renderPurchases();
        }));
      }

      const list = purchaseMonth ? kindRows.filter(p => String(p.purchase_date).startsWith(purchaseMonth)) : kindRows;
      renderPurchaseTable(app, list);
    }

    // ---- ฟอร์มซื้อของเข้าสต็อก ----
    function renderStockPurchaseForm(app) {
      const form = document.createElement('div');
      form.className = 'panel no-print';
      form.innerHTML = `
        <h2>${icon('plus', 16)}บันทึกซื้อของเข้าสต็อก</h2>
        <div class="pu-form">
          <div class="field pu-wide"><label for="puItem">ซื้ออะไร</label>
            <input id="puItem" list="puItemList" placeholder="พิมพ์ชื่อของ" autocomplete="off">
            <datalist id="puItemList">${STOCK.map(s => `<option value="${esc(s.name)}">${esc(s.category || '')} · ${esc(s.unit || '')}</option>`).join('')}</datalist></div>
          <div class="field"><label for="puQty">จำนวน <span class="hint" id="puUnit"></span></label>
            <input id="puQty" type="number" min="0" step="any" inputmode="decimal" placeholder="เช่น 2"></div>
          <div class="field"><label for="puPrice">ราคาต่อหน่วย</label>
            <input id="puPrice" type="number" min="0" step="any" inputmode="decimal" placeholder="เช่น 350"></div>
          <div class="field"><label for="puTotal">ยอดที่จ่ายจริง</label>
            <input id="puTotal" type="number" min="0" step="any" inputmode="decimal" placeholder="คิดให้เอง · แก้ได้"></div>
          <div class="field"><label for="puVendor">ซื้อจากร้าน</label>
            <input id="puVendor" placeholder="เช่น ร้านเครื่องเขียน"></div>
          <div class="field"><label for="puDate">วันที่ซื้อ</label>
            <input id="puDate" type="date" value="${dateKey()}">
            <div class="hint" id="puDateTh"></div></div>
          <div class="field pu-wide"><label for="puNote">หมายเหตุ</label>
            <input id="puNote" placeholder="เว้นว่างได้"></div>
        </div>
        <div class="pu-new" id="puNewBox" hidden>
          <div class="pu-new-hint" id="puNewHint"></div>
          <div class="field"><label for="puNewUnit">หน่วยนับ</label>
            <select id="puNewUnit">${STOCK_UNITS.map(u => `<option>${esc(u)}</option>`).join('')}</select></div>
          <div class="field"><label for="puNewCat">หมวด</label>
            <select id="puNewCat">${STOCK_CATS.map(c => `<option>${esc(c)}</option>`).join('')}</select></div>
        </div>
        <label class="pu-check">
          <input id="puAddStock" type="checkbox" checked>
          <span>รับเข้าสต็อกให้เลย — ไม่ต้องไปกดรับเข้าที่หน้าสต็อกอีกรอบ</span>
        </label>
        <button class="btn" id="puSave">${icon('check', 15)}บันทึกรายจ่าย</button>
        <div class="msg" id="puMsg"></div>`;
      app.appendChild(form);

      const $ = (id) => form.querySelector('#' + id);
      let totalTouched = false;
      const recalc = () => {
        if (totalTouched) return;
        const q = parseFloat($('puQty').value), pr = parseFloat($('puPrice').value);
        $('puTotal').value = (q > 0 && pr >= 0) ? round2(q * pr) : '';
      };
      $('puQty').addEventListener('input', recalc);
      $('puPrice').addEventListener('input', recalc);
      $('puTotal').addEventListener('input', () => { totalTouched = $('puTotal').value !== ''; });

      // ชื่อที่พิมพ์ตรงกับของเดิมไหม (ไม่สนตัวพิมพ์ใหญ่เล็ก/ช่องว่างหัวท้าย — กติกาเดียวกับหน้าสต็อกและฝั่ง SQL)
      const findItem = (name) => {
        const key = String(name || '').trim().toLowerCase();
        return key ? STOCK.find(s => String(s.name).trim().toLowerCase() === key) : null;
      };
      const syncItem = () => {
        const it = findItem($('puItem').value);
        const typed = $('puItem').value.trim();
        $('puUnit').textContent = it && it.unit ? '(' + it.unit + ')' : '';
        const isNew = !it && typed !== '';
        $('puNewBox').hidden = !isNew;
        if (isNew) $('puNewHint').textContent = '"' + typed + '" ยังไม่มีในสต็อก — บันทึกแล้วจะสร้างให้อัตโนมัติ เลือกหน่วยกับหมวดด้วย';
      };
      $('puItem').addEventListener('input', syncItem);
      $('puItem').addEventListener('change', syncItem);

      const syncDate = () => { $('puDateTh').textContent = $('puDate').value ? thDate($('puDate').value) : ''; };
      $('puDate').addEventListener('change', syncDate);
      syncDate();

      $('puSave').addEventListener('click', async () => {
        const msg = $('puMsg');
        msg.textContent = ''; msg.className = 'msg';
        const typed = $('puItem').value.trim();
        const found = findItem(typed);
        const qty = parseFloat($('puQty').value);
        const price = parseFloat($('puPrice').value);
        const total = parseFloat($('puTotal').value);
        if (!typed) { msg.textContent = 'ใส่ชื่อของที่ซื้อก่อน'; msg.className = 'msg error'; return; }
        if (!(qty > 0)) { msg.textContent = 'ใส่จำนวนก่อน'; msg.className = 'msg error'; return; }
        if (!(total >= 0)) { msg.textContent = 'ใส่ยอดที่จ่ายจริงก่อน'; msg.className = 'msg error'; return; }

        $('puSave').disabled = true;
        const { error } = await sb.rpc('purchase_create', {
          p_date: $('puDate').value || dateKey(),
          p_item_id: found ? found.id : null,
          p_item_name: found ? null : typed,
          p_unit: found ? null : $('puNewUnit').value,
          p_category: found ? null : $('puNewCat').value,
          p_qty: qty,
          p_unit_price: price >= 0 ? price : null,
          p_total: total,
          p_vendor: $('puVendor').value.trim() || null,
          p_note: $('puNote').value.trim() || null,
          p_add_stock: $('puAddStock').checked,
          p_by: (ME && ME.email) ? prettyLogin(ME.email) : null,
        });
        $('puSave').disabled = false;
        if (error) {
          msg.textContent = 'บันทึกไม่สำเร็จ: ' + error.message; msg.className = 'msg error';
          toast('บันทึกไม่สำเร็จ', 'error');
          return;
        }
        toast('บันทึกแล้ว ' + fmtBaht(round2(total)) + ' บาท');
        await loadPurchases();
      });
    }

    // ---- ฟอร์มรายจ่ายอื่น (ค่าส่ง ค่าน้ำมัน ฯลฯ) ----
    function renderExpenseForm(app) {
      const form = document.createElement('div');
      form.className = 'panel no-print';
      form.innerHTML = `
        <h2>${icon('plus', 16)}บันทึกรายจ่ายอื่น</h2>
        <div class="pu-form">
          <div class="field pu-wide"><label for="exCat">หมวดรายจ่าย</label>
            <div class="cat-chips" id="exCatChips">${expenseCats().map(c =>
              `<button type="button" class="cat-chip" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
            <input id="exCat" list="exCatList" placeholder="หรือพิมพ์หมวดใหม่เอง" autocomplete="off">
            <datalist id="exCatList">${expenseCats().map(c => `<option value="${esc(c)}"></option>`).join('')}</datalist></div>

            <input id="exVendor" placeholder="เช่น ปั๊ม ปตท. · Flash"></div>
          <div class="field pu-wide"><label for="exOrderInput">ผูกกับออเดอร์ (มี ${PURCH_ORDERS.length} ใบ · ใส่ได้หลายใบ)</label>

          <div class="field pu-wide"><label for="exNote">หมายเหตุ</label>
            <input id="exNote" placeholder="เช่น ไปส่งของที่ยะลา"></div>
        </div>
        <div class="rc-row">
          <label class="rc-pick">${icon('camera', 17)}<span id="exRcLabel">แนบรูปใบเสร็จ (ไม่บังคับ)</span>

          <img id="exRcThumb" class="rc-thumb" alt="" hidden>
          <button class="btn secondary btn-sm" id="exRcClear" hidden>${icon('close', 15)}เอารูปออก</button>
        </div>
        <button class="btn block" id="exSave">${icon('check', 15)}บันทึกรายจ่าย</button>
        <div class="msg" id="exMsg"></div>`;
      app.appendChild(form);

      const $ = (id) => form.querySelector('#' + id);
      const syncDate = () => { $('exDateTh').textContent = $('exDate').value ? thDate($('exDate').value) : ''; };
      $('exDate').addEventListener('change', syncDate);
      syncDate();
      const exOrders = wireOrderMulti(form, 'exOrder', [], () => parseFloat($('exTotal').value));
      $('exTotal').addEventListener('input', exOrders.refresh);

      // ---- ชิปหมวด: แตะแล้วเติมให้ + ดึงร้านที่เคยจ่ายบ่อยของหมวดนั้นมาใส่ให้เลย ----
      const markChips = () => {
        const v = $('exCat').value.trim();
        form.querySelectorAll('.cat-chip').forEach(b => b.classList.toggle('active', b.dataset.c === v));
      };
      const recallVendor = (cat) => {
        // ร้านล่าสุดของหมวดนี้ เอาจากรายการที่เคยบันทึกจริง ไม่ต้องพิมพ์ซ้ำทุกวัน
        const last = PURCHASES.find(p => p.kind === 'expense' && p.category === cat && p.vendor);
        if (last && !$('exVendor').value.trim()) $('exVendor').value = last.vendor;
      };
      form.querySelectorAll('.cat-chip').forEach(b => b.addEventListener('click', () => {
        $('exCat').value = b.dataset.c;
        markChips();
        recallVendor(b.dataset.c);
        $('exTotal').focus();
      }));
      $('exCat').addEventListener('input', markChips);

      // ---- รูปใบเสร็จ ----
      let rcFile = null;
      const rcReset = () => {
        rcFile = null;
        $('exRc').value = '';
        $('exRcLabel').textContent = 'แนบรูปใบเสร็จ (ไม่บังคับ)';
        $('exRcThumb').hidden = true;
        $('exRcClear').hidden = true;
      };

        const f = $('exRc').files && $('exRc').files[0];
        if (!f) return rcReset();
        rcFile = f;
        $('exRcLabel').textContent = 'แนบแล้ว · แตะเพื่อเปลี่ยนรูป';
        $('exRcThumb').src = URL.createObjectURL(f);
        $('exRcThumb').hidden = false;
        $('exRcClear').hidden = false;
      });

      $('exSave').addEventListener('click', async () => {

        msg.textContent = ''; msg.className = 'msg';
        const cat = $('exCat').value.trim();
        const total = parseFloat($('exTotal').value);
        if (!cat) { msg.textContent = 'ใส่หมวดรายจ่ายก่อน'; msg.className = 'msg error'; return; }
        if (!(total >= 0)) { msg.textContent = 'ใส่ยอดที่จ่ายก่อน'; msg.className = 'msg error'; return; }

        $('exSave').disabled = true;
        const { data, error } = await sb.rpc('expense_create', {
          p_date: $('exDate').value || dateKey(),
          p_category: cat,
          p_total: total,
          p_vendor: $('exVendor').value.trim() || null,
          p_note: $('exNote').value.trim() || null,
          p_order_ids: exOrders.getIds(),
          p_by: (ME && ME.email) ? prettyLogin(ME.email) : null,
        });
        if (error) {
          $('exSave').disabled = false;
          msg.textContent = 'บันทึกไม่สำเร็จ: ' + error.message; msg.className = 'msg error';
          toast('บันทึกไม่สำเร็จ', 'error');
          return;
        }

        // อัปรูปใบเสร็จหลังบันทึกสำเร็จแล้ว — รูปล้มก็ไม่ทำให้รายจ่ายหาย บอกให้รู้แล้วไปแนบทีหลังได้
        if (rcFile && data) {
          $('exSave').innerHTML = 'กำลังอัปรูป...';
          try {
            const up = await drivePost({
              action: 'upload', root: 'order',
              lot: 'ใบเสร็จรายจ่าย-' + String($('exDate').value || dateKey()).slice(0, 7),
              filename: rcFile.name, mimeType: rcFile.type, data: await fileToBase64(rcFile),
            });
            await sb.from('purchases').update({ receipt_file_id: up.file.id, receipt_name: up.file.name }).eq('id', data);
            toast('บันทึกแล้ว · แนบรูปเรียบร้อย');
          } catch (err) {
            toast('บันทึกรายจ่ายแล้ว แต่อัปรูปไม่สำเร็จ', 'error');
          }
        } else {
          toast('บันทึกแล้ว ' + fmtBaht(round2(total)) + ' บาท');
        }
        $('exSave').disabled = false;
        await loadPurchases();
      });
    }

    // ---- สรุปรายเดือน: เดือน x หมวด ----
    // คิดสดจากข้อมูลทุกครั้ง ไม่เก็บยอดสรุปซ้ำไว้อีกตาราง (แก้รายการเก่าแล้วสรุปจะตรงเสมอ)
    function renderPurchaseSummary(app) {

        <tbody>${months.map(m => {

        }).join('')}
        <tr><td><b>รวมทุกเดือน</b></td>
          ${cols.map(c => `<td><b>${fmtBaht(round2(purchSum(PURCHASES.filter(p => label(p) === c))))}</b></td>`).join('')}

    // ===== สต็อกวัตถุดิบ =====
    const STOCK_CATS = ['กระดาษการ์ด', 'กระดาษ A4', 'หมึกเครื่องพิมพ์', 'ผ้าดิบ', 'ดาย', 'อื่นๆ'];
    const STOCK_UNITS = ['แผ่น', 'รีม', 'มล.', 'ขวด', 'ตลับ', 'หลา', 'เมตร', 'ชิ้น', 'อัน'];
    let stockCat = 'ทั้งหมด';
    let STOCK = [];

    function stockRemain(it) { return Number(it.total_qty) - Number(it.used_qty); }
    function stockPctLeft(it) {
      const t = Number(it.total_qty);
      return t > 0 ? (stockRemain(it) / t) * 100 : 0;
    }
    /**
     * จุดเตือนคิดเป็น "จำนวนคงเหลือจริง" ตามหน่วยของรายการนั้น (ผ้าดิบ = หลา)
     * ไม่ใช้ % เพราะยอดรับเข้าสะสมโตขึ้นเรื่อยๆ -> % จะเพี้ยนและเตือนตลอดเวลา
     * รายการเก่าที่ยังไม่ตั้งจำนวน จะถอยไปใช้ % เดิมเป็นตัวสำรอง
     */
    function stockThreshold(it) {
      if (it.threshold_qty != null && it.threshold_qty !== '') return Number(it.threshold_qty);
      return (Number(it.total_qty) * (Number(it.threshold_pct) || 0)) / 100;
    }
    /** เหลือ ≤ จุดเตือน = ต้องสั่งเพิ่ม · ≤ 1.5 เท่าของจุดเตือน = ใกล้จุดสั่ง */
    function stockStatus(it) {
      const left = stockRemain(it);
      const th = stockThreshold(it);
      if (th <= 0) return { key: 'ok', label: 'ปกติ', cls: 'st-paid', color: '#067647' };
      if (left <= th) return { key: 'danger', label: 'ต้องสั่งเพิ่ม', cls: 'st-cancel', color: 'var(--danger, #b42318)' };
      if (left <= th * 1.5) return { key: 'warn', label: 'ใกล้จุดสั่ง', cls: 'st-prod', color: '#b8862b' };
      return { key: 'ok', label: 'ปกติ', cls: 'st-paid', color: '#067647' };
    }
    function fmtQty(n) {
      const v = Number(n) || 0;
      return Number.isInteger(v) ? v.toLocaleString('th-TH') : v.toLocaleString('th-TH', { maximumFractionDigits: 2 });
    }

    async function fetchStock() {
      const { data, error } = await sb.from('stock_items')
        .select('id,name,category,unit,total_qty,used_qty,threshold_pct,threshold_qty,note,created_at,is_default_fabric')
        .eq('active', true).order('category').order('created_at');
      if (error) throw error;
      STOCK = data;
      return data;
    }

    /**
     * รับเข้า / เบิกใช้สต็อก — ให้ฐานข้อมูลบวกให้เอง (ฟังก์ชัน stock_apply_move)
     * ห้ามกลับไปคิดยอดในเว็บแล้วเขียนทับ: ถ้า 2 คนกดพร้อมกัน รายการหนึ่งจะหายเงียบๆ
     * kind: 'in' รับเข้า · 'out' เบิกใช้ · 'undo_out' ถอนการเบิก (ตอนยกเลิกปริ้น ไม่บันทึกประวัติใหม่)
     * คืนค่า id ของแถวใน stock_moves ที่เพิ่งสร้าง
     */
    async function stockMove(item, kind, qty, note, order) {
      const amount = Number(qty);
      if (!(amount > 0)) throw new Error('ใส่จำนวนก่อน');
      const { data, error } = await sb.rpc('stock_apply_move', {
        p_item_id: item.id,
        p_kind: kind,
        p_qty: amount,
        p_note: note || null,
        p_order_id: order ? order.id : null,
        p_order_no: order ? order.order_no : null,
      });
      if (error) throw new Error(error.message);
      return data;
    }

    async function loadStock() {
      document.getElementById('statusMsg').textContent = 'กำลังโหลด...';
      // ต้นทุนที่ซื้อ เห็นเฉพาะ admin ขึ้นไป (RLS ของ purchases กันอีกชั้นอยู่แล้ว)
      const [items, movesRes, purchRes] = await Promise.all([
        fetchStock(),
        sb.from('stock_moves').select('id,item_id,kind,qty,note,order_no,created_at')
          .order('created_at', { ascending: false }).limit(60),
        isAdmin()
          ? sb.from('purchases').select('item_id,qty,total,unit_price,vendor,purchase_date')
              .eq('kind', 'stock').order('purchase_date', { ascending: false })
          : Promise.resolve({ data: [] }),
      ]);
      STOCK_PURCH = purchRes.data || [];
      renderStock(items, movesRes.data || []);
      document.getElementById('statusMsg').textContent = 'อัปเดตล่าสุด: ' + new Date().toLocaleString('th-TH');
    }

      `;

      // ---- ฟอร์มเพิ่มของใหม่ (ซ่อนไว้ กดเปิดเมื่อต้องใช้) ----
      const addBar = document.createElement('div');

      app.appendChild(addBar);

      const panel = document.createElement('div');
      panel.className = 'panel no-print';
      panel.hidden = true;
      panel.innerHTML = `
        <h2>${icon('plus', 17)}ของใหม่</h2>
        <div class="form-grid">
          <div class="field"><label for="stName">ชื่อของ</label><input id="stName" placeholder="เช่น หมึกสีฟ้า C"></div>
          <div class="field"><label for="stQty">มีอยู่กี่ชิ้น</label><input id="stQty" type="number" min="0" step="any" placeholder="100" inputmode="decimal"></div>
          <div class="field"><label for="stUnit">หน่วย</label><select id="stUnit">${STOCK_UNITS.map(u => `<option>${esc(u)}</option>`).join('')}</select></div>
          <div class="field"><label for="stCat">หมวด</label><select id="stCat">${STOCK_CATS.map(c => `<option>${esc(c)}</option>`).join('')}</select></div>
        </div>
        <details style="margin:4px 0 10px">
          <summary class="hint" style="cursor:pointer">ตั้งจุดเตือนสั่งซื้อ</summary>
          <div class="field" style="max-width:260px;margin-top:8px">

    // ===== ประวัติการแก้ไข =====

    // ===== ออเดอร์ (รับออเดอร์ลูกค้า) =====
    /**
     * เลขเอกสารออกจากฐานข้อมูล ไม่ใช่จากเว็บ
     * เพราะเว็บอ่านเลขล่าสุดแล้วบวกเองไม่ได้ — 2 คนกดพร้อมกันจะได้เลขเดียวกัน
     * และต้องนับ "สูงสุดของเดือนนั้น" ไม่ใช่จำนวนเอกสารทั้งหมด เลขถึงจะรีเซ็ตทุกเดือน
     * ตัวกันเลขซ้ำจริงคือ unique index + insertWithDocNo() ที่ลองใหม่ให้อัตโนมัติ
     */
    async function nextDocNo(prefix) {
      const { data, error } = await sb.rpc('next_doc_no', { p_prefix: prefix });
      if (error) throw new Error('ออกเลขเอกสารไม่สำเร็จ: ' + error.message);

    }

    const nextOrderNo = () => nextDocNo('OD');

    // โหลดเฉพาะช่วงล่าสุดก่อน (ค่าเริ่มต้น 3 เดือน) กดปุ่มขยายช่วงได้
    // พอข้อมูลโตขึ้นเป็นหลักพัน จะได้ไม่ดึงทั้งตารางทุกครั้งที่เปิดหน้า
    let ordersMonths = 3;

    function monthsAgoISO(n) {
      const d = new Date();
      d.setMonth(d.getMonth() - n);
      return d.toISOString();
    }

    async function loadOrders() {
      if (!CUSTOMERS.length) { try { await fetchCustomers(); } catch (e) {} }
      document.getElementById('statusMsg').textContent = 'กำลังโหลด...';
      let q = sb.from('orders').select('id,order_no,customer,customer_id,channel,status,due_date,delivered_at,total,paid_amount,phone,address,cover_file_id,created_at')
        .order('created_at', { ascending: false });
      if (ordersMonths) q = q.gte('created_at', monthsAgoISO(ordersMonths));
      const [ordRes] = await Promise.all([q, fetchProducts()]);
      if (ordRes.error) throw ordRes.error;
      renderOrders(ordRes.data);
      refreshJobAlert().then(renderNav).catch(() => {});
      document.getElementById('statusMsg').textContent = 'อัปเดตล่าสุด: ' + new Date().toLocaleString('th-TH');
    }

    // แคชรูปปกของออเดอร์ (ดึงจากไดรฟ์ทีละใบตอนเลื่อนถึง)
    const ORDER_THUMBS = {};
    // ดัชนีรูปงานผลิต: ชื่อลูกค้า(ตัวพิมพ์เล็ก) -> ไฟล์รูปแรกที่เจอ (สร้างครั้งเดียวต่อการเปิดหน้า)
    let FABRIC_INDEX = null;

    async function buildFabricIndex() {
      if (FABRIC_INDEX) return FABRIC_INDEX;
      FABRIC_INDEX = {};
      try {
        const { data: lots } = await sb.from('lots').select('name').order('created_at', { ascending: false });
        for (const l of (lots || []).slice(0, 12)) {
          const files = await driveList(l.name, 'fabric');
          files.forEach(f => {
            const parsed = parsePieceFromFilename(f.name);
            const key = (parsed && parsed.label ? parsed.label : f.name.split(/[\s.]/)[0]).trim().toLowerCase();
            // ข้ามชื่อสั้น/ตัวเลขล้วน (เช่น "50") กันจับคู่ผิดกับชื่อลูกค้า
            if (key.length >= 3 && !/^\d+$/.test(key) && !FABRIC_INDEX[key]) FABRIC_INDEX[key] = f;
          });
        }
      } catch (e) { /* ไดรฟ์ล่มก็ปล่อยว่าง */ }
      return FABRIC_INDEX;
    }

    /** หารูปจากงานผลิตที่ชื่อไฟล์ตรงกับชื่อลูกค้า */
    async function findFabricPhoto(customer) {
      const nm = (customer || '').trim().toLowerCase();
      if (nm.length < 3 || !DRIVE_API_URL) return null;
      const idx = await buildFabricIndex();
      if (idx[nm]) return idx[nm];
      const hit = Object.keys(idx).find(k => k.length >= 3 && (k.includes(nm) || nm.includes(k)));
      return hit ? idx[hit] : null;
    }

    function renderOrders(list) {
      const app = document.getElementById('app');
      app.innerHTML = '';
      app.appendChild(buildPageHead('My Job', 'งานของร้าน — รับออเดอร์ลูกค้าจากทุกช่องทาง'));

      const unpaidTotal = list.reduce((s, o) => s + Math.max(0, Number(o.total) - Number(o.paid_amount || 0)), 0);

      // ---- แถบทักทาย + ตัวเลขที่ต้องรู้วันนี้ ----
      const h = new Date().getHours();
      const greet = h < 12 ? 'สวัสดีตอนเช้า' : h < 17 ? 'สวัสดีตอนบ่าย' : 'สวัสดีตอนเย็น';
      const myName = MY_NAME || (prettyLogin(ME ? ME.email : '') || '').split('@')[0] || '';
      const today0 = new Date(new Date().toDateString());

      const isSameDay = (d) => d && new Date(d).toDateString() === today0.toDateString();
      const todayJobs = list.filter(o => isSameDay(o.created_at) || isSameDay(o.due_date));
      const dueSoon = list.filter(o => {
        if (!o.due_date || !needsDelivery(o)) return false;
        const diff = (new Date(o.due_date) - today0) / 86400000;
        return diff >= 0 && diff <= 3;

      const hero = document.createElement('div');

        wrap.querySelectorAll('.job-card').forEach(c => {

          c.style.display = hit ? '' : 'none';

        const box = inp.closest('.job-thumb');
        const orderNo = box.dataset.order, orderId = box.dataset.id;
        box.classList.add('uploading');
        try {
          const up = await drivePost({
            action: 'upload', root: 'order', lot: orderNo,
            filename: file.name, mimeType: file.type, data: await fileToBase64(file),
          });
          await sb.from('orders').update({ cover_file_id: up.file.id, cover_name: up.file.name }).eq('id', orderId);
          delete ORDER_THUMBS[orderNo];
          await boot();
        } catch (err) {
          alert('อัปรูปไม่สำเร็จ: ' + err.message);
          box.classList.remove('uploading');
        }

      // ---- โหลดรูปปกจากไดรฟ์เมื่อเลื่อนถึง ----
      if (DRIVE_API_URL && 'IntersectionObserver' in window) {
        const io = new IntersectionObserver((entries) => {
          entries.forEach(async (en) => {
            if (!en.isIntersecting) return;
            const el = en.target;
            io.unobserve(el);
            const no = el.dataset.order;
            if (el.dataset.cover) return;    // มีรูปปกที่เลือกไว้แล้ว
            try {
              if (ORDER_THUMBS[no] === undefined) {
                const files = await driveList(no, 'order');
                // ไม่มีรูปในออเดอร์ -> ลองหาจากรูปงานผลิตที่ชื่อไฟล์ขึ้นต้นด้วยชื่อลูกค้า
                ORDER_THUMBS[no] = files.length ? files[0] : await findFabricPhoto(el.dataset.customer);
              }
              const f = ORDER_THUMBS[no];
              if (!f) return;
              const img = document.createElement('img');
              img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.alt = no;
              img.src = f.thumb;
              img.addEventListener('error', () => { img.remove(); });
              img.addEventListener('load', () => { el.innerHTML = ''; el.appendChild(img); });
            } catch (e) { /* ไม่มีรูปก็ปล่อยไอคอนไว้ */ }
          });
        }, { rootMargin: '200px' });
        wrap.querySelectorAll('.job-thumb').forEach(t => io.observe(t));
      }
    }

    // ---- ฟอร์มสร้างออเดอร์ ----
    /**
     * หาลูกค้าจากชื่อ/เบอร์ ถ้าไม่มีก็สร้างให้เลย — ใช้ตอนบันทึกออเดอร์
     * จะได้ไม่ต้องไปสร้างลูกค้าก่อนทุกครั้ง และไม่มีออเดอร์ที่ลอยไม่ผูกกับใคร
     * คืน customer_id หรือ null (ถ้าไม่ได้กรอกชื่อเลย)
     */
    async function resolveCustomerId({ pickedId, name, phone, address, extra }) {
      extra = extra || {};
      // เติมข้อมูลที่ยังว่างของลูกค้าเดิม (ไม่ทับของเดิมที่กรอกไว้แล้ว)
      const fillBlanks = async (id) => {
        const c = CUSTOMERS.find(x => x.id === id);
        if (!c) return id;
        const patch = {};
        Object.entries(extra).forEach(([k, v]) => {
          if (v && !String(c[k] || '').trim() && k !== 'customer_type') patch[k] = v;
        });
        if ((phone || '').trim() && !String(c.phone || '').trim()) patch.phone = phone.trim();
        if ((address || '').trim() && !String(c.address || '').trim()) patch.address = address.trim();
        if (Object.keys(patch).length) {
          await sb.from('customers').update(patch).eq('id', id);
          await fetchCustomers();
        }
        return id;
      };
      if (pickedId) return fillBlanks(pickedId);
      const nm = (name || '').trim();
      const ph = (phone || '').trim();
      if (!nm && !ph) return null;

      if (!CUSTOMERS.length) { try { await fetchCustomers(); } catch (e) {} }
      // 1) เบอร์ตรงกันถือว่าคนเดียวกัน (เบอร์เป็น unique ในฐานข้อมูล)
      if (ph) {
        const byPhone = CUSTOMERS.find(c => (c.phone || '').trim() === ph);
        if (byPhone) return fillBlanks(byPhone.id);
      }
      // 2) ชื่อตรงกันแบบไม่สนตัวพิมพ์
      if (nm) {
        const byName = CUSTOMERS.find(c => (c.name || '').trim().toLowerCase() === nm.toLowerCase());
        if (byName) return fillBlanks(byName.id);
      }
      if (!nm) return null;

      // 3) ไม่มีในสมุด -> สร้างใหม่ให้อัตโนมัติ
      const { data, error } = await sb.from('customers').insert({
        ...extra,
        name: nm,
        phone: ph || null,
        address: (address || '').trim() || null,
        first_order_at: new Date().toISOString().slice(0, 10),
      }).select('id').single();
      if (error) {
        // เบอร์ซ้ำ (แข่งกันสร้างพร้อมกัน) -> ดึงของเดิมมาใช้
        if (ph) {
          const { data: again } = await sb.from('customers').select('id').eq('phone', ph).maybeSingle();
          if (again) return again.id;
        }
        throw new Error('สร้างลูกค้าไม่สำเร็จ: ' + error.message);
      }
      await fetchCustomers();
      return data.id;
    }
