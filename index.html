<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สรุปออเดอร์ป้ายผ้า</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f5f2;
    --card: #ffffff;
    --text: #1f2430;
    --sub: #6b7280;
    --accent: #3454d1;
    --accent-soft: #eef1fd;
    --border: #e6e3dd;
    --warn-bg: #fff6ed;
    --warn-border: #f5b77e;
    --warn-text: #92400e;
    --radius: 14px;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
    --space-5: 20px; --space-6: 24px; --space-8: 32px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: 'Prompt', -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 96px;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  header {
    position: sticky; top: 0; z-index: 5;
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: var(--space-4) var(--space-5);
    display: flex; align-items: center; gap: var(--space-3);
  }
  .logo {
    width: 36px; height: 36px; flex-shrink: 0;
    background: var(--accent-soft); border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent);
  }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  header .meta { font-size: 12px; color: var(--sub); margin-top: 2px; }

  .container { padding: var(--space-4) var(--space-4) 0; max-width: 720px; margin: 0 auto; }

  .summary-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--space-2);
    margin-bottom: var(--space-4);
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: var(--space-4) var(--space-2);
    text-align: center;
    opacity: 0; transform: translateY(6px);
    animation: fadeUp .35s ease-out forwards;
  }
  .stat .icon { color: var(--accent); margin-bottom: var(--space-1); }
  .stat .num { font-size: 20px; font-weight: 700; color: var(--text); line-height: 1.2; }
  .stat .lbl { font-size: 11px; color: var(--sub); margin-top: 2px; }

  .lot-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: var(--space-3);
    overflow: hidden;
    opacity: 0; transform: translateY(6px);
    animation: fadeUp .35s ease-out forwards;
  }
  .lot-head {
    padding: var(--space-3) var(--space-4);
    font-weight: 600;
    font-size: 14px;
    background: var(--accent-soft);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: var(--space-2);
  }
  .lot-head .lot-total { color: var(--accent); font-variant-numeric: tabular-nums; }
  .lot-bar-track { height: 4px; background: var(--border); }
  .lot-bar-fill { height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; transition: width .5s ease-out; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: var(--space-2) var(--space-3); text-align: right; border-top: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; font-variant-numeric: normal; }
  th { color: var(--sub); font-weight: 500; font-size: 11px; }

  .warn {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    border-radius: var(--radius);
    padding: var(--space-4);
    margin-bottom: var(--space-4);
    font-size: 13px;
  }
  .warn-head { display: flex; align-items: center; gap: var(--space-2); font-weight: 600; font-size: 14px; margin-bottom: var(--space-2); color: var(--warn-text); }
  .warn ul { margin: 0; padding-left: var(--space-5); }
  .warn li { margin-bottom: 2px; }
  .warn a { color: #b45309; text-decoration: underline; }
  .warn .hint { margin-top: var(--space-2); color: var(--warn-text); }

  .refresh-btn {
    position: fixed;
    bottom: 20px; right: 20px;
    background: var(--accent);
    color: white; border: none;
    border-radius: 999px;
    min-height: 48px;
    padding: 0 20px;
    font-family: inherit;
    font-size: 14px; font-weight: 500;
    display: inline-flex; align-items: center; gap: var(--space-2);
    box-shadow: 0 6px 16px rgba(52,84,209,.35);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .refresh-btn:active { transform: scale(.96); }
  .refresh-btn:disabled { opacity: .65; }
  .refresh-btn .spin { animation: spin 1s linear infinite; display: none; }
  .refresh-btn.loading .spin { display: inline-flex; }
  .refresh-btn.loading .static-icon { display: none; }

  .skeleton { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: var(--space-3); padding: var(--space-4); }
  .skeleton .bar { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--border) 25%, #f0eee9 37%, var(--border) 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; margin-bottom: var(--space-2); }
  .skeleton .bar:last-child { margin-bottom: 0; width: 60%; }

  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .stat, .lot-card { animation: none; opacity: 1; transform: none; }
    .skeleton .bar { animation: none; }
    .refresh-btn .spin { animation: none; }
  }
</style>
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v4a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V4Z"/><path d="M8 12v8h8v-8"/></svg>
    </div>
    <div>
      <h1>สรุปออเดอร์ป้ายผ้า</h1>
      <div class="meta" id="generatedAt" role="status" aria-live="polite">กำลังโหลดข้อมูล...</div>
    </div>
  </header>

  <div class="container" id="app">
    <div class="summary-grid">
      <div class="skeleton"><div class="bar"></div><div class="bar"></div></div>
      <div class="skeleton"><div class="bar"></div><div class="bar"></div></div>
      <div class="skeleton"><div class="bar"></div><div class="bar"></div></div>
    </div>
    <div class="skeleton"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
    <div class="skeleton"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
  </div>

  <button class="refresh-btn" id="refreshBtn" onclick="doRefresh()" aria-label="รีเฟรชข้อมูลตอนนี้">
    <svg class="static-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    <svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    <span id="refreshLabel">รีเฟรชตอนนี้</span>
  </button>

  <script>
    // ===== ตั้งค่า =====
    // ใส่ URL เว็บแอป Apps Script ของคุณ (ลงท้ายด้วย /exec)
    const API_URL = 'https://script.google.com/macros/s/AKfycby5_2FMi0onES_WQPJAHnmnkVZlGIeVsNoHdJyF4SYA0HlmuDdCh9fHa4d6kebVHd1mxQ/exec';

    const ICONS = {
      pieces: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>',
      yard: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h20"/><path d="M6 8v4M10 8v4M14 8v4M18 8v4"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>',
      buffer: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>',
      warn: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4M12 17h.01"/></svg>'
    };

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function render(data) {
      document.getElementById('generatedAt').textContent =
        'อัปเดตล่าสุด: ' + new Date(data.generatedAt).toLocaleString('th-TH');

      const app = document.getElementById('app');
      app.innerHTML = '';

      const summary = document.createElement('div');
      summary.className = 'summary-grid';
      summary.innerHTML = `
        <div class="stat" style="animation-delay:.02s"><div class="icon">${ICONS.pieces}</div><div class="num">${data.totals.pieces}</div><div class="lbl">ชิ้นรวม</div></div>
        <div class="stat" style="animation-delay:.08s"><div class="icon">${ICONS.yard}</div><div class="num">${data.totals.grandTotalYard.toFixed(2)}</div><div class="lbl">ผ้าที่ต้องใช้ (หลา)</div></div>
        <div class="stat" style="animation-delay:.14s"><div class="icon">${ICONS.buffer}</div><div class="num">${data.totals.bufferYard.toFixed(2)}</div><div class="lbl">แนะนำสั่งซื้อ +5% (หลา)</div></div>
      `;
      app.appendChild(summary);

      if (data.unresolved && data.unresolved.length) {
        const warn = document.createElement('div');
        warn.className = 'warn';
        const items = data.unresolved.map(u =>
          `<li>[${esc(u.lot)}] <a href="${esc(u.url)}" target="_blank" rel="noopener">${esc(u.fileName)}</a></li>`
        ).join('');
        warn.innerHTML = `<div class="warn-head">${ICONS.warn} ไม่พบขนาดในชื่อไฟล์ (${data.unresolved.length} ไฟล์)</div>
          <ul>${items}</ul>
          <div class="hint">แก้ชื่อไฟล์ให้มีรูปแบบ "กว้าง x ยาว" เช่น "65 x 85" แล้วกดรีเฟรช ระบบจะอ่านให้ใหม่</div>`;
        app.appendChild(warn);
      }

      const byLot = {};
      data.rows.forEach(r => {
        if (!byLot[r.lot]) byLot[r.lot] = [];
        byLot[r.lot].push(r);
      });

      const lotTotals = Object.keys(byLot).map(lot => byLot[lot].reduce((s, r) => s + r.totalYard, 0));
      const maxLotTotal = Math.max(1, ...lotTotals);

      Object.keys(byLot).forEach((lot, i) => {
        const rowsForLot = byLot[lot];
        const lotTotal = rowsForLot.reduce((s, r) => s + r.totalYard, 0);
        const card = document.createElement('div');
        card.className = 'lot-card';
        card.style.animationDelay = (0.03 * i) + 's';
        const rowsHtml = rowsForLot.map(r => `
          <tr>
            <td>${r.width} x ${r.length}</td>
            <td>${r.count}</td>
            <td>${r.totalYard.toFixed(2)}</td>
          </tr>
        `).join('');
        card.innerHTML = `
          <div class="lot-head"><span>${esc(lot)}</span><span class="lot-total">${lotTotal.toFixed(2)} หลา</span></div>
          <div class="lot-bar-track"><div class="lot-bar-fill" style="width:${(lotTotal / maxLotTotal * 100).toFixed(1)}%"></div></div>
          <table>
            <thead><tr><th scope="col">ขนาด (ซม.)</th><th scope="col">จำนวน</th><th scope="col">ผ้า (หลา)</th></tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        `;
        app.appendChild(card);
      });
    }

    // ใช้ JSONP เรียกข้าม origin ไปหา Apps Script (Apps Script ไม่รองรับ CORS แบบ fetch ตรงๆ)
    function jsonp(url, cb) {
      const cbName = 'jsonp_cb_' + Date.now();
      window[cbName] = function (data) {
        cb(data);
        delete window[cbName];
        script.remove();
      };
      const script = document.createElement('script');
      script.src = url + (url.indexOf('?') > -1 ? '&' : '?') + 'callback=' + cbName;
      document.body.appendChild(script);
    }

    function setLoading(isLoading) {
      const btn = document.getElementById('refreshBtn');
      const label = document.getElementById('refreshLabel');
      btn.disabled = isLoading;
      btn.classList.toggle('loading', isLoading);
      label.textContent = isLoading ? 'กำลังรีเฟรช...' : 'รีเฟรชตอนนี้';
    }

    function loadData() {
      jsonp(API_URL, render);
    }

    function doRefresh() {
      setLoading(true);
      jsonp(API_URL + '?refresh=1', function (data) {
        render(data);
        setLoading(false);
      });
    }

    loadData();
  </script>
</body>
</html>
